<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14130f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WWTycoons — démo économique</title>
<style>
/* WWTycoons — démo. Sobre, dense, lisible sur téléphone comme sur écran large. */

:root {
  --fond:       #14130f;
  --fond2:      #1c1a15;
  --fond3:      #24211a;
  --bord:       #38332a;
  --texte:      #e6e0d2;
  --doux:       #a39a86;
  --faible:     #6d6555;
  --or:         #d9a441;
  --vert:       #6faa72;
  --rouge:      #c2544b;
  --bleu:       #6f9fc9;
  --joueur:     #d9a441;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--or); outline-offset: 1px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

body {
  background: var(--fond);
  color: var(--texte);
  font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  height: 100vh;
  height: 100dvh;
  display: flex;
  overscroll-behavior: none;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Barre du haut ---------- */

#barre {
  display: flex;
  align-items: stretch;
  gap: 1px;
  background: var(--bord);
  border-bottom: 1px solid var(--bord);
  flex: 0 0 auto;
  overflow-x: auto;
}
#barre .bloc {
  background: var(--fond2);
  padding: 7px 14px;
  min-width: 120px;
  flex: 0 0 auto;
}
#barre .bloc.croissant { flex: 1 1 auto; }
.etiq { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--faible); }
.val  { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
.val.argent { color: var(--texte); }
.val.or { color: var(--or); }
.sous { font-size: 11px; color: var(--doux); font-variant-numeric: tabular-nums; }

.commandes { background: var(--fond2); display: flex; align-items: center; gap: 5px; padding: 0 12px; }
.cmd {
  background: var(--fond3); color: var(--texte); border: 1px solid var(--bord);
  padding: 6px 11px; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: inherit;
}
.cmd:hover { background: #2e2a21; }
.cmd.majeur { background: var(--or); color: #191710; border-color: var(--or); font-weight: 600; }
.cmd.vit.actif { border-color: var(--or); color: var(--or); }

/* ---------- Corps ---------- */

main { flex: 1 1 auto; display: flex; min-height: 0; }

#colGauche { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
#colDroite {
  flex: 0 0 370px; border-left: 1px solid var(--bord);
  display: flex; flex-direction: column; min-height: 0; background: var(--fond2);
}

nav#ongletsVilles, nav#modesCarte, nav#ongletsPanneau {
  display: flex; gap: 1px; background: var(--bord); flex: 0 0 auto; overflow-x: auto;
}
nav button {
  background: var(--fond2); color: var(--doux); border: 0; padding: 8px 13px;
  cursor: pointer; font-size: 12px; font-family: inherit; white-space: nowrap; flex: 0 0 auto;
}
nav button:hover { color: var(--texte); background: var(--fond3); }
nav button.actif { background: var(--fond3); color: var(--or); box-shadow: inset 0 -2px 0 var(--or); }
nav#ongletsPanneau button { flex: 1 1 0; }
nav#modesCarte button { font-size: 11px; padding: 6px 10px; }

#zoneCarte { flex: 1 1 auto; position: relative; overflow: hidden; background: #0e0d0a; }
#carte { display: block; cursor: crosshair; touch-action: none; }
#legende {
  position: absolute; left: 10px; bottom: 10px; background: rgba(20,19,15,.9);
  border: 1px solid var(--bord); border-radius: 3px; padding: 7px 9px;
  font-size: 11px; color: var(--doux); pointer-events: none; max-width: 260px;
}
#legende .ligne { display: flex; align-items: center; gap: 6px; }
#legende i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ---------- Panneau ---------- */

#panneau { flex: 1 1 auto; overflow-y: auto; padding: 12px; }
#panneau h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--faible); margin: 16px 0 7px; font-weight: 600;
}
#panneau h3:first-child { margin-top: 0; }

.barometre { margin-bottom: 9px; }
.barometre .tete { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
.barometre .piste { height: 7px; background: var(--fond); border-radius: 4px; overflow: hidden; }
.barometre .jauge { height: 100%; border-radius: 4px; transition: width .3s; }
.barometre.critique .jauge { background: var(--rouge) !important; }

table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--faible); font-size: 10px;
     text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px 4px 0; }
td { padding: 3px 6px 3px 0; border-top: 1px solid #221f19; }
td.n, th.n { text-align: right; }
.vert { color: var(--vert); } .rouge { color: var(--rouge); } .or { color: var(--or); }
.doux { color: var(--doux); } .faible { color: var(--faible); }

.puce { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.ligneBat { cursor: pointer; }
.ligneBat:hover td { background: var(--fond3); }

/* ---------- Feuille du bas ---------- */
/* Sur mobile, une feuille qui remonte du bas, la carte restant visible
   au-dessus : à cette inclinaison, un panneau flottant masquerait plusieurs
   bâtiments et le joueur perdrait le contexte de ce qu'il inspecte. */

#feuille {
  position: fixed; left: 0; right: 370px; bottom: 0;
  background: var(--fond2); border-top: 1px solid var(--bord);
  box-shadow: 0 -8px 24px rgba(0,0,0,.5);
  transition: transform .22s ease; z-index: 20; max-height: 58vh; overflow-y: auto;
}
#feuille.fermee { transform: translateY(101%); }
#feuillePoignee {
  height: 3px; width: 44px; background: var(--bord); border-radius: 2px;
  margin: 7px auto 0; cursor: pointer;
}
#feuilleCorps { padding: 10px 16px 16px; }
#feuilleCorps h2 { font-size: 15px; margin-bottom: 2px; }
#feuilleCorps .soustitre { color: var(--doux); font-size: 12px; margin-bottom: 10px; }
.grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; margin-bottom: 10px; }
.fiche { background: var(--fond3); border: 1px solid var(--bord); border-radius: 3px; padding: 6px 9px; }
.fiche .etiq { margin-bottom: 1px; }
.fiche .v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button {
  background: var(--fond3); color: var(--texte); border: 1px solid var(--bord);
  padding: 7px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; font-family: inherit;
}
.actions button:hover:not(:disabled) { border-color: var(--or); color: var(--or); }
.actions button:disabled { opacity: .38; cursor: not-allowed; }
.actions button.primaire { background: var(--or); color: #191710; border-color: var(--or); font-weight: 600; }

input[type=range] { width: 100%; accent-color: var(--or); }

.avert { color: var(--rouge); font-size: 11px; margin-top: 6px; }
.note { color: var(--doux); font-size: 11px; margin-top: 6px; line-height: 1.5; }

/* ---------- Fin de partie ---------- */

#finPartie {
  position: fixed; inset: 0; background: rgba(10,9,7,.94); z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
#finPartie.cachee { display: none; }
#finPartie .boite { background: var(--fond2); border: 1px solid var(--bord); border-radius: 5px;
  padding: 26px 30px; max-width: 480px; width: 100%; }
#finPartie h1 { font-size: 21px; margin-bottom: 4px; }

/* ---------- Boutons flottants sur la carte ---------- */

#btnRecentrer, #btnLegende {
  position: absolute; right: 10px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(28,26,21,.92); color: var(--doux);
  border: 1px solid var(--bord); cursor: pointer;
  font-size: 16px; line-height: 1; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
}
#btnRecentrer { top: 10px; }
#btnLegende   { top: 58px; }
#btnRecentrer:active, #btnLegende:active { background: var(--fond3); color: var(--or); }

/* ---------- Tablette et téléphone ---------- */
/* La carte doit rester la pièce maîtresse : c'est elle qu'on lit, et une
   feuille qui remonte du bas laisse le contexte visible au-dessus. */

@media (max-width: 860px) {
  main { flex-direction: column; }
  #colGauche { flex: 1 1 auto; min-height: 42vh; }
  #colDroite { flex: 0 0 40vh; border-left: 0; border-top: 1px solid var(--bord); }
  #feuille { right: 0; max-height: 72vh; }

  /* Des cibles qu'on vise au pouce, pas à la souris. */
  nav button { padding: 11px 15px; font-size: 13px; }
  nav#modesCarte button { padding: 10px 13px; font-size: 12px; }
  .actions button { padding: 11px 15px; font-size: 13px; }
  .cmd { padding: 10px 14px; }
  #feuillePoignee { height: 4px; width: 60px; margin-top: 10px; }
  #feuilleCorps { padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }

  #barre { padding-top: env(safe-area-inset-top); }
  #barre .bloc { min-width: 88px; padding: 6px 11px; }
  .val { font-size: 15px; }
  .sous { font-size: 10px; }
  .commandes { padding: 0 8px; gap: 4px; }

  #legende { display: none; }
  #legende.montre { display: block; }
  table { font-size: 13px; }
  td { padding: 5px 6px 5px 0; }
}

#btnVitesseCycle { display: none; }

/* Sur un téléphone, la barre n'a pas la largeur de tout montrer. On garde ce
   qui commande une décision — la date, l'argent — et on replie les trois
   boutons de vitesse en un seul, qui tourne. Le reste vit dans les onglets. */
@media (max-width: 620px) {
  #barre .bloc.masquable { display: none; }
  #barre .bloc { min-width: 0; padding: 6px 9px; }
  .val { font-size: 14px; }
  .etiq { font-size: 9px; letter-spacing: .05em; }
  .cmd.vit { display: none; }
  #btnVitesseCycle { display: block; min-width: 44px; }
  #btnPause .mot { display: none; }
  #btnPause { min-width: 46px; font-size: 15px; }
  .commandes { padding: 0 7px; }
  #colDroite { flex: 0 0 38vh; }
}

</style>
</head>
<body>
<header id="barre">
  <div class="bloc">
    <div class="etiq">Date</div>
    <div class="val" id="date">An 1 · janvier</div>
    <div class="sous" id="restant">60 mois restants</div>
  </div>
  <div class="bloc">
    <div class="etiq">Trésorerie</div>
    <div class="val argent" id="tresorerie">15 000 $</div>
    <div class="sous" id="resultat">—</div>
  </div>
  <div class="bloc masquable">
    <div class="etiq">Cours de l'action</div>
    <div class="val" id="cours">1,00 $</div>
    <div class="sous" id="actifnet">actif net 15 000 $</div>
  </div>
  <div class="bloc masquable">
    <div class="etiq">Votre fortune</div>
    <div class="val or" id="fortune">1 500 $</div>
    <div class="sous">10 % du capital</div>
  </div>
  <div class="bloc croissant masquable">
    <div class="etiq">Climat</div>
    <div class="val" id="climat">Normal</div>
    <div class="sous" id="rang">—</div>
  </div>
  <div class="commandes">
    <button id="btnPause" class="cmd majeur"><span class="signe">▶</span><span class="mot"> Démarrer</span></button>
    <button data-vitesse="1" class="cmd vit actif">×1</button>
    <button data-vitesse="4" class="cmd vit">×4</button>
    <button data-vitesse="20" class="cmd vit">×20</button>
    <button id="btnVitesseCycle" class="cmd">×1</button>
  </div>
</header>

<main>
  <section id="colGauche">
    <nav id="ongletsVilles"></nav>
    <div id="zoneCarte">
      <canvas id="carte"></canvas>
      <div id="legende"></div>
      <button id="btnRecentrer" title="Vue d'ensemble">⤢</button>
      <button id="btnLegende" title="Légende">i</button>
    </div>
    <nav id="modesCarte">
      <button data-mode="fonction" class="actif">Fonction</button>
      <button data-mode="proprio">Propriétaire</button>
      <button data-mode="fertilite">Fertilité</button>
      <button data-mode="bois">Bois</button>
      <button data-mode="argile">Argile</button>
      <button data-mode="charbon">Charbon</button>
      <button data-mode="minerai">Minerai</button>
      <button data-mode="terrain">Prix du sol</button>
    </nav>
  </section>

  <aside id="colDroite">
    <nav id="ongletsPanneau">
      <button data-onglet="ville" class="actif">Ville</button>
      <button data-onglet="marche">Marché</button>
      <button data-onglet="comptes">Comptes</button>
      <button data-onglet="rail">Rail</button>
    </nav>
    <div id="panneau"></div>
  </aside>
</main>

<div id="feuille" class="fermee">
  <div id="feuillePoignee"></div>
  <div id="feuilleCorps"></div>
</div>

<div id="finPartie" class="cachee"></div>
<script type="module">

// ===== js/sim/params.js ==============================================

// ---------------------------------------------------------------------------
// Le barème de référence, en code. Voir docs/00-BAREME.md — ce fichier en est
// la transcription littérale. Aucune valeur numérique du jeu ne doit exister
// ailleurs que dans ce fichier.
// ---------------------------------------------------------------------------

const P = {
  moisParSeconde: 10,          // 1 mois = 10 s réelles
  salaireCase: 20,             // $ / mois, l'unité de compte de tout le jeu
  terrainRef: 100,             // $ la case, avant facteurs
  entretienAnnuel: 0.10,       // 10 % / an de la valeur bâtie, foncier exclu
  loyerBase: 5,                // $ / mois pour une maison au niveau 1

  // Marché
  exposantPrix: 0.60,          // tension^0,6
  lissagePrix: 0.28,           // calibré : 30 % de production retenue -> +19 % en 5 mois
  prixPlancher: 0.50,          // du prix de référence
  prixPlafond: 2.50,
  tensionMin: 0.20,
  tensionMax: 6.00,

  // Ville
  pivot: 0.80,                 // moyenne des baromètres au-dessus de laquelle on croît
  cadenceDemo: 0.002,          // 0,2 % de la population par mois et par point d'écart
  cadenceMax: 0.05,            // plafond ±5 % / mois
  exodeCritique: 0.05,         // seuil critique franchi -> -5 % / mois
  seuilsCritiques: { nourriture: 0.80, emploi: 0.50, produits: 0.20 },
  employesParMenage: 2,
  coefChantiers: 1.45,         // au-delà de la consommation : matériaux et entretien

  // Bâtiments
  seuilMatieres: 0.15,         // sous 15 % de ses besoins, un bâtiment s'arrête
  entretienSommeil: 0.10,      // 10 % de la masse salariale en sommeil
  moisAvantFermeture: 12,      // une case vide un an ferme

  // Société
  apportJoueur: 1500,
  partFondateur: 0.10,
  actionsInitiales: 15000,
  multipleNormal: 10,
  multipleEuphorie: 15,
  multipleCrise: 5,
  malusPerte: 3,               // une perte se répare : -3 × perte annuelle
  fenetreProfit: 12,           // mois glissants

  // Foncier
  facteurNiveau: [1.0, 1.3, 1.8, 2.6, 4.0],
  seuilsNiveau: [100, 250, 500, 1000, 2000],   // en ménages
  nomsNiveau: ['Comptoir', 'Bourg', 'Ville', 'Grandeville', 'Métropole'],
  attenuationDistance: 0.04,   // 1 / (1 + 0,04 × cases)
  partIndependants: 0.30,
  surprixIndependants: 1.20,

  // Amorçage
  stockAmorcage: { planches: 800, briques: 400 },

  // Carte
  tailleVille: 48,             // 48 × 48 pour la démo (64 en production)
};

// --- Ressources -------------------------------------------------------------
// prix = prix de référence, celui qui s'établit quand la demande égale l'offre.

const RES = {
  bois:      { nom: 'Bois',      prix: 1,    couleur: '#7a6a4f', extractible: true  },
  argile:    { nom: 'Argile',    prix: 1,    couleur: '#a56b4a', extractible: true  },
  charbon:   { nom: 'Charbon',   prix: 1,    couleur: '#3d3d42', extractible: true  },
  minerai:   { nom: 'Minerai',   prix: 1,    couleur: '#6b5b73', extractible: true  },
  cereales:  { nom: 'Céréales',  prix: 2.40, couleur: '#c9a227', extractible: true  },
  betail:    { nom: 'Bétail',    prix: 2.40, couleur: '#b08968', extractible: true  },
  planches:  { nom: 'Planches',  prix: 5,    couleur: '#b5894f', extractible: false },
  briques:   { nom: 'Briques',   prix: 5,    couleur: '#9c4a35', extractible: false },
  acier:     { nom: 'Acier',     prix: 15,   couleur: '#5a7d8c', extractible: false },
  pain:      { nom: 'Pain',      prix: 12,   couleur: '#d9a441', extractible: false },
  viande:    { nom: 'Viande',    prix: 12,   couleur: '#a83f3f', extractible: false },
  produits:  { nom: 'Produits',  prix: 17,   couleur: '#4f7d5a', extractible: false },
};

const RESSOURCES = Object.keys(RES);

// Les deux nourritures sont substituables 1 pour 1 : le ménage veut une ration
// par mois, pas une demi-ration de chaque. Il mange ce qu'il y a.
const NOURRITURES = ['pain', 'viande'];

// --- Bâtiments --------------------------------------------------------------
// cases : emprise. w × h : forme posée sur la carte.
// Les débits sont donnés PAR CASE : un bâtiment de n cases a n employés et
// produit n fois ces quantités. (§20 : « une case, un employé, une production »)

const BAT = {
  coupe:       { nom: 'Coupe forestière', cases: 1, w: 1, h: 1, sort: 'bois',     debit: 24, intrants: {}, cout: 130, mat: { planches: 26 }, qual: 'bois',      cat: 'expl' },
  carriere:    { nom: 'Carrière',         cases: 1, w: 1, h: 1, sort: 'argile',   debit: 24, intrants: {}, cout: 130, mat: { planches: 26 }, qual: 'argile',    cat: 'expl' },
  mineCharbon: { nom: 'Mine de charbon',  cases: 1, w: 1, h: 1, sort: 'charbon',  debit: 24, intrants: {}, cout: 130, mat: { planches: 26 }, qual: 'charbon',   cat: 'expl' },
  mineFer:     { nom: 'Mine de fer',      cases: 1, w: 1, h: 1, sort: 'minerai',  debit: 24, intrants: {}, cout: 130, mat: { planches: 26 }, qual: 'minerai',   cat: 'expl' },
  ferme:       { nom: 'Ferme céréalière', cases: 2, w: 2, h: 1, sort: 'cereales', debit: 10, intrants: {}, cout: 130, mat: { planches: 26 }, qual: 'fertilite', cat: 'expl' },
  ranch:       { nom: 'Ranch',            cases: 2, w: 2, h: 1, sort: 'betail',   debit: 10, intrants: {}, cout: 130, mat: { planches: 26 }, qual: 'fertilite', cat: 'expl' },

  scierie:     { nom: 'Scierie',      cases: 2, w: 2, h: 1, sort: 'planches', debit: 12, intrants: { bois: 24 },              cout: 575, mat: { planches: 60, briques: 55 }, cat: 'trans' },
  briqueterie: { nom: 'Briqueterie',  cases: 2, w: 2, h: 1, sort: 'briques',  debit: 12, intrants: { argile: 24 },            cout: 575, mat: { planches: 60, briques: 55 }, cat: 'trans' },
  minoterie:   { nom: 'Minoterie',    cases: 2, w: 2, h: 1, sort: 'pain',     debit: 5,  intrants: { cereales: 10 },          cout: 575, mat: { planches: 60, briques: 55 }, cat: 'trans' },
  abattoir:    { nom: 'Abattoir',     cases: 2, w: 2, h: 1, sort: 'viande',   debit: 5,  intrants: { betail: 10 },            cout: 575, mat: { planches: 60, briques: 55 }, cat: 'trans' },
  acierie:     { nom: 'Aciérie',      cases: 4, w: 2, h: 2, sort: 'acier',    debit: 6,  intrants: { charbon: 24, minerai: 24 }, cout: 810, mat: { planches: 30, briques: 42, acier: 30 }, cat: 'trans' },
  manufacture: { nom: 'Manufacture',  cases: 4, w: 2, h: 2, sort: 'produits', debit: 6,  intrants: { planches: 6, acier: 2 }, cout: 680, mat: { planches: 40, briques: 36, acier: 20 }, cat: 'manu' },

  maison:    { nom: 'Maison',              cases: 1, w: 1, h: 1, menages: 1,  cout: 180, mat: { planches: 24, briques: 12 }, cat: 'loge' },
  immeuble:  { nom: 'Immeuble',            cases: 4, w: 2, h: 2, menages: 20, cout: 925, mat: { briques: 65, acier: 40 },    cat: 'loge' },
  bureaux:   { nom: 'Immeuble de bureaux', cases: 4, w: 2, h: 2, postes: 20,  cout: 500, mat: { briques: 40, acier: 20 },    cat: 'bur'  },
  entrepot:  { nom: 'Entrepôt',            cases: 4, w: 2, h: 2, capacite: 2000, cout: 100, mat: { planches: 20 },           cat: 'neg'  },
};

const TYPES_BAT = Object.keys(BAT);

// Coût total de construction d'un bâtiment, en quantités de matériaux.
function materiaux(type) {
  const b = BAT[type], out = {};
  for (const [r, q] of Object.entries(b.mat)) out[r] = q * b.cases;
  return out;
}

// Valeur des matériaux au prix de référence (sert de repère, pas de facture :
// la facture réelle est établie au prix du marché local du jour).
function coutRef(type) {
  let t = 0;
  for (const [r, q] of Object.entries(materiaux(type))) t += q * RES[r].prix;
  return t;
}

// Entretien mensuel : 10 % / an de la valeur bâtie, foncier exclu.
// Il ne se contracte jamais — c'est lui qui borne les pertes.
function entretien(type, valeurBatie) {
  return (valeurBatie ?? coutRef(type)) * P.entretienAnnuel / 12;
}

// --- Terrain ----------------------------------------------------------------

const RELIEFS = {
  plaine:   { nom: 'Plaine',   couleur: '#8fa361', biais: { fertilite: 2.0, argile: 1.5, bois: 0.6, charbon: 0.3, minerai: 0.2 } },
  foret:    { nom: 'Forêt',    couleur: '#4f7042', biais: { fertilite: 0.9, argile: 0.6, bois: 2.4, charbon: 0.4, minerai: 0.3 } },
  colline:  { nom: 'Colline',  couleur: '#9c8f6a', biais: { fertilite: 0.7, argile: 1.0, bois: 0.9, charbon: 2.0, minerai: 1.1 } },
  montagne: { nom: 'Montagne', couleur: '#8a8a92', biais: { fertilite: 0.2, argile: 0.5, bois: 0.4, charbon: 1.3, minerai: 2.4 } },
};

const QUALITES = ['fertilite', 'argile', 'bois', 'charbon', 'minerai'];

// Le niveau d'une ville, d'après son nombre de ménages.
function niveauVille(menages) {
  let n = 1;
  for (let i = 0; i < P.seuilsNiveau.length; i++) if (menages >= P.seuilsNiveau[i]) n = i + 1;
  return Math.min(n, 5);
}

// Prix d'une case de terrain : 100 $ × facteur de niveau × facteur de distance.
function prixTerrain(niveau, distanceGare) {
  const fn = P.facteurNiveau[niveau - 1];
  const fd = 1 / (1 + P.attenuationDistance * distanceGare);
  return P.terrainRef * fn * fd;
}

// Loyer mensuel d'un logement plein : il découle du foncier, pas d'un barème.
// loyer = rendement × (terrain + construction) ÷ 12 + entretien
function loyer(type, terrain, construction) {
  const rdt = type === 'maison' ? 0.15 : 0.20;
  return rdt * (terrain + construction) / 12 + construction * P.entretienAnnuel / 12;
}

// ===== js/sim/mapgen.js ==============================================

// ---------------------------------------------------------------------------
// Génération de carte. Une carte neuve à chaque partie.
//
// Principe (§CQ14) : toutes les ressources sont présentes dans toutes les
// villes, mais chacune a une prédominance et deux ou trois ressources
// nettement plus rares. Aucune ville ne peut se suffire à elle-même, aucune
// n'est privée de quoi que ce soit.
// ---------------------------------------------------------------------------


// PRNG déterministe (mulberry32) : même graine, même carte.
function rng(graine) {
  let a = graine >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Bruit de valeur lissé : des taches cohérentes plutôt qu'un poivre aléatoire.
function bruit(rnd, taille, echelle) {
  const g = Math.ceil(taille / echelle) + 2;
  const pts = Array.from({ length: g * g }, () => rnd());
  const lisse = (t) => t * t * (3 - 2 * t);
  return (x, y) => {
    const fx = x / echelle, fy = y / echelle;
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const tx = lisse(fx - x0), ty = lisse(fy - y0);
    const at = (i, j) => pts[Math.min(j, g - 1) * g + Math.min(i, g - 1)];
    const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  };
}

const NOMS = ['Grands-Bois', 'Val-de-Fer', 'Plaine-Dorée', 'Terre-Rouge', 'Port-Neuf',
              'Bois-Perdu', 'Roche-Noire', 'Champs-Longs', 'Argilières', 'Confluent'];

// Chaque ville reçoit une prédominance et deux raretés. Ce sont des biais sur
// la distribution des qualités, jamais une absence : le minerai existe partout,
// il est simplement médiocre là où il n'est pas la vocation du lieu.
const PROFILS = [
  { pred: 'bois',      rares: ['minerai', 'charbon'],  relief: 'foret'    },
  { pred: 'minerai',   rares: ['fertilite', 'bois'],   relief: 'montagne' },
  { pred: 'fertilite', rares: ['charbon', 'minerai'],  relief: 'plaine'   },
  { pred: 'argile',    rares: ['bois', 'minerai'],     relief: 'plaine'   },
  { pred: 'charbon',   rares: ['fertilite', 'argile'], relief: 'colline'  },
];

function genererCarte(nbVilles, graine) {
  const rnd = rng(graine);
  const N = P.tailleVille;
  const profils = melanger(PROFILS.slice(), rnd).slice(0, nbVilles);
  const noms = melanger(NOMS.slice(), rnd);

  const villes = profils.map((profil, i) => {
    const bReliefA = bruit(rnd, N, 11), bReliefB = bruit(rnd, N, 5);
    const bQ = {}; for (const q of QUALITES) bQ[q] = bruit(rnd, N, 8);

    const gare = { x: N >> 1, y: N >> 1 };
    const cases = new Array(N * N);

    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const h = bReliefA(x, y) * 0.7 + bReliefB(x, y) * 0.3;
      // Le relief dominant du profil est sur-représenté sans être exclusif.
      let relief;
      if (h > 0.72) relief = 'montagne';
      else if (h > 0.56) relief = 'colline';
      else if (h > 0.40) relief = 'foret';
      else relief = 'plaine';
      if (rnd() < 0.28) relief = profil.relief;

      const biais = RELIEFS[relief].biais;
      const q = {};
      for (const nom of QUALITES) {
        // base 1-5 tirée du bruit, modulée par le relief puis par le profil
        let v = bQ[nom](x, y) * 4 + 1;
        v *= biais[nom];
        if (nom === profil.pred) v *= 1.45;
        if (profil.rares.includes(nom)) v *= 0.55;
        q[nom] = Math.max(1, Math.min(5, Math.round(v)));
      }

      const d = Math.abs(x - gare.x) + Math.abs(y - gare.y);
      cases[y * N + x] = {
        x, y, relief, q, distanceGare: d,
        rue: false,
        proprio: null,      // null = vierge ; 'ind' = indépendant ; sinon id de société
        bat: null,          // référence vers le bâtiment posé
        chantier: null,
        voie: false,
        vendue: false,
      };
    }

    // La gare, et les emprises de voie qui en partent — réservées, non
    // constructibles, visibles dès la première seconde.
    cases[gare.y * N + gare.x].voie = true;
    for (let x = 0; x < N; x++) cases[gare.y * N + x].voie = true;

    // La trame des rues. « La densité des rues fait la hiérarchie urbaine. Un
    // bâtiment seul dans sa parcelle, entouré de rue sur quatre côtés, met la
    // moitié de la surface en gris : parfait pour un bourg, désastreux pour une
    // métropole qui doit paraître dense. Une rue toutes les trois ou quatre
    // cases avec des îlots mitoyens au centre, des parcelles isolées en
    // périphérie. » (§21)
    const RAYON_URBAIN = Math.round(N * 0.38);
    for (const c of cases) {
      const dx = c.x - gare.x, dy = c.y - gare.y;
      if (Math.abs(dx) + Math.abs(dy) > RAYON_URBAIN) continue;   // la campagne n'a pas de rues
      if (dx % 5 === 0 || dy % 5 === 0) c.rue = true;
    }

    // 30 % des cases exploitables appartiennent à des indépendants. Ils vendent
    // au prix du marché majoré de 20 % : le raccourci payant.
    for (const c of cases) if (!c.voie && !c.rue && rnd() < P.partIndependants) c.proprio = 'ind';

    // Les cases autour de la gare sont ouvertes d'emblée, sans quoi la règle de
    // contiguïté n'aurait aucun point de départ.
    for (const c of cases) if (c.distanceGare <= 4 && !c.voie && !c.rue) c.vendue = true;

    return {
      id: i, nom: noms[i], profil, N, gare, cases,
      menages: 200,               // 200 ménages = 400 employés au départ
      occupation: 0.85,
      salaire: P.salaireCase,
      niveau: 1,
      barometres: { nourriture: 1, emploi: 0.78, produits: 0.6 },
      epargne: 0,
      marche: null,               // affecté par world.js
      histo: [],
    };
  });

  // Les liaisons : toutes les paires de villes, dates d'achèvement échelonnées
  // et annoncées dès le début de la partie.
  const liaisons = [];
  for (let a = 0; a < nbVilles; a++) for (let b = a + 1; b < nbVilles; b++) {
    liaisons.push({
      a, b,
      nom: `${villes[a].nom} — ${villes[b].nom}`,
      dateInitiale: 14 + Math.floor(rnd() * 22),   // mois
      date: 0, capital: 0, achevee: false, cotee: false,
      actions: 0, tresorerie: 0, parts: {},
    });
  }
  for (const l of liaisons) l.date = l.dateInitiale;

  return { villes, liaisons, graine };
}

function melanger(a, rnd) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function caseAt(ville, x, y) {
  if (x < 0 || y < 0 || x >= ville.N || y >= ville.N) return null;
  return ville.cases[y * ville.N + x];
}

// Règle de contiguïté : on ne peut acheter une terre vierge que si elle touche
// une terre déjà vendue ou bâtie. La ville s'étend en anneaux depuis sa gare, et
// il existe à chaque instant une frontière étroite et disputée.
function estAchetable(ville, c) {
  if (!c || c.voie || c.rue || c.vendue) return false;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const v = caseAt(ville, c.x + dx, c.y + dy);
    if (v && (v.vendue || v.voie)) return true;
  }
  return false;
}

// ===== js/sim/market.js ==============================================

// ---------------------------------------------------------------------------
// Le marché : formation des prix, rationnement.
//
// Règle centrale (§20) : le prix suit les FLUX, jamais le stock.
//   tension = besoins réels du mois ÷ production mise en vente
// Acheter pour stocker n'est pas un besoin et n'entre pas dans le calcul.
// Le matelas de stock protège l'approvisionnement, pas le cours.
// ---------------------------------------------------------------------------


class Marche {
  constructor(villes) {
    this.villes = villes;               // les villes qui partagent ce marché
    this.stock = {};
    this.prix = {};
    this.besoins = {};                  // demande réelle du mois en cours
    this.entrees = {};                  // production mise en vente ce mois
    this.restants = {};                 // ce qui n'a pas encore été présenté au guichet
    this.service = {};                  // fraction du besoin réellement servie
    this.prixRevient = {};              // plancher local : nul ne vend à perte
    for (const r of RESSOURCES) {
      this.stock[r] = 0;
      this.prix[r] = RES[r].prix;
      this.besoins[r] = 0;
      this.entrees[r] = 0;
      this.restants[r] = 0;
      this.service[r] = 1;
      this.prixRevient[r] = 0;
    }
  }

  get nom() { return this.villes.map(v => v.nom).join(' + '); }

  // --- Phase 1 : on déclare ------------------------------------------------

  demander(res, qte) { this.besoins[res] += qte; }
  offrir(res, qte) { this.entrees[res] += qte; this.stock[res] += qte; }

  // Le prix de revient réel sur ce marché fait plancher : personne ne vend
  // durablement à perte. Sur une mauvaise terre, chaque unité porte plus de
  // salaire, et la marchandise y est structurellement plus chère.
  declarerRevient(res, coutUnitaire) {
    this.prixRevient[res] = Math.max(this.prixRevient[res], coutUnitaire);
  }

  // --- Phase 2 : on fixe les prix ------------------------------------------

  fixerPrix() {
    for (const r of RESSOURCES) {
      const ref = RES[r].prix;
      let tension;
      if (this.entrees[r] <= 0.0001) {
        tension = this.besoins[r] > 0 ? P.tensionMax : 1;
      } else {
        tension = this.besoins[r] / this.entrees[r];
      }
      tension = Math.max(P.tensionMin, Math.min(P.tensionMax, tension));

      const cible = ref * Math.pow(tension, P.exposantPrix);
      // Le lissage est ce qui fait que les stocks « absorbent le coup » pendant
      // quelques mois avant que le prix ne s'envole.
      this.prix[r] += P.lissagePrix * (cible - this.prix[r]);

      const bas = Math.max(ref * P.prixPlancher, this.prixRevient[r]);
      this.prix[r] = Math.max(bas, Math.min(ref * P.prixPlafond, this.prix[r]));
      this.prixRevient[r] = 0;
    }
  }

  // --- Phase 3 : on sert ----------------------------------------------------
  // Quand les entrées plus le stock ne couvrent pas les besoins, chacun est
  // servi au prorata : usines, chantiers et entretien reçoivent la même
  // fraction de ce qu'ils demandent.
  //
  // Le service se recalcule avant chaque vague de la filière, sur le stock du
  // moment et sur ce qui n'a pas encore été présenté au guichet. Sans quoi les
  // ateliers du premier étage seraient servis sur un stock qui ne contient pas
  // encore la production du mois.

  ouvrirGuichet() {
    for (const r of RESSOURCES) this.restants[r] = this.besoins[r];
  }

  calculerService() {
    for (const r of RESSOURCES) {
      this.service[r] = this.restants[r] <= 0.001 ? 1
        : Math.max(0, Math.min(1, this.stock[r] / this.restants[r]));
    }
  }

  // Retire du stock au prorata du service. Renvoie la quantité réellement
  // obtenue. C'est le seul point de sortie régulier du marché.
  prendre(res, qte) {
    const servi = Math.min(qte * this.service[res], this.stock[res]);
    this.stock[res] -= servi;
    this.restants[res] = Math.max(0, this.restants[res] - qte);
    return servi;
  }

  // Achat spéculatif : ne compte pas dans les besoins, donc ne bouge pas le
  // prix. Il vide en revanche le matelas — au premier accroc de production, les
  // usines s'arrêtent faute d'intrants.
  rafler(res, qte) {
    const pris = Math.min(qte, this.stock[res]);
    this.stock[res] -= pris;
    return pris;
  }

  reinitialiser() {
    // On garde la trace des entrées du mois écoulé : c'est le seul indicateur
    // fiable de ce qu'une filière est capable de livrer, le stock de début de
    // mois ne disant rien quand la consommation se fait en juste-à-temps.
    this.entreesPrec = { ...this.entrees };
    for (const r of RESSOURCES) { this.besoins[r] = 0; this.entrees[r] = 0; }
  }

  // Ce qu'une ressource peut raisonnablement fournir ce mois-ci : ce qu'elle a
  // livré le mois dernier, plus ce qui dort en stock.
  offreAttendue(res) {
    return (this.entreesPrec ? this.entreesPrec[res] || 0 : 0) + this.stock[res];
  }

  // Rapport prix / référence, pour l'affichage.
  indice(res) { return this.prix[res] / RES[res].prix; }
}

// ===== js/sim/building.js ============================================

// ---------------------------------------------------------------------------
// Le bâtiment.
//
//   résultat mensuel = taux d'activité × marge brute − entretien
//
// Les trois lignes se contractent ensemble : un atelier à moitié achète la
// moitié de ses intrants, paie la moitié de ses salaires et vend la moitié de
// sa production. Seul l'entretien ne bouge jamais — c'est lui qui borne les
// pertes et qui fixe le seuil d'activité.
// ---------------------------------------------------------------------------


let _idBatiment = 1;

class Batiment {
  constructor(type, ville, cases, societe) {
    this.id = _idBatiment++;
    this.type = type;
    this.def = BAT[type];
    this.ville = ville;
    this.cases = cases;                 // les cases occupées
    this.societe = societe;
    this.activite = 1.0;                // curseur 0 → 1, réglable par le joueur
    this.versEntrepot = false;          // affecter la production à son entrepôt
    this.age = 0;
    this.moisVide = 0;

    // La facture a été établie au prix du marché du jour où le chantier a été
    // ouvert : un bâtiment ne coûte jamais deux fois la même chose.
    this.valeurBatie = coutRef(type);
    this.terrain = cases.reduce((s, c) => s + (c.prixPaye || 0), 0);

    // Qualité du sol : la sortie d'une exploitation vaut base × qualité ÷ 3.
    // Elle ne joue jamais sur la transformation.
    this.qualite = 3;
    if (this.def.qual) {
      this.qualite = cases.reduce((s, c) => s + c.q[this.def.qual], 0) / cases.length;
    }

    this.production = 0;
    this.tauxReel = 0;
    this.resultat = 0;
    this.margeUnitaire = 0;
    this.histo = [];                    // résultats des 12 derniers mois
    this.alerte = null;                 // 'matieres' | 'bras' | 'invendus' | 'perte'
    this.recu = {};
  }

  get n() { return this.def.cases; }
  get enSommeil() { return this.activite <= 0.001; }

  // Le loyer d'un bâtiment plein. Il ne découle pas d'un barème mais du
  // foncier : loyer = rendement × (terrain + construction) ÷ 12 + entretien.
  // C'est ce qui fait qu'acheter tôt paie deux fois — le loyer monte avec la
  // ville, mais le rendement du joueur se calcule sur le prix qu'il a payé.
  get loyerPlein() {
    if (this.def.cat === 'loge') {
      return loyer(this.type, this.terrainCourant, this.valeurBatie);
    }
    if (this.def.cat === 'bur') {
      const rdtParNiveau = [0.12, 0.14, 0.16, 0.18, 0.20];
      const rdt = rdtParNiveau[this.ville.niveau - 1];
      return rdt * (this.terrainCourant + this.valeurBatie) / 12 + this.entretien;
    }
    return 0;
  }

  // Valeur actuelle du terrain sous le bâtiment : elle suit le niveau de la
  // ville. Une usine sans profit implantée dans une ville qui a grandi prend
  // malgré tout de la valeur.
  get terrainCourant() {
    return this.cases.reduce((s, c) =>
      s + prixTerrain(this.ville.niveau, c.distanceGare), 0);
  }

  get entretien() { return this.valeurBatie * P.entretienAnnuel / 12; }
  get masseSalarialePleine() { return this.n * P.salaireCase; }

  // Capacité de production, qualité du sol comprise.
  get capacite() {
    if (!this.def.sort) return 0;
    return this.def.debit * this.n * (this.def.qual ? this.qualite / 3 : 1);
  }

  besoinsIntrants() {
    const out = {};
    for (const [r, q] of Object.entries(this.def.intrants || {})) out[r] = q * this.n * this.activite;
    return out;
  }

  // Marge brute unitaire aux prix du marché du jour. C'est le seul chiffre qui
  // compte : le danger vient toujours de l'ÉCART entre le prix d'entrée et le
  // prix de sortie, jamais d'un prix seul.
  margeBrute(marche) {
    if (!this.def.sort) return 0;
    const recette = this.capacite * marche.prix[this.def.sort];
    let couts = this.masseSalarialePleine;
    for (const [r, q] of Object.entries(this.def.intrants || {})) {
      couts += q * this.n * marche.prix[r];
    }
    return recette - couts;
  }

  // Le taux d'activité sous lequel la marge ne couvre plus l'entretien.
  seuilActivite(marche) {
    const mb = this.margeBrute(marche);
    return mb <= 0 ? Infinity : this.entretien / mb;
  }

  // --- Le mois -------------------------------------------------------------

  // 1. Déclarer ses besoins au marché et à la ville.
  declarer(marche) {
    if (this.def.cat === 'loge' || this.def.cat === 'bur' || this.def.cat === 'neg') {
      return;
    }
    // Un atelier dont la marge brute est négative — la valeur de ce qu'il
    // produit tombe sous le coût de ce qu'il consomme — arrête sa production de
    // lui-même et retombe à son seul entretien.
    if (this.margeBrute(marche) < 0 && !this.forcer) {
      this.activiteEffective = 0;
      this.alerte = 'perte';
      return;
    }
    this.activiteEffective = this.activite;
    for (const [r, q] of Object.entries(this.besoinsIntrants())) marche.demander(r, q);

    // Le prix de revient réel fait plancher sur ce marché.
    if (this.def.sort && this.capacite > 0) {
      let c = this.masseSalarialePleine + this.entretien;
      for (const [r, q] of Object.entries(this.def.intrants || {})) c += q * this.n * marche.prix[r];
      marche.declarerRevient(this.def.sort, c / this.capacite);
    }
  }

  // 2. Recevoir intrants et main-d'œuvre, produire, tenir ses comptes.
  produire(marche, partBras) {
    this.age++;
    this.alerte = null;
    const ent = this.entretien;

    // Logement : n'est exposé que du côté du coût. Il achète — ses matériaux au
    // chantier, puis son entretien — mais ne vend jamais de marchandise. Sa
    // recette est un loyer, fixé par le développement de la ville, pas par la
    // bourse. Le taux d'occupation est celui de la ville entière, partagé par
    // tous les propriétaires.
    if (this.def.cat === 'loge') {
      this.production = 0;
      this.tauxReel = this.vacantePenurie ? 0 : this.ville.occupation;
      this.resultat = this.loyerPlein * this.tauxReel - ent;
      if (this.tauxReel < 0.3) this.alerte = 'invendus';
      return this.cloturer();
    }

    // Bureaux : le seul argent qui entre du dehors. Ils louent 20 postes à des
    // sociétés extérieures à la carte, dont les salaires financent une
    // consommation que la ville n'a pas eu à produire. Un poste vide ne
    // rapporte rien — c'est ce qui les borne.
    if (this.def.cat === 'bur') {
      const occ = Math.max(0, Math.min(1, partBras));
      this.production = 0;
      this.tauxReel = occ;
      this.resultat = this.loyerPlein * occ - ent;
      if (occ < 0.5) this.alerte = 'bras';
      return this.cloturer();
    }

    // Entrepôt : ne rapporte rien, coûte ses salaires et son entretien. C'est
    // cette charge fixe qui rend le stockage massif coûteux, donc risqué.
    if (this.def.cat === 'neg') {
      this.production = 0;
      this.tauxReel = 1;
      this.resultat = -(this.masseSalarialePleine + ent);
      return this.cloturer();
    }

    // Mise en sommeil : plus de matières, plus de salaires, plus de production.
    // Le bâtiment reste debout moyennant un entretien réduit et se rallume
    // quand le marché repart.
    if (this.enSommeil || this.activiteEffective <= 0) {
      this.production = 0;
      this.tauxReel = 0;
      this.resultat = -(ent + this.masseSalarialePleine * P.entretienSommeil);
      return this.cloturer();
    }

    // Loi du minimum stricte : une scierie qui ne reçoit qu'un tiers de son bois
    // tourne à un tiers, quel que soit le nombre d'ouvriers disponibles. On ne
    // scie pas du bois qu'on n'a pas.
    let ratioMat = 1;
    const besoins = this.besoinsIntrants();
    this.recu = {};
    for (const [r, q] of Object.entries(besoins)) {
      const obtenu = marche.prendre(r, q);
      this.recu[r] = obtenu;
      if (q > 0) ratioMat = Math.min(ratioMat, obtenu / q);
    }

    // Sous 15 % de ses besoins en matières, un bâtiment s'arrête complètement
    // et ne paie plus que son entretien : on ne rallume pas une scierie pour
    // produire trois planches par mois.
    if (Object.keys(besoins).length && ratioMat < P.seuilMatieres) {
      for (const [r, o] of Object.entries(this.recu)) marche.offrir(r, o); // on rend
      this.production = 0; this.tauxReel = 0;
      this.resultat = -ent;
      this.alerte = 'matieres';
      return this.cloturer();
    }

    const taux = this.activiteEffective * Math.min(ratioMat, partBras);
    this.tauxReel = taux;
    this.production = this.capacite * taux;

    const prixSortie = marche.prix[this.def.sort];
    const recette = this.production * prixSortie;
    let achats = 0;
    for (const [r, o] of Object.entries(this.recu)) achats += o * marche.prix[r];
    const salaires = this.masseSalarialePleine * taux;

    this.resultat = recette - achats - salaires - ent;
    this.margeUnitaire = this.production > 0
      ? (recette - achats - salaires) / this.production : 0;

    // La production part sur le marché — sauf si le joueur l'affecte à son
    // entrepôt, ce qui réduit directement les entrées et fait monter le prix.
    if (this.versEntrepot && this.societe && this.societe.entrepotDans(this.ville)) {
      this.societe.stocker(this.ville, this.def.sort, this.production);
    } else {
      marche.offrir(this.def.sort, this.production);
    }

    if (ratioMat < 0.9) this.alerte = 'matieres';
    else if (partBras < 0.9) this.alerte = 'bras';
    else if (this.resultat < 0) this.alerte = 'perte';

    return this.cloturer();
  }

  cloturer() {
    this.histo.push(this.resultat);
    if (this.histo.length > P.fenetreProfit) this.histo.shift();
    // Une case qui reste vide un an ferme : la fermeture libère les bras, le
    // foncier et le droit de rebâtir ailleurs.
    if (this.tauxReel <= 0.01) this.moisVide++; else this.moisVide = 0;
    return this.resultat;
  }

  get profitAnnuel() {
    const s = this.histo.reduce((a, b) => a + b, 0);
    return this.histo.length ? s * 12 / this.histo.length : 0;
  }

  // Valeur : un profit se projette sur la durée, une perte se répare — les deux
  // multiplicateurs ne sont pas les mêmes, et ce n'est pas arbitraire.
  valeur(multiple) {
    const base = this.terrainCourant + this.valeurBatie;
    const p = this.profitAnnuel;
    const v = p >= 0 ? base + multiple * p : base - P.malusPerte * p * -1;
    const plancher = base - P.malusPerte * this.entretien * 12;
    return Math.max(plancher, v);
  }

  // Ce que le bâtiment demande au marché du travail ce mois-ci.
  get postesDemandes() {
    if (this.def.cat === 'loge') return 0;                  // une maison n'emploie personne
    if (this.def.cat === 'bur') return this.def.postes;
    if (this.def.cat === 'neg') return this.n;
    return this.n * (this.activiteEffective ?? this.activite);
  }

  // Ce qu'il emploie RÉELLEMENT, une fois le mois écoulé. C'est ce chiffre — et
  // jamais la capacité installée — qui dit s'il reste de la main-d'œuvre pour un
  // nouveau chantier : une usine à l'arrêt ne mobilise personne. En comptant les
  // postes théoriques, la simulation refusait de construire une minoterie alors
  // qu'un travailleur sur cinq était sans emploi, et la ville restait bloquée
  // pendant des années sans qu'on comprenne pourquoi.
  get postesPourvus() {
    if (this.def.cat === 'loge') return 0;
    if (this.def.cat === 'bur') return this.def.postes * (this.tauxReel || 0);
    if (this.def.cat === 'neg') return this.n;
    return this.n * (this.tauxReel || 0);
  }
}

// ---------------------------------------------------------------------------
// La société.
//
// Un joueur ne possède presque rien en propre. Il possède 10 % d'une société
// qu'il dirige, et cette société possède tout le reste. Sa fortune, celle qui
// décide de la victoire, c'est son argent liquide plus la valeur en bourse des
// actions qu'il détient.
// ---------------------------------------------------------------------------


let _idSociete = 1;

class Societe {
  constructor(nom, couleur, estJoueur = false) {
    this.id = `S${_idSociete++}`;
    this.nom = nom;
    this.couleur = couleur;
    this.estJoueur = estJoueur;

    this.tresorerie = P.apportJoueur / P.partFondateur;   // 15 000 $
    this.actions = P.actionsInitiales;
    this.dette = 0;
    this.batiments = [];
    this.chantiers = [];
    this.stocks = {};                 // par ville : { ressource: quantité }
    this.histoCours = [];
    this.faillite = false;

    // Le porteur détient 10 % ; les 90 % restants sont au public.
    this.parts = { [this.id + ':fondateur']: P.actionsInitiales * P.partFondateur };
  }

  partDe(qui) { return (this.parts[qui] || 0) / this.actions; }

  // --- Patrimoine ----------------------------------------------------------

  actifNet(multiple) {
    let v = this.tresorerie - this.dette;
    for (const b of this.batiments) v += b.valeur(multiple);
    for (const c of this.chantiers) v += c.engage;   // le cash immobilisé dans les trous
    return v;
  }

  cours(multiple) { return Math.max(0.01, this.actifNet(multiple) / this.actions); }

  // Le cours retenu pour le décompte final est la moyenne des douze derniers
  // mois, jamais celui de la dernière seconde : sans cette précaution la partie
  // se déciderait sur une manipulation de dernière minute.
  coursMoyen() {
    if (!this.histoCours.length) return 1;
    return this.histoCours.reduce((a, b) => a + b, 0) / this.histoCours.length;
  }

  enregistrerCours(multiple) {
    this.histoCours.push(this.cours(multiple));
    if (this.histoCours.length > P.fenetreProfit) this.histoCours.shift();
  }

  // --- Entrepôts et stocks -------------------------------------------------
  // L'entrepôt est le droit d'entrée sur un marché : sans entrepôt sur place,
  // une société ne peut ni acheter ni stocker dans cette ville.

  entrepotDans(ville) {
    return this.batiments.some(b => b.ville === ville && b.def.cat === 'neg');
  }

  capaciteDans(ville) {
    return this.batiments
      .filter(b => b.ville === ville && b.def.cat === 'neg')
      .reduce((s, b) => s + b.def.capacite, 0);
  }

  stockDe(ville) {
    if (!this.stocks[ville.id]) this.stocks[ville.id] = {};
    return this.stocks[ville.id];
  }

  stocker(ville, res, qte) {
    const s = this.stockDe(ville);
    const total = Object.values(s).reduce((a, b) => a + b, 0);
    const place = Math.max(0, this.capaciteDans(ville) - total);
    const mis = Math.min(qte, place);
    s[res] = (s[res] || 0) + mis;
    return qte - mis;                 // ce qui n'a pas pu entrer
  }

  // --- Comptes -------------------------------------------------------------

  encaisser(m) { this.tresorerie += m; }

  peutPayer(m) { return this.tresorerie >= m; }

  payer(m) {
    this.tresorerie -= m;
    if (this.tresorerie < 0) this.faillite = true;
    return true;
  }

  get resultatMensuel() {
    return this.batiments.reduce((s, b) => s + b.resultat, 0);
  }

  get masseSalariale() {
    return this.batiments.reduce((s, b) =>
      s + b.masseSalarialePleine * (b.tauxReel || 0), 0);
  }
}

// ---------------------------------------------------------------------------
// Le chantier.
//
// On lance un chantier dès qu'on a le cash — rien n'oblige à attendre les
// planches. Le cash part immédiatement, le chantier entre au carnet, et il
// reste un trou dans le sol tant que la totalité des matériaux n'est pas
// arrivée. Cette commande n'est pas une intention : c'est une demande réelle
// sur le marché, au même titre que le pain d'un ménage.
// ---------------------------------------------------------------------------

let _idChantier = 1;

class Chantier {
  constructor(type, ville, cases, societe, coutTerrain) {
    this.id = _idChantier++;
    this.type = type;
    this.ville = ville;
    this.cases = cases;
    this.societe = societe;
    this.ouvertLe = 0;
    this.engage = coutTerrain;
    this.restant = materiaux(type);          // ce qu'il attend encore
    this.recu = {};
    for (const r of Object.keys(this.restant)) this.recu[r] = 0;
  }

  // Un chantier est achevé quand il ne lui manque plus rien d'utile. La
  // tolérance n'est pas une facilité : le rationnement au prorata fait décroître
  // le reliquat géométriquement, si bien qu'il resterait éternellement un
  // millième de brique et que le chantier ne sortirait jamais de terre.
  get complet() {
    return Object.values(this.restant).every(q => q < 0.5);
  }

  // Part de main-d'œuvre mobilisée : les bras suivent les matériaux, pas le
  // calendrier. Un chantier à l'arrêt ne mobilise personne.
  get postesDemandes() {
    const tot = Object.values(materiaux(this.type)).reduce((a, b) => a + b, 0);
    const res = Object.values(this.restant).reduce((a, b) => a + b, 0);
    return (1 - res / tot) > 0 ? this.cases.length * 0.5 : 0;
  }

  progression() {
    if (this.complet) return 1;
    const tot = Object.values(materiaux(this.type)).reduce((a, b) => a + b, 0);
    const res = Object.values(this.restant).reduce((a, b) => a + b, 0);
    return Math.min(0.99, 1 - res / tot);
  }
}

// ===== js/sim/ai.js ==================================================

// ---------------------------------------------------------------------------
// Comment une ville bâtit.
//
// Une ville ne bâtit pas ce qui rapporte le plus. Elle bâtit ce qui lui manque,
// et quand rien ne manque, alors seulement elle regarde le rendement. Trois
// règles suffisent à décrire tout son comportement, et elles valent aussi bien
// pour un joueur — un joueur a simplement le droit de se tromper.
// ---------------------------------------------------------------------------


// Qui produit quoi.
const PRODUCTEUR = {
  bois: 'coupe', argile: 'carriere', charbon: 'mineCharbon', minerai: 'mineFer',
  cereales: 'ferme', betail: 'ranch',
  planches: 'scierie', briques: 'briqueterie', pain: 'minoterie',
  viande: 'abattoir', acier: 'acierie', produits: 'manufacture',
};

// PREMIÈRE RÈGLE — on ne bâtit pas ce qui manque, on bâtit ce qui empêche de
// le faire. La ville prend son besoin le plus criant, puis remonte la filière
// jusqu'au premier maillon qui bloque. Il manque du pain ? Si les minoteries
// tournent à vide faute de blé, on bâtit une ferme, pas une minoterie.
function remonter(monde, ville, res, profondeur = 0) {
  if (profondeur > 4) return null;
  const type = PRODUCTEUR[res];
  if (!type) return null;
  const def = BAT[type];
  const intrants = Object.keys(def.intrants || {});
  if (!intrants.length) return type;

  // Le goulot se lit dans le PRIX, pas ailleurs. Une scierie ne souffre pas du
  // manque de bois en soi : si les planches étaient rares aussi, leur prix
  // monterait et sa marge tiendrait. Elle souffre parce que le bois est rare
  // alors que les planches ne le sont pas. C'est l'écart entre le prix d'entrée
  // et le prix de sortie qui désigne le maillon à bâtir.
  const m = ville.marche;
  let pire = null, pireIndice = 0;
  for (const r of intrants) {
    const indice = m.prix[r] / RES[r].prix;
    if (indice > pireIndice) { pireIndice = indice; pire = r; }
  }
  const indiceSortie = m.prix[res] / RES[res].prix;

  // Si l'intrant est nettement plus tendu que le produit, c'est lui qu'il faut
  // aller chercher en amont. Sinon, c'est bien cet atelier-ci qui manque.
  if (pireIndice > 1.20 && pireIndice > indiceSortie * 0.95) {
    return remonter(monde, ville, pire, profondeur + 1);
  }
  return type;
}

// TROISIÈME RÈGLE — le plafond de bras. On ne décide pas de bâtir ce qu'on ne
// pourra pas faire tourner. Une ville qui ignore cette règle se couvre d'usines
// vides et s'affame.
function brasDisponibles(monde, ville) {
  const bras = ville.menages * P.employesParMenage;
  let occupes = 0;
  // On plafonne sur les postes DEMANDÉS, chantiers compris : c'est la capacité
  // installée qui ne peut pas dépasser le nombre de bras. Se fier aux postes
  // pourvus mènerait à une spirale — des usines rationnées paraissent libérer
  // des bras, on bâtit davantage, on rationne encore plus, et la ville se
  // couvre d'usines vides en s'affamant.
  for (const b of monde.tousBatiments(ville)) occupes += b.postesDemandes;
  for (const c of monde.tousChantiers(ville)) occupes += c.postesDemandes;
  return bras - occupes;
}

// Une filière est saturée quand ses ateliers existants tournent déjà au ralenti
// faute d'intrants : en bâtir un de plus n'ajoute pas un gramme de production.
function sature(monde, ville, type) {
  const intrants = Object.keys(BAT[type].intrants || {});
  if (!intrants.length) return false;
  const miens = monde.tousBatiments(ville).filter(b => b.type === type && b.age > 3);
  if (miens.length < 2) return false;
  const taux = miens.reduce((s, b) => s + b.tauxReel, 0) / miens.length;
  if (taux >= 0.55) return false;
  // Ils tournent au ralenti — mais est-ce faute d'intrants, ou faute de
  // débouchés ? Dans le second cas, en bâtir un de plus serait absurde ; dans
  // le premier, c'est en amont qu'il faut aller, ce dont `remonter` s'occupe.
  return true;
}

// Le besoin le plus criant de la ville, dans l'ordre où elle le ressent.
function besoinLePlusCriant(monde, ville, penchant) {
  const b = ville.barometres;
  const m = ville.marche;

  const candidats = [];

  // La nourriture passe avant tout le reste. Elle est le seul baromètre dont la
  // chute vide la ville, et le seul dont la correction prend des années : il
  // faut une ferme, puis une minoterie, puis des bras pour les deux.
  if (b.nourriture < 0.995) candidats.push({ score: 5 - b.nourriture * 2, res: 'pain' });

  // Le logement ne compte pas dans le plafond de bras : une maison n'emploie
  // personne, et la bloquer parce que la ville est pleine, c'est l'empêcher de
  // grandir précisément au moment où elle le pourrait.
  //
  // Mais on ne loge pas des gens qu'on ne pourra pas nourrir. La ville garde
  // toujours un peu de mou sur le marché du travail : « la main-d'œuvre
  // disponible est l'amortisseur de la ville », et une ville au plein emploi ne
  // peut plus bâtir la ferme qui la sauverait. Un plein-emploi durable n'est
  // pas une réussite, c'est une fragilité.
  const mou = brasDisponibles(monde, ville) / Math.max(1, ville.menages * P.employesParMenage);
  if (ville.occupation > 0.86 && mou > 0.10) {
    candidats.push({ score: 2.2 + ville.occupation, res: null, type: 'logement' });
  }

  if (b.produits < 0.90) candidats.push({ score: 2 - b.produits, res: 'produits' });

  // Les matériaux : une ville à court de briques finit par se donner une
  // briqueterie, parce que ses chantiers en font monter le prix.
  for (const r of ['planches', 'briques']) {
    const indice = m.prix[r] / RES[r].prix;
    if (indice > 1.15) candidats.push({ score: indice, res: r });
  }

  // Le penchant ne rend pas aveugle : il déclasse les occasions, il ne les
  // supprime pas. Une pénurie criante reste criante pour tout le monde.
  if (penchant) for (const c of candidats) {
    if (c.type === penchant || c.res === penchant) c.score *= 1.5;
  }
  candidats.sort((a, b2) => b2.score - a.score);
  if (!candidats.length) return null;
  // Parmi les occasions qui se valent à peu près, on ne prend pas toujours la
  // première : deux sociétés qui lisent le même marché ne doivent pas fatalement
  // ouvrir le même chantier le même mois.
  const seuil = candidats[0].score * 0.75;
  const bonnes = candidats.filter(c => c.score >= seuil);
  return bonnes[Math.floor(Math.random() * bonnes.length)];
}

// L'épargne des ménages bâtit la ville. Les habitants construisent ce qui
// manque le plus, et ces bâtiments appartiennent aux propriétaires
// indépendants — donc rachetables par les joueurs.
function piloterVille(monde, ville) {
  const budget = ville.epargne;
  if (budget < 200) return;

  const besoin = besoinLePlusCriant(monde, ville);
  if (!besoin) return;

  let type;
  if (besoin.type === 'logement') {
    // La maison est un petit pas prudent, l'immeuble un pari sur l'avenir.
    // Une ville sans acier ne peut pas bâtir en hauteur.
    const acierDispo = ville.marche.stock.acier > 200;
    type = (acierDispo && ville.menages > 260 && budget > 4500) ? 'immeuble' : 'maison';
  } else {
    type = remonter(monde, ville, besoin.res);
  }
  if (!type) return;

  const def = BAT[type];
  if (def.cat !== 'loge' && brasDisponibles(monde, ville) < def.cases) return;

  const cout = coutEstime(monde, ville, type);
  if (budget < cout) return;

  const cases = monde.trouverEmplacement(ville, type, null);
  if (!cases) return;

  ville.epargne -= cout;
  monde.poser(type, ville, cases, null);
}

function coutEstime(monde, ville, type) {
  const m = ville.marche;
  let c = 0;
  const def = BAT[type];
  for (const [r, q] of Object.entries(def.mat)) c += q * def.cases * m.prix[r];
  return c + def.cases * monde.prixCase(ville, { distanceGare: 8, proprio: 'ind' });
}

// ---------------------------------------------------------------------------
// Les sociétés rivales.
//
// Elles jouent le même jeu que le joueur, avec les mêmes règles : elles
// achètent de la terre, ouvrent des chantiers, règlent l'activité de leurs
// bâtiments. Elles n'ont accès à aucune information cachée.
// ---------------------------------------------------------------------------

function piloterSociete(monde, s) {
  if (s.faillite) return;

  // On surveille d'abord ce qu'on possède : un atelier qui perd de l'argent
  // depuis trois mois passe en sommeil plutôt que de saigner.
  for (const b of s.batiments) {
    if (!b.def.sort) continue;
    const pertes = b.histo.slice(-3);
    if (pertes.length === 3 && pertes.every(x => x < 0)) b.activite = 0;
    else if (b.activite === 0 && b.margeBrute(b.ville.marche) > b.entretien * 2) b.activite = 1;
  }

  // Ouvrir trop de chantiers à la fois, c'est immobiliser son cash dans des
  // trous. C'est le principal piège de trésorerie du jeu.
  if (s.chantiers.length >= 2) return;
  if (s.tresorerie < 1200) return;

  // Où bâtir : la ville où l'occasion est la plus nette. Chaque société a un
  // métier de prédilection, sans quoi les trois rivales bâtiraient exactement
  // la même chose au même moment.
  let meilleur = null;
  for (const v of monde.villes) {
    const besoin = besoinLePlusCriant(monde, v, s.penchant);
    if (!besoin) continue;
    let type = besoin.type === 'logement'
      ? (v.marche.stock.acier > 300 && s.tresorerie > 6000 ? 'immeuble' : 'maison')
      : remonter(monde, v, besoin.res);
    if (!type) continue;
    const def = BAT[type];
    if (def.cat !== 'loge' && brasDisponibles(monde, v) < def.cases) continue;
    // On n'ajoute pas un atelier de plus à une filière déjà à l'arrêt : ce
    // serait payer un bâtiment pour le mettre aussitôt en sommeil.
    if (sature(monde, v, type)) continue;
    const score = besoin.score;
    if (!meilleur || score > meilleur.score) meilleur = { ville: v, type, score };
  }

  // Les bureaux sont le seul argent qui vienne du dehors : une ville qui en
  // manque s'étiole. C'est un placement lent mais qui ne dépend d'aucun marché.
  if (!meilleur || meilleur.score < 1.2) {
    const v = monde.villes[Math.floor(Math.random() * monde.villes.length)];
    const bureaux = monde.tousBatiments(v).filter(b => b.def.cat === 'bur').length;
    if (bureaux < Math.ceil(v.menages / 78) && brasDisponibles(monde, v) > 25) {
      meilleur = { ville: v, type: 'bureaux', score: 1 };
    }
  }
  if (!meilleur) return;

  const cases = monde.trouverEmplacement(meilleur.ville, meilleur.type, null)
             || monde.trouverEmplacement(meilleur.ville, meilleur.type, s);
  if (!cases) return;
  const cout = coutEstime(monde, meilleur.ville, meilleur.type);
  if (s.tresorerie < cout * 1.3) return;

  monde.ouvrirChantier(meilleur.type, meilleur.ville, cases, s);
}

// ===== js/sim/world.js ===============================================

// ---------------------------------------------------------------------------
// Le monde et la boucle mensuelle.
//
// Tout se résout au mois, et le mois dure dix secondes réelles. Rien ne se
// calcule en continu : la production, la consommation, les loyers, les
// salaires, les prix, les dividendes.
//
//   Seconde 0     la production est livrée, les prix recalculés, les comptes
//                 mis à jour
//   Secondes 0-3  fenêtre de priorité des joueurs : stocks au plus haut, prix
//                 au plus bas
//   Secondes 3-10 l'ordinateur consomme progressivement ; les stocks fondent
// ---------------------------------------------------------------------------







class Monde {
  constructor({ nbVilles = 3, duree = 60, graine = Date.now() } = {}) {
    const carte = genererCarte(nbVilles, graine);
    this.villes = carte.villes;
    this.liaisons = carte.liaisons;
    this.graine = graine;
    this.mois = 0;
    this.duree = duree;                 // 60 mois = 10 ans = 20 minutes
    this.climat = 'normal';             // normal | euphorie | crise
    this.journal = [];

    this.societes = [];
    this.joueur = new Societe('Vous', '#d9a441', true);
    this.societes.push(this.joueur);
    const rivaux = [
      ['Ashcroft & Fils',    '#5b8fd9', 'logement'],
      ['Compagnie Meridian', '#c05a8a', 'produits'],
      ['Consortium Vale',    '#5fae7f', 'planches'],
    ];
    for (const [n, c, penchant] of rivaux) {
      const s = new Societe(n, c);
      s.penchant = penchant;              // son métier de prédilection
      this.societes.push(s);
    }

    this.recomposerMarches();
    this.amorcer();
  }

  get multiple() {
    return this.climat === 'crise' ? P.multipleCrise
         : this.climat === 'euphorie' ? P.multipleEuphorie : P.multipleNormal;
  }

  // --- Marchés --------------------------------------------------------------
  // Dès que deux villes sont reliées par une ligne achevée, elles n'ont plus
  // qu'un seul marché : leurs stocks se confondent et un prix unique s'établit.
  // Les besoins et les productions s'additionnent.

  recomposerMarches() {
    const parent = this.villes.map((_, i) => i);
    const find = (i) => parent[i] === i ? i : (parent[i] = find(parent[i]));
    for (const l of this.liaisons) if (l.achevee) parent[find(l.a)] = find(l.b);

    const groupes = new Map();
    this.villes.forEach((v, i) => {
      const r = find(i);
      if (!groupes.has(r)) groupes.set(r, []);
      groupes.get(r).push(v);
    });

    const anciens = this.marches || [];
    this.marches = [];
    for (const membres of groupes.values()) {
      const m = new Marche(membres);
      // On reprend les stocks et les prix des marchés d'origine : la fusion
      // additionne, elle ne remet pas à zéro.
      const sources = anciens.filter(a => a.villes.some(v => membres.includes(v)));
      if (sources.length) {
        for (const r of RESSOURCES) {
          m.stock[r] = sources.reduce((s, a) => s + a.stock[r], 0);
          m.prix[r] = sources.reduce((s, a) => s + a.prix[r], 0) / sources.length;
        }
      }
      this.marches.push(m);
      for (const v of membres) v.marche = m;
    }
  }

  // Correctif obligatoire du piège de l'amorçage : il faut des planches pour
  // construire une scierie, qui produit les planches. Chaque ville commence
  // donc avec un stock importé, jamais réapprovisionné. Il finance les premiers
  // bâtiments puis se raréfie, ce qui rend très rentable la première scierie et
  // la première briqueterie de chaque ville.
  amorcer() {
    for (const v of this.villes) {
      for (const [r, q] of Object.entries(P.stockAmorcage)) v.marche.stock[r] += q;
      v.niveau = niveauVille(v.menages);
      // Un parc de départ minimal, aux mains des indépendants : sans lui la
      // ville n'a rien à manger le premier mois.
      this.parcDeDepart(v);
    }
  }

  // Le parc de départ n'est pas posé au hasard : il est dimensionné sur les
  // besoins réels de la ville, filière par filière, en remontant depuis la
  // consommation.
  //
  // « La consommation d'un ménage appelle 0,90 case de production. Mais une
  //   ville n'en vit pas : il faut environ 1,45 fois ce chiffre pour fabriquer
  //   en plus les matériaux des chantiers et de l'entretien. Une ville dotée du
  //   strict nécessaire à la consommation ne peut employer que 45 % de ses bras
  //   et s'effondre. » (§20)
  parcDeDepart(v) {
    const M = v.menages;

    // Logement : un peu plus que la population, pour que l'occupation démarre
    // sous 100 % et laisse à la ville la place de croître.
    this.poserJusqua(v, 'maison', M / 0.85, b => b.def.menages);

    // Filière alimentaire : 1 ration par ménage et par mois.
    this.poserJusqua(v, 'minoterie', M, b => b.capacite);
    this.poserJusqua(v, 'ferme', M * 2, b => b.capacite);      // 2 céréales par pain

    // Filière manufacturée, remontée jusqu'aux mines.
    this.poserJusqua(v, 'manufacture', M * 1.08, b => b.capacite);
    const planchesManu = M * 1.08 * 1;                          // 6 planches pour 6 produits
    const acierManu = M * 1.08 / 3;                             // 2 aciers pour 6 produits
    this.poserJusqua(v, 'acierie', acierManu, b => b.capacite);
    this.poserJusqua(v, 'mineCharbon', acierManu * 4, b => b.capacite);
    this.poserJusqua(v, 'mineFer', acierManu * 4, b => b.capacite);

    // Matériaux : ce que réclament les manufactures, plus l'entretien du parc
    // et les chantiers à venir — c'est le facteur 1,45.
    const planches = planchesManu + M * 0.45;
    this.poserJusqua(v, 'scierie', planches, b => b.capacite);
    this.poserJusqua(v, 'coupe', planches * 2, b => b.capacite);
    this.poserJusqua(v, 'briqueterie', M * 0.40, b => b.capacite);
    this.poserJusqua(v, 'carriere', M * 0.80, b => b.capacite);

    // Filière élevage : pour l'instant un doublon de la filière céréalière,
    // pain et viande étant substituables 1 pour 1. Modeste au départ.
    this.poserJusqua(v, 'abattoir', M * 0.12, b => b.capacite);
    this.poserJusqua(v, 'ranch', M * 0.24, b => b.capacite);

    // Les bureaux sont le seul argent qui vienne du dehors : le nombre de
    // départ décide de la trajectoire d'une ville plus sûrement que la qualité
    // de ses terres. Un immeuble pour 78 ménages tient l'emploi à 78 %.
    const bureaux = Math.max(1, Math.round(M / 78) + (v.bonusBureaux || 0));
    for (let k = 0; k < bureaux; k++) {
      const cases = this.trouverEmplacement(v, 'bureaux', null);
      if (cases) this.poser('bureaux', v, cases, null);
    }

    v.occupation = Math.min(1, v.menages / Math.max(1, this.tousBatiments(v)
      .filter(b => b.def.cat === 'loge').reduce((s, b) => s + b.def.menages, 0)));
  }

  // Pose des bâtiments d'un type jusqu'à couvrir la cible. La capacité réelle
  // dépend de la qualité du sol : sur une mauvaise terre il en faut simplement
  // davantage — la ville cherche toujours à couvrir ses besoins, quel que soit
  // le sol. Ce qui change, c'est le prix de revient.
  poserJusqua(v, type, cible, mesure) {
    let total = 0, gardeFou = 0;
    while (total < cible && gardeFou++ < 400) {
      const cases = this.trouverEmplacement(v, type, null);
      if (!cases) break;
      const b = this.poser(type, v, cases, null);
      total += mesure(b);
    }
    return total;
  }

  // --- Foncier --------------------------------------------------------------

  prixCase(ville, c) {
    const base = prixTerrain(ville.niveau, c.distanceGare);
    return c.proprio === 'ind' ? base * P.surprixIndependants : base;
  }

  // Cherche la meilleure emprise libre de la bonne forme. Les exploitations
  // vont là où le sol est bon — une ferme sur une terre de qualité 5 sort une
  // fois et demie ce que sort la même ferme sur une qualité 3 ; le reste se
  // serre autour de la gare, là où le foncier est cher mais la ville dense.
  trouverEmplacement(ville, type, societe) {
    const def = BAT[type];
    const N = ville.N;
    let meilleur = null, meilleurScore = -Infinity;

    for (let y = 0; y + def.h <= N; y++) for (let x = 0; x + def.w <= N; x++) {
      const cases = [];
      let ok = true;
      for (let dy = 0; dy < def.h && ok; dy++) for (let dx = 0; dx < def.w && ok; dx++) {
        const c = caseAt(ville, x + dx, y + dy);
        if (!c || c.voie || c.rue || c.bat || c.chantier) { ok = false; break; }
        // Une société doit posséder toutes les cases de l'emprise ; le parc de
        // l'ordinateur s'installe sur les terres restées aux indépendants.
        if (societe && c.proprio !== societe.id) { ok = false; break; }
        if (!societe && c.proprio && c.proprio !== 'ind') { ok = false; break; }
        cases.push(c);
      }
      if (!ok || cases.length !== def.cases) continue;

      // Le foncier est d'autant plus recherché qu'il est proche de la gare,
      // mais une exploitation préfère toujours la bonne terre.
      let score = -cases[0].distanceGare;
      if (def.qual) {
        const q = cases.reduce((s, c) => s + c.q[def.qual], 0) / cases.length;
        score = q * 40 - cases[0].distanceGare * 0.5;
      }
      if (score > meilleurScore) { meilleurScore = score; meilleur = cases; }
    }
    return meilleur;
  }

  // Pose immédiate (parc de départ et constructions des indépendants).
  poser(type, ville, cases, societe) {
    for (const c of cases) {
      c.vendue = true;
      if (!societe && !c.proprio) c.proprio = 'ind';
      c.prixPaye = this.prixCase(ville, c);
    }
    const b = new Batiment(type, ville, cases, societe);
    for (const c of cases) c.bat = b;
    if (societe) societe.batiments.push(b);
    else (ville.batIndependants ||= []).push(b);
    return b;
  }

  // Ouvre un chantier. Le cash part immédiatement — terrain compris — et le
  // chantier entre au carnet. Il ne sortira de terre que le mois où la dernière
  // brique sera livrée.
  ouvrirChantier(type, ville, cases, societe) {
    const coutTerrain = cases.reduce((s, c) =>
      s + (c.proprio === societe.id ? 0 : this.prixCase(ville, c)), 0);
    if (!societe.peutPayer(coutTerrain)) return null;
    societe.payer(coutTerrain);
    for (const c of cases) {
      c.proprio = societe.id;
      c.vendue = true;
      c.prixPaye = this.prixCase(ville, c);
    }
    const ch = new Chantier(type, ville, cases, societe, coutTerrain);
    ch.ouvertLe = this.mois;
    for (const c of cases) c.chantier = ch;
    societe.chantiers.push(ch);
    return ch;
  }

  acheterTerrain(ville, c, societe) {
    if (!estAchetable(ville, c) && c.proprio !== 'ind') return false;
    const prix = this.prixCase(ville, c);
    if (!societe.peutPayer(prix)) return false;
    societe.payer(prix);
    c.proprio = societe.id;
    c.vendue = true;
    c.prixPaye = prix;
    return true;
  }

  demolir(b) {
    // La société conserve le terrain, ne récupère aucun matériau, et la case
    // est libre le mois suivant. Sans cette règle, une ville couverte de
    // maisons ne pourrait plus jamais se densifier.
    for (const c of b.cases) c.bat = null;
    if (b.societe) b.societe.batiments = b.societe.batiments.filter(x => x !== b);
    else b.ville.batIndependants = b.ville.batIndependants.filter(x => x !== b);
  }

  tousBatiments(ville) {
    const out = ville.batIndependants ? ville.batIndependants.slice() : [];
    for (const s of this.societes) for (const b of s.batiments) if (b.ville === ville) out.push(b);
    return out;
  }

  tousChantiers(ville) {
    const out = [];
    for (const s of this.societes) for (const c of s.chantiers) if (c.ville === ville) out.push(c);
    return out;
  }

  // =========================================================================
  //  LE MOIS
  // =========================================================================

  tick() {
    if (this.mois >= this.duree) return false;
    this.mois++;

    for (const m of this.marches) m.reinitialiser();

    // --- 1. Tout le monde déclare ses besoins ------------------------------
    for (const v of this.villes) {
      const m = v.marche;
      const bats = this.tousBatiments(v);

      for (const b of bats) b.declarer(m);

      // Les ménages. Le budget est contraint : la nourriture et le loyer sont
      // incompressibles, c'est l'achat de produits manufacturés qui encaisse
      // tout le chômage.
      const revenu = P.employesParMenage * v.salaire * v.barometres.emploi;
      const prixNourr = Math.min(m.prix.pain, m.prix.viande);
      const dispo = Math.max(0, revenu - 5);            // hors loyer approximé
      const partNourr = Math.min(1, dispo / Math.max(0.01, prixNourr));
      const reste = Math.max(0, dispo - partNourr * prixNourr);
      const partProd = Math.min(1, reste / Math.max(0.01, m.prix.produits));

      v.demandeNourriture = v.menages * partNourr;
      v.demandeProduits = v.menages * partProd;

      // Pain et viande sont substituables 1 pour 1 : le ménage veut une ration
      // par mois, pas une demi-ration de chaque. Il mange ce qu'il y a, en
      // commençant par le moins cher. Une ville de blé se passe donc d'élevage
      // et une ville d'herbe se passe de blé, sans que ni l'une ni l'autre soit
      // punie pour ce que son sol ne donne pas.
      // La répartition se fait sur ce que chaque filière est CAPABLE de livrer —
      // sa production du mois écoulé plus son stock — et non sur le stock seul.
      // Sur un marché où le pain se consomme en juste-à-temps, le stock est nul
      // en début de mois : répartir là-dessus enverrait toute la demande sur la
      // viande, et la ville mourrait de faim avec du pain sur les étals.
      const moinsCher = m.prix.pain <= m.prix.viande ? 'pain' : 'viande';
      const autre = moinsCher === 'pain' ? 'viande' : 'pain';
      v.repas = {};
      const capaciteA = m.offreAttendue(moinsCher) * (v.menages / totalMenages(m));
      v.repas[moinsCher] = Math.min(v.demandeNourriture, capaciteA);
      v.repas[autre] = v.demandeNourriture - v.repas[moinsCher];
      m.demander(moinsCher, v.repas[moinsCher]);
      m.demander(autre, v.repas[autre]);
      m.demander('produits', v.demandeProduits);

      // Les chantiers. Cette commande n'est pas une intention : c'est une
      // demande réelle sur le marché, au même titre que le pain d'un ménage.
      // C'est ainsi qu'une ville à court de briques finit par se donner une
      // briqueterie.
      for (const ch of this.tousChantiers(v)) {
        for (const [r, q] of Object.entries(ch.restant)) if (q > 0) m.demander(r, q);
      }

      // L'entretien du bâti : une demande permanente de matériaux, qui donne
      // aux scieries et briqueteries leur débouché de régime de croisière.
      for (const b of bats) {
        for (const [r, q] of Object.entries(materiaux(b.type))) {
          m.demander(r, q * P.entretienAnnuel / 12);
        }
      }
    }

    // --- 2. On ouvre le guichet ---------------------------------------------
    // Les prix ne sont PAS recalculés ici : la production du mois doit d'abord
    // être livrée aux marchés (§2, seconde 0). Ils le seront en fin de mois,
    // sur le rapport entre les besoins et les entrées réellement constatés.
    for (const m of this.marches) m.ouvrirGuichet();

    // --- 3. Main-d'œuvre ----------------------------------------------------
    for (const v of this.villes) {
      const bras = v.menages * P.employesParMenage;
      const bats = this.tousBatiments(v);
      let postes = 0;
      for (const b of bats) postes += b.postesDemandes;
      for (const ch of this.tousChantiers(v)) postes += ch.postesDemandes;
      v.postesDemandes = postes;
      v.bras = bras;
      v.partBras = postes > 0 ? Math.min(1, bras / postes) : 1;
    }

    // --- 4. On produit, dans l'ordre de la filière --------------------------
    // Le service se recalcule avant chaque vague : sans quoi une scierie serait
    // rationnée sur un stock de bois qui ne contient pas encore la coupe du
    // mois. À l'intérieur d'une vague, chacun est servi au même prorata.
    const VAGUES = [
      ['coupe', 'carriere', 'mineCharbon', 'mineFer', 'ferme', 'ranch'],
      ['scierie', 'briqueterie', 'minoterie', 'abattoir', 'acierie'],
      ['manufacture'],
    ];

    for (const v of this.villes) v.__bats = this.tousBatiments(v);

    for (let i = 0; i < VAGUES.length; i++) {
      for (const m of this.marches) m.calculerService();
      for (const v of this.villes) {
        for (const b of v.__bats) {
          if (!VAGUES[i].includes(b.type)) continue;
          b.produire(v.marche, v.partBras);
          if (b.societe) b.societe.encaisser(b.resultat);
          else v.epargne += Math.max(0, b.resultat);
        }
      }

      // Après la première transformation, les chantiers et l'entretien se
      // présentent au même guichet que les usines : le chantier compte comme un
      // consommateur d'intrants, temporaire mais réel. Il n'est ni prioritaire,
      // ni sacrifié.
      if (i === 1) {
        for (const m of this.marches) m.calculerService();

        // L'entretien ne se contracte jamais, pas même en sommeil.
        for (const v of this.villes) {
          for (const b of v.__bats) {
            for (const [r, q] of Object.entries(materiaux(b.type))) {
              v.marche.prendre(r, q * P.entretienAnnuel / 12);
            }
          }
        }

        // Entre chantiers, priorité au plus ancien : un chantier ouvert il y a
        // dix mois ne cède jamais sa place à un chantier ouvert hier. C'est ce
