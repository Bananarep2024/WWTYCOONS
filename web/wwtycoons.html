        // qui garantit qu'aucun chantier ne reste ouvert pour toujours.
        for (const v of this.villes) {
          const m = v.marche;
          const chs = this.tousChantiers(v).sort((a, b) => a.ouvertLe - b.ouvertLe);
          for (const ch of chs) {
            for (const [r, q] of Object.entries(ch.restant)) {
              if (q <= 0) continue;
              const servi = m.prendre(r, q);
              ch.restant[r] = Math.max(0, q - servi);
              ch.recu[r] = (ch.recu[r] || 0) + servi;
              if (ch.societe) ch.societe.payer(servi * m.prix[r]);
            }
          }
        }
      }
    }

    // --- 5. Loyers, bureaux, entrepôts --------------------------------------
    // Ils ne prennent rien au marché : leur recette est un loyer, pas une
    // marchandise.
    for (const v of this.villes) {
      for (const b of v.__bats) {
        if (b.def.sort) continue;
        b.produire(v.marche, v.partBras);
        if (b.societe) b.societe.encaisser(b.resultat);
        else v.epargne += Math.max(0, b.resultat);
      }
    }

    // --- 6. Les ménages consomment ------------------------------------------
    // En deux passes. D'abord chacun prend sa part au prorata sur chaque
    // nourriture ; ensuite seulement joue la substitution, elle aussi au
    // prorata du reliquat. Servir la substitution hors quota donnerait tout le
    // stock à la première ville servie et affamerait les suivantes — sur un
    // marché fusionné, c'est la mort assurée des villes de la fin de liste.
    for (const m of this.marches) m.calculerService();

    for (const v of this.villes) {
      const m = v.marche;
      v.nourrObtenue = 0;
      for (const r of NOURRITURES) v.nourrObtenue += m.prendre(r, v.repas[r] || 0);
      v.prodObtenue = m.prendre('produits', v.demandeProduits);
    }

    for (const m of this.marches) {
      const manque = m.villes.reduce((s, v) =>
        s + Math.max(0, v.demandeNourriture - v.nourrObtenue), 0);
      const dispo = NOURRITURES.reduce((s, r) => s + m.stock[r], 0);
      m.partSubstitution = manque > 0.001 ? Math.min(1, dispo / manque) : 0;
    }

    for (const v of this.villes) {
      const m = v.marche;
      let reste = Math.max(0, v.demandeNourriture - v.nourrObtenue) * m.partSubstitution;
      for (const r of NOURRITURES) {
        if (reste <= 0.001) break;
        const pris = m.rafler(r, reste);
        v.nourrObtenue += pris;
        reste -= pris;
      }
    }

    for (const v of this.villes) {
      const m = v.marche;
      v.barometres.nourriture = clamp01(v.nourrObtenue / Math.max(1, v.menages));
      v.barometres.produits = clamp01(v.prodObtenue / Math.max(1, v.menages));
      v.barometres.emploi = clamp01(
        Math.min(v.postesDemandes, v.bras) / Math.max(1, v.bras));

      // L'épargne des ménages n'est ni perdue ni thésaurisée : elle bâtit la
      // ville. Une fois son panier et son loyer payés, ce qui reste au ménage
      // est investi sur place.
      const revenu = P.employesParMenage * v.salaire * v.barometres.emploi;
      const depense = v.nourrObtenue / Math.max(1, v.menages)
                        * Math.min(m.prix.pain, m.prix.viande)
                    + v.prodObtenue / Math.max(1, v.menages) * m.prix.produits + 5;
      v.epargne += Math.max(0, revenu - depense) * v.menages;
    }

    // --- 7. Les prix du mois suivant ----------------------------------------
    // Maintenant seulement, sur le rapport entre les besoins réels du mois et ce
    // qui est entré sur le marché. Le stock n'entre pas dans ce calcul : il
    // protège l'approvisionnement, pas le cours.
    for (const m of this.marches) m.fixerPrix();

    // --- 8. Le salaire, variable d'ajustement de la ville -------------------
    for (const v of this.villes) this.ajusterSalaire(v);

    // --- 9. Démographie -----------------------------------------------------
    for (const v of this.villes) this.demographie(v);

    // --- 10. Les chantiers achevés sortent de terre --------------------------
    for (const s of this.societes) {
      const restants = [];
      for (const ch of s.chantiers) {
        if (ch.complet) {
          for (const c of ch.cases) c.chantier = null;
          const b = new Batiment(ch.type, ch.ville, ch.cases, s);
          for (const c of ch.cases) c.bat = b;
          s.batiments.push(b);
          this.journal.push(`${this.mois} · ${s.nom} achève ${BAT[ch.type].nom} à ${ch.ville.nom}`);
        } else restants.push(ch);
      }
      s.chantiers = restants;
    }

    // --- 11. Fermeture des cases mortes -------------------------------------
    // Une case qui reste vide un an ferme. Sans cette porte de sortie, une ville
    // qui a bâti au mauvais endroit reste prisonnière de son parc : elle a
    // atteint son plafond, ne peut plus rien bâtir d'autre, et décline en
    // regardant ses ateliers déserts.
    //
    // La règle ne vaut que pour le parc des indépendants — c'est la ville qui
    // ferme ses propres cases mortes. Le bâtiment d'une société lui appartient :
    // à elle de le mettre en sommeil, de le vendre ou de le démolir. On ne
    // détruit pas le capital d'un joueur à sa place.
    for (const v of this.villes) {
      const morts = (v.batIndependants || []).filter(b =>
        b.moisVide >= P.moisAvantFermeture && b.def.cat !== 'loge');
      if (morts.length) this.demolir(morts[0]);       // une seule par mois
    }

    // --- 12. Le rail ---------------------------------------------------------
    this.avancerRail();

    // --- 13. L'ordinateur et les rivaux bâtissent ---------------------------
    for (const v of this.villes) piloterVille(this, v);
    for (const s of this.societes) if (!s.estJoueur) piloterSociete(this, s);

    // --- 14. Finance --------------------------------------------------------
    for (const s of this.societes) s.enregistrerCours(this.multiple);
    for (const v of this.villes) {
      v.niveau = niveauVille(v.menages);
      v.histo.push({ mois: this.mois, menages: v.menages, salaire: v.salaire,
                     ...v.barometres });
      if (v.histo.length > 400) v.histo.shift();
    }

    return true;
  }

  // Chaque mois le salaire tend vers le plus petit de deux nombres : ce dont le
  // ménage a besoin pour couvrir son panier au prix du jour, et ce que les
  // employeurs peuvent payer sans passer sous leur seuil d'activité. Le
  // rattrapage prend quelques mois, et c'est dans cette fenêtre que les
  // baromètres plongent.
  ajusterSalaire(v) {
    const m = v.marche;
    const panier = Math.min(m.prix.pain, m.prix.viande) + m.prix.produits + 5;
    const besoin = panier / P.employesParMenage;

    let capaciteTotale = 0, cases = 0;
    for (const b of this.tousBatiments(v)) {
      if (!b.def.sort || b.tauxReel <= 0.01) continue;
      let recette = b.production * m.prix[b.def.sort];
      for (const [r, q] of Object.entries(b.recu || {})) recette -= q * m.prix[r];
      recette -= b.entretien;
      capaciteTotale += Math.max(0, recette);
      cases += b.n * b.tauxReel;
    }
    const capacite = cases > 0 ? capaciteTotale / cases : P.salaireCase;

    const cible = Math.max(8, Math.min(besoin, capacite));
    v.salaire += 0.25 * (cible - v.salaire);
  }

  // Hors seuil critique, c'est la moyenne des trois baromètres qui décide.
  // Au-dessus du pivot la ville attire, en dessous elle repousse. La cadence
  // est proportionnelle à l'écart.
  demographie(v) {
    const b = v.barometres;
    const moyenne = (b.nourriture + b.emploi + b.produits) / 3;
    v.moyenne = moyenne;

    let taux;
    const critique = b.nourriture < P.seuilsCritiques.nourriture
                  || b.emploi < P.seuilsCritiques.emploi
                  || b.produits < P.seuilsCritiques.produits;
    if (critique) {
      // Un seul seuil franchi vers le bas suffit à vider la ville, quels que
      // soient les autres.
      taux = -P.exodeCritique;
      v.enCrise = true;
    } else {
      taux = 0.2 * (moyenne - P.pivot);
      taux = Math.max(-P.cadenceMax, Math.min(P.cadenceMax, taux));
      v.enCrise = false;
    }

    // La capacité de logement borne l'afflux : la croissance s'arrête même à
    // 95 % de satisfaction si personne n'a bâti. C'est ce qui pousse à
    // construire.
    const capacite = this.tousBatiments(v)
      .filter(x => x.def.cat === 'loge')
      .reduce((s, x) => s + x.def.menages, 0);

    let nouveau = v.menages * (1 + taux);
    nouveau = Math.max(0, Math.min(nouveau, capacite));
    v.menages = nouveau;
    v.capaciteLogement = capacite;
    // Le taux d'occupation est commun à toute la ville, partagé par tous les
    // propriétaires : ajouter des logements augmente la capacité ; si la
    // population ne suit pas, l'occupation baisse pour tout le monde.
    v.occupation = capacite > 0 ? clamp01(v.menages / capacite) : 0;
  }

  // Le rail est entièrement conduit par l'ordinateur ; le joueur n'y intervient
  // que comme actionnaire. Chaque tranche de capital avance la date d'un mois,
  // dans la limite de 40 % du délai initial : le joueur peut avancer la date,
  // pas la faire disparaître.
  avancerRail() {
    for (const l of this.liaisons) {
      if (l.achevee) continue;
      if (this.mois >= l.date) {
        l.achevee = true;
        l.cotee = true;
        l.actions = Math.max(1000, l.capital);
        this.journal.push(`${this.mois} · ★ Liaison ouverte : ${l.nom} — les marchés fusionnent`);
        this.recomposerMarches();
      }
    }
  }

  investirRail(liaison, societe, montant) {
    if (liaison.achevee || !societe.peutPayer(montant)) return false;
    societe.payer(montant);
    liaison.capital += montant;
    liaison.parts[societe.id] = (liaison.parts[societe.id] || 0) + montant;
    // Une tranche = un mois d'avance, dans la limite de 40 % du délai initial.
    const tranche = 800;
    const avanceMax = Math.floor(liaison.dateInitiale * 0.40);
    const dejaAvance = liaison.dateInitiale - liaison.date;
    const gain = Math.min(Math.floor(montant / tranche), avanceMax - dejaAvance);
    liaison.date = Math.max(this.mois + 1, liaison.date - Math.max(0, gain));
    return true;
  }

  // Fortune finale = argent liquide + actions détenues × cours, le cours retenu
  // étant la moyenne des douze derniers mois.
  classement() {
    return this.societes.map(s => ({
      societe: s,
      fortune: s.coursMoyen() * s.actions * P.partFondateur,
    })).sort((a, b) => b.fortune - a.fortune);
  }
}

function clamp01(x) { return Math.max(0, Math.min(1, isFinite(x) ? x : 0)); }

// Sur un marché fusionné, chaque ville ne peut compter que sur sa part de
// l'offre commune, au prorata de sa population.
function totalMenages(marche) {
  return Math.max(1, marche.villes.reduce((s, v) => s + v.menages, 0));
}

// ===== js/ui/render.js ===============================================

// ---------------------------------------------------------------------------
// Le rendu de la carte.
//
// Deux états, pas un dégradé (§21) : la vue de ville, où chaque bâtiment a sa
// couleur de fonction, et le mode carte colorée, qui teinte les cases selon une
// donnée unique — fertilité, prix des terres, chômage, propriétaire. Ce second
// mode n'est pas une concession technique : c'est le mode déclaré obligatoire
// au §19 pour rendre le jeu lisible.
// ---------------------------------------------------------------------------



// La couleur sert la fonction avant l'ornement : un joueur doit distinguer d'un
// coup d'œil une scierie d'une aciérie parmi des centaines de bâtiments, sur un
// écran de téléphone. La teinte dit la famille, la valeur dit le bâtiment.
const COULEURS = {
  coupe: '#6b8f4e', carriere: '#a8724a', mineCharbon: '#3a3a40', mineFer: '#6e5f78',
  ferme: '#c9a93f', ranch: '#a8804f',
  scierie: '#b5894f', briqueterie: '#9c4a35', minoterie: '#d6b74e',
  abattoir: '#a83f3f', acierie: '#5a7d8c', manufacture: '#4f8f6a',
  maison: '#8a7f6d', immeuble: '#b3a68e', bureaux: '#7fa3c4', entrepot: '#5f5a4d',
};

const ALERTES = { matieres: '#c9863f', bras: '#6f9fc9', invendus: '#9a6fb0', perte: '#c2544b' };

class Rendu {
  constructor(canvas, monde) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.monde = monde;
    this.mode = 'fonction';
    this.selection = null;
    this.survol = null;
    this.zoom = 1;
    this.cx = 0; this.cy = 0;          // décalage en cases
  }

  dimensionner() {
    const z = this.cv.parentElement;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = z.clientWidth; this.h = z.clientHeight;
    this.cv.width = this.w * dpr; this.cv.height = this.h * dpr;
    this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  get ville() { return this.monde.villes[this.iVille || 0]; }

  // Taille d'une case à l'écran. À zoom 1, la ville tient entièrement dans la
  // fenêtre, quel que soit l'écran — c'est la vue d'ensemble. Au-delà, on entre
  // dans le détail, et sur un téléphone c'est indispensable : une case de sept
  // pixels ne se vise pas au doigt.
  get pasBase() { return Math.min(this.w, this.h) / this.ville.N; }
  get pas() { return Math.max(2, this.pasBase * this.zoom); }
  get ox() { return Math.round((this.w - this.ville.N * this.pas) / 2 + this.cx); }
  get oy() { return Math.round((this.h - this.ville.N * this.pas) / 2 + this.cy); }

  // On ne laisse jamais la ville sortir entièrement de l'écran.
  recadrer() {
    const etendue = this.ville.N * this.pas;
    const margeX = Math.max(0, (etendue - this.w) / 2 + this.w * 0.35);
    const margeY = Math.max(0, (etendue - this.h) / 2 + this.h * 0.35);
    this.cx = Math.max(-margeX, Math.min(margeX, this.cx));
    this.cy = Math.max(-margeY, Math.min(margeY, this.cy));
  }

  // Zoome en gardant fixe le point visé — sinon la carte glisse sous le doigt.
  zoomerVers(px, py, facteur) {
    const avant = this.pas;
    this.zoom = Math.max(1, Math.min(6, this.zoom * facteur));
    const apres = this.pas;
    if (apres === avant) return;
    const k = apres / avant;
    this.cx = (this.cx + this.w / 2 - px) * k - this.w / 2 + px;
    this.cy = (this.cy + this.h / 2 - py) * k - this.h / 2 + py;
    this.recadrer();
  }

  caseSous(px, py) {
    const x = Math.floor((px - this.ox) / this.pas), y = Math.floor((py - this.oy) / this.pas);
    const v = this.ville;
    if (x < 0 || y < 0 || x >= v.N || y >= v.N) return null;
    return v.cases[y * v.N + x];
  }

  dessiner() {
    const { ctx } = this, v = this.ville, p = this.pas, ox = this.ox, oy = this.oy;
    ctx.clearRect(0, 0, this.w, this.h);
    ctx.fillStyle = '#0e0d0a';
    ctx.fillRect(0, 0, this.w, this.h);

    const joueur = this.monde.joueur;

    for (const c of v.cases) {
      const x = ox + c.x * p, y = oy + c.y * p;
      if (x + p < 0 || y + p < 0 || x > this.w || y > this.h) continue;

      ctx.fillStyle = this.couleurCase(c, v);
      ctx.fillRect(x, y, p, p);

      if (c.rue && this.mode === 'fonction') {
        ctx.fillStyle = '#2a2822';
        ctx.fillRect(x, y, p, p);
      }

      // Les emprises de voie sont réservées et visibles dès la première
      // seconde : le joueur sait où le rail passera.
      if (c.voie) {
        ctx.fillStyle = '#2f2c25';
        ctx.fillRect(x, y, p, p);
        ctx.strokeStyle = '#4a463a'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y + p / 2); ctx.lineTo(x + p, y + p / 2); ctx.stroke();
      }
    }

    // Le contour remplace l'occlusion et se voit à toutes les distances (§21) :
    // un trait sombre sur les ruptures rend la trame urbaine lisible.
    if (p >= 5 && this.mode === 'fonction') {
      ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1;
      const vus = new Set();
      for (const c of v.cases) {
        if (!c.bat || vus.has(c.bat.id)) continue;
        vus.add(c.bat.id);
        const xs = c.bat.cases.map(k => k.x), ys = c.bat.cases.map(k => k.y);
        const x0 = ox + Math.min(...xs) * p, y0 = oy + Math.min(...ys) * p;
        const w = (Math.max(...xs) - Math.min(...xs) + 1) * p;
        const h = (Math.max(...ys) - Math.min(...ys) + 1) * p;
        ctx.strokeRect(x0 + .5, y0 + .5, w - 1, h - 1);
      }
    }

    // La gare, au centre.
    ctx.fillStyle = '#d9a441';
    ctx.fillRect(ox + v.gare.x * p, oy + v.gare.y * p, p, p);

    // Chantiers : une case terrassée à plat, visible de tous dès le premier
    // jour. Personne n'est jamais pris par surprise.
    for (const c of v.cases) {
      if (!c.chantier) continue;
      const x = ox + c.x * p, y = oy + c.y * p;
      ctx.fillStyle = '#3d3527';
      ctx.fillRect(x, y, p, p);
      ctx.strokeStyle = c.chantier.societe === joueur ? '#d9a441' : '#6b6252';
      ctx.setLineDash([2, 2]); ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, y + .5, p - 1, p - 1);
      ctx.setLineDash([]);
      if (p >= 8) {
        ctx.fillStyle = '#d9a441';
        ctx.fillRect(x + 1, y + p - 3, (p - 2) * c.chantier.progression(), 2);
      }
    }

    // Les pastilles d'alerte : quatre états seulement, et jamais recouvertes.
    // C'est la couche que le joueur lit vraiment.
    if (p >= 6) {
      const vus = new Set();
      for (const c of v.cases) {
        const b = c.bat;
        if (!b || !b.alerte || vus.has(b.id)) continue;
        vus.add(b.id);
        ctx.fillStyle = ALERTES[b.alerte];
        ctx.beginPath();
        ctx.arc(ox + c.x * p + p - 2.5, oy + c.y * p + 2.5, Math.min(2.5, p / 4), 0, 7);
        ctx.fill();
      }
    }

    // La frontière achetable : étroite et disputée. Les joueurs se battent sur
    // le même mince liseré, ce qui concentre la compétition.
    if (this.mode === 'proprio' || this.mode === 'terrain') {
      ctx.strokeStyle = 'rgba(217,164,65,.55)'; ctx.lineWidth = 1;
      for (const c of v.cases) {
        if (!estAchetable(v, c)) continue;
        ctx.strokeRect(ox + c.x * p + .5, oy + c.y * p + .5, p - 1, p - 1);
      }
    }

    if (this.selection) {
      const c = this.selection;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.strokeRect(ox + c.x * p - 1, oy + c.y * p - 1, p + 2, p + 2);
    }
  }

  couleurCase(c, v) {
    switch (this.mode) {
      case 'fonction': {
        // « Si la teinte sert à l'individualité, elle n'est plus disponible
        //   pour l'information. » On ne fait donc varier que la valeur : la
        //   teinte reste celle de la famille, et deux maisons voisines se
        //   distinguent quand même.
        if (c.bat) return nuance(COULEURS[c.bat.type], c.bat.id);
        return nuance(RELIEFS[c.relief].couleur, c.x * 31 + c.y * 17);
      }

      case 'proprio': {
        if (!c.vendue && !c.proprio) return '#1e1c17';
        if (c.proprio === 'ind') return '#4a463a';
        const s = this.monde.societes.find(x => x.id === c.proprio);
        return s ? s.couleur : '#2a2822';
      }

      case 'terrain': {
        const t = prixTerrain(v.niveau, c.distanceGare);
        const k = Math.min(1, (t - 60) / 360);
        return melange('#22201a', '#d9a441', k);
      }

      default: {
        // Les cartes de qualité : le seul endroit où se lit le handicap de
        // terrain, qui ne fait aucun bruit et ne se guérit jamais.
        const q = c.q[this.mode];
        return q == null ? '#22201a' : melange('#241f17', '#7dd48a', (q - 1) / 4);
      }
    }
  }
}

// Fait varier la luminosité d'une teinte selon un identifiant, sans jamais
// toucher à la teinte elle-même.
function nuance(hex, graine) {
  const h = ((graine * 2654435761) >>> 0) % 1000 / 1000;
  const k = 0.86 + h * 0.28;
  const p = (i) => Math.max(0, Math.min(255, Math.round(parseInt(hex.substr(i, 2), 16) * k)));
  const c = (v) => v.toString(16).padStart(2, '0');
  return `#${c(p(1))}${c(p(3))}${c(p(5))}`;
}

function melange(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  const p = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  const c = (x, y) => Math.round(x + (y - x) * t).toString(16).padStart(2, '0');
  return `#${c(r1, r2)}${c(g1, g2)}${c(b1, b2)}`;
}

// ===== js/ui/panneaux.js =============================================

// ---------------------------------------------------------------------------
// Les panneaux d'information.
//
// « Le registre est ce qui permet au joueur de repérer le bâtiment qui perd de
//   l'argent. Sans lui, une société de trente bâtiments est une boîte noire et
//   le joueur ne peut prendre aucune décision éclairée — il jouera au hasard.
//   C'est un écran à soigner autant que la carte, et probablement à concevoir
//   avant elle. » (§3)
// ---------------------------------------------------------------------------



const $ = (s) => document.querySelector(s);
const eur = (n) => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + ' $';
const pct = (n) => Math.round(n * 100) + ' %';
const cl = (n) => n > 0 ? 'vert' : n < 0 ? 'rouge' : 'doux';

// --- Ville ------------------------------------------------------------------

function panneauVille(monde, v) {
  const b = v.barometres;
  const moy = (b.nourriture + b.emploi + b.produits) / 3;

  // Les trois barres doivent être affichées côte à côte avec leur moyenne, pour
  // qu'on voie d'un coup d'œil laquelle tire vers le bas : trois facteurs
  // médiocres donnent un résultat médiocre sans qu'aucun ne saute aux yeux.
  const jauge = (nom, val, seuil, couleur) => `
    <div class="barometre ${val < seuil ? 'critique' : ''}">
      <div class="tete"><span>${nom}</span>
        <span class="${val < seuil ? 'rouge' : 'doux'}">${pct(val)}${val < seuil ? ' ⚠' : ''}</span></div>
      <div class="piste"><div class="jauge" style="width:${Math.min(100, val * 100)}%;background:${couleur}"></div></div>
    </div>`;

  const tendance = v.enCrise ? '<span class="rouge">seuil critique franchi — la ville se vide de 5 % par mois</span>'
    : moy > P.pivot + 0.005 ? `<span class="vert">attractive — elle grossit de ${(0.2 * (moy - P.pivot) * 100).toFixed(1)} % par mois</span>`
    : moy < P.pivot - 0.005 ? `<span class="rouge">elle repousse — ${(0.2 * (moy - P.pivot) * 100).toFixed(1)} % par mois</span>`
    : '<span class="doux">à l\'équilibre, sur son pivot</span>';

  return `
    <h3>${v.nom} · ${P.nomsNiveau[v.niveau - 1]}</h3>
    <div class="grille">
      <div class="fiche"><div class="etiq">Ménages</div><div class="v">${Math.round(v.menages)}</div></div>
      <div class="fiche"><div class="etiq">Occupation</div><div class="v">${pct(v.occupation)}</div></div>
      <div class="fiche"><div class="etiq">Salaire</div><div class="v">${v.salaire.toFixed(1)} $</div></div>
      <div class="fiche"><div class="etiq">Bras libres</div><div class="v">${Math.round(Math.max(0, v.bras - v.postesDemandes))}</div></div>
    </div>

    <h3>Les trois baromètres</h3>
    ${jauge('Nourriture', b.nourriture, P.seuilsCritiques.nourriture, '#d9a441')}
    ${jauge('Emploi', b.emploi, P.seuilsCritiques.emploi, '#6f9fc9')}
    ${jauge('Produits manufacturés', b.produits, P.seuilsCritiques.produits, '#6faa72')}
    <div class="barometre" style="margin-top:11px">
      <div class="tete"><span><b>Moyenne</b> — pivot à ${pct(P.pivot)}</span><span class="or"><b>${pct(moy)}</b></span></div>
      <div class="piste"><div class="jauge" style="width:${moy * 100}%;background:#d9a441"></div></div>
    </div>
    <div class="note">${tendance}</div>

    <h3>Prochain palier</h3>
    <div class="note">${paliersuivant(v)}</div>

    <h3>Chantiers en cours (${monde.tousChantiers(v).length})</h3>
    ${tableChantiers(monde, v)}
  `;
}

function paliersuivant(v) {
  const n = niveauVille(v.menages);
  if (n >= 5) return 'Métropole — le dernier palier est atteint.';
  const cible = P.seuilsNiveau[n];
  return `${P.nomsNiveau[n]} à ${cible} ménages — il en manque <b>${Math.max(0, Math.ceil(cible - v.menages))}</b>. `
       + `Le foncier passerait de ×${P.facteurNiveau[n - 1].toFixed(1)} à ×${P.facteurNiveau[n].toFixed(1)}.`;
}

function tableChantiers(monde, v) {
  const chs = monde.tousChantiers(v).sort((a, b) => a.ouvertLe - b.ouvertLe);
  if (!chs.length) return '<div class="note faible">Aucun.</div>';
  return `<table><tr><th>Ouvert</th><th>Bâtiment</th><th>Société</th><th class="n">Avancement</th></tr>
    ${chs.map(c => `<tr>
      <td class="doux">mois ${c.ouvertLe}</td>
      <td>${BAT[c.type].nom}</td>
      <td style="color:${c.societe.couleur}">${c.societe.nom}</td>
      <td class="n">${pct(c.progression())}</td></tr>`).join('')}
  </table>
  <div class="note">Priorité au plus ancien : un chantier ouvert il y a dix mois ne cède
  jamais sa place à un chantier ouvert hier.</div>`;
}

// --- Marché -----------------------------------------------------------------

function panneauMarche(monde, v) {
  const m = v.marche;
  const lignes = RESSOURCES.map(r => {
    const i = m.indice(r);
    const classe = i > 1.4 ? 'rouge' : i < 0.75 ? 'vert' : 'doux';
    const serv = m.service[r];
    return `<tr>
      <td><span class="puce" style="background:${RES[r].couleur}"></span>${RES[r].nom}</td>
      <td class="n">${m.prix[r].toFixed(2)} $</td>
      <td class="n ${classe}">${i.toFixed(2)}×</td>
      <td class="n ${serv < 0.95 ? 'rouge' : 'doux'}">${pct(serv)}</td>
      <td class="n doux">${Math.round(m.stock[r])}</td>
    </tr>`;
  }).join('');

  return `
    <h3>Marché de ${m.nom}</h3>
    <table>
      <tr><th>Ressource</th><th class="n">Prix</th><th class="n">/ réf.</th><th class="n">Servi</th><th class="n">Stock</th></tr>
      ${lignes}
    </table>
    <div class="note">
      Le prix suit les <b>flux</b>, jamais le stock : il monte quand les besoins réels du mois
      dépassent ce qui entre sur le marché. Rafler un stock ne fait pas bouger le cours —
      cela vide le matelas, et les usines s'arrêtent au premier accroc.
    </div>
    ${m.villes.length > 1 ? `<div class="note or">★ ${m.villes.length} villes fusionnées :
      leurs stocks se confondent et un prix unique s'établit.</div>` : ''}
  `;
}

// --- Comptes ----------------------------------------------------------------

function panneauComptes(monde) {
  const s = monde.joueur;
  const bats = s.batiments;

  const enTete = `
    <div class="grille">
      <div class="fiche"><div class="etiq">Votre fortune</div>
        <div class="v or">${eur(s.cours(monde.multiple) * s.actions * P.partFondateur)}</div></div>
      <div class="fiche"><div class="etiq">Cours de l'action</div>
        <div class="v">${s.cours(monde.multiple).toFixed(3).replace('.', ',')} $</div></div>
      <div class="fiche"><div class="etiq">Climat</div>
        <div class="v">${{ normal: 'Normal', euphorie: 'Euphorie', crise: 'Crise' }[monde.climat]}</div></div>
    </div>`;
  if (!bats.length && !s.chantiers.length) {
    return enTete + `<h3>Livre de comptes</h3>
      <div class="note">Votre société ne possède encore rien.<br><br>
      Cliquez une case sur la carte pour acheter du terrain, puis ouvrez un chantier.
      Le terrain est la moitié du coût d'une maison — et la totalité de ce qui fait
      les fortunes.</div>`;
  }

  const lignes = bats.map(b => {
    const marge = b.margeUnitaire;
    return `<tr class="ligneBat" data-bat="${b.id}">
      <td><span class="puce" style="background:${COULEURS[b.type]}"></span>${BAT[b.type].nom}</td>
      <td class="doux">${b.ville.nom.slice(0, 7)}</td>
      <td class="n">${pct(b.tauxReel)}</td>
      <td class="n ${cl(b.resultat)}">${eur(b.resultat)}</td>
      <td class="n doux">${b.def.sort ? marge.toFixed(2) : '—'}</td>
    </tr>`;
  }).join('');

  const resultat = s.resultatMensuel;
  const actif = s.actifNet(monde.multiple);

  return enTete + `
    <h3>Exploitation du mois</h3>
    <table>
      <tr><th>Bâtiment</th><th>Ville</th><th class="n">Activité</th><th class="n">Résultat</th><th class="n">Marge/u</th></tr>
      ${lignes}
    </table>

    <h3>Bilan</h3>
    <table>
      <tr><td>Résultat net du mois</td><td class="n ${cl(resultat)}">${eur(resultat)}</td></tr>
      <tr><td>Masse salariale</td><td class="n doux">${eur(s.masseSalariale)}</td></tr>
      <tr><td>Trésorerie</td><td class="n">${eur(s.tresorerie)}</td></tr>
      <tr><td>Immobilisé en chantiers</td><td class="n doux">${eur(s.chantiers.reduce((a, c) => a + c.engage, 0))}</td></tr>
      <tr><td>Valeur des bâtiments</td><td class="n">${eur(bats.reduce((a, b) => a + b.valeur(monde.multiple), 0))}</td></tr>
      <tr><td><b>Actif net réévalué</b></td><td class="n"><b>${eur(actif)}</b></td></tr>
      <tr><td>Cours de l'action</td><td class="n or">${s.cours(monde.multiple).toFixed(3)} $</td></tr>
    </table>
    <div class="note">
      Multiple du marché : <b>×${monde.multiple}</b>. Un bâtiment vaut son terrain plus ses
      matériaux, plus ${monde.multiple} fois son résultat annuel — et jamais moins que son plancher.
    </div>

    <h3>Concurrents</h3>
    <table>
      <tr><th>Société</th><th class="n">Bâtiments</th><th class="n">Cours</th></tr>
      ${monde.societes.map(x => `<tr>
        <td><span class="puce" style="background:${x.couleur}"></span>${x.nom}</td>
        <td class="n doux">${x.batiments.length}</td>
        <td class="n">${x.cours(monde.multiple).toFixed(3)} $</td></tr>`).join('')}
    </table>
  `;
}

// --- Rail -------------------------------------------------------------------

function panneauRail(monde) {
  const lignes = monde.liaisons.map((l, i) => {
    const reste = l.date - monde.mois;
    const part = l.capital > 0 ? (l.parts[monde.joueur.id] || 0) / l.capital : 0;
    return `<tr>
      <td>${l.nom}</td>
      <td class="n ${l.achevee ? 'vert' : reste <= 3 ? 'or' : 'doux'}">
        ${l.achevee ? 'ouverte' : reste + ' mois'}</td>
      <td class="n doux">${part > 0 ? pct(part) : '—'}</td>
      <td class="n">${l.achevee ? '—' : `<button class="miniInvest" data-liaison="${i}">+800 $</button>`}</td>
    </tr>`;
  }).join('');

  return `
    <h3>Les liaisons</h3>
    <table>
      <tr><th>Ligne</th><th class="n">Achèvement</th><th class="n">Votre part</th><th></th></tr>
      ${lignes}
    </table>
    <div class="note">
      Chaque tranche de 800 $ avance la date d'un mois, dans la limite de 40 % du délai
      initial : on peut avancer le rendez-vous, jamais le supprimer.<br><br>
      Le jour où une ligne s'ouvre, les deux villes n'ont plus qu'un seul marché. Les prix
      s'effondrent d'un côté, s'envolent de l'autre, et tous les calculs de rentabilité sont
      à refaire. <b>Celui qui a acheté les bonnes terres avant que la ligne n'aboutisse a
      gagné sa partie.</b>
    </div>

    <h3>Journal</h3>
    <div class="note">${monde.journal.slice(-9).reverse().join('<br>') || 'Rien à signaler.'}</div>
  `;
}

// ===== js/ui/feuille.js ==============================================

// ---------------------------------------------------------------------------
// La feuille d'inspection : ce qu'on voit quand on clique une case.
//
// Elle remonte du bas de l'écran, la carte restant entièrement visible
// au-dessus. Un panneau flottant masquerait plusieurs bâtiments et le joueur
// perdrait le contexte de ce qu'il inspecte. (§21)
// ---------------------------------------------------------------------------





const NOMS_QUALITE = { fertilite: 'Fertilité', argile: 'Argile', bois: 'Bois',
                       charbon: 'Charbon', minerai: 'Minerai' };

// Ce qu'on peut bâtir, groupé comme le joueur y pense.
const MENU = [
  ['Logement', ['maison', 'immeuble']],
  ['Exploitation', ['coupe', 'carriere', 'mineCharbon', 'mineFer', 'ferme', 'ranch']],
  ['Transformation', ['scierie', 'briqueterie', 'minoterie', 'abattoir', 'acierie']],
  ['Manufacture', ['manufacture']],
  ['Rapport et négoce', ['bureaux', 'entrepot']],
];

function contenuFeuille(monde, v, c) {
  if (!c) return '';
  const joueur = monde.joueur;

  if (c.rue) return entete('Rue', 'Voirie — non constructible')
    + `<div class="note">Une rue toutes les cinq cases au centre, des parcelles isolées en
       périphérie : c'est ce contraste qui fait lire la hiérarchie urbaine, bien mieux que
       la superficie.</div>`;

  if (c.voie) return entete('Emprise de voie ferrée', 'Réservée — non constructible')
    + `<div class="note">Le rail passera ici. Les emprises sont visibles dès la première
       seconde : le joueur sait où la ligne aboutira, et peut acheter autour.</div>`;

  if (c.chantier) return ficheChantier(monde, c.chantier);
  if (c.bat) return ficheBatiment(monde, c.bat, c);
  return ficheTerrain(monde, v, c);
}

function entete(titre, sous) {
  return `<h2>${titre}</h2><div class="soustitre">${sous}</div>`;
}

// --- Un terrain -------------------------------------------------------------

function ficheTerrain(monde, v, c) {
  const joueur = monde.joueur;
  const aMoi = c.proprio === joueur.id;
  const prix = monde.prixCase(v, c);
  const base = prixTerrain(v.niveau, c.distanceGare);

  const qualites = QUALITES.map(q => {
    const n = c.q[q];
    const couleur = n >= 4 ? 'vert' : n <= 2 ? 'rouge' : 'doux';
    return `<div class="fiche"><div class="etiq">${NOMS_QUALITE[q]}</div>
      <div class="v ${couleur}">${n}<span class="faible" style="font-size:11px"> / 5</span></div></div>`;
  }).join('');

  let proprio = 'Vierge';
  if (c.proprio === 'ind') proprio = 'Propriétaire indépendant';
  else if (c.proprio) {
    const s = monde.societes.find(x => x.id === c.proprio);
    proprio = s ? s.nom : 'Inconnu';
  }

  const achetable = estAchetable(v, c) || c.proprio === 'ind';
  let actions = '';
  if (aMoi) {
    actions = menuConstruire(monde, v, c);
  } else if (achetable) {
    const peut = joueur.tresorerie >= prix;
    actions = `<div class="actions">
      <button class="primaire" id="btnAcheter" ${peut ? '' : 'disabled'}>Acheter — ${eur(prix)}</button>
    </div>
    ${c.proprio === 'ind' ? `<div class="note">Un indépendant vend au prix du marché
      majoré de 20 % (${eur(base)} + 20 %). C'est le raccourci qui permet de contourner la
      règle de contiguïté — payant, donc réservé aux cases qui comptent.</div>` : ''}
    ${peut ? '' : '<div class="avert">Trésorerie insuffisante.</div>'}`;
  } else {
    actions = `<div class="note">Hors de portée. On ne peut acheter une terre vierge que si
      elle touche une terre déjà vendue ou bâtie : la ville s'étend en anneaux depuis sa gare,
      et il existe à chaque instant une frontière étroite et disputée.</div>`;
  }

  return entete(`${RELIEFS[c.relief].nom} · ${c.x},${c.y}`,
                `${proprio} — à ${c.distanceGare} cases de la gare`)
    + `<div class="grille">${qualites}</div>`
    + `<div class="grille">
        <div class="fiche"><div class="etiq">Prix du sol</div><div class="v">${eur(prix)}</div></div>
        <div class="fiche"><div class="etiq">Facteur ville</div><div class="v">×${P.facteurNiveau[v.niveau - 1].toFixed(1)}</div></div>
        <div class="fiche"><div class="etiq">Facteur distance</div><div class="v">×${(1 / (1 + P.attenuationDistance * c.distanceGare)).toFixed(2)}</div></div>
      </div>`
    + actions;
}

// --- Le menu de construction ------------------------------------------------

function menuConstruire(monde, v, c) {
  const joueur = monde.joueur;
  const m = v.marche;

  const groupes = MENU.map(([titre, types]) => {
    const boutons = types.map(t => {
      const def = BAT[t];
      // La facture est établie au prix du marché local du jour où le chantier
      // est lancé. Bâtir pendant une surproduction de briques revient beaucoup
      // moins cher que pendant une pénurie.
      let cout = 0;
      for (const [r, q] of Object.entries(materiaux(t))) cout += q * m.prix[r];
      const emprise = empriseDepuis(monde, v, c, t);
      const possible = !!emprise && joueur.tresorerie >= cout;
      const cher = cout / coutRef(t);
      return `<button class="btnBatir" data-type="${t}" ${possible ? '' : 'disabled'}
        title="${def.nom}">
        <span class="puce" style="background:${COULEURS[t]}"></span>${def.nom}
        <span class="${cher > 1.25 ? 'rouge' : cher < 0.85 ? 'vert' : 'doux'}"> ${eur(cout)}</span>
      </button>`;
    }).join('');
    return `<div class="etiq" style="margin:9px 0 4px">${titre}</div><div class="actions">${boutons}</div>`;
  }).join('');

  return groupes + `<div class="note">
    Le coût est établi <b>au prix du marché du jour</b> : un bâtiment ne coûte jamais deux
    fois la même chose. On bâtit quand les matériaux sont au plus bas — c'est-à-dire au
    moment précis où l'on peut le moins se le permettre.<br><br>
    Le cash part immédiatement ; le chantier reste un trou dans le sol tant que la dernière
    brique n'est pas livrée.</div>`;
}

// Cherche une emprise de la bonne forme, ancrée sur la case cliquée, dont le
// joueur possède toutes les cases.
function empriseDepuis(monde, v, c, type) {
  const def = BAT[type];
  const joueur = monde.joueur;
  for (let dy = 0; dy < def.h; dy++) for (let dx = 0; dx < def.w; dx++) {
    const x0 = c.x - dx, y0 = c.y - dy;
    const cases = [];
    let ok = true;
    for (let j = 0; j < def.h && ok; j++) for (let i = 0; i < def.w && ok; i++) {
      const k = v.cases[(y0 + j) * v.N + (x0 + i)];
      if (!k || x0 + i < 0 || y0 + j < 0 || x0 + i >= v.N || y0 + j >= v.N) { ok = false; break; }
      if (k.voie || k.rue || k.bat || k.chantier || k.proprio !== joueur.id) { ok = false; break; }
      cases.push(k);
    }
    if (ok && cases.length === def.cases) return cases;
  }
  return null;
}

// --- Un chantier ------------------------------------------------------------

function ficheChantier(monde, ch) {
  const m = ch.ville.marche;
  const lignes = Object.entries(materiaux(ch.type)).map(([r, total]) => {
    const recu = ch.recu[r] || 0;
    return `<tr><td><span class="puce" style="background:${RES[r].couleur}"></span>${RES[r].nom}</td>
      <td class="n">${Math.round(recu)} / ${total}</td>
      <td class="n ${m.service[r] < 0.9 ? 'rouge' : 'doux'}">${pct(m.service[r])} servi</td></tr>`;
  }).join('');

  return entete(`Chantier — ${BAT[ch.type].nom}`,
    `${ch.societe.nom} · ouvert au mois ${ch.ouvertLe} · ${pct(ch.progression())} livré`)
    + `<table>${lignes}</table>
    <div class="note">Le bâtiment ne sortira de terre que le mois où la dernière brique sera
    livrée. Ouvrir trop de chantiers à la fois, c'est immobiliser son cash dans des trous —
    c'est le principal piège de trésorerie du jeu.</div>`;
}

// --- Un bâtiment ------------------------------------------------------------

const TEXTE_ALERTE = {
  matieres: 'Manque de matières premières',
  bras: 'Manque de main-d\'œuvre',
  invendus: 'Locaux vacants',
  perte: 'Perte financière',
};

function ficheBatiment(monde, b, c) {
  const def = b.def, m = b.ville.marche;
  const aMoi = b.societe === monde.joueur;
  const proprio = b.societe ? b.societe.nom : 'Propriétaire indépendant';
  const mb = b.margeBrute(m);
  const seuil = b.seuilActivite(m);

  let production = '';
  if (def.sort) {
    const intr = Object.entries(def.intrants || {}).map(([r, q]) =>
      `${Math.round(q * b.n)} ${RES[r].nom.toLowerCase()}`).join(' + ') || '—';
    production = `<div class="grille">
      <div class="fiche"><div class="etiq">Produit</div>
        <div class="v">${b.production.toFixed(0)}<span class="faible" style="font-size:11px"> ${RES[def.sort].nom.toLowerCase()}</span></div></div>
      <div class="fiche"><div class="etiq">Consomme</div><div class="v" style="font-size:12px">${intr}</div></div>
      <div class="fiche"><div class="etiq">Marge par unité</div>
        <div class="v ${b.margeUnitaire > 0 ? 'vert' : 'rouge'}">${b.margeUnitaire.toFixed(2)} $</div></div>
      <div class="fiche"><div class="etiq">Seuil d'activité</div>
        <div class="v ${seuil > 0.6 ? 'rouge' : 'doux'}">${isFinite(seuil) ? pct(seuil) : 'hors d\'atteinte'}</div></div>
    </div>`;
  }

  let qualite = '';
  if (def.qual) {
    qualite = `<div class="note">Sol de qualité <b>${b.qualite.toFixed(1)} / 5</b> :
      cette exploitation sort ${(b.qualite / 3).toFixed(2)}× ce que sortirait la même sur une
      terre moyenne. Un handicap de terrain ne fait aucun bruit — il se lit uniquement dans
      la marge, et il ne se guérit jamais.</div>`;
  }

  const reglage = aMoi && def.sort ? `
    <div class="etiq" style="margin:11px 0 4px">Curseur d'activité — ${Math.round(b.activite * 100)} %</div>
    <input type="range" id="curseurActivite" min="0" max="100" value="${Math.round(b.activite * 100)}">
    <div class="actions" style="margin-top:6px">
      <button class="preReglage" data-v="0">Sommeil</button>
      <button class="preReglage" data-v="50">50 %</button>
      <button class="preReglage" data-v="100">100 %</button>
      ${b.def.cat !== 'loge' && monde.joueur.entrepotDans(b.ville)
        ? `<button id="btnEntrepot">${b.versEntrepot ? '↺ Vendre au marché' : '⇥ Vers l\'entrepôt'}</button>` : ''}
    </div>
    <div class="note">Curseur à zéro : plus de matières achetées, plus de salaires versés.
    Le bâtiment reste debout moyennant un entretien réduit à 10 % de sa masse salariale, et
    se rallume quand le marché repart.</div>` : '';

  const demolir = aMoi ? `<div class="actions" style="margin-top:9px">
    <button id="btnDemolir">Démolir</button></div>
    <div class="note">La société conserve le terrain, ne récupère aucun matériau, et la case
    est libre le mois suivant. C'est le seul moyen, pour une ville saturée, de se densifier.</div>` : '';

  return entete(def.nom,
    `${proprio} · ${b.ville.nom} · ${def.cases} case${def.cases > 1 ? 's' : ''}`
    + (b.alerte ? ` · <span class="rouge">⚠ ${TEXTE_ALERTE[b.alerte]}</span>` : ''))
    + `<div class="grille">
        <div class="fiche"><div class="etiq">Activité</div><div class="v">${pct(b.tauxReel)}</div></div>
        <div class="fiche"><div class="etiq">Résultat du mois</div>
          <div class="v ${b.resultat >= 0 ? 'vert' : 'rouge'}">${eur(b.resultat)}</div></div>
        <div class="fiche"><div class="etiq">Entretien</div><div class="v doux">${b.entretien.toFixed(2)} $</div></div>
        <div class="fiche"><div class="etiq">Valeur</div><div class="v">${eur(b.valeur(monde.multiple))}</div></div>
      </div>`
    + production + qualite + reglage + demolir;
}

// ===== js/main.js ====================================================

// ---------------------------------------------------------------------------
// Orchestration : la boucle de temps, les entrées, le rafraîchissement.
//
// Un mois dure dix secondes réelles. Le joueur revient toutes les dix secondes
// pour saisir une opportunité, puis a sept secondes pour réfléchir.
// ---------------------------------------------------------------------------






const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
              'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

const monde = new Monde({ nbVilles: 3, duree: 60, graine: (Math.random() * 1e9) | 0 });
const cv = $('#carte');
const rendu = new Rendu(cv, monde);
rendu.iVille = 0;

let enMarche = false;
let vitesse = 1;
let horloge = 0;
let ongletPanneau = 'ville';

// --- Boucle -----------------------------------------------------------------

let precedent = performance.now();
function boucle(t) {
  const dt = Math.min(250, t - precedent);
  precedent = t;

  if (enMarche) {
    horloge += dt * vitesse;
    const duree = P.moisParSeconde * 1000;
    while (horloge >= duree) {
      horloge -= duree;
      if (!monde.tick()) { enMarche = false; finDePartie(); break; }
      rafraichirTout();
    }
  }

  rendu.dessiner();
  requestAnimationFrame(boucle);
}

// --- Affichage --------------------------------------------------------------

function rafraichirTout() {
  rafraichirBarre();
  rafraichirPanneau();
  rafraichirFeuille();
  rafraichirOngletsVilles();
}

function rafraichirBarre() {
  const s = monde.joueur;
  const an = Math.floor(monde.mois / 12) + 1;
  $('#date').textContent = `An ${an} · ${MOIS[monde.mois % 12]}`;
  $('#restant').textContent = `${monde.duree - monde.mois} mois restants`;
  $('#tresorerie').textContent = eur(s.tresorerie);

  const r = s.resultatMensuel;
  const el = $('#resultat');
  el.textContent = (r >= 0 ? '+' : '') + eur(r) + ' / mois';
  el.className = 'sous ' + (r > 0 ? 'vert' : r < 0 ? 'rouge' : 'doux');

  $('#cours').textContent = s.cours(monde.multiple).toFixed(3).replace('.', ',') + ' $';
  $('#actifnet').textContent = 'actif net ' + eur(s.actifNet(monde.multiple));
  $('#fortune').textContent = eur(s.cours(monde.multiple) * s.actions * P.partFondateur);
  $('#climat').textContent = { normal: 'Normal', euphorie: 'Euphorie', crise: 'Crise' }[monde.climat];

  const cl = monde.classement();
  const rang = cl.findIndex(x => x.societe === s) + 1;
  $('#rang').textContent = `${rang === 1 ? '1er' : rang + 'e'} sur ${cl.length}`
    + ` — multiple du marché ×${monde.multiple}`;
}

function rafraichirPanneau() {
  const v = rendu.ville;
  const p = $('#panneau');
  const haut = p.scrollTop;
  p.innerHTML =
      ongletPanneau === 'ville' ? panneauVille(monde, v)
    : ongletPanneau === 'marche' ? panneauMarche(monde, v)
    : ongletPanneau === 'comptes' ? panneauComptes(monde)
    : panneauRail(monde);
  p.scrollTop = haut;

  p.querySelectorAll('.ligneBat').forEach(tr => tr.onclick = () => {
    const b = monde.joueur.batiments.find(x => x.id === +tr.dataset.bat);
    if (!b) return;
    rendu.iVille = monde.villes.indexOf(b.ville);
    rendu.selection = b.cases[0];
    rafraichirTout();
    ouvrirFeuille();
  });

  p.querySelectorAll('.miniInvest').forEach(btn => btn.onclick = () => {
    monde.investirRail(monde.liaisons[+btn.dataset.liaison], monde.joueur, 800);
    rafraichirTout();
  });
}

function rafraichirOngletsVilles() {
  const n = $('#ongletsVilles');
  if (n.children.length !== monde.villes.length) {
    n.innerHTML = monde.villes.map((v, i) =>
      `<button data-ville="${i}" class="${i === rendu.iVille ? 'actif' : ''}"></button>`).join('');
    n.querySelectorAll('button').forEach(b => b.onclick = () => {
      rendu.iVille = +b.dataset.ville;
      rendu.selection = null;
      fermerFeuille();
      rafraichirTout();
    });
  }
  monde.villes.forEach((v, i) => {
    const b = n.children[i];
    const alerte = v.enCrise ? ' <span style="color:#c2544b">⚠</span>' : '';
    b.innerHTML = `${v.nom} <span class="faible">${Math.round(v.menages)}</span>${alerte}`;
    b.className = i === rendu.iVille ? 'actif' : '';
  });
}

// --- Feuille ----------------------------------------------------------------

function ouvrirFeuille() { $('#feuille').classList.remove('fermee'); }
function fermerFeuille() { $('#feuille').classList.add('fermee'); rendu.selection = null; }

function rafraichirFeuille() {
  if ($('#feuille').classList.contains('fermee')) return;
  const v = rendu.ville, c = rendu.selection;
  const corps = $('#feuilleCorps');
  corps.innerHTML = contenuFeuille(monde, v, c);
  brancherFeuille(v, c);
}

function brancherFeuille(v, c) {
  const joueur = monde.joueur;

  const acheter = $('#btnAcheter');
  if (acheter) acheter.onclick = () => {
    if (monde.acheterTerrain(v, c, joueur)) rafraichirTout();
  };

  document.querySelectorAll('.btnBatir').forEach(btn => btn.onclick = () => {
    const type = btn.dataset.type;
    const cases = empriseDepuis(monde, v, c, type);
    if (!cases) return;
    const ch = monde.ouvrirChantier(type, v, cases, joueur);
    if (ch) {
      // On paie les matériaux au fil des livraisons, mais le terrain part tout
      // de suite. Le chantier entre au carnet.
      rafraichirTout();
    }
  });

  const cur = $('#curseurActivite');
  if (cur && c.bat) {
    cur.oninput = () => { c.bat.activite = +cur.value / 100; };
    cur.onchange = () => rafraichirTout();
  }
  document.querySelectorAll('.preReglage').forEach(b => b.onclick = () => {
    if (c.bat) { c.bat.activite = +b.dataset.v / 100; rafraichirTout(); }
  });

  const ent = $('#btnEntrepot');
  if (ent && c.bat) ent.onclick = () => { c.bat.versEntrepot = !c.bat.versEntrepot; rafraichirTout(); };

  const dem = $('#btnDemolir');
  if (dem && c.bat) dem.onclick = () => { monde.demolir(c.bat); fermerFeuille(); rafraichirTout(); };
}

// --- Entrées ----------------------------------------------------------------

// La carte se manipule au doigt : un toucher sélectionne, un glissement
// déplace, deux doigts zooment. Il faut distinguer les trois, sans quoi le
// moindre tremblement de la main ouvrirait une fiche au mauvais endroit.
const doigts = new Map();
let depart = null, aGlisse = false, ecartInitial = 0, zoomInitial = 1;

cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId);
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (doigts.size === 1) {
    depart = { x: e.clientX, y: e.clientY, cx: rendu.cx, cy: rendu.cy };
    aGlisse = false;
  } else if (doigts.size === 2) {
    const [a, b] = [...doigts.values()];
    ecartInitial = Math.hypot(a.x - b.x, a.y - b.y);
    zoomInitial = rendu.zoom;
    aGlisse = true;                       // un pincement n'est jamais une sélection
  }
});

cv.addEventListener('pointermove', (e) => {
  if (!doigts.has(e.pointerId)) return;
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (doigts.size >= 2) {
    const [a, b] = [...doigts.values()];
    const ecart = Math.hypot(a.x - b.x, a.y - b.y);
    if (ecartInitial > 8) {
      const r = cv.getBoundingClientRect();
      const cible = Math.max(1, Math.min(6, zoomInitial * ecart / ecartInitial));
      rendu.zoomerVers((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, cible / rendu.zoom);
    }
    return;
  }

  if (!depart) return;
  const dx = e.clientX - depart.x, dy = e.clientY - depart.y;
  if (!aGlisse && Math.hypot(dx, dy) > 9) aGlisse = true;
  if (aGlisse) {
    rendu.cx = depart.cx + dx;
    rendu.cy = depart.cy + dy;
    rendu.recadrer();
  }
});

function relacher(e) {
  doigts.delete(e.pointerId);
  if (doigts.size === 0 && depart && !aGlisse) {
    const r = cv.getBoundingClientRect();
    const c = rendu.caseSous(e.clientX - r.left, e.clientY - r.top);
    if (c) { rendu.selection = c; ouvrirFeuille(); rafraichirFeuille(); }
  }
  if (doigts.size === 0) depart = null;
}
cv.addEventListener('pointerup', relacher);
cv.addEventListener('pointercancel', (e) => { doigts.delete(e.pointerId); depart = null; });

// À la molette sur ordinateur, au double-toucher sur mobile.
cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  rendu.zoomerVers(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
}, { passive: false });

let dernierToucher = 0;
cv.addEventListener('pointerup', (e) => {
  const t = Date.now();
  if (t - dernierToucher < 300 && !aGlisse) {
    const r = cv.getBoundingClientRect();
    rendu.zoomerVers(e.clientX - r.left, e.clientY - r.top, rendu.zoom < 2.5 ? 2.2 : 1 / rendu.zoom);
  }
  dernierToucher = t;
});

$('#btnRecentrer').onclick = () => {
  rendu.zoom = 1; rendu.cx = 0; rendu.cy = 0;
};

$('#btnLegende').onclick = () => $('#legende').classList.toggle('montre');

$('#feuillePoignee').onclick = fermerFeuille;

$('#btnPause').onclick = () => {
  enMarche = !enMarche;
  $('#btnPause').querySelector('.signe').textContent = enMarche ? '❚❚' : '▶';
  $('#btnPause').querySelector('.mot').textContent = enMarche ? ' Pause' : ' Reprendre';
};

const VITESSES = [1, 4, 20];

function reglerVitesse(v) {
  vitesse = v;
  document.querySelectorAll('.vit').forEach(x =>
    x.classList.toggle('actif', +x.dataset.vitesse === v));
  $('#btnVitesseCycle').textContent = '×' + v;
}

document.querySelectorAll('.vit').forEach(b =>
  b.onclick = () => reglerVitesse(+b.dataset.vitesse));

// Sur téléphone, un seul bouton qui tourne : ×1 → ×4 → ×20 → ×1.
$('#btnVitesseCycle').onclick = () =>
  reglerVitesse(VITESSES[(VITESSES.indexOf(vitesse) + 1) % VITESSES.length]);

document.querySelectorAll('#modesCarte button').forEach(b => b.onclick = () => {
  rendu.mode = b.dataset.mode;
  document.querySelectorAll('#modesCarte button').forEach(x => x.classList.toggle('actif', x === b));
  legende();
});

document.querySelectorAll('#ongletsPanneau button').forEach(b => b.onclick = () => {
  ongletPanneau = b.dataset.onglet;
  document.querySelectorAll('#ongletsPanneau button')
    .forEach(x => x.classList.toggle('actif', x === b));
  rafraichirPanneau();
});

addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); $('#btnPause').click(); }
  if (e.key === 'Escape') fermerFeuille();
});

addEventListener('resize', () => { rendu.dimensionner(); legende(); });

// --- Légende ----------------------------------------------------------------

function legende() {
  const el = $('#legende');
  const m = rendu.mode;
  if (m === 'fonction') {
    el.innerHTML = `<b>Fonction</b> — pastilles d'alerte :<br>
      <div class="ligne"><i style="background:#c9863f"></i>manque de matières</div>
      <div class="ligne"><i style="background:#6f9fc9"></i>manque de bras</div>
      <div class="ligne"><i style="background:#9a6fb0"></i>locaux vacants</div>
      <div class="ligne"><i style="background:#c2544b"></i>perte financière</div>`;
  } else if (m === 'proprio') {
    el.innerHTML = '<b>Propriétaire</b><br>' + monde.societes.map(s =>
      `<div class="ligne"><i style="background:${s.couleur}"></i>${s.nom}</div>`).join('')
      + `<div class="ligne"><i style="background:#4a463a"></i>indépendants</div>
         <div class="ligne"><i style="background:#1e1c17"></i>vierge</div>
         <div style="margin-top:4px">Liseré doré : la frontière achetable.</div>`;
  } else if (m === 'terrain') {
    el.innerHTML = `<b>Prix du sol</b><br>Plus c'est doré, plus c'est cher.<br>
      Le foncier monte avec le niveau de la ville, et baisse avec la distance à la gare.`;
  } else {
    el.innerHTML = `<b>${m}</b> — qualité de 1 à 5.<br>Plus c'est vert, plus la case rend.<br>
      Un handicap de terrain ne se guérit jamais.`;
  }
}

// --- Fin de partie ----------------------------------------------------------

function finDePartie() {
  const cl = monde.classement();
  const moi = cl.findIndex(x => x.societe === monde.joueur) + 1;
  $('#finPartie').innerHTML = `<div class="boite">
    <h1>Fin de partie</h1>
    <div class="soustitre" style="color:var(--doux);margin-bottom:16px">
      Dix ans. Le cours retenu est la moyenne des douze derniers mois.</div>
    <table>${cl.map((x, i) => `<tr>
      <td>${i + 1}. <span class="puce" style="background:${x.societe.couleur}"></span>${x.societe.nom}</td>
      <td class="n ${x.societe === monde.joueur ? 'or' : ''}">${eur(x.fortune)}</td></tr>`).join('')}
    </table>
    <div class="note">Vous finissez <b>${moi === 1 ? '1er' : moi + 'e'}</b>.</div>
    <div class="actions" style="margin-top:16px">
      <button class="primaire" onclick="location.reload()">Nouvelle partie</button></div>
  </div>`;
  $('#finPartie').classList.remove('cachee');
}

// --- Départ -----------------------------------------------------------------

rendu.dimensionner();
legende();
rafraichirTout();
requestAnimationFrame(boucle);
</script>
</body>
