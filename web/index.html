<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>WWTycoons — démo économique</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- La carte occupe tout l'écran. Tout le reste flotte au-dessus. -->
<canvas id="carte"></canvas>

<header id="barre">
  <div class="jauges">
    <div class="jauge">
      <div class="etiq">Date</div>
      <div class="val" id="date">An 1 · janv.</div>
      <div class="sous" id="restant">—</div>
    </div>
    <div class="jauge">
      <div class="etiq">Trésorerie</div>
      <div class="val" id="tresorerie">15 000 $</div>
      <div class="sous" id="resultat">—</div>
    </div>
    <div class="jauge masquable">
      <div class="etiq">Fortune</div>
      <div class="val or" id="fortune">1 500 $</div>
      <div class="sous" id="rang">—</div>
    </div>
  </div>

  <nav class="icones">
    <button class="ico" data-vue="villes" title="Les villes" aria-label="Les villes">
      <svg viewBox="0 0 24 24"><path d="M3 21V9l5-3v4l6-4v5l6-3v13z"/></svg>
      <span>Villes</span>
    </button>
    <button class="ico" data-vue="marche" title="Le marché" aria-label="Le marché">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 4-7 5 6v3H3z" opacity=".55"/><path d="M3 13l5-6 4 4 4-7 5 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Marché</span>
    </button>
    <button class="ico" data-vue="batir" title="Bâtir" aria-label="Bâtir">
      <svg viewBox="0 0 24 24"><path d="M3 20h18v2H3zM6 20V9l6-4 6 4v11h-4v-6h-4v6z" opacity=".55"/><path d="M6 20V9l6-4 6 4v11" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 2v3M10.5 3.5h3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Bâtir</span>
    </button>
    <button class="ico" data-vue="societe" title="Ma société" aria-label="Ma société">
      <svg viewBox="0 0 24 24"><path d="M4 21V6l8-3 8 3v15zM9 21v-5h6v5z" opacity=".55"/><path d="M4 21V6l8-3 8 3v15H4z" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Société</span>
    </button>
    <button class="ico" data-vue="bourse" title="La bourse" aria-label="La bourse">
      <svg viewBox="0 0 24 24"><path d="M3 20h18v2H3z" opacity=".55"/><path d="M4 18V9h3v9zM10 18V4h3v14zM16 18v-6h3v6z" opacity=".55"/><path d="M4 18V9h3v9zM10 18V4h3v14zM16 18v-6h3v6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Bourse</span>
    </button>
    <button class="ico" data-vue="rail" title="Le chemin de fer" aria-label="Le chemin de fer">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v12H6z" opacity=".5"/><path d="M6 3h12v12H6zM4 19h16M8 15l-2 5M16 15l2 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>Rail</span>
    </button>
    <button class="ico" id="btnFiltres" title="Filtres" aria-label="Filtres">
      <svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Filtres</span>
    </button>
  </nav>

  <div class="horloge">
    <button id="btnPause" class="cmd majeur" aria-label="Démarrer"><span class="signe">▶</span></button>
    <button id="btnVitesse" class="cmd">×1</button>
  </div>
</header>

<!-- Le filtre actif, rappelé sous la barre : sans ce bandeau, on oublie qu'on
     regarde une donnée et non la carte. -->
<div id="bandeauFiltre" class="cachee">
  <span id="bandeauNom"></span>
  <span id="bandeauEchelle"></span>
  <button id="btnQuitterFiltre">Voir les bâtiments</button>
</div>

<div id="outils">
  <button id="btnRecentrer" title="Vue d'ensemble" aria-label="Vue d'ensemble">⤢</button>
  <button id="btnZoomPlus" title="Zoomer" aria-label="Zoomer">+</button>
  <button id="btnZoomMoins" title="Dézoomer" aria-label="Dézoomer">−</button>
</div>

<!-- Panneau des filtres -->
<div id="volet" class="cachee">
  <div class="voletTete">
    <b id="voletTitre">Filtres</b>
    <button id="btnFermerVolet" aria-label="Fermer">✕</button>
  </div>
  <div id="voletCorps"></div>
</div>

<!-- Feuille d'inspection, remontée du bas -->
<div id="feuille" class="fermee">
  <div id="feuillePoignee"></div>
  <div id="feuilleCorps"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
