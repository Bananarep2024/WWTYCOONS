  // le reste à ses porteurs.
  //
  // Le péage a été prélevé sur les producteurs au moment de la vente : on ne
  // fait ici que le collecter. Rien n'est créé. Il n'y a plus de répartition au
  // prorata de la longueur entre compagnies concurrentes — il n'y en a qu'une.
  exploiterRail() {
    const c = this.compagnie;
    c.recette = 0; c.charges = 0; c.resultat = 0;
    if (!c.lignes.length) return;

    for (const m of this.marches) {
      if (m.villes.length > 1) c.recette += m.peageCollecte || 0;
    }
    c.charges = this.capitalNominal() * P.entretienVoie / 12;
    c.resultat = c.recette - c.charges;
    c.histoResultat.push(c.resultat);
    if (c.histoResultat.length > P.fenetreProfit) c.histoResultat.shift();

    // Le dividende part à ceux qui ont souscrit. La part du consortium sort du
    // modèle, comme les salaires que les bureaux reçoivent du dehors.
    if (c.resultat > 0 && c.actions > 0) {
      for (const s of this.societes) {
        const n = c.parts[s.id] || 0;
        if (n > 0) s.encaisser(c.resultat * n / c.actions);
      }
    }
    c.cours = this.coursRail();        // mémorisé : la société le lit pour son actif
    c.histoCours.push(c.cours);
    if (c.histoCours.length > P.histoireDesCours) c.histoCours.shift();
  }

  beneficeAnnuelRail() {
    const h = this.compagnie.histoResultat;
    return h.length ? h.reduce((a, b) => a + b, 0) * 12 / h.length : 0;
  }

  // Non cotée : la part vaut ce qu'on a souscrit, au franc le franc.
  // Cotée : capital nominal + PER × bénéfice, divisé par les actions.
  coursRail() {
    const c = this.compagnie;
    if (!c.actions || !c.cotee) return P.prixNominalAction;
    const b = Math.max(0, this.beneficeAnnuelRail());
    return Math.max(0.01, (this.capitalNominal() + b * this.per) / c.actions);
  }

  capitalisationRail() { return this.coursRail() * this.compagnie.actions; }

  valeurPartRail(societe) {
    return (this.compagnie.parts[societe.id] || 0) * this.coursRail();
  }

  // Souscrire au chantier en cours. Il n'y a plus de ligne à choisir : la
  // compagnie n'en pose qu'une à la fois, et c'est celle-là qu'on finance.
  investirRail(societe, montant) {
    const l = this.chantierRail;
    if (!l || l.date === null || !societe.peutPayer(montant)) return false;
    const c = this.compagnie;
    societe.payer(montant);
    c.capital += montant;
    // La souscription se compte en ACTIONS, pas en dollars : c'est ce qui permet
    // à la part de valoir autre chose que son prix d'achat une fois la compagnie
    // introduite en bourse.
    const titres = montant / P.prixNominalAction;
    c.parts[societe.id] = (c.parts[societe.id] || 0) + titres;
    c.actions += titres;
    if (!societe.rails) societe.rails = [];
    if (!societe.rails.includes(c)) societe.rails.push(c);
    // Une tranche = un mois d'avance, dans la limite de 40 % du délai initial.
    const tranche = 800;
    const avanceMax = Math.floor(l.dateInitiale * 0.40);
    const dejaAvance = (l.debut + l.dateInitiale) - l.date;
    const gain = Math.min(Math.floor(montant / tranche), avanceMax - dejaAvance);
    l.date = Math.max(this.mois + 1, l.date - Math.max(0, gain));
    return true;
  }

  // Fortune finale = argent liquide + actions détenues × cours, le cours retenu
  // étant la moyenne des douze derniers mois.
  classement() {
    return this.societes.map(s => ({
      societe: s,
      fortune: s.coursMoyen() * s.actions * P.partFondateur,
    })).sort((a, b) => b.fortune - a.fortune);
  }
}

function clamp01(x) { return Math.max(0, Math.min(1, isFinite(x) ? x : 0)); }

// Sur un marché fusionné, chaque ville ne peut compter que sur sa part de
// l'offre commune, au prorata de sa population.
function totalMenages(marche) {
  return Math.max(1, marche.villes.reduce((s, v) => s + v.menages, 0));
}

// ===== js/ui/sprites.js ==============================================

// ---------------------------------------------------------------------------
// Les bâtiments, dessinés.
//
// Vus de très haut, on ne voit d'un bâtiment que son toit. C'est donc là que
// doit vivre son identité : une cheminée fumante pour l'aciérie, des piles de
// grumes pour la scierie, des silos pour la minoterie. La teinte dit la
// famille, le toit dit le métier.
//
// Chaque type est pré-rendu une fois par palier de zoom dans un petit canvas,
// puis recopié : dessiner cinq cents toits au trait à chaque image mettrait un
// téléphone à genoux.
// ---------------------------------------------------------------------------


// La teinte porte la famille industrielle. On ne la dépense jamais pour
// distinguer deux bâtiments du même métier — cette information-là passe par la
// forme du toit.
const COULEURS = {
  coupe: '#5d7f45', carriere: '#a8724a', mineCharbon: '#43434b', mineFer: '#6e5f78',
  ferme: '#c2a340', ranch: '#a8804f',
  scierie: '#a87c46', briqueterie: '#9c4a35', minoterie: '#cfae47',
  abattoir: '#a04040', acierie: '#54798a', manufacture: '#4a8763',
  maison: '#9b8f78', immeuble: '#bcae93', bureaux: '#6f96ba', entrepot: '#6d675a',
};

const cache = new Map();

// Éclaircit ou assombrit une couleur — le seul usage autorisé de la valeur.
function ton(hex, k) {
  const p = (i) => Math.max(0, Math.min(255, Math.round(parseInt(hex.substr(i, 2), 16) * k)));
  const h = (v) => v.toString(16).padStart(2, '0');
  return `#${h(p(1))}${h(p(3))}${h(p(5))}`;
}

function videCache() { cache.clear(); }

// Renvoie le canvas du bâtiment à la taille de case demandée.
function sprite(type, pas) {
  const cle = type + '@' + pas;
  if (cache.has(cle)) return cache.get(cle);

  const def = BAT[type];
  const w = Math.round(def.w * pas), h = Math.round(def.h * pas);
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, w); cv.height = Math.max(1, h);
  const ctx = cv.getContext('2d');
  const base = COULEURS[type];

  DESSINS[type](ctx, w, h, base, pas);

  cache.set(cle, cv);
  return cv;
}

// --- Briques de dessin ------------------------------------------------------

// Un bâtiment posé : un corps, un liseré d'ombre à droite et en bas. C'est ce
// liseré, et non un dégradé, qui détache le bâtiment du sol à toutes les
// distances.
function corps(ctx, x, y, w, h, couleur) {
  ctx.fillStyle = couleur;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.fillRect(x, y + h - Math.max(1, h * 0.13), w, Math.max(1, h * 0.13));
  ctx.fillRect(x + w - Math.max(1, w * 0.11), y, Math.max(1, w * 0.11), h);
}

// Un toit à deux pentes vu de dessus : deux bandes, l'une éclairée, l'autre à
// l'ombre, séparées par la ligne de faîte.
function toitDeuxPentes(ctx, x, y, w, h, couleur) {
  ctx.fillStyle = ton(couleur, 1.18);
  ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = ton(couleur, 0.74);
  ctx.fillRect(x, y + h / 2, w, h / 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x, y + h / 2 - 0.5, w, 1);
}

// Le toit en dents de scie de l'atelier : des verrières orientées au nord.
function dentsDeScie(ctx, x, y, w, h, couleur, n) {
  const pas = w / n;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = ton(couleur, 1.10);
    ctx.fillRect(x + i * pas, y, pas * 0.55, h);
    ctx.fillStyle = ton(couleur, 0.70);
    ctx.fillRect(x + i * pas + pas * 0.55, y, pas * 0.45, h);
  }
}

function cheminee(ctx, cx, cy, r, sombre = '#2e2a26') {
  ctx.fillStyle = sombre;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
}

function pastille(ctx, cx, cy, r, couleur) {
  ctx.fillStyle = couleur;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
}

// --- Un dessin par bâtiment -------------------------------------------------

const DESSINS = {
  // Le logement : un toit, une cheminée. Rien de plus, et c'est voulu — il y en
  // aura des centaines.
  maison(ctx, w, h, c) {
    const m = w * 0.10;
    toitDeuxPentes(ctx, m, m, w - 2 * m, h - 2 * m, c);
    if (w >= 11) cheminee(ctx, w * 0.72, h * 0.30, Math.max(1, w * 0.07));
  },

  // L'immeuble : toit plat, édicule d'escalier, et une emprise qui va jusqu'aux
  // bords — c'est la densité qui doit se lire.
  immeuble(ctx, w, h, c) {
    corps(ctx, 1, 1, w - 2, h - 2, c);
    ctx.fillStyle = ton(c, 0.62);
    ctx.fillRect(w * 0.36, h * 0.36, w * 0.26, h * 0.26);
    if (w >= 16) {
      ctx.fillStyle = 'rgba(0,0,0,.20)';
      for (let i = 1; i < 4; i++) ctx.fillRect(1, h * i / 4, w - 2, 1);
    }
  },

  // Les bureaux : une grande verrière au centre, qui les distingue au premier
  // coup d'œil de l'immeuble d'habitation.
  bureaux(ctx, w, h, c) {
    corps(ctx, 1, 1, w - 2, h - 2, c);
    ctx.fillStyle = ton(c, 1.42);
    ctx.fillRect(w * 0.22, h * 0.22, w * 0.56, h * 0.56);
    ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w * 0.50, h * 0.22); ctx.lineTo(w * 0.50, h * 0.78);
    ctx.moveTo(w * 0.22, h * 0.50); ctx.lineTo(w * 0.78, h * 0.50);
    ctx.stroke();
  },

  // L'entrepôt : un hangar tout en longueur, ses portes sur la façade.
  entrepot(ctx, w, h, c) {
    corps(ctx, 1, h * 0.16, w - 2, h * 0.68, c);
    ctx.fillStyle = ton(c, 0.55);
    const n = Math.max(2, Math.round(w / 9));
    for (let i = 0; i < n; i++) {
      ctx.fillRect(2 + (w - 4) * (i + 0.25) / n, h * 0.64, (w - 4) * 0.4 / n, h * 0.18);
    }
  },

  // La ferme : d'abord des sillons, et une grange dans un coin. Ce sont les
  // sillons qu'on reconnaît de loin.
  ferme(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.82);
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = ton(c, 1.15);
    const n = Math.max(3, Math.round(h / 4));
    for (let i = 0; i < n; i++) ctx.fillRect(0, h * (i + 0.15) / n, w, h * 0.4 / n);
    if (w >= 14) {
      ctx.fillStyle = '#8a5a3a';
      ctx.fillRect(w * 0.06, h * 0.58, w * 0.24, h * 0.34);
    }
  },

  // Le ranch : un enclos, et le bétail dedans.
  ranch(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.86);
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = ton(c, 0.5); ctx.lineWidth = 1;
    ctx.strokeRect(1.5, 1.5, w - 3, h - 3);
    if (w >= 12) {
      ctx.fillStyle = '#6b4a33';
      for (let i = 0; i < 3; i++) {
        pastille(ctx, w * (0.25 + i * 0.24), h * (0.35 + (i % 2) * 0.3), Math.max(1, w * 0.045), '#6b4a33');
      }
    }
  },

  // La coupe forestière : des arbres, et une trouée déjà exploitée.
  coupe(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.72);
    ctx.fillRect(0, 0, w, h);
    const r = Math.max(1, w * 0.15);
    for (const [px, py] of [[0.28, 0.30], [0.68, 0.26], [0.30, 0.70], [0.72, 0.68]]) {
      pastille(ctx, w * px, h * py, r, ton(c, 1.25));
    }
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(w * 0.44, h * 0.44, w * 0.16, h * 0.16);
  },

  // La carrière : une entaille en gradins dans le sol.
  carriere(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.80);
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = ton(c, 1.05 + i * 0.14);
      const k = 0.12 + i * 0.12;
      ctx.fillRect(w * k, h * k, w * (1 - 2 * k), h * (1 - 2 * k));
    }
  },

  mineCharbon(ctx, w, h, c) { mine(ctx, w, h, c, '#26262b'); },
  mineFer(ctx, w, h, c) { mine(ctx, w, h, c, '#7a6a86'); },

  // La scierie : dents de scie, et les grumes empilées à côté.
  scierie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.62); ctx.fillRect(0, 0, w, h);
    dentsDeScie(ctx, 1, h * 0.12, w * 0.62, h * 0.74, c, Math.max(2, Math.round(w / 12)));
    ctx.fillStyle = '#7d5b3a';
    const n = 3;
    for (let i = 0; i < n; i++) {
      ctx.fillRect(w * 0.68, h * (0.18 + i * 0.24), w * 0.26, h * 0.14);
    }
  },

  // La briqueterie : le four, sa cheminée, et les briques qui sèchent.
  briqueterie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.58); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.06, h * 0.16, w * 0.52, h * 0.68, c);
    cheminee(ctx, w * 0.32, h * 0.50, Math.max(1.2, w * 0.09), '#3a2420');
    ctx.fillStyle = ton(c, 1.30);
    for (let i = 0; i < 3; i++) ctx.fillRect(w * 0.66, h * (0.20 + i * 0.24), w * 0.28, h * 0.14);
  },

  // La minoterie : les silos, en enfilade. C'est la silhouette la plus
  // reconnaissable de toute la carte.
  minoterie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.58); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.04, h * 0.24, w * 0.42, h * 0.56, c);
    const r = Math.max(1.4, h * 0.15);
    for (let i = 0; i < 3; i++) {
      pastille(ctx, w * (0.58 + i * 0.16), h * 0.5, r, ton(c, 1.22));
      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(w * (0.58 + i * 0.16), h * 0.5, r, 0, 7); ctx.stroke();
    }
  },

  // L'abattoir : le hangar et la cour de manœuvre.
  abattoir(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.56); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.06, h * 0.14, w * 0.56, h * 0.72, c);
    ctx.fillStyle = ton(c, 0.80);
    ctx.fillRect(w * 0.68, h * 0.20, w * 0.26, h * 0.60);
  },

  // L'aciérie : deux hauts fourneaux et la halle. Le seul bâtiment à deux
  // intrants du jeu, et le plus cher du palier — il doit se voir.
  acierie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.50); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.05, h * 0.30, w * 0.56, h * 0.60, c);
    dentsDeScie(ctx, w * 0.05, h * 0.30, w * 0.56, h * 0.60, c, 3);
    const r = Math.max(1.6, w * 0.09);
    cheminee(ctx, w * 0.74, h * 0.28, r, '#33302e');
    cheminee(ctx, w * 0.88, h * 0.42, r * 0.82, '#33302e');
    ctx.fillStyle = '#d98a3a';
    ctx.beginPath(); ctx.arc(w * 0.74, h * 0.28, r * 0.42, 0, 7); ctx.fill();
  },

  // La manufacture : la plus grande halle vitrée de la carte.
  manufacture(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.50); ctx.fillRect(0, 0, w, h);
    dentsDeScie(ctx, w * 0.06, h * 0.14, w * 0.88, h * 0.62, c, Math.max(3, Math.round(w / 10)));
    ctx.fillStyle = ton(c, 0.72);
    ctx.fillRect(w * 0.06, h * 0.80, w * 0.88, h * 0.12);
    if (w >= 18) cheminee(ctx, w * 0.14, h * 0.86, Math.max(1.2, w * 0.05), '#33302e');
  },
};

// Le chevalement d'une mine et son terril : la même silhouette pour le charbon
// et le fer, seule la couleur du tas change.
function mine(ctx, w, h, c, tas) {
  ctx.fillStyle = ton(c, 0.70);
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = tas;
  ctx.beginPath();
  ctx.moveTo(w * 0.52, h * 0.88); ctx.lineTo(w * 0.96, h * 0.88);
  ctx.lineTo(w * 0.74, h * 0.46); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = ton(c, 1.5); ctx.lineWidth = Math.max(1, w * 0.06);
  ctx.beginPath();
  ctx.moveTo(w * 0.14, h * 0.18); ctx.lineTo(w * 0.44, h * 0.62);
  ctx.moveTo(w * 0.44, h * 0.18); ctx.lineTo(w * 0.14, h * 0.62);
  ctx.stroke();
}

// ===== js/ui/render.js ===============================================

// ---------------------------------------------------------------------------
// Le rendu de la carte du monde.
//
// Deux couches, deux traitements. Le sol est une image : une fois par
// changement de filtre, on peint la carte entière à raison d'un pixel par case,
// puis on l'étire — repeindre vingt-cinq mille cases à chaque image mettrait un
// téléphone à genoux. Les bâtiments, eux, sont dessinés au-dessus, et seulement
// ceux que la fenêtre voit.
//
// Par défaut on voit les bâtiments, pas des données. Les filtres sont un mode
// qu'on demande, jamais l'état de repos de la carte.
// ---------------------------------------------------------------------------





const ALERTES = { matieres: '#e0993f', bras: '#6f9fc9', invendus: '#a97fc0', perte: '#e05a4e' };

// L'échelle des filtres : rouge pour le mauvais, jaune au milieu, vert pour le
// bon. Une seule échelle pour tous les filtres, pour que le joueur n'ait jamais
// à réapprendre à lire une couleur.
function echelle(t) {
  t = Math.max(0, Math.min(1, t));
  const arrets = [
    [0.00, [176, 54, 45]],    // rouge
    [0.35, [201, 122, 46]],   // orange
    [0.55, [206, 178, 58]],   // jaune
    [1.00, [93, 165, 96]],    // vert
  ];
  for (let i = 1; i < arrets.length; i++) {
    if (t <= arrets[i][0]) {
      const [t0, c0] = arrets[i - 1], [t1, c1] = arrets[i];
      const k = (t - t0) / (t1 - t0);
      return c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
    }
  }
  return arrets[arrets.length - 1][1];
}

// Les filtres par case : chacun sait lire une case et en tirer une valeur de 0
// (mauvais, rouge) à 1 (bon, vert).
//
// `bornes` dit ce que valent les deux extrémités de l'échelle. Sans elles, le
// dégradé rouge → vert était muet, et rien ne distinguait un filtre où le vert
// veut dire « beaucoup » d'un filtre où il veut dire « pas cher ». Un joueur
// regardant le prix du sol y lisait le contraire de ce qui était affiché : le
// centre en rouge — donc CHER — se lisait comme le parent pauvre de sa
// périphérie verte.
const SOL = ['stérile · 0', `filon · ${P.qualiteSommet}`];
const lireSol = (nom) => (c) => c.q[nom] / P.qualiteSommet;

const FILTRES_CASE = {
  fertilite: { nom: 'Fertilité', bornes: SOL, lire: lireSol('fertilite') },
  bois:      { nom: 'Bois',      bornes: SOL, lire: lireSol('bois') },
  argile:    { nom: 'Argile',    bornes: SOL, lire: lireSol('argile') },
  charbon:   { nom: 'Charbon',   bornes: SOL, lire: lireSol('charbon') },
  minerai:   { nom: 'Minerai',   bornes: SOL, lire: lireSol('minerai') },
  terrain:   { nom: 'Prix du sol', bornes: ['cher · 540 $', 'bon marché · 40 $'],
               lire: (c) => 1 - Math.min(1, (prixTerrain(c.ville ? c.ville.niveau : 1,
                                              c.distanceGare, qualiteMax(c)) - 40) / 500) },

  // Le potentiel de valorisation : ce que la case vaudra si la ville va au bout,
  // rapporté à ce qu'elle vaut aujourd'hui.
  //
  // C'est le seul chiffre qui distingue le centre de la périphérie, puisque le
  // rendement est le même partout à tout instant — le loyer étant indexé sur le
  // foncier, il s'ajuste et le taux ne bouge pas. Ce qui diffère, c'est la
  // PENTE. On normalise sur l'amplitude complète du barème, de ×1 à ×4, pour
  // que la couleur veuille dire la même chose d'une ville à l'autre.
  potentiel: { nom: 'Potentiel de valorisation', bornes: ['×1 — au bout', `×${P.facteurNiveau[4]} — tout à gagner`],
               lire: (c) => {
                 if (!c.ville) return 0;
                 const p = potentielTerrain(c.ville.niveau, c.distanceGare, qualiteMax(c));
                 return Math.max(0, Math.min(1, (p - 1) / (P.facteurNiveau[4] - 1)));
               } },
};

// Les filtres par ville : l'emploi, le salaire et les baromètres ne se
// mesurent pas à la case mais à la ville entière. Tout son territoire prend
// donc la même teinte, et les cinq villes se comparent d'un coup d'œil.
const FILTRES_VILLE = {
  emploi:     { nom: 'Emploi',     bornes: ['0 %', '100 %'], lire: (v) => v.barometres.emploi },
  nourriture: { nom: 'Nourriture', bornes: ['0 %', '100 %'], lire: (v) => v.barometres.nourriture },
  produits:   { nom: 'Produits',   bornes: ['0 %', '100 %'], lire: (v) => v.barometres.produits },
  occupation: { nom: 'Logement',   bornes: ['vide ou saturé', '90 % occupé'],
                lire: (v) => 1 - Math.abs(v.occupation - 0.9) / 0.9 },
  // Un salaire élevé est une bonne nouvelle pour la ville et une mauvaise pour
  // l'industriel. On le lit ici du point de vue du patron : bas = vert.
  salaire:    { nom: 'Salaire',    bornes: ['35 $ — cher à employer', '10 $ — main-d\'œuvre bon marché'],
                lire: (v) => 1 - Math.min(1, (v.salaire - 10) / 25) },
};

class Rendu {
  constructor(canvas, monde) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.monde = monde;
    this.filtre = null;              // null = on voit les bâtiments
    this.filtrePrix = null;          // ou le nom d'une ressource
    this.filtreRdt = null;           // ou un type de bâtiment, ou 'tous'
    this.selection = null;
    this.pose = null;          // type de bâtiment qu'on cherche à poser
    this.survol = null;        // dernière case visée, pour l'aperçu
    this.zoom = 1;
    this.cx = 0; this.cy = 0;
    this.index = [];                 // les bâtiments, rafraîchis au mois
    this.solPerime = true;
  }

  // Le canvas est en `position: fixed` sur toute la fenetre : c'est donc la
  // fenetre qu'il faut mesurer, jamais son parent. Un hote qui enveloppe la
  // page dans un conteneur sans hauteur donnerait sinon un canvas de 300 x 150,
  // et la carte disparaitrait sans la moindre erreur.
  dimensionner() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.cv.width = Math.round(this.w * dpr); this.cv.height = Math.round(this.h * dpr);
    this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.ctx.imageSmoothingEnabled = false;
  }

  // À zoom 1, le monde entier tient dans la fenêtre.
  get pasBase() { return Math.min(this.w / this.monde.L, this.h / this.monde.H); }
  get pas() { return this.pasBase * this.zoom; }
  get ox() { return (this.w - this.monde.L * this.pas) / 2 + this.cx; }
  get oy() { return (this.h - this.monde.H * this.pas) / 2 + this.cy; }

  // La carte ne quitte jamais l'écran. Quand elle est plus grande que la
  // fenêtre, ses bords s'y arrêtent — on ne dérive pas dans le vide ; quand
  // elle est plus petite, elle reste centrée.
  recadrer() {
    const eL = this.monde.L * this.pas, eH = this.monde.H * this.pas;
    // On autorise un débordement d'une fraction d'ÉCRAN au-delà des bords —
    // pas une fraction de carte, qui vaudrait dix fois plus au zoom minimal et
    // rien du tout au zoom maximal. Ainsi le geste se comporte pareil partout,
    // et une ville de lisière peut enfin venir au milieu de la vue.
    const dx = this.w * P.debordement, dy = this.h * P.debordement;
    const mx = Math.max(0, (eL - this.w) / 2) + dx;
    const my = Math.max(0, (eH - this.h) / 2) + dy;
    this.cx = Math.max(-mx, Math.min(mx, this.cx));
    this.cy = Math.max(-my, Math.min(my, this.cy));
  }

  zoomerVers(px, py, facteur) {
    const avant = this.pas;
    this.zoom = Math.max(1, Math.min(28, this.zoom * facteur));
    const apres = this.pas;
    if (apres === avant) return;
    const k = apres / avant;
    this.cx = (this.cx + this.w / 2 - px) * k - this.w / 2 + px;
    this.cy = (this.cy + this.h / 2 - py) * k - this.h / 2 + py;
    this.recadrer();
  }

  // Centre la vue sur une ville, au zoom où l'on distingue les bâtiments.
  cadrerVille(v) {
    // On cadre sur la plus petite dimension : en portrait, c'est la largeur qui
    // décide, et une ville coupée au bord n'est pas une ville cadrée.
    const tenir = Math.min(this.w, this.h) * 0.88;
    this.zoom = Math.max(1, Math.min(28, tenir / (v.rayon * 2.5 * this.pasBase)));
    this.cx = (this.monde.L / 2 - v.gare.x - 0.5) * this.pas;
    this.cy = (this.monde.H / 2 - v.gare.y - 0.5) * this.pas;
    this.recadrer();
  }

  caseSous(px, py) {
    const x = Math.floor((px - this.ox) / this.pas), y = Math.floor((py - this.oy) / this.pas);
    return this.monde.caseAt(x, y);
  }

  choisirFiltre(nom, prix = null, rdt = null) {
    this.filtre = nom; this.filtrePrix = prix; this.filtreRdt = rdt;
    this.solPerime = true;
  }

  // Y a-t-il un mode de lecture en cours ? Sous un filtre, le bâti s'efface
  // pour laisser la donnée parler.
  get sousFiltre() { return !!(this.filtre || this.filtrePrix || this.filtreRdt); }

  // La rentabilité d'un bâtiment sur l'échelle commune. On ne compare pas des
  // pourcentages bruts — une coupe forestière vise 15 %, une manufacture 25 %,
  // et les mettre côte à côte sur la même règle punirait la première pour une
  // promesse qu'elle n'a jamais faite. On lit donc la TENUE : atteint-il le
  // rendement que le barème lui assigne ?
  //
  //   rouge  : il ne rapporte rien, ou il perd
  //   jaune  : il tient la moitié de sa promesse
  //   vert   : il atteint son rendement visé, ou le dépasse
  teinteRendement(b) {
    return echelle(b.tenue());
  }

  // Les bâtiments changent au mois, pas à l'image : on tient une liste à plat.
  rafraichirIndex() {
    this.index = [];
    for (const v of this.monde.villes) {
      for (const b of this.monde.tousBatiments(v)) this.index.push(b);
    }
    if (this.filtre && FILTRES_VILLE[this.filtre]) this.solPerime = true;
    if (this.filtrePrix) this.solPerime = true;
  }

  // --- Le sol -------------------------------------------------------------
  // Peint une fois, à un pixel par case, puis étiré. C'est ce qui rend une
  // carte de vingt-cinq mille cases affichable sur un téléphone.

  peindreSol() {
    const m = this.monde;
    if (!this.sol) {
      this.sol = document.createElement('canvas');
      this.sol.width = m.L; this.sol.height = m.H;
    }
    const ctx = this.sol.getContext('2d');
    const img = ctx.createImageData(m.L, m.H);
    const d = img.data;

    // Teintes de ville, calculées une fois pour toutes les cases du territoire.
    const teinteVille = new Map();
    if (this.filtrePrix) {
      for (const v of m.villes) {
        const ind = v.marche.prix[this.filtrePrix] / RES[this.filtrePrix].prix;
        // Cher = rouge, bon marché = vert. L'échelle couvre la moitié au double
        // du prix de référence, là où se joue tout ce qui est lisible.
        teinteVille.set(v, echelle(1 - (ind - 0.5) / 1.5));
      }
    } else if (this.filtre && FILTRES_VILLE[this.filtre]) {
      const f = FILTRES_VILLE[this.filtre];
      for (const v of m.villes) teinteVille.set(v, echelle(f.lire(v)));
    }

    const fCase = this.filtre && FILTRES_CASE[this.filtre] ? FILTRES_CASE[this.filtre] : null;
    const parVille = teinteVille.size > 0;
    // En lecture de rentabilité, la donnée est portée par les bâtiments : le
    // sol doit s'effacer pour ne pas leur disputer le regard.
    const sourdine = !!this.filtreRdt;
    const joueurId = m.joueur.id;
    const couleursSocietes = new Map(m.societes.map(s => [s.id,
      [parseInt(s.couleur.substr(1, 2), 16), parseInt(s.couleur.substr(3, 2), 16),
       parseInt(s.couleur.substr(5, 2), 16)]]));

    for (let i = 0; i < m.cases.length; i++) {
      const c = m.cases[i];
      let r, g, b;

      if (sourdine) {
        const gris = 26 + c.alt * 22 + (c.ville ? 10 : 0);
        r = gris; g = gris + 2; b = gris - 3;
      } else if (parVille) {
        if (c.ville) {
          const t = teinteVille.get(c.ville);
          [r, g, b] = t;
        } else {
          // Hors des villes, on garde le relief mais en sourdine : le regard
          // doit aller aux territoires comparés.
          const gris = 32 + c.alt * 26;
          r = gris; g = gris + 2; b = gris - 2;
        }
      } else if (this.filtre === 'proprio') {
        // Ce qui est à vous saute aux yeux ; le reste s'efface. C'est le seul
        // filtre qui ne suit pas l'échelle rouge-vert : il ne mesure rien, il
        // désigne.
        if (c.proprio === joueurId) { r = 224; g = 177; b = 85; }
        else if (c.proprio && c.proprio !== 'ind') {
          const s = couleursSocietes.get(c.proprio) || [90, 84, 72];
          [r, g, b] = s;
        } else if (c.bat || c.proprio === 'ind') { r = 74; g = 70; b = 60; }
        else if (c.ville) { r = 42; g = 39; b = 33; }
        else { r = 24; g = 23; b = 20; }
      } else if (fCase) {
        [r, g, b] = echelle(fCase.lire(c));
        if (!c.ville && this.filtre === 'terrain') { r = 34; g = 34; b = 30; }
      } else {
        const base = RELIEFS[c.relief].couleur;
        r = parseInt(base.substr(1, 2), 16);
        g = parseInt(base.substr(3, 2), 16);
        b = parseInt(base.substr(5, 2), 16);
      }

      // L'ombrage du relief : une lumière rasante venue du nord-ouest. C'est
      // elle, et rien d'autre, qui fait exister les montagnes sur une carte
      // vue de dessus.
      // L'altitude assombrit les fonds et blanchit les hauteurs ; l'ombrage
      // rasant du nord-ouest fait le reste. C'est ce couple, et rien d'autre,
      // qui fait exister un relief sur une carte vue de dessus.
      const etage = 0.86 + c.alt * 0.42;
      const lum = 1 + (-c.pente * 1.7 - c.penteY * 1.3) * 5.2;
      const k = Math.max(0.42, Math.min(1.7, lum * etage));
      d[i * 4]     = Math.min(255, r * k);
      d[i * 4 + 1] = Math.min(255, g * k);
      d[i * 4 + 2] = Math.min(255, b * k);
      d[i * 4 + 3] = 255;
    }

    ctx.putImageData(img, 0, 0);
    this.solPerime = false;
  }

  // --- L'image ------------------------------------------------------------

  dessiner() {
    // Les barres du navigateur mobile apparaissent et disparaissent sans
    // declencher d'evenement fiable : on verifie a chaque image.
    if (this.w !== window.innerWidth || this.h !== window.innerHeight) this.dimensionner();

    const { ctx } = this, m = this.monde, p = this.pas, ox = this.ox, oy = this.oy;
    if (this.solPerime || !this.sol) this.peindreSol();
    if (p !== this._dernierPas) { videCache(); this._dernierPas = p; }

    ctx.fillStyle = '#0f1512';
    ctx.fillRect(0, 0, this.w, this.h);

    ctx.imageSmoothingEnabled = p < 3;
    ctx.drawImage(this.sol, ox, oy, m.L * p, m.H * p);

    // La fenêtre, en cases : tout le reste du dessin s'y limite.
    const x0 = Math.floor(-ox / p) - 1, y0 = Math.floor(-oy / p) - 1;
    const x1 = Math.ceil((this.w - ox) / p) + 1, y1 = Math.ceil((this.h - oy) / p) + 1;
    const vu = (b) => b.cases[0].x >= x0 && b.cases[0].x <= x1
                   && b.cases[0].y >= y0 && b.cases[0].y <= y1;

    this.dessinerVoies(ctx, p, ox, oy, x0, y0, x1, y1);
    this.dessinerBatiments(ctx, p, ox, oy, vu);
    this.dessinerChantiers(ctx, p, ox, oy, x0, y0, x1, y1);

    // Les gares, toujours visibles : ce sont les repères de la carte.
    for (const v of m.villes) {
      const gx = ox + v.gare.x * p, gy = oy + v.gare.y * p;
      const r = Math.max(3, Math.min(9, p * 0.7));
      ctx.fillStyle = '#e0b155';
      ctx.beginPath(); ctx.arc(gx + p / 2, gy + p / 2, r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    this.dessinerAlertes(ctx, p, ox, oy, vu);
    this.dessinerEtiquettes(ctx, p, ox, oy);

    // La frontière achetable : étroite et disputée, c'est là que se joue le
    // foncier. On ne la montre que quand elle sert — sous un filtre foncier, ou
    // dès qu'on a la fiche d'un terrain ouverte. Sans cela le joueur ne voit pas
    // où sa ville peut s'étendre, et croit la règle plus dure qu'elle n'est :
    // il suffit de toucher du sol VENDU, un bâtiment n'est pas nécessaire.
    const inspecteUnTerrain = this.selection && !this.selection.bat
                           && !this.selection.chantier && this.selection.ville;
    if (p >= 4 && !this.pose
        && (this.filtre === 'terrain' || this.filtre === 'proprio' || inspecteUnTerrain)) {
      ctx.strokeStyle = 'rgba(224,177,85,.75)'; ctx.lineWidth = 1;
      for (const v of m.villes) for (const c of v.cases) {
        if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
        if (!estAchetable(m, c)) continue;
        ctx.strokeRect(ox + c.x * p + .5, oy + c.y * p + .5, p - 1, p - 1);
      }
    }

    if (this.pose) this.dessinerPose(ctx, p, ox, oy, x0, y0, x1, y1);

    // La sélection cercle le BÂTIMENT ENTIER, pas la case touchée.
    //
    // On ne clique jamais sur un bâtiment, on clique sur une de ses cases : un
    // carré blanc d'une case au coin d'une aciérie de quatre laissait croire
    // qu'on inspectait un terrain d'une case, et les chiffres du foncier
    // devenaient incompréhensibles. Le contour épouse maintenant l'emprise.
    if (this.selection) {
      const c = this.selection;
      const bloc = (c.bat && c.bat.cases) || (c.chantier && c.chantier.cases) || [c];
      let x0b = Infinity, y0b = Infinity, x1b = -Infinity, y1b = -Infinity;
      for (const k of bloc) {
        if (k.x < x0b) x0b = k.x;
        if (k.y < y0b) y0b = k.y;
        if (k.x > x1b) x1b = k.x;
        if (k.y > y1b) y1b = k.y;
      }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.strokeRect(ox + x0b * p - 1, oy + y0b * p - 1,
                     (x1b - x0b + 1) * p + 2, (y1b - y0b + 1) * p + 2);
    }
  }

  // Le mode « Bâtir ». On cercle d'or tout ce qui peut recevoir le bâtiment
  // choisi, et on montre en plein l'emprise exacte sous le doigt : sans cet
  // aperçu, poser un carré de quatre cases relève de la divination.
  dessinerPose(ctx, p, ox, oy, x0, y0, x1, y1) {
    const m = this.monde;

    // LA GARE SE POSE HORS DES VILLES, donc on ne peut pas balayer les cases des
    // territoires pour trouver où elle tient : c'est exactement le contraire.
    // On cercle la terre libre, et on marque en rouge ce qui est trop près d'une
    // gare existante — le refus le plus fréquent, et le seul qu'on ne devine pas.
    if (this.pose === 'gare') {
      for (let y = Math.max(0, y0); y <= y1 && y < m.H; y++) {
        for (let x = Math.max(0, x0); x <= x1 && x < m.L; x++) {
          const c = m.caseAt(x, y);
          if (!c || c.ville) continue;
          const refus = m.peutFonderGare(x, y);
          ctx.fillStyle = refus ? 'rgba(184,102,58,.20)' : 'rgba(224,177,85,.28)';
          ctx.fillRect(ox + x * p, oy + y * p, p, p);
        }
      }
      if (this.survol && !this.survol.ville) {
        const ok = !m.peutFonderGare(this.survol.x, this.survol.y);
        ctx.strokeStyle = ok ? '#fff' : '#b8663a';
        ctx.lineWidth = 2;
        // Le territoire qu'ouvrirait la gare : sans lui, on pose à l'aveugle.
        ctx.beginPath();
        ctx.arc(ox + (this.survol.x + .5) * p, oy + (this.survol.y + .5) * p,
                P.rayonGare * p, 0, Math.PI * 2);
        ctx.stroke();
      }
      return;
    }

    const def = BAT[this.pose];
    ctx.strokeStyle = 'rgba(224,177,85,.85)';
    ctx.lineWidth = Math.max(1, p * 0.12);
    for (const v of m.villes) for (const c of v.cases) {
      if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
      if (!this.posable(c)) continue;
      ctx.strokeRect(ox + c.x * p + .5, oy + c.y * p + .5, p - 1, p - 1);
    }

    const e = this.survol && this.emprise ? this.emprise(this.survol, this.pose) : null;
    if (e) {
      ctx.fillStyle = 'rgba(224,177,85,.42)';
      for (const c of e.cases) ctx.fillRect(ox + c.x * p, oy + c.y * p, p, p);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      const xs = e.cases.map(c => c.x), ys = e.cases.map(c => c.y);
      ctx.strokeRect(ox + Math.min(...xs) * p - 1, oy + Math.min(...ys) * p - 1,
                     def.w * p + 2, def.h * p + 2);
    }
  }

  // Une case est posable si le bâtiment choisi tient quelque part autour d'elle.
  posable(c) {
    if (this.pose === 'gare') return !c.ville && !this.monde.peutFonderGare(c.x, c.y);
    return this.emprise ? !!this.emprise(c, this.pose) : false;
  }

  // Les emprises de voie, case par case — et non plus un trait tiré entre deux
  // gares.
  //
  // La différence n'est pas cosmétique : les cases sont RÉSERVÉES, personne ne
  // peut y bâtir, et le joueur doit voir exactement lesquelles pour acheter
  // autour. Un trait droit passait à côté de la moitié d'entre elles.
  //
  // La ligne se pose depuis les DEUX gares à la fois, chacune avançant vers
  // l'autre : ce qui est posé est doré, ce qui reste à poser est gris. On voit
  // ainsi le chantier progresser, et l'on voit son propre investissement le
  // faire avancer d'un coup.
  dessinerVoies(ctx, p, ox, oy, x0, y0, x1, y1) {
    const m = this.monde;
    // Un plancher de largeur : à la vue d'ensemble une case fait deux pixels,
    // et une emprise dessinée à 62 % de cela ne se verrait plus.
    const large = Math.max(1.8, p * 0.62), decal = (p - large) / 2;

    for (const l of m.liaisons) {
      const e = l.emprise;
      if (!e || !e.length) continue;

      // Avancement : de l'OUVERTURE du chantier à sa date d'achèvement.
      //
      // C'était `mois / date`, ce qui n'a de sens que si les travaux ont
      // commencé au mois zéro. Depuis que la compagnie pose ses lignes l'une
      // après l'autre, `date` est un mois absolu : une ligne ouverte au mois 55
      // pour une livraison au mois 80 s'affichait à 69 % de rail posé dès son
      // premier jour. Quatre lignes paraissaient ainsi se construire ensemble.
      let avance = 0;
      if (l.achevee) avance = 1;
      else if (l.date !== null && l.debut !== null && l.date > l.debut) {
        avance = Math.max(0, Math.min(1, (m.mois - l.debut) / (l.date - l.debut)));
      }
      const posees = Math.round(e.length * avance);

      for (let i = 0; i < e.length; i++) {
        const c = e[i];
        if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
        // La voie avance depuis UNE gare vers l'autre. Elle partait autrefois
        // des deux bouts à la fois, ce qui allait deux fois plus vite et ne
        // ressemblait à rien : une équipe pose du rail devant elle.
        const rang = l.depuisB ? (e.length - 1 - i) : i;
        const posee = l.achevee || rang < posees;
        // Le gris doit se lire dès le premier mois : c'est lui qui annonce où la
        // ligne passera, et donc où il faut acheter avant tout le monde.
        ctx.fillStyle = posee ? 'rgba(224,177,85,.90)' : 'rgba(186,180,166,.46)';
        ctx.fillRect(ox + c.x * p + decal, oy + c.y * p + decal, large, large);
      }
    }
  }

  dessinerBatiments(ctx, p, ox, oy, vu) {
    const joueur = this.monde.joueur;
    const dessine = p >= 5.5 && !this.sousFiltre;

    for (const b of this.index) {
      if (!vu(b)) continue;
      const c = b.cases[0];
      const x = ox + c.x * p, y = oy + c.y * p;

      // Lecture de la rentabilité : le bâtiment porte lui-même la couleur, et
      // ceux qui ne sont pas du type demandé restent en silhouette. C'est ce
      // qui permet de comparer trente scieries d'un bout à l'autre de la carte.
      if (this.filtreRdt) {
        const vise = this.filtreRdt === 'tous' || this.filtreRdt === b.type;
        if (vise) {
          const t = this.teinteRendement(b);
          ctx.fillStyle = 'rgb(' + t[0] + ',' + t[1] + ',' + t[2] + ')';
        } else {
          ctx.fillStyle = 'rgba(0,0,0,.34)';
        }
        ctx.fillRect(x, y, p * b.def.w, p * b.def.h);
        if (b.societe === joueur && p >= 3) {
          ctx.strokeStyle = '#e0b155';
          ctx.lineWidth = Math.max(1, p * 0.10);
          ctx.strokeRect(x + .5, y + .5, p * b.def.w - 1, p * b.def.h - 1);
        }
        continue;
      }

      if (dessine) {
        ctx.drawImage(sprite(b.type, p), Math.round(x), Math.round(y));
      } else if (!this.sousFiltre) {
        // Trop petit pour un toit : on garde la couleur de famille, qui suffit
        // à lire la vocation des quartiers.
        ctx.fillStyle = COULEURS[b.type];
        ctx.fillRect(x, y, p * b.def.w, p * b.def.h);
      } else {
        // Sous un filtre, le bâti ne doit pas voler la couleur de la donnée :
        // il n'en reste qu'une silhouette sombre.
        ctx.fillStyle = 'rgba(0,0,0,.28)';
        ctx.fillRect(x, y, p * b.def.w, p * b.def.h);
      }

      // Ce qui est à vous se voit toujours, quel que soit le mode.
      if (b.societe === joueur && p >= 3) {
        ctx.strokeStyle = '#e0b155';
        ctx.lineWidth = Math.max(1, p * 0.10);
        ctx.strokeRect(x + .5, y + .5, p * b.def.w - 1, p * b.def.h - 1);
      }
    }
  }

  dessinerChantiers(ctx, p, ox, oy, x0, y0, x1, y1) {
    const joueur = this.monde.joueur;
    for (const s of this.monde.societes) for (const ch of s.chantiers) {
      const c = ch.cases[0];
      if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
      const x = ox + c.x * p, y = oy + c.y * p;
      const w = p * BAT[ch.type].w, h = p * BAT[ch.type].h;
      ctx.fillStyle = '#3a3226';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = s === joueur ? '#e0b155' : 'rgba(150,140,120,.7)';
      ctx.setLineDash([Math.max(2, p * 0.3), Math.max(2, p * 0.3)]);
      ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      ctx.setLineDash([]);
      if (p >= 7) {
        ctx.fillStyle = '#e0b155';
        ctx.fillRect(x + 2, y + h - 4, (w - 4) * ch.progression(), 2);
      }
    }
  }

  // Les pastilles d'alerte : quatre états seulement, jamais recouvertes. C'est
  // la couche que le joueur lit vraiment.
  dessinerAlertes(ctx, p, ox, oy, vu) {
    if (p < 4) return;
    for (const b of this.index) {
      if (!b.alerte || !vu(b)) continue;
      const c = b.cases[0];
      const r = Math.min(3.2, Math.max(1.6, p / 4));
      ctx.fillStyle = ALERTES[b.alerte];
      ctx.beginPath();
      ctx.arc(ox + (c.x + b.def.w) * p - r - 1, oy + c.y * p + r + 1, r, 0, 7);
      ctx.fill();
    }
  }

  dessinerEtiquettes(ctx, p, ox, oy) {
    ctx.textAlign = 'center';
    ctx.font = `600 ${Math.max(10, Math.min(15, 9 + p * 0.5))}px ui-sans-serif, system-ui, sans-serif`;
    for (const v of this.monde.villes) {
      const x = ox + (v.gare.x + .5) * p;
      const y = oy + v.gare.y * p - Math.max(8, p * 0.9);
      if (x < -60 || x > this.w + 60 || y < -20 || y > this.h + 20) continue;
      const texte = p < 4 ? v.nom : `${v.nom} · ${Math.round(v.menages)}`;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,7,6,.85)';
      ctx.strokeText(texte, x, y);
      ctx.fillStyle = v.enCrise ? '#e05a4e' : '#efe8d8';
      ctx.fillText(texte, x, y);
    }
    ctx.textAlign = 'left';
  }
}

// ===== js/ui/panneaux.js =============================================

// ---------------------------------------------------------------------------
// Le contenu des volets : filtres, villes, marché, société, rail.
//
// « Le registre est ce qui permet au joueur de repérer le bâtiment qui perd de
//   l'argent. Sans lui, une société de trente bâtiments est une boîte noire et
//   le joueur ne peut prendre aucune décision éclairée — il jouera au hasard. »
// ---------------------------------------------------------------------------




const $ = (s) => document.querySelector(s);
const eur = (n) => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + ' $';
const pct = (n) => Math.round(n * 100) + ' %';
const cl = (n) => n > 0 ? 'vert' : n < 0 ? 'rouge' : 'doux';
const rgb = (t) => `rgb(${t[0]},${t[1]},${t[2]})`;

// Les bâtiments dont la rentabilité veut dire quelque chose : l'entrepôt ne
// rapporte rien par construction, il n'a pas de rendement à comparer.
const RENTABLES = TYPES_BAT.filter(t => BAT[t].cat !== 'neg');

// --- Filtres ----------------------------------------------------------------

function voletFiltres(monde, rendu) {
  const past = (id, nom, actif, teinte) =>
    `<button data-filtre="${id}" class="${actif ? 'actif' : ''}">`
    + (teinte ? `<span class="nuance" style="background:${teinte}"></span>` : '')
    + `${nom}</button>`;

  const f = rendu.filtre, fp = rendu.filtrePrix, rendement = rendu.filtreRdt;

  return `
    <h3>Ce que montre la carte</h3>
    <div class="pastilles">
      ${past('', 'Les bâtiments', !f && !fp)}
      ${past('proprio', 'Mes possessions', f === 'proprio')}
    </div>

    <h3>Le terrain — case par case</h3>
    <div class="pastilles">
      ${Object.entries(FILTRES_CASE).map(([id, x]) =>
        past(id, x.nom, f === id)).join('')}
    </div>

    <h3>Les villes — territoire entier</h3>
    <div class="pastilles">
      ${Object.entries(FILTRES_VILLE).map(([id, x]) =>
        past(id, x.nom, f === id)).join('')}
    </div>

    <h3>La rentabilité, bâtiment par bâtiment</h3>
    <div class="pastilles">
      <button data-rdt="tous" class="${rendement === 'tous' ? 'actif' : ''}">Tous</button>
      ${RENTABLES.map(t =>
        `<button data-rdt="${t}" class="${rendement === t ? 'actif' : ''}">
           <span class="nuance" style="background:${COULEURS[t]}"></span>${BAT[t].nom}</button>`
      ).join('')}
    </div>
    <div class="note">Chaque bâtiment prend la couleur de son rendement : rouge s'il ne
      rapporte rien, vert à 20 % l'an — le rendement visé de la transformation, au milieu du
      barème. Ceux d'un autre métier restent en silhouette.</div>

    <h3>Le prix d'une marchandise, ville par ville</h3>
    <div class="pastilles">
      ${RESSOURCES.map(r =>
        `<button data-prix="${r}" class="${fp === r ? 'actif' : ''}">
           <span class="nuance" style="background:${RES[r].couleur}"></span>${RES[r].nom}</button>`
      ).join('')}
    </div>

    <div class="note">
      Une seule échelle pour tout : <b class="rouge">rouge</b> pour ce qui va mal,
      jaune au milieu, <b class="vert">vert</b> pour ce qui va bien. Sur les prix,
      le rouge dit « cher » — mauvaise nouvelle pour qui achète, bonne pour qui vend.
    </div>
  `;
}

// --- Villes -----------------------------------------------------------------

// L'attractivité, ville par ville, et ce qui la compose.
//
// C'est le seul chiffre qui décide de la population : bâtir des logements ne
// fait venir personne, cela ouvre des portes. Le joueur doit donc pouvoir lire
// d'un coup d'œil pourquoi une ville attire et pourquoi une autre stagne — et
// les quatre composantes se lisent séparément, sinon le chiffre global ne dit
// rien d'actionnable.

// `val` est la position sur l'échelle rouge → vert, entre 0 et 1 ; `affiche`
// est ce qu'on écrit. Les deux diffèrent pour le pouvoir d'achat, dont le
// chiffre parlant est un rapport centré sur 100 % et non une position.
function miniJauge(nom, val, seuil, affiche) {
  const alerte = seuil !== undefined && val < seuil;
  return `<div class="mini">
    <div class="miniTete"><span>${nom}</span>
      <span class="${alerte ? 'rouge' : 'doux'}">${affiche ?? pct(val)}${alerte ? ' ⚠' : ''}</span></div>
    <div class="miniPiste"><div style="width:${Math.min(100, Math.max(0, val) * 100)}%;
      background:${rgb(echelle(val))}"></div></div>
  </div>`;
}

// L'aisance vaut 1,00 quand le ménage boucle tout juste. On la ramène sur
// l'échelle commune pour qu'elle se lise comme les autres : 0,70 → rouge,
// 1,20 → vert.
function echelleAisance(a) {
  return (a - P.aisanceMin) / (P.aisanceMax - P.aisanceMin);
}

function carteVille(monde, v) {
  const b = v.barometres;
  const a = monde.attractivite(v);
  const ais = monde.aisance(v);
  const croissance = v.enCrise ? -P.exodeCritique
    : Math.max(-P.cadenceMax, Math.min(P.cadenceMax, P.cadenceDemo * 100 * (a - P.pivot)));

  const mouvement = v.enCrise
    ? '<span class="rouge">seuil critique franchi — la ville se vide</span>'
    : croissance > 0.0005
      ? `<span class="vert">+${(croissance * 100).toFixed(1)} % par mois</span> venus du dehors`
      : croissance < -0.0005
        ? `<span class="rouge">${(croissance * 100).toFixed(1)} % par mois</span> — elle repousse`
        : '<span class="doux">à l\'équilibre, sur son pivot</span>';

  const mig = v.migration === undefined ? 0 : v.migration;
  const echange = Math.abs(mig) < 0.05 ? ''
    : mig > 0 ? ` · <span class="vert">+${mig.toFixed(1)}</span> pris aux villes reliées`
              : ` · <span class="rouge">${mig.toFixed(1)}</span> partis vers les villes reliées`;

  const plein = v.occupation > 0.97
    ? '<div class="avert">Logements pleins : l\'attractivité ne peut plus se traduire en habitants.</div>'
    : v.occupation < 0.55 && v.capaciteLogement > 0
      ? '<div class="note">Beaucoup de logements vides — ils ne feront venir personne tant que l\'attractivité restera sous le pivot.</div>'
      : '';

  return `<div class="carteVille ${monde.villeChoisie === v ? 'actif' : ''}" data-ville="${v.id}">
    <div class="tetVille">
      <span><b>${v.nom}</b>${v.enCrise ? ' <span class="rouge">⚠</span>' : ''}
        <span class="cv"><br>${P.nomsNiveau[v.niveau - 1]} · ${Math.round(v.menages)} ménages
        · ${pct(v.occupation)} occupé${v.temperament
          ? `<br><i class="faible">fondée comme ${v.temperament.nom}</i>` : ''}</span></span>
      <span class="attrait" style="color:${rgb(echelle(a))}">${pct(a)}
        <span class="etiq" style="display:block;text-align:right">attractivité</span></span>
    </div>
    <div class="minis">
      ${miniJauge('Nourriture', b.nourriture, P.seuilsCritiques.nourriture)}
      ${miniJauge('Emploi', b.emploi, P.seuilsCritiques.emploi)}
      ${miniJauge('Produits', b.produits)}
      ${miniJauge('Pouvoir d\'achat', echelleAisance(ais), undefined,
                   (ais * 100).toFixed(0) + ' %')}
    </div>
    <div class="pied">${mouvement}${echange}
      · salaire ${v.salaire.toFixed(1)} $ · panier ${monde.panier(v).toFixed(1)} $</div>
    ${plein}
  </div>`;
}

function voletVilles(monde) {
  const classees = monde.villes.slice()
    .sort((a, b) => monde.attractivite(b) - monde.attractivite(a));
  return `<h3>Attractivité — les cinq villes</h3>
    <div class="listeCartesVilles">${classees.map(v => carteVille(monde, v)).join('')}</div>
    <div class="note">
      <b>attractivité = moyenne des trois baromètres × pouvoir d'achat</b>, où le pouvoir
      d'achat vaut le revenu du ménage divisé par son panier — 100 % quand il boucle tout
      juste. Au-dessus du pivot de ${pct(P.pivot)} la ville attire des habitants
      <b>du dehors</b> ; en dessous elle en perd. Une part très faible de la population
      circule en plus entre les villes qu'un rail relie, au prorata de leur attrait.<br><br>
      Bâtir des logements <b>ne fait venir personne</b> : cela ouvre des portes que
      l'attractivité remplira, ou pas.
    </div>
    <div class="pastilles"><button data-vue="evenements">${
      monde.evenements.length
        ? monde.evenements.map(e => e.def.signe).join(' ') + ' &nbsp;Ce qui arrive'
        : 'Ce qui arrive — la chronique'}</button></div>
    ${monde.villeChoisie ? detailVille(monde, monde.villeChoisie) : ''}
  `;
}

function detailVille(monde, v) {
  const b = v.barometres;
  const a = monde.attractivite(v);
  const ais = monde.aisance(v);
  const moy = (b.nourriture + b.emploi + b.produits) / 3;

  const jauge = (nom, val, seuil) => `
    <div class="barometre">

    </div>`;

  const n = niveauVille(v.menages);
  const palier = n >= 5 ? 'Métropole — dernier palier.'
    : `${P.nomsNiveau[n]} à ${P.seuilsNiveau[n]} ménages — il en manque
       <b>${Math.max(0, Math.ceil(P.seuilsNiveau[n] - v.menages))}</b>, et le foncier
       passerait de ×${P.facteurNiveau[n - 1].toFixed(1)} à ×${P.facteurNiveau[n].toFixed(1)}.`;

  return `
    <h3>${v.nom} · ${P.nomsNiveau[v.niveau - 1]}</h3>
    ${v.temperament ? `<div class="note" style="margin:0 0 9px">Fondée comme
      <b>${v.temperament.nom}</b>. Les cinq villes n'ouvrent pas la partie dans le même état :
      celle-ci démarrait avec ${Math.round(v.temperament.emploi * 100)} % de ses bras employés,
      ${Math.round(v.temperament.vivres * 100)} % de couverture alimentaire,
      ${Math.round(v.temperament.produits * 100)} % en produits manufacturés,
      ${v.temperament.bureaux >= 1.2 ? 'une belle dotation de bureaux'
        : v.temperament.bureaux <= 0.6 ? 'presque pas de bureaux' : 'des bureaux en nombre moyen'},
      et ${v.filieresEngorgees && v.filieresEngorgees.length
        ? `<b>${v.filieresEngorgees.map(f => RES[f].nom.toLowerCase()).join(' et ')}</b> en
           surproduction — cours effondré, stock qui s'entasse, ateliers déficitaires en bloc :
           c'est là qu'on ramasse une filière entière pour le prix de sa terre`
        : 'aucune filière en surproduction'}.</div>` : ''}
    <div class="grille">
      <div class="fiche"><div class="etiq">Ménages</div><div class="v">${Math.round(v.menages)}</div></div>
      <div class="fiche"><div class="etiq">Logements</div>
        <div class="v">${Math.round(v.capaciteLogement || 0)}</div>
        <div class="etiq" style="margin-top:2px">${pct(v.occupation)} occupés</div></div>
      <div class="fiche"><div class="etiq">Salaire</div><div class="v">${v.salaire.toFixed(1)} $</div></div>
      <div class="fiche"><div class="etiq">Bras libres</div>
        <div class="v">${Math.round(Math.max(0, (v.bras || 0) - (v.postesDemandes || 0)))}</div></div>
    </div>

    <h3>Les trois baromètres</h3>
    ${jauge('Nourriture', b.nourriture, P.seuilsCritiques.nourriture)}
    ${jauge('Emploi', b.emploi, P.seuilsCritiques.emploi)}
    ${jauge('Produits manufacturés', b.produits)}
    <div class="barometre" style="margin-top:8px">
      <div class="tete"><span>Moyenne</span><span class="doux">${pct(moy)}</span></div>
      <div class="piste"><div class="jauge2" style="width:${moy * 100}%;background:var(--doux)"></div></div>
    </div>

    <h3>Le pouvoir d'achat</h3>
    <div class="grille">
      <div class="fiche"><div class="etiq">Revenu du ménage</div>
        <div class="v">${eur(revenu)}</div>
        <div class="etiq" style="margin-top:2px">2 employés · emploi ${pct(b.emploi)}</div></div>
      <div class="fiche"><div class="etiq">Panier</div>
        <div class="v doux">${eur(panier)}</div>
        <div class="etiq" style="margin-top:2px">ration + produit + loyer</div></div>
      <div class="fiche"><div class="etiq">Pouvoir d'achat</div>
        <div class="v" style="color:${rgb(echelle(echelleAisance(ais)))}">${(ais * 100).toFixed(0)} %</div>
        <div class="etiq" style="margin-top:2px">borné à ${(P.aisanceMin*100).toFixed(0)}–${(P.aisanceMax*100).toFixed(0)} %</div></div>
    </div>

    <div class="barometre" style="margin-top:10px">
      <div class="tete"><span><b>Attractivité</b> — pivot à ${pct(P.pivot)}</span>
        <span class="or"><b>${pct(a)}</b></span></div>
      <div class="piste"><div class="jauge2" style="width:${Math.min(100, a * 100)}%;background:var(--or)"></div></div>
    </div>
    <div class="note">${pct(moy)} de baromètres × ${(ais * 100).toFixed(0)} % de pouvoir d'achat
      = <b>${pct(a)}</b>. ${v.enCrise
        ? '<span class="rouge">Un seuil critique est franchi : la ville se vide de 5 % par mois, quels que soient les autres chiffres.</span>'
        : a > P.pivot
          ? 'Au-dessus du pivot : la ville tire des habitants du dehors.'
          : 'Sous le pivot : elle en perd.'}</div>
    <div class="note">${palier}</div>
  `;
}

// --- Marché -----------------------------------------------------------------

// Le cours d'une marchandise, en courbe.
//
// Un instantané ne dit rien : un cours à 0,85 peut être une filière qui
// s'effondre ou une pénurie qui se résorbe, et les deux appellent des décisions
// opposées. La courbe tranche d'un coup d'œil.
function graphiqueCours(h, couleur) {
  if (!h || h.length < 2) {
    return '<div class="note">Pas encore assez de mois pour tracer une courbe.</div>';
  }
  const L = 300, H = 96, marge = 4;
  const bas = Math.min(0.9, Math.min(...h)), haut = Math.max(1.1, Math.max(...h));
  const y = (v) => marge + (haut - v) / (haut - bas) * (H - 2 * marge);
  const x = (i) => i / (h.length - 1) * L;
  const trace = h.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const aire = `${trace} L${L},${H} L0,${H} Z`;
  const dernier = h[h.length - 1];

  return `<svg viewBox="0 0 ${L} ${H}" class="cours" preserveAspectRatio="none">
      <line x1="0" y1="${y(1).toFixed(1)}" x2="${L}" y2="${y(1).toFixed(1)}"
            stroke="rgba(224,177,85,.45)" stroke-width="1" stroke-dasharray="4 4"/>
      <path d="${aire}" fill="${couleur}" opacity=".14"/>
      <path d="${trace}" fill="none" stroke="${couleur}" stroke-width="2"
            stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="legendeCours">
      <span>${h.length} mois</span>
      <span class="doux">bas ${bas.toFixed(2)}× · haut ${haut.toFixed(2)}×</span>
      <span class="or">aujourd'hui ${dernier.toFixed(2)}×</span>
    </div>
    <div class="note">Le trait doré est le <b>prix de référence</b> — celui qui s'établit
      quand la demande égale l'offre. Sous ce trait, la filière produit plus que le marché
      n'absorbe : le stock s'entasse et les ateliers perdent de l'argent, tous à la fois.</div>`;
}

// Qui se nourrit de sa propre production, et qui dépend de ses voisines.
//
// Un marché fusionné n'est pas un entrepôt unique : ce qu'une ville produit
// alimente d'abord ses propres besoins, et seul le surplus s'exporte. Le taux
// global du marché ne dit donc plus rien de ce que vit chaque ville, et sans ce
// détail le joueur ne peut pas voir laquelle est fournisseuse et laquelle est
// dépendante — c'est pourtant la lecture qui décide où bâtir.
function detailLocal(m, r) {
  if (m.villes.length < 2) return '';
  const lignes = [];
  for (const [v, l] of m.parVille) {
    if (l.besoins[r] <= 0.001 && l.entrees[r] <= 0.001) continue;
    const couvert = l.besoins[r] > 0.001 ? Math.min(1, l.entrees[r] / l.besoins[r]) : 1;
    const excedent = l.entrees[r] - l.besoins[r];
    lignes.push(`<div class="ligneLocale">
      <span>${v.nom}</span>
      <span class="${couvert >= 0.999 ? 'vert' : couvert < 0.6 ? 'rouge' : 'doux'}">${
        couvert >= 0.999
          ? `autosuffisante · +${Math.round(excedent).toLocaleString('fr-FR')} exportés`
          : `${pct(couvert)} de ses besoins · importe ${Math.round(-excedent).toLocaleString('fr-FR')}`}</span>
    </div>`);
  }
  if (!lignes.length) return '';
  return `<div class="detailLocal">${lignes.join('')}</div>`;
}

function voletMarche(monde, rendu) {
  const ouvert = rendu.coursOuvert || null;

  return monde.marches.map(m => {
    const cartes = RESSOURCES.map(r => {
      const i = m.indice(r);
      const servi = m.service[r] === undefined ? 1 : m.service[r];
      const stock = m.stock[r] || 0;
      // La jauge dit ce qu'on peut OBTENIR : rouge, la marchandise manque et les
      // ateliers s'arrêtent ; vert, on en trouve autant qu'on en demande.
      const teinte = rgb(echelle(servi));
      const classePrix = i > 1.35 ? 'rouge' : i < 0.85 ? 'vert' : 'doux';
      // Le stock se lit en mois de consommation : c'est la seule échelle qui ait
      // un sens d'une marchandise à l'autre, entre un charbon qui se compte par
      // dizaines de milliers et une viande qui se compte par dizaines. Engorgé
      // veut dire au-dessus du matelas que le marché cherche à tenir (§4.2 bis)
      // — donc au-dessus de ce qui va commencer à s'abîmer.
      const matelas = m.matelasVise(r);
      const mois = m.besoins[r] > 1 ? stock / m.besoins[r] : null;
      const engorge = stock > matelas;

      return `<div class="carteRes ${ouvert === r ? 'actif' : ''}" data-cours="${r}">
        <div class="tetRes">
          <span><span class="puce" style="background:${RES[r].couleur}"></span>${RES[r].nom}</span>
          <span class="prixRes ${classePrix}">${m.prix[r].toFixed(2)} $
            <span class="etiq" style="display:block;text-align:right">${i.toFixed(2)} × réf.</span></span>
        </div>
        <div class="miniPiste" style="margin:5px 0 4px">
          <div style="width:${(servi * 100).toFixed(0)}%;background:${teinte}"></div>
        </div>
        <div class="piedRes">
          <span>stock <b>${Math.round(stock).toLocaleString('fr-FR')}</b>${
            mois === null ? '' : ` · ${mois.toFixed(1)} mois`}</span>
          <span class="${servi < 0.95 ? 'rouge' : 'doux'}">${pct(servi)} servi</span>
          ${engorge ? '<span class="vert">engorgé</span>' : ''}
        </div>
        ${detailLocal(m, r)}
        ${ouvert === r ? graphiqueCours(m.histoPrix[r], RES[r].couleur)
            + `<div class="actions" style="margin-top:6px">
                 <button data-prix="${r}">Voir sur la carte</button>
               </div>` : ''}
      </div>`;
    }).join('');

    return `<h3>${m.nom}${m.villes.length > 1 ? ' — marché fusionné' : ''}</h3>
      <div class="listeRes">${cartes}</div>`;
  }).join('') + `
    <div class="note">
      Touchez une marchandise pour <b>ouvrir sa courbe</b>, et le bouton pour la voir ville
      par ville sur la carte.<br><br>
      La jauge dit ce qu'on peut <b>obtenir</b> : rouge, la marchandise manque et les ateliers
      s'arrêtent au premier accroc ; vert, on en trouve autant qu'on en demande. Le prix suit
      les <b>flux</b> : il monte quand les besoins du mois dépassent ce qui entre sur le marché.
      Le marché cherche en plus à garder <b>un mois de consommation en cave</b> — c'est le chiffre
      en mois à côté du stock. Ce qui lui manque pour l'atteindre, il l'achète et fait monter le
      cours ; ce qu'il garde au-dessus est marqué <b>engorgé</b>, cesse d'être acheté et
      commence à s'abîmer.
    </div>`;
}

function voletSociete(monde) {
  const s = monde.joueur;
  const enTete = `
    <div class="grille">
      <div class="fiche"><div class="etiq">Votre fortune</div>
        <div class="v or">${eur(s.cours(monde.multiple) * s.actions * P.partFondateur)}</div></div>
      <div class="fiche"><div class="etiq">Cours</div>
        <div class="v">${s.cours(monde.multiple).toFixed(3).replace('.', ',')} $</div></div>
      <div class="fiche"><div class="etiq">Trésorerie</div><div class="v">${eur(s.tresorerie)}</div></div>
    </div>`;

  if (!s.batiments.length && !s.chantiers.length) {
    return enTete + `<h3>Livre de comptes</h3>
      <div class="note">Votre société ne possède encore rien.<br><br>
      Approchez une ville, touchez une case libre à la lisière du bâti, achetez-la, puis
      ouvrez un chantier. Le terrain est la moitié du coût d'une maison — et la totalité
      de ce qui fait les fortunes.</div>`;
  }

  const lignes = s.batiments.map(b => `
    <tr class="ligneBat" data-bat="${b.id}">
      <td><span class="puce" style="background:${COULEURS[b.type]}"></span>${BAT[b.type].nom}</td>
      <td class="doux">${b.ville.nom.slice(0, 8)}</td>
      <td class="n">${pct(b.tauxReel)}</td>
      <td class="n" style="color:${rgb(echelle(b.tenue()))}">${(b.rendement * 100).toFixed(0)} %</td>
      <td class="n ${cl(b.resultat)}">${eur(b.resultat)}</td>
    </tr>`).join('');

  return enTete + `
    <h3>Exploitation du mois</h3>
    <table>
      <tr><th>Bâtiment</th><th>Ville</th><th class="n">Activ.</th>
          <th class="n">Rdt</th><th class="n">Résultat</th></tr>
      ${lignes}
    </table>

    <h3>Bilan</h3>
    <table>
      <tr><td>Résultat net</td><td class="n ${cl(s.resultatMensuel)}">${eur(s.resultatMensuel)}</td></tr>
      <tr><td>Immobilisé en chantiers</td>
          <td class="n doux">${eur(s.chantiers.reduce((a, c) => a + c.engage, 0))}</td></tr>
      <tr><td>Valeur des bâtiments</td>
          <td class="n">${eur(s.batiments.reduce((a, b) => a + b.valeurDeCession, 0))}</td></tr>
      <tr><td><b>Actif net réévalué</b></td><td class="n"><b>${eur(s.actifNet(monde.multiple))}</b></td></tr>
    </table>

    <h3>Les concurrents</h3>
    <table>
      <tr><th>Société</th><th class="n">Bâtiments</th><th class="n">Cours</th></tr>
      ${monde.societes.map(x => `<tr>
        <td><span class="puce" style="background:${x.couleur}"></span>${x.nom}</td>
        <td class="n doux">${x.batiments.length}</td>
        <td class="n">${x.cours(monde.multiple).toFixed(3).replace('.', ',')} $</td></tr>`).join('')}
    </table>
    <div class="note">Multiple du marché : <b>×${monde.multiple}</b>. Un bâtiment vaut son
      terrain plus ses matériaux, plus ${monde.multiple} fois son résultat annuel.</div>

    <h3>La partie</h3>
    <div class="note">Elle n'a pas de terme : elle court tant que vous la faites courir.
      Il n'y a plus de décompte à battre, seulement une fortune à bâtir.</div>
    <div class="actions" style="margin-top:8px">
      <button onclick="location.reload()">Nouveau monde</button>
    </div>`;
}

// --- Rail -------------------------------------------------------------------

// ---------------------------------------------------------------------------
// La bourse.
//
// Le PER n'est pas un réglage : c'est un prix, formé comme tous les autres par
// une tension entre une demande — les capitaux que l'épargne des ménages dirige
// vers le marché — et une offre : les bénéfices qu'on peut acheter. C'est de là
// que vient le cycle, sans qu'aucun « climat » n'ait à être piloté.
// ---------------------------------------------------------------------------

function voletBourse(monde, rendu) {
  const per = monde.per;
  const ouvert = rendu.coursOuvert || null;

  const tension = monde.tensionBourse || 1;
  const chaud = tension > 1.3, froid = tension < 0.7;

  const entete = `
    <div class="grille">
      <div class="fiche"><div class="etiq">PER du marché</div>
        <div class="v or">${per.toFixed(1)}</div>
        <div class="etiq" style="margin-top:2px">référence ${P.perReference}</div></div>
      <div class="fiche"><div class="etiq">Capitaux placés</div>
        <div class="v">${eur(monde.capitauxBourse || 0)}</div>
        <div class="etiq" style="margin-top:2px">par mois</div></div>
      <div class="fiche"><div class="etiq">Bénéfices cotés</div>
        <div class="v doux">${eur(monde.beneficesCotes || 0)}</div>
        <div class="etiq" style="margin-top:2px">par an</div></div>
    </div>
    <div class="carteRes ${ouvert === '__per' ? 'actif' : ''}" data-cours="__per">
      <div class="tetRes"><span><b>Le multiple de marché</b>
        <span class="cv"><br>${chaud ? 'les capitaux se pressent — les cours montent plus vite que les profits'
          : froid ? 'les capitaux se retirent — les cours montent moins vite que les profits'
          : 'le marché est à sa valeur'}</span></span>
        <span class="prixRes ${chaud ? 'vert' : froid ? 'rouge' : 'doux'}">${tension.toFixed(2)}
          <span class="etiq" style="display:block;text-align:right">tension</span></span></div>
      ${ouvert === '__per' ? graphiqueCours(monde.histoPER.map(x => x / P.perReference), '#e0b155')
        + `<div class="note">La courbe est rapportée au PER de référence (${P.perReference}).
             Elle monte quand l'épargne des ménages afflue plus vite que les bénéfices — c'est
             le haut de cycle — et retombe quand l'économie rentre.</div>` : ''}
    </div>`;

  const societes = monde.societes.map(s => {
    const cours = s.cours(per), cap = cours * s.actions;
    const part = s.partDe(s === monde.joueur ? s.id + ':fondateur' : '__');
    const b = s.profitAnnuel;
    return `<div class="carteRes ${ouvert === 'S' + s.id ? 'actif' : ''}" data-cours="S${s.id}">
      <div class="tetRes">
        <span><b>${s.nom}</b>${s === monde.joueur ? ' <span class="or">— vous</span>' : ''}
          <span class="cv"><br>${s.batiments.length} bâtiments · actif net ${eur(s.actifNet())}</span></span>
        <span class="prixRes">${cours.toFixed(2)} $
          <span class="etiq" style="display:block;text-align:right">l'action</span></span>
      </div>
      <div class="piedRes">
        <span>capitalisation <b>${eur(cap)}</b></span>
        <span class="${b >= 0 ? 'vert' : 'rouge'}">bénéfice ${eur(b)}/an</span>
        ${s === monde.joueur ? `<span class="or">vos ${pct(P.partFondateur)} : ${eur(cap * P.partFondateur)}</span>` : ''}
      </div>
      ${ouvert === 'S' + s.id ? graphiqueCours(s.histoCours.map(x => x / Math.max(0.01, s.histoCours[0])), '#e0b155') : ''}
    </div>`;
  }).join('');

  // Une seule compagnie de chemin de fer, qui pose ses lignes l'une après
  // l'autre. Sa carte dit ce qu'elle exploite déjà et ce qu'elle creuse.
  const co = monde.compagnie;
  const chantier = monde.chantierRail;
  const mien = co.parts[monde.joueur.id] || 0;
  const partPct = co.actions > 0 ? mien / co.actions : 0;
  const cours = monde.coursRail();
  const benef = monde.beneficeAnnuelRail();
  const reste = chantier && chantier.date !== null ? chantier.date - monde.mois : null;

  const enTravaux = !chantier ? `
      <div class="piedRes"><span class="doux">réseau achevé — plus rien à poser</span></div>`
    : chantier.date === null ? `
      <div class="piedRes"><span class="doux">prochain chantier : ${chantier.nom}</span></div>`
    : `
      <div class="piedRes">
        <span>chantier <b>${chantier.nom}</b></span>
        <span class="or">ouverture dans ${Math.max(0, reste)} mois</span>
      </div>
      <div class="actions" style="margin-top:6px">
        <button class="miniInvest">Souscrire 800 $</button>
      </div>`;

  const rails = `<div class="carteRes ${ouvert === 'RAIL' ? 'actif' : ''}" data-cours="RAIL">
      <div class="tetRes">
        <span><b>${co.nom}</b>
          <span class="cv"><br>${co.lignes.length} ligne${co.lignes.length > 1 ? 's' : ''} en exploitation
          · ${co.cotee ? 'cotée' : 'non cotée'}</span></span>
        <span class="prixRes">${cours.toFixed(2)} $
          <span class="etiq" style="display:block;text-align:right">l'action</span></span>
      </div>
      ${co.cotee ? `<div class="piedRes">
        <span>capitalisation <b>${eur(monde.capitalisationRail())}</b></span>
        <span class="${benef >= 0 ? 'vert' : 'rouge'}">${eur(benef)}/an</span>
        ${mien > 0 ? `<span class="or">votre part ${pct(partPct)} · ${eur(mien * cours)}</span>` : ''}
      </div>` : `<div class="piedRes">
        <span class="doux">souscrit ${eur(co.capital)}</span>
        ${mien > 0 ? `<span class="or">vous : ${eur(mien * P.prixNominalAction)}</span>` : ''}
      </div>`}
      ${enTravaux}
      ${ouvert === 'RAIL' && co.histoCours.length > 1
        ? graphiqueCours(co.histoCours.map(x => x / Math.max(0.01, co.histoCours[0])), '#8fb0c9') : ''}
    </div>`;


  return entete
    + `<h3>Les sociétés</h3><div class="listeRes">${societes}</div>`
    + `<h3>Le chemin de fer</h3><div class="listeRes">${rails}</div>`
    + `<div class="note">
        Il n'y a qu'<b>une compagnie</b>, et elle pose ses lignes l'une après l'autre. Tant
        qu'elle n'a pas ouvert sa première, elle n'est pas cotée : on y souscrit au franc le
        franc — ${eur(P.prixNominalAction)} l'action — et chaque tranche avance la date
        d'ouverture du chantier en cours. Le jour de la première ligne, le consortium extérieur
        complète le capital, la compagnie <b>entre en bourse</b> et acquiert d'un coup tout
        son goodwill.<br><br>
        Elle vit ensuite d'un péage de ${pct(P.peageRail)} sur le chiffre d'affaires du marché
        qu'elle dessert, au prorata du rail qu'elle a posé, et verse son bénéfice à ses
        porteurs. C'est la valeur de croissance du jeu : son profit monte avec les villes,
        sans que vous ayez rien à faire — mais vous souscrivez en aveugle, des années avant
        de savoir lesquelles auront grandi.
      </div>`;
}

// Le choix des deux gares. Il vit ici plutôt que dans le monde : c'est un
// état d'interface, pas un fait de simulation.
const choixVoie = { a: null, b: null };

function voletRail(monde) {
  const joueur = monde.joueur;
  const villes = monde.villes;
  if (choixVoie.a === null && villes.length) choixVoie.a = 0;
  if (choixVoie.b === null && villes.length > 1) choixVoie.b = 1;

  const options = (sel) => villes.map((v, i) =>
    `<option value="${i}" ${i === sel ? 'selected' : ''}>${v.nom}</option>`).join('');

  const devis = monde.devisVoie(choixVoie.a, choixVoie.b);
  const deja = devis && monde.dejaReliees(choixVoie.a, choixVoie.b);
  const assez = devis && joueur.tresorerie >= devis.cout;

  let resume;
  if (!devis) resume = '<div class="note">Choisissez deux gares différentes.</div>';
  else if (deja) resume = `<div class="note">Ces deux gares partagent déjà un marché —
    une seconde ligne n'y ajouterait rien.</div>`;
  else resume = `
    <div class="grille">
      <div class="fiche"><div class="etiq">Longueur</div>
        <div class="v">${devis.longueur}<span class="faible" style="font-size:11px"> cases</span></div></div>
      <div class="fiche"><div class="etiq">Devis</div>
        <div class="v ${assez ? '' : 'rouge'}">${eur(devis.cout)}</div></div>
      <div class="fiche"><div class="etiq">Durée annoncée</div>
        <div class="v">${devis.mois}<span class="faible" style="font-size:11px"> mois</span></div></div>
    </div>
    <div class="actions"><button id="btnVoie" class="primaire">Ouvrir le chantier</button></div>
    <div class="note">Le devis n'est pas prélevé d'avance : chaque mois le chantier présente
      sa facture et la voie avance <b>au prorata de ce qui est payé</b>. Caisse vide, il se
      suspend là où il en est et repart dès qu'il y a de quoi — rien de posé n'est perdu.</div>`;

  // Les chantiers en cours, et ce qui est déjà ouvert.
  const enCours = monde.liaisons.filter(l => l.societe && !l.achevee);
  const ouvertes = monde.liaisons.filter(l => l.achevee);

  const barre = (l) => {
    const p = Math.max(0, Math.min(1, l.pose / l.longueur));
    const teinte = l.arret ? '#b8663a' : '#5f8f6a';
    return `<div class="miniPiste" style="margin:5px 0 2px">
      <div style="width:${(100 * p).toFixed(0)}%;background:${teinte}"></div></div>
      <span class="faible">${Math.round(l.pose)} / ${l.longueur} cases ·
      ${eur(l.depense)} engagés${l.arret ? ' · <span class="rouge">suspendu, caisse vide</span>' : ''}</span>`;
  };

  const listeChantiers = enCours.length ? enCours.map(l =>
    `<div class="fiche" style="margin-bottom:6px"><div class="etiq">${l.nom}</div>${barre(l)}</div>`
  ).join('') : '<div class="note">Aucun chantier en cours.</div>';

  const listeOuvertes = ouvertes.length
    ? `<table>${ouvertes.map(l => `<tr><td>${l.nom}</td>
        <td class="n"><span class="vert">ouverte</span><br>
        <span class="faible">${l.longueur} cases</span></td></tr>`).join('')}</table>`
    : '<div class="note">Aucune ligne ouverte. Tant que rien ne relie deux gares,'
      + ' chacune vit sur son seul marché.</div>';

  return `
    <h3>Tirer une voie</h3>
    <div class="grille">
      <div class="fiche"><div class="etiq">Départ</div>
        <select id="railA" class="choix">${options(choixVoie.a)}</select></div>
      <div class="fiche"><div class="etiq">Arrivée</div>
        <select id="railB" class="choix">${options(choixVoie.b)}</select></div>
    </div>
    ${resume}
    <h3>Chantiers</h3>
    ${listeChantiers}
    <h3>Lignes ouvertes</h3>
    ${listeOuvertes}`;
}

const MENU_BATIR = [
  ['Logement', ['maison', 'immeuble']],
  ['Exploitation', ['coupe', 'carriere', 'mineCharbon', 'mineFer', 'ferme', 'ranch']],
  ['Transformation', ['scierie', 'briqueterie', 'minoterie', 'abattoir', 'acierie']],
  ['Manufacture', ['manufacture']],
  ['Rapport et négoce', ['bureaux', 'entrepot']],
];

function voletBatir(monde, rendu) {
  const joueur = monde.joueur;
  // Le devis se chiffre dans la ville qu'on regarde : les matériaux n'ont pas
  // le même prix d'un marché à l'autre tant que le rail ne les a pas réunis.
  const v = monde.villeChoisie || rendu.villeAuCentre() || monde.villes[0];
  const m = v.marche;

  const groupes = MENU_BATIR.map(([titre, types]) => {
    const lignes = types.map(t => {
      const def = BAT[t];
      let materiel = 0;
      for (const [r, q] of Object.entries(materiaux(t))) materiel += q * m.prix[r];
      const cher = materiel / coutRef(t);
      const choisi = rendu.pose === t;
      const abordable = joueur.tresorerie >= materiel;
      const vise = rendementVise(t);
      return `<button class="ligneBatir ${choisi ? 'actif' : ''}" data-batir="${t}"
                ${abordable ? '' : 'disabled'}>
        <span class="puce" style="background:${COULEURS[t]}"></span>
        <span class="nomBat">${def.nom}</span>
        <span class="sousBat">${def.w}×${def.h}${
          // Les bureaux n'exigent pas de bras, ils en OFFRENT : dire « requis »
          // là-dessus inverserait le sens du seul bâtiment qui amène du travail.
          def.cat === 'bur' ? ` · ${def.postes} postes offerts`
          : def.cat === 'loge' ? ` · ${def.menages} ménage${def.menages > 1 ? 's' : ''}`
          : ` · ${emploisRequis(t)} ouvrier${emploisRequis(t) > 1 ? 's' : ''}`
        }${vise ? ' · visé ' + Math.round(vise * 100) + ' %' : ''}</span>
        <span class="prixBat ${cher > 1.25 ? 'rouge' : cher < 0.85 ? 'vert' : 'doux'}">${eur(materiel)}</span>
      </button>`;
    }).join('');
    return `<h3>${titre}</h3><div class="listeBatir">${lignes}</div>`;
  }).join('');

  const enCours = rendu.pose
    ? `<div class="avertBatir">Posez la <b>${rendu.pose === 'gare' ? 'gare fondatrice'
          : BAT[rendu.pose].nom}</b> — touchez la carte.
         Les cases possibles sont cerclées d'or.
         <button id="btnAnnulerPose">Annuler</button></div>`
    : `<div class="note">Choisissez un bâtiment, puis touchez la carte à l'endroit voulu.
         Le terrain qui vous manque est acheté dans le même geste — on ne peut prendre
         qu'une terre vierge touchant la frontière urbaine, ou celle d'un indépendant,
         jamais celle d'un rival.</div>`;

  // LA GARE EST EN TÊTE, ET À PART. Elle ne se pose pas dans une ville : elle en
  // fonde une. C'est le seul bâtiment qui s'installe hors de tout territoire, et
  // le seul dont le prix comprend une cargaison.
  const dg = devisGare();
  const gare = `<h3>Fonder</h3>
    <div class="listeBatir">
      <button class="ligneBatir ${rendu.pose === 'gare' ? 'actif' : ''}" data-batir="gare"
              ${joueur.tresorerie >= dg.cout ? '' : 'disabled'}>
        <span class="puce" style="background:#c9a227"></span>
        <span class="nomBat">Gare fondatrice</span>
        <span class="sousBat">${P.logementsGare} logements · ${P.moisDeVivres} mois de vivres</span>
        <span class="prixBat ${joueur.tresorerie >= dg.cout ? 'doux' : 'rouge'}">${eur(dg.cout)}</span>
      </button>
    </div>
    <div class="note">Une gare s'installe <b>hors de tout territoire</b> et fonde une localité.
      Elle n'apporte <b>pas d'habitants</b> — elle apporte de quoi en attirer :
      ${P.logementsGare} maisons vides, ${P.exploitationsFournies} exploitations pour donner du
      travail, et ${P.moisDeVivres} mois de vivres et de produits pour que les premiers venus y
      vivent au plein. La population arrive ensuite d'elle-même, tant que les trois baromètres
      tiennent. Passé ce délai, ou le hameau se nourrit seul, ou une voie le relie, ou il
      s'éteint.</div>`;

  return `<div class="grille">
      <div class="fiche"><div class="etiq">Trésorerie</div>
        <div class="v or">${eur(joueur.tresorerie)}</div></div>
      <div class="fiche"><div class="etiq">Devis établi à</div>
        <div class="v" style="font-size:12px">${v.nom}</div></div>
    </div>
    ${enCours}${gare}${groupes}
    <div class="note">Le prix affiché est celui des <b>matériaux au marché du jour</b> ;
      le foncier s'y ajoute selon l'endroit et vous est annoncé avant de valider. Le cash
      part immédiatement, le chantier ne sort de terre qu'à la dernière brique livrée.</div>`;
}

// --- Les événements ---------------------------------------------------------
//
// Un événement qu'on subit sans comprendre ce qu'il fait n'apprend rien. Chaque
// fiche dit donc trois choses : ce qui arrive, combien de temps cela dure, et
// par quel canal exactement cela touche l'économie du joueur.

const CANAL = {
  sol: 'Le rendement des terres — fermes, ranchs, coupes, carrières et mines '
     + 'sortent moins (ou plus) que leur ordinaire, sans que rien d\'autre ne change. '
     + 'Le prix suit, puisqu\'il suit les flux.',
  travail: 'Le régime des ateliers touchés, ramené à ' + pct(P.regimeDeGreve) + ' de la normale. '
     + 'Les ouvriers ne sont pas partis : ils sont là et ne produisent pas. La grève cesse '
     + 'd\'elle-même dès que le salaire de la ville atteint ce qu\'elle réclame.',
  finance: 'La destination de l\'épargne des ménages : ce qui achète des titres, '
     + 'ce qui bâtit, ce qui dort en banque.',
  population: 'Le nombre d\'habitants, une fois pour toutes — un afflux ne remplit '
     + 'que les logements déjà debout, et une épidémie ne rend pas ce qu\'elle a pris.',
};

function ficheEvenement(monde, e) {
  const reste = Math.max(0, e.fin - monde.mois);
  const total = Math.max(1, e.fin - e.debut);
  const avance = Math.max(0, Math.min(1, (monde.mois - e.debut) / total));
  return `
    <div class="carteEvt ${e.def.teinte}">
      <div class="tete">
        <b><span class="signe">${e.def.signe}</span> ${e.def.nom}</b>
        <span class="doux">${reste} mois</span>
