        const u = (dx * ca + dy * sa), w = (-dx * sa + dy * ca) / aplatissement;
        const d = Math.hypot(u, w) / rayon;
        if (d > 0.55 + fLisiere(x, y) * 0.62) continue;

        c.ville = v;
        c.distanceGare = Math.round(Math.hypot(dx, dy));
        // Le quartier le plus proche donne sa vocation à la case.
        let meilleur = germes[0], best = Infinity;
        for (const g of germes) {
          const dd = Math.hypot(g.x - x, g.y - y);
          if (dd < best) { best = dd; meilleur = g; }
        }
        c.quartier = meilleur.vocation;
        v.cases.push(c);
      }
    }


    cases[site.y * L + site.x].voie = true;

    // 30 % des cases exploitables appartiennent d'emblée à des indépendants.
    for (const c of v.cases) {
      if (!c.voie && rnd() < P.partIndependants) c.proprio = 'ind';
      if (c.distanceGare <= 4 && !c.voie) c.vendue = true;
    }

    return v;
  });

  // --- 4 bis. Le sol prend la vocation de sa ville --------------------------
  //
  // Le plafond s'applique par APPARTENANCE, et non par distance. Essayé d'abord
  // en pondérant les cinq villes par l'inverse de la distance, puis par une
  // gaussienne : dans les deux cas la voisine pesait encore assez en lisière
  // pour remonter les plafonds bas, et une ville sur dix seulement respectait sa
  // vocation. Le territoire est déjà découpé à ce stade — autant s'en servir.
  //
  // Il ne reste à mélanger que la terre vierge, celle de l'entre-deux que les
  // villes atteindront en grandissant : elle vaut la moyenne de ses voisines,
  // pondérée par la distance, ce qui donne le dégradé entre deux zones.
  const s2 = P.porteeVocation * P.porteeVocation;
  const parId = new Map(villes.map((v, i) => [v.id, vocations[i]]));

  for (const c of cases) {
    const sienne = c.ville ? parId.get(c.ville.id) : null;

    let plafonds = sienne;
    if (!plafonds) {
      let dmin2 = Infinity;
      const d2 = sites.map(s => {
        const v = (s.x - c.x) * (s.x - c.x) + (s.y - c.y) * (s.y - c.y);
        if (v < dmin2) dmin2 = v;
        return v;
      });
      // On retranche le carré de la plus courte distance avant d'exponentier :
      // le résultat est le même après normalisation, mais la plus proche vaut 1
      // au lieu d'un nombre minuscule, et rien ne s'annule au loin.
      let somme = 0;
      const poids = d2.map(v => { const p = Math.exp(-(v - dmin2) / s2); somme += p; return p; });
      plafonds = {};
      for (const nom of QUALITES) {
        let t = 0;
        for (let i = 0; i < vocations.length; i++) t += poids[i] * vocations[i][nom];
        plafonds[nom] = somme > 0 ? t / somme : P.vocationRiche;
      }
    }

    const q = {};
    for (const nom of QUALITES) {
      // On ÉTIRE la valeur brute sous son plafond au lieu de la couper : une case
      // stérile le reste, une case excellente atteint tout juste le plafond, et
      // le relief continue de se lire à l'intérieur de la zone. L'étirement part
      // de zéro : une carte pauvre en charbon n'a pas des mines médiocres, elle
      // n'a pas de charbon.
      const v = c.qBrut[nom] * plafonds[nom] / P.vocationRiche;
      // Le filon est toujours hors les murs : sur un territoire de ville, on
      // plafonne à 2. La qualité 3 n'existe que sur la terre libre, et c'est ce
      // qui oblige à fonder une gare pour l'atteindre.
      // Le plafond tient à deux choses : appartenir à un territoire, et être
      // trop près d'une ville fondatrice. La seconde est ce qui oblige à
      // s'éloigner vraiment — sans elle, un filon de lisière se cueille en
      // posant une gare juste derrière la frontière, sans rien risquer.
      let haut = c.ville ? P.plafondEnVille : P.qualiteSommet;
      if (haut > P.plafondEnVille) {
        for (const s of sites) {
          if (Math.hypot(s.x - c.x, s.y - c.y) < P.distanceMinFilon) {
            haut = P.plafondEnVille; break;
          }
        }
      }
      q[nom] = Math.max(0, Math.min(haut, Math.round(v)));
    }
    c.q = q;
    // On garde la valeur brute : le plancher ci-dessous s'en sert pour choisir
    // les cases à promouvoir.
  }

  // --- 4 ter. Le plancher : chaque ville produit tout, fût-ce à perte --------
  //
  // Une ville dont la vocation ne retient ni charbon ni minerai n'en a pas une
  // case, et rien ne s'y ouvre avant que le rail n'arrive — vingt ans plus tard.
  // Elle passe la moitié de la partie à ne pas exister. On lui garantit donc un
  // nombre plancher de cases de qualité 1 sur CHACUNE des cinq ressources : de
  // quoi produire, au rendement nul, ce que son sol ne lui donne pas.
  //
  // Ce n'est pas une faveur, c'est ce qui rend le rail désirable au lieu d'être
  // vital : la ville survit sans lui, elle ne prospère qu'avec.
  for (const v of villes) {
    for (const nom of QUALITES) {
      const manquantes = v.cases.filter(c => c.q[nom] < 1);
      const deja = v.cases.length - manquantes.length;
      const aPromouvoir = P.minCasesParRessource - deja;
      if (aPromouvoir <= 0) continue;
      // Les meilleures d'abord — celles que le relief désignait déjà, pour que
      // le filon promu reste au bon endroit plutôt que d'être saupoudré.
      manquantes.sort((a, b) => b.qBrut[nom] - a.qBrut[nom]);
      for (let i = 0; i < aPromouvoir && i < manquantes.length; i++) {
        manquantes[i].q[nom] = 1;
      }
    }
  }
  for (const c of cases) c.qBrut = null;

  // --- 5. Le réseau ferroviaire -------------------------------------------
  // On relie les villes en arbre couvrant minimal, plus une boucle si la carte
  // s'y prête. Deux villes reliées par une chaîne d'autres villes sont reliées :
  // A–B et B–C valent A–C, sans troisième ligne à construire.
  const liaisons = construireReseau(villes, rnd);
  // L'emprise de chaque liaison est conservée : réservée dès la première
  // seconde, inconstructible, et dessinée en train de se poser.
  for (const l of liaisons) {
    l.emprise = tracerVoie(cases, L, H, villes[l.a].gare, villes[l.b].gare);
  }

  return { L, H, cases, villes, liaisons, graine };
}

// Arbre couvrant minimal sur les distances, puis une arête supplémentaire prise
// parmi les plus courtes restantes : le réseau n'est ni une simple ligne ni un
// graphe complet.
function construireReseau(villes, rnd) {
  const aretes = [];
  for (let a = 0; a < villes.length; a++) for (let b = a + 1; b < villes.length; b++) {
    aretes.push({ a, b, d: Math.hypot(villes[a].gare.x - villes[b].gare.x,
                                      villes[a].gare.y - villes[b].gare.y) });
  }
  aretes.sort((p, q) => p.d - q.d);

  const parent = villes.map((_, i) => i);
  const find = (i) => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const retenues = [], rejetees = [];
  for (const e of aretes) {
    if (find(e.a) !== find(e.b)) { parent[find(e.a)] = find(e.b); retenues.push(e); }
    else rejetees.push(e);
  }
  if (rejetees.length && villes.length >= 4) retenues.push(rejetees[0]);

  return retenues.map((e) => {
    // La date d'achèvement est proportionnelle à la longueur : une ligne longue
    // demande plus de travail, et le joueur le voit dès la première seconde.
    const mois = Math.round(8 + e.d * P.moisParCaseDeVoie + rnd() * 6);
    // Une liaison n'est plus une société : il n'y a qu'UNE compagnie de chemin
    // de fer, et elle pose ses lignes l'une après l'autre. La liaison ne porte
    // donc plus que sa géométrie et son calendrier. `date` reste nulle tant que
    // le chantier n'a pas commencé — on ne date pas des travaux qui n'ont pas
    // d'ouvriers.
    return {
      a: e.a, b: e.b, longueur: Math.round(e.d),
      nom: `${villes[e.a].nom} — ${villes[e.b].nom}`,
      dateInitiale: mois, date: null, debut: null, achevee: false,
    };
  });
}

// Trace l'emprise de la voie, en escalier doux entre deux gares. Elle est
// réservée et visible dès la première seconde : le joueur sait où la ligne
// aboutira, et peut acheter autour.
// L'emprise est renvoyée DANS L'ORDRE, de la gare de départ à celle d'arrivée :
// c'est ce qui permet de la dessiner en train de se construire, gare après gare,
// au lieu d'un simple trait entre deux points.
function tracerVoie(cases, L, H, d, f) {
  const emprise = [];
  let x = d.x, y = d.y;
  const poser = () => {
    const c = cases[Math.max(0, Math.min(H - 1, y)) * L + Math.max(0, Math.min(L - 1, x))];
    c.voie = true;
    emprise.push(c);
  };
  poser();
  let garde = 0;
  while ((x !== f.x || y !== f.y) && garde++ < 4000) {
    const dx = Math.sign(f.x - x), dy = Math.sign(f.y - y);
    // On avance en diagonale douce : deux pas horizontaux pour un pas vertical
    // quand l'écart horizontal domine, et l'inverse sinon.
    if (Math.abs(f.x - x) > Math.abs(f.y - y)) x += dx;
    else y += dy;
    poser();
  }
  return emprise;
}

// Attribue à chaque ville sa seconde ressource riche, de sorte qu'aucune
// ressource n'en reçoive deux tant qu'une autre n'en a pas reçu une.
//
// C'est un couplage : chaque ville ne peut prendre que l'une des deux ressources
// qui ne sont ni sa prédominance ni ses raretés. On explore en profondeur, dans
// un ordre tiré au sort pour que deux cartes ne se ressemblent pas, et on se
// rabat sur un choix libre si aucun couplage complet n'existe — ce qui arrive
// dès que la partie compte moins de cinq villes.
function repartirSeconds(profils, rnd) {
  const choix = profils.map(p =>
    melanger(QUALITES.filter(q => q !== p.pred && !p.rares.includes(q)), rnd));

  const pris = new Set();
  const sortie = new Array(profils.length).fill(null);

  const poser = (i) => {
    if (i >= profils.length) return true;
    for (const q of choix[i]) {
      if (pris.has(q)) continue;
      pris.add(q); sortie[i] = q;
      if (poser(i + 1)) return true;
      pris.delete(q); sortie[i] = null;
    }
    return false;
  };

  if (poser(0)) return sortie;
  // Pas de couplage complet : chacun prend son premier choix disponible.
  return choix.map(c => c[0] || null);
}

function melanger(a, rnd) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Règle de contiguïté : on ne peut acheter une terre vierge que si elle touche
// une terre déjà vendue ou bâtie. La ville s'étend en anneaux depuis sa gare, et
// il existe à chaque instant une frontière étroite et disputée.
function estAchetable(monde, c) {
  if (!c || c.voie || c.vendue || !c.ville) return false;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const v = monde.caseAt(c.x + dx, c.y + dy);
    if (v && (v.vendue || v.voie)) return true;
  }
  return false;
}

// ===== js/sim/evenements.js ==========================================

// ---------------------------------------------------------------------------
// Les événements.
//
// Une économie qui ne connaît que sa propre mécanique finit par être prévisible :
// on trouve la bonne trajectoire, on la répète, et il n'y a plus rien à décider.
// Les événements sont ce qui casse la trajectoire — une sécheresse qui affame,
// une vague d'immigration qui remplit les logements qu'on avait bâtis en avance,
// un krach qui assèche la bourse au moment où l'on comptait dessus.
//
// PRINCIPE : un événement ne mute jamais l'état de façon irréversible. Il
// s'inscrit dans une liste, et la simulation LIT ses modificateurs là où ils
// s'appliquent. Quand il expire, il disparaît de la liste et tout revient de
// soi-même. Les seules exceptions sont les mouvements de population — une
// épidémie qui a emporté des gens ne les rend pas.
// ---------------------------------------------------------------------------


// Le catalogue. `poids` est la fréquence relative : la somme n'a pas à faire 1.
const EVENEMENTS = {
  secheresse: {
    nom: 'Sécheresse', signe: '☀', teinte: 'rouge',
    poids: 14, duree: [10, 30], portee: 'sol',
    texte: (e) => `${e.ville ? e.ville.nom + ' souffre de la sécheresse' : 'La sécheresse frappe toute la carte'}`
      + ` — les terres ne rendent que ${Math.round(e.ampleur * 100)} % de leur ordinaire`,
  },
  recolte: {
    nom: 'Récolte exceptionnelle', signe: '✿', teinte: 'vert',
    poids: 10, duree: [6, 14], portee: 'sol',
    texte: (e) => `${e.ville ? 'Récolte exceptionnelle à ' + e.ville.nom : 'Récolte exceptionnelle partout'}`
      + ` — les terres rendent ${Math.round(e.ampleur * 100)} % de leur ordinaire`,
  },
  immigration: {
    nom: 'Vague d\'immigration', signe: '⇥', teinte: 'vert',
    poids: 11, duree: [1, 1], portee: 'population',
    texte: (e) => `Une vague d'immigration afflue`
      + `${e.ville ? ' vers ' + e.ville.nom : ' sur toute la carte'}`
      + ` — les logements vacants se remplissent`,
  },
  grippe: {
    nom: 'Grippe espagnole', signe: '†', teinte: 'rouge',
    poids: 7, duree: [1, 1], portee: 'population',
    texte: (e) => `La grippe emporte ${Math.round((1 - e.ampleur) * 100)} % des habitants`
      + `${e.ville ? ' de ' + e.ville.nom : ' de chaque ville'}`,
  },
  greve: {
    nom: 'Grève', signe: '✊', teinte: 'rouge',
    poids: 13, duree: [4, 16], portee: 'travail',
    texte: (e) => `Grève ${e.secteur ? NOMS_SECTEUR[e.secteur] : 'générale'} à ${e.ville.nom}`
      + ` — les ateliers tournent au ralenti tant que le salaire n'aura pas atteint`
      + ` ${e.exige.toFixed(2)} $`,
  },
  krach: {
    nom: 'Krach boursier', signe: '↯', teinte: 'rouge',
    poids: 9, duree: [8, 20], portee: 'finance',
    texte: () => `Krach boursier — l'épargne des ménages déserte le marché,`
      + ` les capitaux se replient sur la brique`,
  },
  crise: {
    nom: 'Crise économique', signe: '▽', teinte: 'rouge',
    poids: 9, duree: [10, 26], portee: 'finance',
    texte: () => `Crise économique — l'épargne reste en banque : elle ne bâtit plus`
      + ` et n'achète plus de titres`,
  },
  boom: {
    nom: 'Boom économique', signe: '△', teinte: 'vert',
    poids: 10, duree: [10, 24], portee: 'finance',
    texte: (e) => `Boom économique — des capitaux venus du dehors gonflent l'épargne`
      + ` de ${Math.round((e.ampleur - 1) * 100)} %`,
  },
};

const NOMS_SECTEUR = {
  expl: 'des exploitations', trans: 'des ateliers',
  manu: 'des manufactures', bur: 'des bureaux',
};

const SECTEURS = ['expl', 'trans', 'manu'];

// ---------------------------------------------------------------------------

function entre(rng, [a, b]) { return a + Math.floor(rng() * (b - a + 1)); }

function tirerType(rng) {
  const noms = Object.keys(EVENEMENTS);
  const total = noms.reduce((s, n) => s + EVENEMENTS[n].poids, 0);
  let r = rng() * total;
  for (const n of noms) { r -= EVENEMENTS[n].poids; if (r <= 0) return n; }
  return noms[0];
}

// Fabrique un événement du type demandé. `monde` sert à choisir une ville et à
// lire l'état courant — un salaire exigé n'a de sens que rapporté au salaire du
// jour.
function creerEvenement(monde, type, rng = Math.random) {
  const def = EVENEMENTS[type];
  const e = {
    type, def, debut: monde.mois,
    fin: monde.mois + entre(rng, def.duree),
    ville: null, secteur: null, ampleur: 1,
  };

  // Local ou général ? Une sécheresse générale est rare et brutale ; une
  // sécheresse locale est la règle, et c'est elle qui rend le rail précieux —
  // on achète le pain de la ville d'à côté.
  //
  // La finance, elle, n'est jamais locale : il n'y a qu'une bourse et qu'une
  // épargne, et un krach qui ne frapperait qu'une ville n'aurait nulle part où
  // s'appliquer. Une grève, à l'inverse, est toujours celle d'une ville — on ne
  // fait pas grève « en général » contre un salaire qui se fixe ville par ville.
  const local = def.portee !== 'finance'
    && (type === 'greve' || rng() < P.partEvenementsLocaux);
  if (local) e.ville = monde.villes[Math.floor(rng() * monde.villes.length)];

  switch (type) {
    case 'secheresse':
      e.ampleur = P.secheresseMin + rng() * (P.secheresseMax - P.secheresseMin);
      break;
    case 'recolte':
      e.ampleur = P.recolteMin + rng() * (P.recolteMax - P.recolteMin);
      break;
    case 'immigration':
      e.ampleur = 1 + P.immigrationMin + rng() * (P.immigrationMax - P.immigrationMin);
      break;
    case 'grippe':
      e.ampleur = 1 - (P.grippeMin + rng() * (P.grippeMax - P.grippeMin));
      break;
    case 'greve':
      // Une grève générale une fois sur trois ; sinon un secteur seulement.
      e.secteur = rng() < 0.34 ? null : SECTEURS[Math.floor(rng() * SECTEURS.length)];
      e.exige = e.ville.salaire * (1 + P.hausseExigee);
      break;
    case 'boom':
      e.ampleur = 1 + P.boomMin + rng() * (P.boomMax - P.boomMin);
      break;
  }
  return e;
}

// ---------------------------------------------------------------------------
// Le moteur, appelé une fois par mois.
// ---------------------------------------------------------------------------

function tirerEvenements(monde, rng = Math.random) {
  // Les événements à effet immédiat sont appliqués puis retirés ; les autres
  // vivent jusqu'à leur date de fin, ou jusqu'à ce que leur condition de sortie
  // soit remplie — c'est le cas de la grève, qui s'arrête quand elle a obtenu
  // ce qu'elle demandait.
  monde.evenements = monde.evenements.filter(e => {
    if (e.type === 'greve' && e.ville.salaire >= e.exige) {
      monde.journal.push(`${monde.mois} · ✊ La grève de ${e.ville.nom} prend fin`
        + ` — le salaire a atteint ${e.ville.salaire.toFixed(2)} $`);
      return false;
    }
    if (monde.mois >= e.fin) {
      monde.journal.push(`${monde.mois} · ${e.def.signe} ${e.def.nom} : c'est fini`);
      return false;
    }
    return true;
  });

  // On ne surcharge pas : deux événements simultanés au plus, et jamais deux du
  // même type. Une partie qui empile les catastrophes ne se joue plus, elle se
  // subit.
  if (monde.mois < P.graceEvenements) return;
  if (monde.evenements.length >= P.evenementsSimultanes) return;
  if (rng() > 1 / P.moisEntreEvenements) return;

  const type = tirerType(rng);
  if (monde.evenements.some(e => e.type === type)) return;

  const e = creerEvenement(monde, type, rng);
  monde.journal.push(`${monde.mois} · ${e.def.signe} ${e.def.texte(e)}`);

  // Les événements de population frappent une fois et disparaissent.
  if (e.def.portee === 'population') {
    appliquerPopulation(monde, e);
    return;
  }
  monde.evenements.push(e);
}

function appliquerPopulation(monde, e) {
  const cibles = e.ville ? [e.ville] : monde.villes;
  for (const v of cibles) {
    const avant = v.menages;
    // Une vague d'immigration ne crée pas de logements : elle remplit ceux qui
    // sont vides. Qui a bâti en avance encaisse la vague, qui a bâti juste ce
    // qu'il fallait la regarde passer.
    v.menages = Math.max(4, Math.min(v.capaciteLogement || Infinity, v.menages * e.ampleur));
    v.occupation = v.capaciteLogement > 0
      ? Math.max(0, Math.min(1, v.menages / v.capaciteLogement)) : 0;
    const delta = Math.round(v.menages - avant);
    if (delta !== 0) {
      monde.journal.push(`${monde.mois} ·    ${v.nom} : ${delta > 0 ? '+' : ''}${delta} ménages`);
    }
  }
}

// ---------------------------------------------------------------------------
// Les modificateurs. C'est par ici que la simulation lit les événements.
// ---------------------------------------------------------------------------

// Ce que rend la terre, rapporté à son ordinaire. Sécheresse et récolte se
// multiplient : une récolte exceptionnelle pendant une sécheresse générale, ce
// sont deux nouvelles qui se compensent en partie, et c'est très bien ainsi.
function facteurSol(monde, ville) {
  let f = 1;
  for (const e of monde.evenements) {
    if (e.def.portee !== 'sol') continue;
    if (e.ville && e.ville !== ville) continue;
    f *= e.ampleur;
  }
  return f;
}

// Le régime auquel tourne un atelier. Une grève ne renvoie pas les ouvriers chez
// eux : ils sont là, ils ne travaillent pas.
function facteurGreve(monde, ville, categorie) {
  for (const e of monde.evenements) {
    if (e.type !== 'greve' || e.ville !== ville) continue;
    if (e.secteur && e.secteur !== categorie) continue;
    return P.regimeDeGreve;
  }
  return 1;
}

// Ce que devient l'épargne des ménages : ce qui bâtit, ce qui achète des titres.
// En crise, elle ne fait ni l'un ni l'autre — elle dort.
function orientationEpargne(monde) {
  let versBourse = P.partEnBourse, versVille = 1 - P.partEnBourse, apport = 1;
  for (const e of monde.evenements) {
    if (e.type === 'krach') { versVille += versBourse; versBourse = 0; }
    if (e.type === 'crise') { versBourse = 0; versVille = 0; }
    if (e.type === 'boom') apport *= e.ampleur;
  }
  return { versBourse, versVille, apport };
}

// La grève tire le salaire vers le haut : c'est sa raison d'être.
function salaireExige(monde, ville) {
  let s = 0;
  for (const e of monde.evenements) {
    if (e.type === 'greve' && e.ville === ville) s = Math.max(s, e.exige);
  }
  return s;
}

// ===== js/sim/market.js ==============================================

// ---------------------------------------------------------------------------
// Le marché : formation des prix, rationnement.
//
// Règle centrale (§20) : le prix suit les FLUX.
//   tension = besoins effectifs du mois ÷ production mise en vente
// Acheter pour stocker n'est toujours pas un besoin et n'entre pas dans le
// calcul. Mais les besoins effectifs comprennent le rattrapage du matelas de
// sécurité (§4.2 bis) : le marché veut tenir un mois de consommation en cave,
// et l'écart à ce mois-là, étalé sur six, s'ajoute ou se retranche.
//
// Sans ce terme, un tas une fois constitué devenait INVISIBLE : les flux se
// rééquilibraient autour de lui, la tension revenait à 1, et plus rien ne le
// mangeait ni ne le faisait grossir.
// ---------------------------------------------------------------------------


class Marche {
  constructor(villes) {
    this.villes = villes;               // les villes qui partagent ce marché
    this.stock = {};
    this.prix = {};
    this.besoins = {};                  // demande réelle du mois en cours
    this.entrees = {};                  // production mise en vente ce mois
    this.restants = {};                 // ce qui n'a pas encore été présenté au guichet
    this.service = {};                  // fraction du besoin réellement servie
    this.prixRevient = {};              // plancher local : le coût du meilleur
    for (const r of RESSOURCES) {
      this.stock[r] = 0;
      this.prix[r] = RES[r].prix;
      this.besoins[r] = 0;
      this.entrees[r] = 0;
      this.restants[r] = 0;
      this.service[r] = 1;
      this.prixRevient[r] = Infinity;
    }
    // Le péage ferroviaire : nul sur un marché d'une seule ville, puisque
    // aucune ligne ne le dessert. Il est prélevé sur les producteurs au moment
    // de la vente et reversé aux compagnies — rien n'est créé.
    this.peage = 0;
    this.peageCollecte = 0;
    // L'historique des cours : sans lui, le joueur ne voit qu'un instantané et
    // ne peut pas distinguer une pénurie qui s'installe d'un accident d'un mois.
    this.histoPrix = {};
    for (const r of RESSOURCES) this.histoPrix[r] = [];

    // LE GRAND LIVRE PAR VILLE.
    //
    // Un marché fusionné n'est pas un entrepôt unique où tout le monde puise au
    // même prorata. Ce qu'une ville produit alimente d'abord SES propres
    // besoins ; seul le surplus part chez la voisine. Sans cette règle, une
    // ville qui produit tout le blé se retrouvait rationnée à 60 % comme celle
    // qui n'en produit pas un grain — le rail ne reliait pas deux économies, il
    // les fondait en une seule bouillie.
    //
    // Le PRIX, lui, reste celui du marché entier : un marché relié a un cours,
    // c'est ce qui le définit. La priorité locale décide de qui obtient la
    // marchandise, jamais de ce qu'elle coûte.
    this.parVille = new Map();
    for (const v of villes) this.parVille.set(v, this.livreNeuf());
    this.serviceCommun = {};
    for (const r of RESSOURCES) this.serviceCommun[r] = 1;
  }

  livreNeuf() {
    const l = { stock: {}, besoins: {}, restants: {}, entrees: {}, serviceLocal: {}, debit: {} };
    for (const r of RESSOURCES) {
      l.stock[r] = 0; l.besoins[r] = 0; l.restants[r] = 0;
      l.entrees[r] = 0; l.serviceLocal[r] = 1; l.debit[r] = 0;
    }
    return l;
  }

  // Le livre d'une ville. Une ville absente — cas des appels sans contexte —
  // retombe sur un livre commun, ce qui rend la priorité locale inopérante pour
  // elle plutôt que de lever une exception.
  livre(ville) {
    if (!ville) {
      if (!this._orphelin) this._orphelin = this.livreNeuf();
      return this._orphelin;
    }
    let l = this.parVille.get(ville);
    if (!l) { l = this.livreNeuf(); this.parVille.set(ville, l); }
    return l;
  }

  // Le stock total, recomposé depuis les livres : c'est lui qu'on affiche.
  recomposerStock() {
    for (const r of RESSOURCES) {
      let t = 0;
      for (const l of this.parVille.values()) t += l.stock[r];
      if (this._orphelin) t += this._orphelin.stock[r];
      this.stock[r] = t;
    }
  }

  get nom() { return this.villes.map(v => v.nom).join(' + '); }

  // --- Phase 1 : on déclare ------------------------------------------------

  demander(res, qte, ville) {
    this.besoins[res] += qte;
    this.livre(ville).besoins[res] += qte;
  }

  offrir(res, qte, ville) {
    this.entrees[res] += qte;
    this.stock[res] += qte;
    const l = this.livre(ville);
    l.entrees[res] += qte;
    l.stock[res] += qte;         // la marchandise appartient à la ville qui l'a sortie
  }

  // Le plancher, c'est le coût du MEILLEUR producteur — pas du pire.
  //
  // L'inverse a été essayé et c'était une catastrophe silencieuse : sur un
  // marché continental, la mine la plus misérable du continent tirait vers le
  // haut le prix du charbon partout. Ce prix devenait une rente pour toutes les
  // bonnes mines, qui atteignaient 90 % de rendement ; il ne descendait jamais,
  // donc la mine misérable survivait à l'équilibre exact et une mine de plus
  // s'ouvrait chaque mois — 890 mines de charbon en vingt ans. Et en aval,
  // l'aciérie payait cette rente sans pouvoir la répercuter.
  //
  // Le plancher juste est celui sous lequel même le producteur le plus efficace
  // vendrait à perte : là, l'offre s'effondrerait pour de bon. Au-dessus, c'est
  // à la tension de décider — et aux exploitations mal placées de s'arrêter,
  // ce que le seuil de marge négative fait déjà.
  declarerRevient(res, coutUnitaire) {
    this.prixRevient[res] = Math.min(this.prixRevient[res], coutUnitaire);
  }

  // --- Phase 2 : on fixe les prix ------------------------------------------

  // Le matelas que le marché cherche à tenir sur une ressource : un mois de la
  // consommation qu'il vient de constater.
  matelasVise(res) { return P.matelasMois * this.besoins[res]; }

  fixerPrix() {
    for (const r of RESSOURCES) {
      const ref = RES[r].prix;

      // Le besoin qui fait le prix n'est plus la seule consommation du mois :
      // c'est elle plus ce qu'il faut acheter pour ramener la cave au matelas.
      // À la cave pleine ce terme est négatif et fait tomber le prix — c'est
      // par là qu'un tas cesse d'être invisible.
      //
      // Il est BORNÉ à une fraction de la consommation, et cette borne n'est pas
      // un garde-fou de confort : sans elle, une ville neuve se fait tuer par
      // son propre amorçage. Elle démarre avec 3 000 planches et des besoins
      // minuscules — des dizaines de mois de couverture — si bien que le terme
      // de rattrapage annulait ses besoins effectifs, écrasait le prix des
      // planches, et personne n'y bâtissait de scierie. L'amorçage épuisé, la
      // ville n'avait aucune industrie du bois et s'éteignait. Sur la graine 7,
      // deux villes sur cinq y sont mortes avant le mois 60.
      //
      // Le matelas MODULE le signal de prix, il ne le remplace pas. Et la borne
      // doit être serrée : à ±0,50 il restait deux villes mortes sur quarante,
      // à ±0,80 une. Un quart de la consommation est déjà assez de latitude
      // pour effacer une ville jeune du marché.
      const brut = (this.matelasVise(r) - this.stock[r]) / P.moisDeRestockage;
      const borne = P.correctionMatelas * this.besoins[r];
      const ecart = Math.max(-borne, Math.min(borne, brut));
      const besoinsEff = Math.max(0, this.besoins[r] + ecart);

      let tension;
      if (this.entrees[r] <= 0.0001) {
        tension = besoinsEff > 0 ? P.tensionMax : 1;
      } else {
        tension = besoinsEff / this.entrees[r];
      }
      tension = Math.max(P.tensionMin, Math.min(P.tensionMax, tension));

      const cible = ref * Math.pow(tension, P.exposantPrix);
      // Le lissage est ce qui fait que les stocks « absorbent le coup » pendant
      // quelques mois avant que le prix ne s'envole.
      this.prix[r] += P.lissagePrix * (cible - this.prix[r]);

      // Le plancher au prix de revient du producteur le plus efficace reste
      // intact. Le retirer sur un marché engorgé a été essayé — c'est ce qui
      // achève le plus vite un troupeau invendable — mais il ne protège pas
      // que l'éleveur : il tient toute la filière lourde. Sans lui, le
      // baromètre des produits tombait de 97 % à 57 %. Ce n'est pas le prix à
      // payer pour vider une cave.
      const revient = Number.isFinite(this.prixRevient[r]) ? this.prixRevient[r] : 0;
      const bas = Math.max(ref * P.prixPlancher, revient);
      this.prix[r] = Math.max(bas, Math.min(ref * P.prixPlafond, this.prix[r]));
      this.prixRevient[r] = Infinity;

      const h = this.histoPrix[r];
      h.push(this.prix[r] / ref);
      if (h.length > P.histoireDesCours) h.shift();
    }
  }

  // --- Phase 3 : on sert ----------------------------------------------------
  // Quand les entrées plus le stock ne couvrent pas les besoins, chacun est
  // servi au prorata : usines, chantiers et entretien reçoivent la même
  // fraction de ce qu'ils demandent.
  //
  // Le service se recalcule avant chaque vague de la filière, sur le stock du
  // moment et sur ce qui n'a pas encore été présenté au guichet. Sans quoi les
  // ateliers du premier étage seraient servis sur un stock qui ne contient pas
  // encore la production du mois.

  ouvrirGuichet() {
    for (const r of RESSOURCES) this.restants[r] = this.besoins[r];
    for (const l of this.parVille.values()) {
      for (const r of RESSOURCES) l.restants[r] = l.besoins[r];
    }
    if (this._orphelin) for (const r of RESSOURCES) {
      this._orphelin.restants[r] = this._orphelin.besoins[r];
    }
  }

  // Deux taux au lieu d'un.
  //
  //   serviceLocal   ce qu'une ville tire de sa PROPRE production
  //   serviceCommun  ce que les villes en manque tirent du surplus des autres
  //
  // La ville qui produit assez est servie à 100 % quoi qu'il arrive ailleurs.
  // Celles qui manquent se partagent au prorata ce que les excédentaires n'ont
  // pas consommé.
  calculerService() {
    const livres = [...this.parVille.values()];
    if (this._orphelin) livres.push(this._orphelin);

    for (const r of RESSOURCES) {
      let surplus = 0, deficit = 0;
      for (const l of livres) {
        const besoin = l.restants[r], stock = l.stock[r];
        l.serviceLocal[r] = besoin <= 0.001 ? 1 : Math.max(0, Math.min(1, stock / besoin));
        surplus += Math.max(0, stock - besoin);
        deficit += Math.max(0, besoin - stock);
      }
      this.serviceCommun[r] = deficit <= 0.001 ? 1 : Math.max(0, Math.min(1, surplus / deficit));
      // Le taux du marché entier reste calculé : c'est lui qu'on affiche, et
      // c'est lui qui décrit la tension globale.
      this.service[r] = this.restants[r] <= 0.001 ? 1
        : Math.max(0, Math.min(1, this.stock[r] / this.restants[r]));
    }
  }

  // Retire du stock au prorata du service. Renvoie la quantité réellement
  // obtenue. C'est le seul point de sortie régulier du marché.
  prendre(res, qte, ville) {
    const l = this.livre(ville);

    // 1. Sa propre production, servie en priorité.
    const local = Math.min(qte * l.serviceLocal[res], l.stock[res]);
    l.stock[res] -= local;
    let servi = local;

    // 2. Ce qui manque va chercher le surplus des villes reliées, au prorata.
    const manque = qte - local;
    if (manque > 0.0001 && this.serviceCommun[res] > 0) {
      servi += this.puiserAilleurs(res, manque * this.serviceCommun[res], l);
    }

    l.restants[res] = Math.max(0, l.restants[res] - qte);
    this.restants[res] = Math.max(0, this.restants[res] - qte);
    // Le total suit la sortie réelle : `servi` est exactement ce qui a quitté
    // les livres, local et puisé confondus. Recomposer la somme à chaque prise
    // coûtait le double du temps de simulation pour le même résultat.
    this.stock[res] -= servi;
    return servi;
  }

  // Puise dans l'excédent des AUTRES villes, au prorata de ce que chacune a de
  // trop. Une ville ne cède jamais ce dont elle a encore besoin : c'est toute la
  // règle, et elle tient en cette soustraction.
  puiserAilleurs(res, veut, sauf) {
    const autres = [];
    let dispo = 0;
    for (const l of this.parVille.values()) {
      if (l === sauf) continue;
      const s = Math.max(0, l.stock[res] - l.restants[res]);
      if (s > 0) { autres.push([l, s]); dispo += s; }
    }
    if (this._orphelin && this._orphelin !== sauf) {
      const s = Math.max(0, this._orphelin.stock[res] - this._orphelin.restants[res]);
      if (s > 0) { autres.push([this._orphelin, s]); dispo += s; }
    }
    if (dispo <= 0.0001) return 0;

    const pris = Math.min(veut, dispo);
    for (const [l, s] of autres) l.stock[res] -= pris * (s / dispo);
    return pris;
  }

  // Achat spéculatif : ne compte pas dans les besoins, donc ne bouge pas le
  // prix. Il vide en revanche le matelas — au premier accroc de production, les
  // usines s'arrêtent faute d'intrants.
  rafler(res, qte, ville) {
    const l = this.livre(ville);
    let pris = Math.min(qte, l.stock[res]);
    l.stock[res] -= pris;
    if (pris < qte) pris += this.puiserAilleurs(res, qte - pris, l);
    this.stock[res] -= pris;
    return pris;
  }

  // --- Phase 6 : la garde ---------------------------------------------------
  // Ce qui dort au-dessus du matelas s'abîme. La marchandise pourrit là où elle
  // est : la perte se calcule donc livre par livre, sur le stock de chaque
  // ville.
  //
  // Le matelas d'une ville est un mois de son DÉBIT, pas de sa consommation :
  // le plus grand des deux entre ce qu'elle consomme et ce qu'elle sort. C'est
  // la seule mesure juste sous la règle du service local. Une ville minière
  // garde dans son propre livre le charbon qu'elle destine à l'export ; ses
  // besoins locaux sont nuls, et un matelas calé sur eux ferait pourrir chaque
  // mois la totalité de ce qu'elle allait vendre à la voisine — mesuré : 1 065
  // ménages au lieu de 1 889 et sept villes sur vingt en crise.
  //
  // Un matelas commun au marché entier n'allait pas non plus : la perte y était
  // répartie au prorata sur tous les livres, si bien que la ville qui n'avait
  // rien en trop payait pour le tas de la voisine. Sur la graine 12345, deux
  // villes sur cinq y sont mortes pendant qu'une sixième doublait.
  // `mois` sert à épargner les réserves d'une colonie neuve : les vivres livrés
  // avec une gare doivent tenir les deux ans promis, or la freinte les mangeait
  // en dix-huit mois — un tas de deux ans de couverture est par définition un
  // excédent. Une cargaison de fondation n'est pas un tas oublié, c'est une
  // provision datée.
  perimer(mois = Infinity) {
    const livres = [];
    for (const [ville, l] of this.parVille) {
      if (ville && ville.vivresJusqua > mois) continue;
      livres.push(l);
    }
    if (this._orphelin) livres.push(this._orphelin);
    for (const r of RESSOURCES) {
      let total = 0;
      for (const l of this.parVille.values()) total += l.stock[r];
      if (this._orphelin) total += this._orphelin.stock[r];
      this.stock[r] = total;
      total = 0;
      for (const l of livres) {
        // Le débit est une enveloppe qui redescend lentement, pas la mesure du
        // mois. Sans mémoire, une scierie mise en sommeil un mois ramène le
        // débit de sa ville à zéro et fait pourrir d'un coup tout ce qu'elle
        // gardait pour l'export ; le mois suivant elle repart sans matelas.
        l.debit[r] = Math.max(l.besoins[r], l.entrees[r], l.debit[r] * P.memoireDebit);
        const exces = l.stock[r] - P.matelasMois * l.debit[r];
        if (exces > 0) l.stock[r] -= exces * P.freinteExcedent;
        total += exces > 0 ? exces * P.freinteExcedent : 0;
      }
      this.stock[r] -= total;
    }
  }

  reinitialiser() {
    // On garde la trace des entrées du mois écoulé : c'est le seul indicateur
    // fiable de ce qu'une filière est capable de livrer, le stock de début de
    // mois ne disant rien quand la consommation se fait en juste-à-temps.
    this.entreesPrec = { ...this.entrees };
    this.peageCollecte = 0;
    for (const r of RESSOURCES) { this.besoins[r] = 0; this.entrees[r] = 0; }
    for (const l of this.parVille.values()) {
      for (const r of RESSOURCES) { l.besoins[r] = 0; l.entrees[r] = 0; }
    }
    if (this._orphelin) for (const r of RESSOURCES) {
      this._orphelin.besoins[r] = 0; this._orphelin.entrees[r] = 0;
    }
  }

  // Ce qu'une ressource peut raisonnablement fournir ce mois-ci : ce qu'elle a
  // livré le mois dernier, plus ce qui dort en stock.
  offreAttendue(res) {
    return (this.entreesPrec ? this.entreesPrec[res] || 0 : 0) + this.stock[res];
  }

  // Rapport prix / référence, pour l'affichage.
  indice(res) { return this.prix[res] / RES[res].prix; }
}

// ===== js/sim/building.js ============================================

// ---------------------------------------------------------------------------
// Le bâtiment.
//
//   résultat mensuel = taux d'activité × marge brute − entretien
//
// Les trois lignes se contractent ensemble : un atelier à moitié achète la
// moitié de ses intrants, paie la moitié de ses salaires et vend la moitié de
// sa production. Seul l'entretien ne bouge jamais — c'est lui qui borne les
// pertes et qui fixe le seuil d'activité.
// ---------------------------------------------------------------------------


let _idBatiment = 1;

class Batiment {
  constructor(type, ville, cases, societe) {
    this.id = _idBatiment++;
    this.type = type;
    this.def = BAT[type];
    this.ville = ville;
    this.cases = cases;                 // les cases occupées
    this.societe = societe;
    this.activite = 1.0;                // curseur 0 → 1, réglable par le joueur
    this.versEntrepot = false;          // affecter la production à son entrepôt
    this.age = 0;
    this.moisVide = 0;
    this.moisDeficit = 0;

    // La facture a été établie au prix du marché du jour où le chantier a été
    // ouvert : un bâtiment ne coûte jamais deux fois la même chose.
    this.valeurBatie = coutRef(type);
    this.terrain = cases.reduce((s, c) => s + (c.prixPaye || 0), 0);

    // Qualité du sol : la sortie d'une exploitation vaut base × qualité ÷ 3.
    // Elle ne joue jamais sur la transformation.
    this.qualite = 1;
    if (this.def.qual) {
      this.qualite = cases.reduce((s, c) => s + c.q[this.def.qual], 0) / cases.length;
    }

    this.production = 0;
    this.tauxReel = 0;
    this.resultat = 0;
    this.margeUnitaire = 0;
    this.histo = [];                    // résultats des 12 derniers mois
    this.alerte = null;                 // 'matieres' | 'bras' | 'invendus' | 'perte'
    this.recu = {};
  }

  get n() { return this.def.cases; }
  get enSommeil() { return this.activite <= 0.001; }

  // Le loyer d'un bâtiment plein. Il ne découle pas d'un barème mais du
  // foncier : loyer = rendement × (terrain + construction) ÷ 12 + entretien.
  // C'est ce qui fait qu'acheter tôt paie deux fois — le loyer monte avec la
  // ville, mais le rendement du joueur se calcule sur le prix qu'il a payé.
  get loyerPlein() {
    if (this.def.cat === 'loge') {
      return loyer(this.type, this.terrainCourant, this.valeurBatie);
    }
    if (this.def.cat === 'bur') {
      const rdtParNiveau = [0.12, 0.14, 0.16, 0.18, 0.20];
      const rdt = rdtParNiveau[this.ville.niveau - 1];
      return rdt * (this.terrainCourant + this.valeurBatie) / 12 + this.entretien;
    }
    return 0;
  }

  // Valeur actuelle du terrain sous le bâtiment : elle suit le niveau de la
  // ville. Une usine sans profit implantée dans une ville qui a grandi prend
  // malgré tout de la valeur.
  get terrainCourant() {
    return this.cases.reduce((s, c) =>
      s + prixTerrain(this.ville.niveau, c.distanceGare, qualiteMax(c)), 0);
  }

  get entretien() { return this.valeurBatie * P.entretienAnnuel / 12; }
  // Le salaire est celui de la ville, pas une constante.
  //
  // Il l'était : le bâtiment payait 20 $ par case pendant que le ménage n'en
  // recevait que 14. Les six dollars manquants ne partaient nulle part — ils
  // n'existaient tout simplement pas des deux côtés du même livre de comptes.
  // Le ménage ne pouvait plus s'offrir son panier, le baromètre des produits
  // tombait à 59 % sans qu'aucun produit ne manque sur les étals, et la ville
  // s'installait sur le pivot pour vingt ans.
  // Combien d'ouvriers le bâtiment porte.
  //
  // Une case n'est plus un poste : l'échelle industrielle en met plusieurs, et
  // sur une exploitation la qualité du sol multiplie encore — un filon de
  // niveau 5 fait vivre cinq fois plus de monde qu'un sol de niveau 1, sur la
  // même surface. C'est ce qui rend une bonne case précieuse : non pas plus
  // rentable à l'ouvrier, mais capable d'en porter beaucoup plus.
  // L'emploi NE SUIT PLUS LE SOL. Une concession se travaille par une équipe
  // fixe — quatre bras à la case, que le filon soit maigre ou gras — et c'est le
  // filon qui décide de ce qu'elle en tire. C'est la condition pour que la
  // qualité se voie sur la MARGE : tant que l'emploi suivait la production en
  // proportion exacte, la recette par ouvrier valait débit × prix, une constante,
  // et la bonne terre ne rapportait pas un sou de plus par ouvrier que la
  // mauvaise. Elle ajoutait des ouvriers, elle n'enrichissait personne.
  get emplois() {
    if (this.def.cat === 'bur') return this.def.postes;
    return this.n * echelleDe(this.type);
  }

  get masseSalarialePleine() {
    return this.emplois * (this.ville ? this.ville.salaire : P.salaireCase);
  }

  // Capacité de production, qualité du sol comprise.
  get capacite() {
    if (!this.def.sort) return 0;
    // Le facteur de sol du mois — sécheresse, récolte exceptionnelle — ne joue
    // que sur ce qui pousse. Une mine ne connaît pas la pluie.
    const meteo = (this.def.qual === 'fertilite' && this.ville && this.ville.facteurSol)
      ? this.ville.facteurSol : 1;
    // La production suit l'échelle du sol : 0 · 1 · 1,09 · 2,13. À qualité zéro
    // elle est nulle — pas de gisement, rien à extraire — et le bâtiment ne
    // devrait de toute façon jamais avoir pu s'y ouvrir.
    const k = echelleDe(this.type);
    const sol = this.def.qual ? facteurQualite(this.qualite) : 1;
    return this.def.debit * this.n * k * sol * meteo;
  }

  besoinsIntrants() {
    const out = {};
    const k = echelleDe(this.type);
    for (const [r, q] of Object.entries(this.def.intrants || {})) {
      out[r] = q * this.n * k * this.activite;
    }
    return out;
  }

  // Marge brute unitaire aux prix du marché du jour. C'est le seul chiffre qui
  // compte : le danger vient toujours de l'ÉCART entre le prix d'entrée et le
  // prix de sortie, jamais d'un prix seul.
  margeBrute(marche) {
    if (!this.def.sort) return 0;
    const recette = this.capacite * marche.prix[this.def.sort];
    let couts = this.masseSalarialePleine;
    const k = echelleDe(this.type);
    for (const [r, q] of Object.entries(this.def.intrants || {})) {
      couts += q * this.n * k * marche.prix[r];
    }
    return recette - couts;
  }

  // Le taux d'activité sous lequel la marge ne couvre plus l'entretien.
  seuilActivite(marche) {
    const mb = this.margeBrute(marche);
    return mb <= 0 ? Infinity : this.entretien / mb;
  }

  // --- Le mois -------------------------------------------------------------

  // 1. Déclarer ses besoins au marché et à la ville.
  declarer(marche) {
    if (this.def.cat === 'loge' || this.def.cat === 'bur' || this.def.cat === 'neg') {
      return;
    }
    // Un atelier dont la marge brute est négative — la valeur de ce qu'il
    // produit tombe sous le coût de ce qu'il consomme — arrête sa production de
    // lui-même et retombe à son seul entretien.
    if (this.margeBrute(marche) < 0 && !this.forcer) {
      this.activiteEffective = 0;
      this.alerte = 'perte';
      return;
    }
    this.activiteEffective = this.activite;
    for (const [r, q] of Object.entries(this.besoinsIntrants())) marche.demander(r, q, this.ville);

    // Le prix de revient réel fait plancher sur ce marché.
    if (this.def.sort && this.capacite > 0) {
      let c = this.masseSalarialePleine + this.entretien;
      for (const [r, q] of Object.entries(this.def.intrants || {})) c += q * this.n * marche.prix[r];
      marche.declarerRevient(this.def.sort, c / this.capacite);
    }
  }

  // 2. Recevoir intrants et main-d'œuvre, produire, tenir ses comptes.
  produire(marche, partBras) {
    this.age++;
    this.alerte = null;
    const ent = this.entretien;

    // Logement : n'est exposé que du côté du coût. Il achète — ses matériaux au
    // chantier, puis son entretien — mais ne vend jamais de marchandise. Sa
    // recette est un loyer, fixé par le développement de la ville, pas par la
    // bourse. Le taux d'occupation est celui de la ville entière, partagé par
    // tous les propriétaires.
    if (this.def.cat === 'loge') {
      this.production = 0;
      this.tauxReel = this.vacantePenurie ? 0 : this.ville.occupation;
      this.resultat = this.loyerPlein * this.tauxReel - ent;
      if (this.tauxReel < 0.3) this.alerte = 'invendus';
      return this.cloturer();
    }

    // Bureaux : le seul argent qui entre du dehors. Ils louent 20 postes à des
    // sociétés extérieures à la carte, dont les salaires financent une
    // consommation que la ville n'a pas eu à produire. Un poste vide ne
    // rapporte rien — c'est ce qui les borne.
    if (this.def.cat === 'bur') {
      const occ = Math.max(0, Math.min(1, partBras));
      this.production = 0;
      this.tauxReel = occ;
      this.resultat = this.loyerPlein * occ - ent;
      if (occ < 0.5) this.alerte = 'bras';
      return this.cloturer();
    }

    // Entrepôt : ne rapporte rien, coûte ses salaires et son entretien. C'est
    // cette charge fixe qui rend le stockage massif coûteux, donc risqué.
    if (this.def.cat === 'neg') {
      this.production = 0;
      this.tauxReel = 1;
      this.resultat = -(this.masseSalarialePleine + ent);
      return this.cloturer();
    }

    // Mise en sommeil : plus de matières, plus de salaires, plus de production.
    // Le bâtiment reste debout moyennant un entretien réduit et se rallume
    // quand le marché repart.
    if (this.enSommeil || this.activiteEffective <= 0) {
      this.production = 0;
      this.tauxReel = 0;
      this.resultat = -(ent + this.masseSalarialePleine * P.entretienSommeil);
      return this.cloturer();
    }

    // Loi du minimum stricte : une scierie qui ne reçoit qu'un tiers de son bois
    // tourne à un tiers, quel que soit le nombre d'ouvriers disponibles. On ne
    // scie pas du bois qu'on n'a pas.
    let ratioMat = 1;
    const besoins = this.besoinsIntrants();
    this.recu = {};
    for (const [r, q] of Object.entries(besoins)) {
      const obtenu = marche.prendre(r, q, this.ville);
      this.recu[r] = obtenu;
      if (q > 0) ratioMat = Math.min(ratioMat, obtenu / q);
    }

    // Sous 15 % de ses besoins en matières, un bâtiment s'arrête complètement
    // et ne paie plus que son entretien : on ne rallume pas une scierie pour
    // produire trois planches par mois.
    if (Object.keys(besoins).length && ratioMat < P.seuilMatieres) {
      for (const [r, o] of Object.entries(this.recu)) marche.offrir(r, o, this.ville); // on rend
      this.production = 0; this.tauxReel = 0;
      this.resultat = -ent;
      this.alerte = 'matieres';
      return this.cloturer();
    }

    // Une grève ne renvoie pas les ouvriers chez eux : ils sont là, ils ne
    // travaillent pas. L'atelier tourne au ralenti et continue de payer son
    // entretien — c'est ce qui rend la grève coûteuse pour tout le monde.
    const greve = this.ville && this.ville.greveDe ? this.ville.greveDe(this.def.cat) : 1;
    const taux = this.activiteEffective * Math.min(ratioMat, partBras) * greve;
    this.tauxReel = taux;
    this.production = this.capacite * taux;

    // On ne consomme — et on ne paie — que ce qui entre réellement dans le
    // produit. Le reste retourne au marché.
    //
    // C'est la loi du minimum vue depuis la caisse. Une aciérie qui reçoit tout
    // son charbon et deux tiers de son minerai ne fait pas d'acier avec le
    // charbon en trop : il ne sert à rien, et le lui facturer revenait à lui
    // faire porter la pénurie deux fois. C'était assez pour rendre toutes les
    // aciéries déficitaires — et, dans le même mouvement, pour retirer du
    // marché un charbon dont personne ne se servait, ce qui en gonflait le prix
    // et enrichissait les mines de la pénurie qu'elles causaient.
    const part = this.activiteEffective > 0 ? taux / this.activiteEffective : 0;
    let achats = 0;
    for (const [r, o] of Object.entries(this.recu)) {
      const utilise = Math.min(o, (besoins[r] || 0) * part);
      const rendu = o - utilise;
      if (rendu > 0) marche.offrir(r, rendu, this.ville);
      this.recu[r] = utilise;
      achats += utilise * marche.prix[r];
    }

    const prixSortie = marche.prix[this.def.sort];
    const brut = this.production * prixSortie;
    // Le péage ferroviaire se prélève à la vente, comme un frais de port. Il ne
    // pèse que sur les marchés desservis par une ligne — un marché isolé n'a
    // rien à payer, mais il n'a rien non plus à vendre au-dehors.
    const peage = brut * (marche.peage || 0);
    marche.peageCollecte += peage;
    const recette = brut - peage;
    const salaires = this.masseSalarialePleine * taux;

    this.resultat = recette - achats - salaires - ent;
    this.margeUnitaire = this.production > 0
      ? (recette - achats - salaires) / this.production : 0;

    // La production part sur le marché — sauf si le joueur l'affecte à son
    // entrepôt, ce qui réduit directement les entrées et fait monter le prix.
    if (this.versEntrepot && this.societe && this.societe.entrepotDans(this.ville)) {
      this.societe.stocker(this.ville, this.def.sort, this.production);
    } else {
      marche.offrir(this.def.sort, this.production, this.ville);
    }

    if (ratioMat < 0.9) this.alerte = 'matieres';
    else if (partBras < 0.9) this.alerte = 'bras';
    else if (this.resultat < 0) this.alerte = 'perte';

    return this.cloturer();
  }

  cloturer() {
    this.histo.push(this.resultat);
    if (this.histo.length > P.fenetreProfit) this.histo.shift();
    // Une case qui reste vide un an ferme : la fermeture libère les bras, le
    // foncier et le droit de rebâtir ailleurs.
    if (this.tauxReel <= 0.01) this.moisVide++; else this.moisVide = 0;
    // Une affaire qui saigne finit par fermer. Sans ce compteur, une aciérie
    // rationnée depuis dix ans reste debout : sa marge brute à pleine capacité
    // est positive, donc l'arrêt automatique ne se déclenche jamais, et rien ne
    // ramène jamais le nombre d'aciéries au nombre de mines qui peuvent les
    // nourrir.
    if (this.resultat < 0) this.moisDeficit++; else this.moisDeficit = 0;
    return this.resultat;
  }

  // Ce que le bâtiment rapporte, rapporté à ce qu'il a coûté — terrain et
  // matériaux au prix du jour.
  //
  // Surtout pas rapporté à sa VALEUR : celle-ci vaut « base + 10 × profit », si
  // bien que profit ÷ valeur tend vers 1/10 quel que soit le profit et ne peut
  // jamais dépasser 10 %. Un rendement mesuré ainsi ne dit rien — il mesure le
  // multiple de valorisation, pas la performance du bâtiment.
  get prixDeRevient() { return this.terrainCourant + this.valeurBatie; }

  get rendement() {
    const base = this.prixDeRevient;
    return base > 0 ? this.profitAnnuel / base : 0;
  }

  // Tient-il sa promesse ? De 0 (rien, ou perte) à 1 (il atteint son rendement
  // visé) et au-delà. C'est cette mesure-là, et non le rendement brut, qui
  // permet de comparer une coupe forestière à une manufacture : les deux n'ont
  // jamais eu la même promesse à tenir.
  tenue() {
    const vise = rendementVise(this.type);
    if (vise <= 0) return 0;
    return this.rendement / vise;
  }

  // Ce qu'il a demandé, ce qu'il a reçu. Un atelier ne souffre jamais d'un prix
  // seul : il souffre de ce qui lui manque, et c'est ce manque qu'il faut voir.
  intrants() {
    const out = [];
    for (const [r, q] of Object.entries(this.def.intrants || {})) {
      const demande = q * this.n * (this.activiteEffective ?? this.activite);
      const recu = (this.recu && this.recu[r]) || 0;
      out.push({ res: r, demande, recu, part: demande > 0 ? recu / demande : 1 });
    }
    return out;
  }

  get profitAnnuel() {
    const s = this.histo.reduce((a, b) => a + b, 0);
    return this.histo.length ? s * 12 / this.histo.length : 0;
  }

  // Valeur : un profit se projette sur la durée, une perte se répare — les deux
  // multiplicateurs ne sont pas les mêmes, et ce n'est pas arbitraire.
  // Ce que ce bâtiment vaut à la vente : son terrain, plus trois années de profit
  // lorsqu'il en fait. C'est exactement le prix auquel un indépendant le cède et
  // celui auquel on le lui rachète — voir Monde.prixRachatIndependant.
  //
  // Le multiple de marché ne s'applique plus ici. Il s'appliquait bâtiment par
  // bâtiment, ce qui empilait autant de goodwills qu'il y avait de murs ; il
  // s'applique désormais une seule fois, au niveau de la société. Un bâtiment,
  // lui, ne se cote pas : il se vend.
  get valeurDeCession() {
    return this.terrainCourant + Math.max(0, P.anneesDeProfit * this.profitAnnuel);
  }

  // Ce que le bâtiment demande au marché du travail ce mois-ci.
  get postesDemandes() {
    if (this.def.cat === 'loge') return 0;                  // une maison n'emploie personne
    if (this.def.cat === 'bur') return this.def.postes;
    if (this.def.cat === 'neg') return this.n;
    return this.emplois * (this.activiteEffective ?? this.activite);
  }

  // Ce qu'il emploie RÉELLEMENT, une fois le mois écoulé. C'est ce chiffre — et
  // jamais la capacité installée — qui dit s'il reste de la main-d'œuvre pour un
  // nouveau chantier : une usine à l'arrêt ne mobilise personne. En comptant les
  // postes théoriques, la simulation refusait de construire une minoterie alors
  // qu'un travailleur sur cinq était sans emploi, et la ville restait bloquée
  // pendant des années sans qu'on comprenne pourquoi.
  get postesPourvus() {
    if (this.def.cat === 'loge') return 0;
    if (this.def.cat === 'bur') return this.def.postes * (this.tauxReel || 0);
    if (this.def.cat === 'neg') return this.n;
    return this.n * (this.tauxReel || 0);
  }
}

// ===== js/sim/company.js =============================================

// ---------------------------------------------------------------------------
// La société.
//
// Un joueur ne possède presque rien en propre. Il possède 10 % d'une société
// qu'il dirige, et cette société possède tout le reste. Sa fortune, celle qui
// décide de la victoire, c'est son argent liquide plus la valeur en bourse des
// actions qu'il détient.
// ---------------------------------------------------------------------------


let _idSociete = 1;

class Societe {
  constructor(nom, couleur, estJoueur = false) {
    this.id = `S${_idSociete++}`;
    this.nom = nom;
    this.couleur = couleur;
    this.estJoueur = estJoueur;

    this.tresorerie = P.apportJoueur / P.partFondateur;   // 15 000 $
    this.actions = P.actionsInitiales;
    this.dette = 0;
    this.batiments = [];
    this.chantiers = [];
    this.stocks = {};                 // par ville : { ressource: quantité }
    this.histoCours = [];
    this.faillite = false;

    // Le porteur détient 10 % ; les 90 % restants sont au public.
    this.parts = { [this.id + ':fondateur']: P.actionsInitiales * P.partFondateur };
    this.histoResultat = [];
    this.rails = [];                    // compagnies ferroviaires détenues
    this.cotee = true;                  // les sociétés des joueurs le sont d'emblée
  }

  partDe(qui) { return (this.parts[qui] || 0) / this.actions; }

  // --- Patrimoine ----------------------------------------------------------

  // L'ACTIF NET, au prix de revient — sans goodwill.
  //
  // Le multiple s'appliquait bâtiment par bâtiment, ce qui empilait autant de
  // goodwills qu'il y avait de murs. Une société se valorise une fois, et
  // globalement : son patrimoine d'un côté, ce que rapporte son exploitation de
  // l'autre. C'est aussi ce qui permet au PER d'être un vrai multiple de marché
  // plutôt qu'un coefficient interne à chaque immeuble.
  actifNet() {
    let v = this.tresorerie - this.dette;
    for (const b of this.batiments) v += b.terrainCourant + b.valeurBatie;
    for (const c of this.chantiers) v += c.engage;   // le cash immobilisé dans les trous
    for (const l of this.rails || []) v += (l.parts[this.id] || 0) * (l.cours || 0);
    return v;
  }

  get profitAnnuel() {
    const s = this.histoResultat.reduce((a, b) => a + b, 0);
    return this.histoResultat.length
      ? s * 12 / this.histoResultat.length : 0;
  }

  // La cotation : patrimoine + ce que le marché paie pour les bénéfices.
  //
  //   cours = ( actif net + PER × bénéfice annuel ) ÷ actions
  //
  // Une société qui perd de l'argent ne tombe pas sous son actif net : on ne
  // paie pas moins que ce qu'elle possède, à une décote près qui est déjà dans
  // la valeur des bâtiments.
  cours(per) {
    const p = this.profitAnnuel;
    return Math.max(0.01, (this.actifNet() + Math.max(0, p) * per) / this.actions);
  }

  capitalisation(per) { return this.cours(per) * this.actions; }

  // Le cours retenu pour le décompte final est la moyenne des douze derniers
  // mois, jamais celui de la dernière seconde : sans cette précaution la partie
  // se déciderait sur une manipulation de dernière minute.
  coursMoyen() {
    if (!this.histoCours.length) return 1;
    return this.histoCours.reduce((a, b) => a + b, 0) / this.histoCours.length;
  }

  enregistrerCours(per) {
    this.histoResultat.push(this.resultatMensuel);
    if (this.histoResultat.length > P.fenetreProfit) this.histoResultat.shift();
    this.histoCours.push(this.cours(per));
    if (this.histoCours.length > P.fenetreProfit) this.histoCours.shift();
  }

  // --- Entrepôts et stocks -------------------------------------------------
  // L'entrepôt est le droit d'entrée sur un marché : sans entrepôt sur place,
  // une société ne peut ni acheter ni stocker dans cette ville.

  entrepotDans(ville) {
    return this.batiments.some(b => b.ville === ville && b.def.cat === 'neg');
  }

  capaciteDans(ville) {
    return this.batiments
      .filter(b => b.ville === ville && b.def.cat === 'neg')
      .reduce((s, b) => s + b.def.capacite, 0);
  }

  stockDe(ville) {
    if (!this.stocks[ville.id]) this.stocks[ville.id] = {};
    return this.stocks[ville.id];
  }

  stocker(ville, res, qte) {
    const s = this.stockDe(ville);
    const total = Object.values(s).reduce((a, b) => a + b, 0);
    const place = Math.max(0, this.capaciteDans(ville) - total);
    const mis = Math.min(qte, place);
    s[res] = (s[res] || 0) + mis;
    return qte - mis;                 // ce qui n'a pas pu entrer
  }

  // --- Comptes -------------------------------------------------------------

  encaisser(m) { this.tresorerie += m; }

  peutPayer(m) { return this.tresorerie >= m; }

  payer(m) {
    this.tresorerie -= m;
    if (this.tresorerie < 0) this.faillite = true;
    return true;
  }

  get resultatMensuel() {
    return this.batiments.reduce((s, b) => s + b.resultat, 0);
  }

  get masseSalariale() {
    return this.batiments.reduce((s, b) =>
      s + b.masseSalarialePleine * (b.tauxReel || 0), 0);
  }
}

// ---------------------------------------------------------------------------
// Le chantier.
//
// On lance un chantier dès qu'on a le cash — rien n'oblige à attendre les
// planches. Le cash part immédiatement, le chantier entre au carnet, et il
// reste un trou dans le sol tant que la totalité des matériaux n'est pas
// arrivée. Cette commande n'est pas une intention : c'est une demande réelle
// sur le marché, au même titre que le pain d'un ménage.
// ---------------------------------------------------------------------------

let _idChantier = 1;

class Chantier {
  constructor(type, ville, cases, societe, coutTerrain) {
    this.id = _idChantier++;
    this.type = type;
    this.ville = ville;
    this.cases = cases;
    this.societe = societe;
    this.ouvertLe = 0;
    this.engage = coutTerrain;
    this.restant = materiaux(type);          // ce qu'il attend encore
    this.recu = {};
    for (const r of Object.keys(this.restant)) this.recu[r] = 0;
  }

  // Un chantier est achevé quand il ne lui manque plus rien d'utile. La
  // tolérance n'est pas une facilité : le rationnement au prorata fait décroître
  // le reliquat géométriquement, si bien qu'il resterait éternellement un
  // millième de brique et que le chantier ne sortirait jamais de terre.
  get complet() {
    return Object.values(this.restant).every(q => q < 0.5);
  }

  // Part de main-d'œuvre mobilisée : les bras suivent les matériaux, pas le
  // calendrier. Un chantier à l'arrêt ne mobilise personne.
  get postesDemandes() {
    const tot = Object.values(materiaux(this.type)).reduce((a, b) => a + b, 0);
    const res = Object.values(this.restant).reduce((a, b) => a + b, 0);
    return (1 - res / tot) > 0 ? this.cases.length * 0.5 : 0;
  }

  progression() {
    if (this.complet) return 1;
    const tot = Object.values(materiaux(this.type)).reduce((a, b) => a + b, 0);
    const res = Object.values(this.restant).reduce((a, b) => a + b, 0);
    return Math.min(0.99, 1 - res / tot);
  }
}

// ===== js/sim/ai.js ==================================================

// ---------------------------------------------------------------------------
// Comment une ville bâtit.
//
// Une ville ne bâtit pas ce qui rapporte le plus. Elle bâtit ce qui lui manque,
// et quand rien ne manque, alors seulement elle regarde le rendement. Trois
// règles suffisent à décrire tout son comportement, et elles valent aussi bien
// pour un joueur — un joueur a simplement le droit de se tromper.
// ---------------------------------------------------------------------------


// Qui produit quoi.
const PRODUCTEUR = {
  bois: 'coupe', argile: 'carriere', charbon: 'mineCharbon', minerai: 'mineFer',
  cereales: 'ferme', betail: 'ranch',
  planches: 'scierie', briques: 'briqueterie', pain: 'minoterie',
  viande: 'abattoir', acier: 'acierie', produits: 'manufacture',
};

// PREMIÈRE RÈGLE — on ne bâtit pas ce qui manque, on bâtit ce qui empêche de
// le faire. La ville prend son besoin le plus criant, puis remonte la filière
// jusqu'au premier maillon qui bloque. Il manque du pain ? Si les minoteries
// tournent à vide faute de blé, on bâtit une ferme, pas une minoterie.
function remonter(monde, ville, res, profondeur = 0) {
  if (profondeur > 4) return null;
  const type = PRODUCTEUR[res];
  if (!type) return null;
  const def = BAT[type];
  const intrants = Object.keys(def.intrants || {});
  if (!intrants.length) return type;

  // Le goulot se lit dans le PRIX, pas ailleurs. Une scierie ne souffre pas du
  // manque de bois en soi : si les planches étaient rares aussi, leur prix
  // monterait et sa marge tiendrait. Elle souffre parce que le bois est rare
  // alors que les planches ne le sont pas. C'est l'écart entre le prix d'entrée
  // et le prix de sortie qui désigne le maillon à bâtir.
  const m = ville.marche;
  let pire = null, pireIndice = 0;
  for (const r of intrants) {
    const indice = m.prix[r] / RES[r].prix;
    if (indice > pireIndice) { pireIndice = indice; pire = r; }
  }
  const indiceSortie = m.prix[res] / RES[res].prix;

  // Le prix ne dit pas tout. Sous la loi du minimum, un atelier rationné
  // produit à la mesure de son intrant le plus rare tout en payant ses salaires
  // en entier : à 50 % de régime, sa marge a disparu. Le manque se lit alors
  // dans le taux de service, pas dans le prix — et c'est cet intrant-là qu'il
  // faut aller chercher, même si son prix n'a pas bougé.
  let rare = null, pireService = 1;
  for (const r of intrants) {
    const s = m.service[r] === undefined ? 1 : m.service[r];
    if (s < pireService) { pireService = s; rare = r; }
  }

  // Si l'intrant est nettement plus tendu que le produit, c'est lui qu'il faut
  // aller chercher en amont. Sinon, c'est bien cet atelier-ci qui manque.
  //
  // La comparaison est RELATIVE, et c'est tout l'intérêt. Un seuil absolu —
  // « l'intrant dépasse 1,20 » — laissait passer le cas le plus courant : de
  // l'acier à 1,18 en face de produits à 0,92. La manufacture était bâtie et
  // rebâtie alors que le minerai criait à 1,81 et que les aciéries tournaient
  // à un tiers de régime.
  if (pireIndice > Math.max(1.05, indiceSortie * 1.10)) {
    return remonter(monde, ville, pire, profondeur + 1);
  }
  // Les ateliers de ce type tournent déjà au ralenti : un de plus ne produirait
  // pas un gramme de mieux. On remonte à ce qui leur manque.
  if (rare && sature(monde, ville, type)) {
    return remonter(monde, ville, rare, profondeur + 1);
  }
  return type;
}

// TROISIÈME RÈGLE — le plafond de bras. On ne décide pas de bâtir ce qu'on ne
// pourra pas faire tourner. Une ville qui ignore cette règle se couvre d'usines
// vides et s'affame.
function brasDisponibles(monde, ville) {
  const bras = ville.menages * P.employesParMenage;
  let occupes = 0;
  // On plafonne sur les postes DEMANDÉS, chantiers compris : c'est la capacité
  // installée qui ne peut pas dépasser le nombre de bras. Se fier aux postes
  // pourvus mènerait à une spirale — des usines rationnées paraissent libérer
  // des bras, on bâtit davantage, on rationne encore plus, et la ville se
  // couvre d'usines vides en s'affamant.
  for (const b of monde.tousBatiments(ville)) occupes += b.postesDemandes;
  for (const c of monde.tousChantiers(ville)) occupes += c.postesDemandes;
  return bras - occupes;
}

// Une filière est saturée quand ses ateliers existants tournent déjà au ralenti
// faute d'intrants : en bâtir un de plus n'ajoute pas un gramme de production.
function sature(monde, ville, type) {
  const intrants = Object.keys(BAT[type].intrants || {});
  if (!intrants.length) return false;
  const miens = monde.tousBatiments(ville).filter(b => b.type === type && b.age > 3);
  if (miens.length < 2) return false;
  const taux = miens.reduce((s, b) => s + b.tauxReel, 0) / miens.length;
  if (taux >= 0.55) return false;
  // Ils tournent au ralenti — mais est-ce faute d'intrants, ou faute de
  // débouchés ? Dans le second cas, en bâtir un de plus serait absurde ; dans
  // le premier, c'est en amont qu'il faut aller, ce dont `remonter` s'occupe.
  return true;
}

// Le taux d'emploi au-dessous duquel on cesse de loger.
//
// C'est LE cadran du chômage, et c'est contre-intuitif : le chômage d'équilibre
// d'une ville n'est pas fixé par ses usines, il est fixé par ce seuil. Un ménage
// de plus, ce sont deux BRAS de plus et un panier de plus ; tant que la ville
// continue de loger, elle continue d'ajouter des bras, et l'emploi retombe
// aussitôt sur le seuil qui a autorisé la construction. L'emploi ne peut donc
// jamais s'établir durablement au-dessus de ce nombre — il s'y colle.
//
// La version précédente le calculait comme le point de bouclage du ménage —
// panier ÷ (2 × salaire). Le raisonnement se tenait, mais il était circulaire :
// le salaire de subsistance montait pour compenser le chômage, ce qui ABAISSAIT
// le seuil, ce qui autorisait plus de logements, ce qui aggravait le chômage.
// La ville s'installait à 70 % d'emploi et n'en bougeait plus, quelle que soit
// la taille de la carte.
//
// Le bon seuil est un objectif, pas un point mort : on ne fait venir des gens
// que dans une ville qui a du travail à leur donner.
function emploiDeBouclage(ville) {
  return P.emploiPourLoger;
}

// L'emploi tiendra-t-il si l'on ajoute ces ménages ? Deux bras chacun, et pas
// un poste de plus : c'est la question que doit se poser une ville avant de
// bâtir, et non celle de savoir si elle a du travail aujourd'hui.
function emploiTiendra(monde, ville, menagesAjoutes) {
  const bras = (ville.menages + menagesAjoutes) * P.employesParMenage;
  if (bras <= 0) return true;
  return Math.min(ville.postesDemandes || 0, bras) / bras >= P.emploiPourLoger;
}

// Les besoins de la ville, dans l'ordre où elle les ressent.
function besoinsClasses(monde, ville, penchant) {
  const b = ville.barometres;
  const m = ville.marche;

  const candidats = [];

  // La nourriture passe avant tout le reste. Elle est le seul baromètre dont la
  // chute vide la ville, et le seul dont la correction prend des années : il
  // faut une ferme, puis une minoterie, puis des bras pour les deux.
  if (b.nourriture < 0.995) candidats.push({ score: 5 - b.nourriture * 2, res: 'pain' });

  // DEUXIÈME RÈGLE — on loge tant qu'on peut nourrir.
  //
  // Le logement ne compte pas dans le plafond de bras, et pour une raison qui
  // change tout : un ménage de plus, ce sont deux BRAS de plus. Le logement est
  // le seul bâtiment qui produise du travail au lieu d'en consommer.
  //
  // C'est pourquoi la condition portait à l'envers. On exigeait auparavant du
  // mou sur le marché du travail — « une ville au plein emploi ne peut plus
  // bâtir la ferme qui la sauverait » — mais l'effet était de geler net la
  // croissance de toute ville qui réussissait : plein emploi, donc pas de mou,
  // donc pas de maisons, donc pas de population, et une ville prospère restait
  // à cent cinquante ménages pendant vingt ans. Le plein emploi est justement
  // le moment où il faut loger davantage.
  //
  // La vraie borne, c'est la nourriture : on ne fait pas venir des gens qu'on
  // ne pourra pas nourrir.
  if (ville.occupation > 0.86 && b.nourriture > 0.95 && b.emploi > emploiDeBouclage(ville)) {
    candidats.push({ score: 2.2 + ville.occupation, res: null, type: 'logement' });
  }

  if (b.produits < P.cibleProduits) candidats.push({ score: 2 - b.produits, res: 'produits' });

  // Les bureaux — le seul argent qui vienne du dehors.
  //
  // Ils n'étaient bâtis qu'à la création du monde. Une ville qui doublait de
  // population gardait son unique immeuble : la part de revenu venue de
  // l'extérieur était divisée par deux à mesure qu'elle grandissait, et avec
  // elle le taux d'emploi. Or l'arithmétique du ménage est sans appel — panier
  // 34 $, revenu 2 × salaire × emploi — et le salaire est plafonné à 20 $ par ce
  // qu'une exploitation peut payer. Sous 85 % d'emploi, le ménage ne boucle
  // plus, n'épargne rien, et la ville cesse de bâtir. L'emploi n'est pas un
  // symptôme : c'est la seule variable qui reste.
  const bureaux = monde.tousBatiments(ville)
    .filter(x => x.def.cat === 'bur').reduce((s, x) => s + x.def.postes, 0);
  const voulus = ville.menages / P.menagesParBureaux * BAT.bureaux.postes;

  // Un bureau prend vingt bras et ne nourrit personne. Poussée trop loin, la
  // densité de bureaux tue la ville : les bras partent tous au tertiaire, plus
  // personne ne bâtit de ferme, le seuil critique de nourriture est franchi et
  // la population s'évapore à 5 % par mois. Mesuré : à un bureau pour seize
  // ménages, les cinq villes tombent à ZÉRO habitant en moins de vingt ans.
  //
  // On ne bâtit donc de bureau que le ventre plein, et qu'à condition de garder
  // de quoi armer la filière alimentaire.
  const ventrePlein = b.nourriture > 0.98;
  const marge = brasDisponibles(monde, ville) - BAT.bureaux.postes;
  if (bureaux < voulus && ventrePlein && marge > ville.menages * P.brasReservesAuxVivres) {
    candidats.push({ score: 2.4 + (voulus - bureaux) / Math.max(1, voulus),
                     res: null, type: 'bureaux' });
  }

  // Les matériaux : une ville à court de briques finit par se donner une
  // briqueterie, parce que ses chantiers en font monter le prix.
  //
  // Et les matières premières avec eux. Les laisser hors de ce tableau était
  // une erreur : le charbon et le minerai n'avaient aucun chemin direct vers
  // le carnet de chantiers — on n'y arrivait qu'en remontant depuis les
  // produits finis, à travers deux étages de filière. Une pénurie de minerai
  // devait donc d'abord faire souffrir la manufacture pour être seulement
  // remarquée, et les mines ont passé vingt ans à encaisser 80 % de rendement
  // sans que personne n'en ouvre une de plus.
  for (const r of ['planches', 'briques', 'bois', 'argile', 'charbon', 'minerai',
                   'cereales', 'betail']) {
    const indice = m.prix[r] / RES[r].prix;
    if (indice > 1.10) candidats.push({ score: 0.9 + indice, res: r });
  }

  // Le penchant ne rend pas aveugle : il déclasse les occasions, il ne les
  // supprime pas. Une pénurie criante reste criante pour tout le monde.
  if (penchant) for (const c of candidats) {
    if (c.type === penchant || c.res === penchant) c.score *= 1.5;
  }
  candidats.sort((a, b2) => b2.score - a.score);
  return candidats;
}

// Le besoin le plus criant — un seul, pour qui n'en veut qu'un.
function besoinLePlusCriant(monde, ville, penchant) {
  const candidats = besoinsClasses(monde, ville, penchant);
  if (!candidats.length) return null;
  // Parmi les occasions qui se valent à peu près, on ne prend pas toujours la
  // première : deux sociétés qui lisent le même marché ne doivent pas fatalement
  // ouvrir le même chantier le même mois.
  const seuil = candidats[0].score * 0.75;
  const bonnes = candidats.filter(c => c.score >= seuil);
  return bonnes[Math.floor(monde.hasard() * bonnes.length)];
}

// L'épargne des ménages bâtit la ville. Les habitants construisent ce qui
// manque le plus, et ces bâtiments appartiennent aux propriétaires
// indépendants — donc rachetables par les joueurs.
function piloterVille(monde, ville) {
  // CINQUIÈME RÈGLE — une affaire qui saigne deux ans ferme, et sa fermeture
  // rend à la ville le terrain et surtout les BRAS. C'est la seule chose qui
  // ramène le nombre d'aciéries au nombre de mines capables de les nourrir :
  // sans sortie de marché, une filière mal proportionnée le reste pour
  // toujours. On n'en ferme qu'une par mois — une ville ne se vide pas d'un
  // coup, et le joueur doit avoir le temps de racheter.
  for (const b of ville.batIndependants) {
    if (b.def.cat === 'loge' || b.def.cat === 'bur') continue;
    if (b.moisDeficit >= P.moisAvantFaillite) { monde.demolir(b); break; }
  }

  // Une ville ne bâtit pas un chantier par mois par décret : elle bâtit tant
  // qu'elle a de l'argent, des bras et un besoin. Le plafond d'un seul chantier
  // mensuel laissait s'accumuler des centaines de milliers de dollars d'épargne
  // inutilisée pendant que la population stagnait faute de logements.
  for (let k = 0; k < P.chantiersVilleParMois; k++) {
    if (!unChantierDeVille(monde, ville)) break;
  }
}

// Renvoie vrai si la ville a effectivement bâti quelque chose.
//
// QUATRIÈME RÈGLE — on ne bâtit pas ce qui ne paiera pas. Le besoin dit quoi
// bâtir ; le calcul dit si ça vaut la peine ICI, sur CE sol, à CES prix. Et si
// le premier besoin mène à un chantier qui perdrait de l'argent, la ville passe
// au suivant plutôt que de ne rien faire — c'est ainsi que le capital finit par
// aller là où il manque, au lieu de s'entêter là où il ne sert à rien.
function unChantierDeVille(monde, ville) {
  const budget = ville.epargne;
  if (budget < 200) return false;

  const besoins = besoinsClasses(monde, ville);
  if (!besoins.length) return false;

  // On ne prend pas toujours le premier : deux villes qui lisent le même marché
  // ne doivent pas fatalement ouvrir le même chantier le même mois.
  const seuil = besoins[0].score * 0.75;
  const tete = besoins.filter(c => c.score >= seuil);
  const ordre = [tete[Math.floor(monde.hasard() * tete.length)],
                 ...besoins].slice(0, 5);

  const essayes = new Set();
  for (const besoin of ordre) {
    let type;
    if (besoin.type === 'bureaux') {
      type = 'bureaux';
    } else if (besoin.type === 'logement') {
      // La maison est un petit pas prudent, l'immeuble un pari sur l'avenir.
      // Une ville sans acier ne peut pas bâtir en hauteur.
      //
      // La disponibilité se lit au TAUX DE SERVICE, jamais au stock. Sur un
      // marché en juste-à-temps, l'acier est consommé le mois même où il sort
      // de l'aciérie : le stock y est structurellement nul, même quand la
      // filière tourne à plein. La condition « stock > 200 » n'était donc
      // jamais vraie — la ville n'a jamais densifié, elle a couvert son
      // territoire de maisons à un ménage la case jusqu'à ce qu'il n'y ait
      // plus un pouce de terre, et s'est arrêtée là avec quatre millions de
      // dollars d'épargne dont elle ne savait que faire.
      const acierDispo = (ville.marche.service.acier ?? 1) > 0.75;
      // Et l'on densifie d'autant plus volontiers que la place manque. La
      // mesure porte sur le QUARTIER D'HABITATION, pas sur le territoire :
      // c'est là que le logement va, et une ville peut avoir des hectares
      // agricoles en friche tout en n'ayant plus où loger personne.
      let res = 0, resLibres = 0;
      for (const c of ville.cases) {
        if (c.quartier !== 'residentiel') continue;
        res++;
        if (!c.bat && !c.chantier && !c.voie) resLibres++;
      }
      const serre = res > 0 && resLibres < res * P.densifierSous;
      const grande = ville.menages > 260 || serre;
      const peutImmeuble = acierDispo && budget > 4500;
      if (serre && !peutImmeuble) {
        // Ville à l'étroit et pas les moyens de bâtir en hauteur : on ne pose
        // SURTOUT pas une maison de plus. Chaque pavillon posé sur les dernières
        // cases libres est un ménage gagné aujourd'hui et vingt perdus demain —
        // c'est ainsi qu'une ville se condamnait à quatre cents habitants.
        // On attend l'acier et l'argent, et on va voir le besoin suivant.
        continue;
      }
      type = (peutImmeuble && grande) ? 'immeuble' : 'maison';
    } else {
      type = remonter(monde, ville, besoin.res);
    }
    if (!type || essayes.has(type)) continue;
    essayes.add(type);

    const def = BAT[type];
    // Un immeuble de bureaux réclame vingt bras, pas quatre : c'est le nombre de
    // POSTES qu'il faut pouvoir pourvoir, pas la surface qu'il couvre.
    const brasRequis = def.cat === 'bur' ? def.postes : def.cases;
    if (def.cat !== 'loge' && brasDisponibles(monde, ville) < brasRequis) continue;

    // Un logement s'apprécie sur l'emploi qu'il y AURA, pas sur celui qu'il y a.
    // Un immeuble amène vingt ménages d'un seul coup — quarante bras — et une
    // ville qui vérifie son taux d'emploi avant de le poser le verra s'effondrer
    // juste après. On regarde donc l'état d'après.
    if (def.cat === 'loge' && !emploiTiendra(monde, ville, def.menages)) continue;

    const cout = coutEstime(monde, ville, type);
    if (budget < cout) continue;
