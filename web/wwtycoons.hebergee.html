            <br>salaire ${v.salaire.toFixed(1)} $
          </span>
        </button>`;
      }).join('')}
    </div>
    <div class="note">Touchez une ville pour l'atteindre sur la carte.</div>
    ${monde.villeChoisie ? detailVille(monde, monde.villeChoisie) : ''}
  `;
}

function detailVille(monde, v) {
  const b = v.barometres;
  const moy = (b.nourriture + b.emploi + b.produits) / 3;

  const jauge = (nom, val, seuil) => `
    <div class="barometre">
      <div class="tete"><span>${nom}</span>
        <span class="${val < seuil ? 'rouge' : 'doux'}">${pct(val)}${val < seuil ? ' ⚠' : ''}</span></div>
      <div class="piste"><div class="jauge2"
        style="width:${Math.min(100, val * 100)}%;background:${rgb(echelle(val))}"></div></div>
    </div>`;

  const tendance = v.enCrise
    ? '<span class="rouge">seuil critique franchi — la ville se vide de 5 % par mois</span>'
    : moy > P.pivot + 0.005 ? `<span class="vert">attractive — +${(0.2 * (moy - P.pivot) * 100).toFixed(1)} % par mois</span>`
    : moy < P.pivot - 0.005 ? `<span class="rouge">elle repousse — ${(0.2 * (moy - P.pivot) * 100).toFixed(1)} % par mois</span>`
    : '<span class="doux">à l\'équilibre, sur son pivot</span>';

  const n = niveauVille(v.menages);
  const palier = n >= 5 ? 'Métropole — dernier palier.'
    : `${P.nomsNiveau[n]} à ${P.seuilsNiveau[n]} ménages — il en manque
       <b>${Math.max(0, Math.ceil(P.seuilsNiveau[n] - v.menages))}</b>, et le foncier
       passerait de ×${P.facteurNiveau[n - 1].toFixed(1)} à ×${P.facteurNiveau[n].toFixed(1)}.`;

  return `
    <h3>${v.nom} · ${P.nomsNiveau[v.niveau - 1]}</h3>
    <div class="grille">
      <div class="fiche"><div class="etiq">Ménages</div><div class="v">${Math.round(v.menages)}</div></div>
      <div class="fiche"><div class="etiq">Occupation</div><div class="v">${pct(v.occupation)}</div></div>
      <div class="fiche"><div class="etiq">Salaire</div><div class="v">${v.salaire.toFixed(1)} $</div></div>
      <div class="fiche"><div class="etiq">Bras libres</div>
        <div class="v">${Math.round(Math.max(0, (v.bras || 0) - (v.postesDemandes || 0)))}</div></div>
    </div>

    <h3>Les trois baromètres</h3>
    ${jauge('Nourriture', b.nourriture, P.seuilsCritiques.nourriture)}
    ${jauge('Emploi', b.emploi, P.seuilsCritiques.emploi)}
    ${jauge('Produits manufacturés', b.produits, P.seuilsCritiques.produits)}
    <div class="barometre" style="margin-top:10px">
      <div class="tete"><span><b>Moyenne</b> — pivot à ${pct(P.pivot)}</span>
        <span class="or"><b>${pct(moy)}</b></span></div>
      <div class="piste"><div class="jauge2" style="width:${moy * 100}%;background:var(--or)"></div></div>
    </div>
    <div class="note">${tendance}</div>
    <div class="note">${palier}</div>
  `;
}

// --- Marché -----------------------------------------------------------------

function voletMarche(monde, rendu) {
  return monde.marches.map(m => {
    const lignes = RESSOURCES.map(r => {
      const i = m.indice(r);
      const classe = i > 1.35 ? 'rouge' : i < 0.8 ? 'vert' : 'doux';
      return `<tr class="ligneRes" data-prix="${r}">
        <td><span class="puce" style="background:${RES[r].couleur}"></span>${RES[r].nom}</td>
        <td class="n">${m.prix[r].toFixed(2)} $</td>
        <td class="n ${classe}">${i.toFixed(2)}×</td>
        <td class="n ${m.service[r] < 0.95 ? 'rouge' : 'doux'}">${pct(m.service[r])}</td>
      </tr>`;
    }).join('');
    return `<h3>${m.nom}${m.villes.length > 1 ? ' — marché fusionné' : ''}</h3>
      <table>
        <tr><th>Marchandise</th><th class="n">Prix</th><th class="n">/ réf.</th><th class="n">Servi</th></tr>
        ${lignes}
      </table>`;
  }).join('') + `
    <div class="note">
      Touchez une marchandise pour la voir sur la carte, ville par ville.<br><br>
      Le prix suit les <b>flux</b>, jamais le stock : il monte quand les besoins du mois
      dépassent ce qui entre sur le marché. Rafler un stock ne fait pas bouger le cours —
      cela vide le matelas, et les usines s'arrêtent au premier accroc.
    </div>`;
}

// --- Société ----------------------------------------------------------------

function voletSociete(monde) {
  const s = monde.joueur;
  const enTete = `
    <div class="grille">
      <div class="fiche"><div class="etiq">Votre fortune</div>
        <div class="v or">${eur(s.cours(monde.multiple) * s.actions * P.partFondateur)}</div></div>
      <div class="fiche"><div class="etiq">Cours</div>
        <div class="v">${s.cours(monde.multiple).toFixed(3).replace('.', ',')} $</div></div>
      <div class="fiche"><div class="etiq">Trésorerie</div><div class="v">${eur(s.tresorerie)}</div></div>
    </div>`;

  if (!s.batiments.length && !s.chantiers.length) {
    return enTete + `<h3>Livre de comptes</h3>
      <div class="note">Votre société ne possède encore rien.<br><br>
      Approchez une ville, touchez une case libre à la lisière du bâti, achetez-la, puis
      ouvrez un chantier. Le terrain est la moitié du coût d'une maison — et la totalité
      de ce qui fait les fortunes.</div>`;
  }

  const lignes = s.batiments.map(b => `
    <tr class="ligneBat" data-bat="${b.id}">
      <td><span class="puce" style="background:${COULEURS[b.type]}"></span>${BAT[b.type].nom}</td>
      <td class="doux">${b.ville.nom.slice(0, 8)}</td>
      <td class="n">${pct(b.tauxReel)}</td>
      <td class="n" style="color:${rgb(echelle(b.tenue()))}">${(b.rendement * 100).toFixed(0)} %</td>
      <td class="n ${cl(b.resultat)}">${eur(b.resultat)}</td>
    </tr>`).join('');

  return enTete + `
    <h3>Exploitation du mois</h3>
    <table>
      <tr><th>Bâtiment</th><th>Ville</th><th class="n">Activ.</th>
          <th class="n">Rdt</th><th class="n">Résultat</th></tr>
      ${lignes}
    </table>

    <h3>Bilan</h3>
    <table>
      <tr><td>Résultat net</td><td class="n ${cl(s.resultatMensuel)}">${eur(s.resultatMensuel)}</td></tr>
      <tr><td>Immobilisé en chantiers</td>
          <td class="n doux">${eur(s.chantiers.reduce((a, c) => a + c.engage, 0))}</td></tr>
      <tr><td>Valeur des bâtiments</td>
          <td class="n">${eur(s.batiments.reduce((a, b) => a + b.valeur(monde.multiple), 0))}</td></tr>
      <tr><td><b>Actif net réévalué</b></td><td class="n"><b>${eur(s.actifNet(monde.multiple))}</b></td></tr>
    </table>

    <h3>Les concurrents</h3>
    <table>
      <tr><th>Société</th><th class="n">Bâtiments</th><th class="n">Cours</th></tr>
      ${monde.societes.map(x => `<tr>
        <td><span class="puce" style="background:${x.couleur}"></span>${x.nom}</td>
        <td class="n doux">${x.batiments.length}</td>
        <td class="n">${x.cours(monde.multiple).toFixed(3).replace('.', ',')} $</td></tr>`).join('')}
    </table>
    <div class="note">Multiple du marché : <b>×${monde.multiple}</b>. Un bâtiment vaut son
      terrain plus ses matériaux, plus ${monde.multiple} fois son résultat annuel.</div>

    <h3>La partie</h3>
    <div class="note">Elle n'a pas de terme : elle court tant que vous la faites courir.
      Il n'y a plus de décompte à battre, seulement une fortune à bâtir.</div>
    <div class="actions" style="margin-top:8px">
      <button onclick="location.reload()">Nouveau monde</button>

}

// --- Rail -------------------------------------------------------------------

function voletRail(monde) {
  const lignes = monde.liaisons.map((l, i) => {
    const reste = l.date - monde.mois;
    const part = l.capital > 0 ? (l.parts[monde.joueur.id] || 0) / l.capital : 0;
    return `<tr>
      <td>${l.nom}<br><span class="faible">${l.longueur} cases</span></td>
      <td class="n ${l.achevee ? 'vert' : reste <= 3 ? 'or' : 'doux'}">
        ${l.achevee ? 'ouverte' : reste + ' mois'}</td>
      <td class="n doux">${part > 0 ? pct(part) : '—'}</td>
      <td class="n">${l.achevee ? '—'
        : `<button class="miniInvest" data-liaison="${i}">+800 $</button>`}</td>
    </tr>`;
  }).join('');

  // Ce que voit le joueur : quelles villes partagent déjà un marché.
  const reseaux = monde.marches.map(m => m.villes.map(v => v.nom).join(' + ')).join('<br>');

  return `
    <h3>Les liaisons</h3>
    <table>
      <tr><th>Ligne</th><th class="n">Achèvement</th><th class="n">Votre part</th><th></th></tr>
      ${lignes}
    </table>
    <div class="note">
      Chaque tranche de 800 $ avance la date d'un mois, dans la limite de 40 % du délai
      initial : on peut avancer le rendez-vous, jamais le supprimer.
    </div>

    <h3>Marchés en présence</h3>
    <div class="note">${reseaux}<br><br>
      Les liaisons ne s'additionnent pas, elles se chaînent : si A rejoint B et B rejoint C,
      alors A et C partagent déjà le même marché, sans qu'aucune ligne supplémentaire ait
      été posée.</div>

    <h3>Journal</h3>
    <div class="note">${monde.journal.slice(-8).reverse().join('<br>') || 'Rien à signaler.'}</div>
  `;
}


// ---------------------------------------------------------------------------
// Bâtir. Le volet qui manquait.
//
// Le joueur commence sans un pouce de terre. Pour bâtir il fallait deviner
// qu'une case libre de la frontière était achetable, l'acheter, puis la
// re-cliquer — deux gestes que rien n'annonçait, sur une case que la carte ne
// distinguait pas des autres. On choisit maintenant le bâtiment d'abord, et la
// carte montre elle-même où il peut aller.
// ---------------------------------------------------------------------------

const MENU_BATIR = [
  ['Logement', ['maison', 'immeuble']],
  ['Exploitation', ['coupe', 'carriere', 'mineCharbon', 'mineFer', 'ferme', 'ranch']],
  ['Transformation', ['scierie', 'briqueterie', 'minoterie', 'abattoir', 'acierie']],
  ['Manufacture', ['manufacture']],
  ['Rapport et négoce', ['bureaux', 'entrepot']],
];

function voletBatir(monde, rendu) {
  const joueur = monde.joueur;
  // Le devis se chiffre dans la ville qu'on regarde : les matériaux n'ont pas
  // le même prix d'un marché à l'autre tant que le rail ne les a pas réunis.
  const v = monde.villeChoisie || rendu.villeAuCentre() || monde.villes[0];
  const m = v.marche;

  const groupes = MENU_BATIR.map(([titre, types]) => {
    const lignes = types.map(t => {
      const def = BAT[t];
      let materiel = 0;
      for (const [r, q] of Object.entries(materiaux(t))) materiel += q * m.prix[r];
      const cher = materiel / coutRef(t);
      const choisi = rendu.pose === t;
      const abordable = joueur.tresorerie >= materiel;
      const vise = rendementVise(t);
      return `<button class="ligneBatir ${choisi ? 'actif' : ''}" data-batir="${t}"
                ${abordable ? '' : 'disabled'}>
        <span class="puce" style="background:${COULEURS[t]}"></span>
        <span class="nomBat">${def.nom}</span>
        <span class="sousBat">${def.w}×${def.h}${vise ? ' · visé ' + Math.round(vise * 100) + ' %' : ''}</span>
        <span class="prixBat ${cher > 1.25 ? 'rouge' : cher < 0.85 ? 'vert' : 'doux'}">${eur(materiel)}</span>
      </button>`;
    }).join('');
    return `<h3>${titre}</h3><div class="listeBatir">${lignes}</div>`;
  }).join('');

  const enCours = rendu.pose
    ? `<div class="avertBatir">Posez la <b>${BAT[rendu.pose].nom}</b> — touchez la carte.
         Les cases possibles sont cerclées d'or.
         <button id="btnAnnulerPose">Annuler</button></div>`
    : `<div class="note">Choisissez un bâtiment, puis touchez la carte à l'endroit voulu.
         Le terrain qui vous manque est acheté dans le même geste — on ne peut prendre
         qu'une terre vierge touchant la frontière urbaine, ou celle d'un indépendant,
         jamais celle d'un rival.</div>`;

  return `<div class="grille">
      <div class="fiche"><div class="etiq">Trésorerie</div>
        <div class="v or">${eur(joueur.tresorerie)}</div></div>
      <div class="fiche"><div class="etiq">Devis établi à</div>
        <div class="v" style="font-size:12px">${v.nom}</div></div>
    </div>
    ${enCours}${groupes}
    <div class="note">Le prix affiché est celui des <b>matériaux au marché du jour</b> ;
      le foncier s'y ajoute selon l'endroit et vous est annoncé avant de valider. Le cash
      part immédiatement, le chantier ne sort de terre qu'à la dernière brique livrée.</div>`;
}

// ===== js/ui/feuille.js ==============================================

// ---------------------------------------------------------------------------
// La feuille d'inspection : ce qu'on voit quand on clique une case.
//
// Elle remonte du bas de l'écran, la carte restant entièrement visible
// au-dessus. Un panneau flottant masquerait plusieurs bâtiments et le joueur
// perdrait le contexte de ce qu'il inspecte. (§21)
// ---------------------------------------------------------------------------





const NOMS_QUALITE = { fertilite: 'Fertilité', argile: 'Argile', bois: 'Bois',
                       charbon: 'Charbon', minerai: 'Minerai' };

// Les quartiers ne sont pas décoratifs : ils décident de ce qu'on peut y bâtir
// à bon compte, et empêchent les ateliers de cerner les maisons.
const NOMS_QUARTIER = { residentiel: 'd\'habitation', industriel: 'industriel',
                        negoce: 'de négoce', agricole: 'agricole' };

// Ce qu'on peut bâtir, groupé comme le joueur y pense.
const MENU = [
  ['Logement', ['maison', 'immeuble']],
  ['Exploitation', ['coupe', 'carriere', 'mineCharbon', 'mineFer', 'ferme', 'ranch']],
  ['Transformation', ['scierie', 'briqueterie', 'minoterie', 'abattoir', 'acierie']],
  ['Manufacture', ['manufacture']],
  ['Rapport et négoce', ['bureaux', 'entrepot']],
];

function contenuFeuille(monde, c) {
  if (!c) return '';
  const v = c.ville;

  if (c.voie) return entete('Emprise de voie ferrée', 'Réservée — non constructible')
    + `<div class="note">Le rail passera ici. Les emprises sont visibles dès la première
       seconde : le joueur sait où la ligne aboutira, et peut acheter autour.</div>`;

  if (c.chantier) return ficheChantier(monde, c.chantier);
  if (c.bat) return ficheBatiment(monde, c.bat, c);
  if (!v) return ficheCampagne(c);
  return ficheTerrain(monde, v, c);
}

function entete(titre, sous) {
  return `<h2>${titre}</h2><div class="soustitre">${sous}</div>`;
}

// --- Un terrain -------------------------------------------------------------

function ficheTerrain(monde, v, c) {
  const joueur = monde.joueur;
  const aMoi = c.proprio === joueur.id;
  const prix = monde.prixCase(v, c);
  const base = prixTerrain(v.niveau, c.distanceGare, qualiteMax(c));

  const qualites = QUALITES.map(q => {
    const n = c.q[q];
    const couleur = n >= 4 ? 'vert' : n <= 2 ? 'rouge' : 'doux';
    return `<div class="fiche"><div class="etiq">${NOMS_QUALITE[q]}</div>
      <div class="v ${couleur}">${n}<span class="faible" style="font-size:11px"> / 5</span></div></div>`;
  }).join('');

  let proprio = 'Vierge';
  if (c.proprio === 'ind') proprio = 'Propriétaire indépendant';
  else if (c.proprio) {
    const s = monde.societes.find(x => x.id === c.proprio);
    proprio = s ? s.nom : 'Inconnu';
  }

  const achetable = estAchetable(monde, c) || c.proprio === 'ind';
  let actions = '';
  if (aMoi) {
    actions = menuConstruire(monde, v, c);
  } else if (achetable) {
    const peut = joueur.tresorerie >= prix;
    actions = `<div class="actions">
      <button class="primaire" id="btnAcheter" ${peut ? '' : 'disabled'}>Acheter — ${eur(prix)}</button>
    </div>
    ${c.proprio === 'ind' ? `<div class="note">Un indépendant vend au prix du marché
      majoré de 20 % (${eur(base)} + 20 %). C'est le raccourci qui permet de contourner la
      règle de contiguïté — payant, donc réservé aux cases qui comptent.</div>` : ''}
    ${peut ? '' : '<div class="avert">Trésorerie insuffisante.</div>'}`;
  } else {
    actions = `<div class="note">Hors de portée. On ne peut acheter une terre vierge que si
      elle touche une terre déjà vendue ou bâtie : la ville s'étend en anneaux depuis sa gare,
      et il existe à chaque instant une frontière étroite et disputée.</div>`;
  }

  return entete(`${RELIEFS[c.relief].nom} · ${c.x},${c.y}`,
                `${proprio} · ${c.quartier ? 'quartier ' + NOMS_QUARTIER[c.quartier] : ''} — à ${c.distanceGare} cases de la gare`)
    + `<div class="grille">${qualites}</div>`
    + `<div class="grille">
        <div class="fiche"><div class="etiq">Prix du sol</div><div class="v">${eur(prix)}</div></div>
        <div class="fiche"><div class="etiq">Facteur ville</div><div class="v">×${P.facteurNiveau[v.niveau - 1].toFixed(1)}</div></div>
        <div class="fiche"><div class="etiq">Facteur distance</div><div class="v">×${(1 / (1 + P.attenuationDistance * c.distanceGare)).toFixed(2)}</div></div>
      </div>`
    + actions;
}

// --- Le menu de construction ------------------------------------------------

function menuConstruire(monde, v, c) {
  const joueur = monde.joueur;
  const m = v.marche;

  const groupes = MENU.map(([titre, types]) => {
    const boutons = types.map(t => {
      const def = BAT[t];
      // La facture est établie au prix du marché local du jour où le chantier
      // est lancé. Bâtir pendant une surproduction de briques revient beaucoup
      // moins cher que pendant une pénurie.
      let cout = 0;
      for (const [r, q] of Object.entries(materiaux(t))) cout += q * m.prix[r];
      const emprise = empriseDepuis(monde, c, t);
      const possible = !!emprise && joueur.tresorerie >= cout;
      const cher = cout / coutRef(t);
      return `<button class="btnBatir" data-type="${t}" ${possible ? '' : 'disabled'}
        title="${def.nom}">
        <span class="puce" style="background:${COULEURS[t]}"></span>${def.nom}
        <span class="${cher > 1.25 ? 'rouge' : cher < 0.85 ? 'vert' : 'doux'}"> ${eur(cout)}</span>
      </button>`;
    }).join('');
    return `<div class="etiq" style="margin:9px 0 4px">${titre}</div><div class="actions">${boutons}</div>`;
  }).join('');

  return groupes + `<div class="note">
    Le coût est établi <b>au prix du marché du jour</b> : un bâtiment ne coûte jamais deux
    fois la même chose. On bâtit quand les matériaux sont au plus bas — c'est-à-dire au
    moment précis où l'on peut le moins se le permettre.<br><br>
    Le cash part immédiatement ; le chantier reste un trou dans le sol tant que la dernière
    brique n'est pas livrée.</div>`;
}

// Cherche une emprise de la bonne forme, ancrée sur la case cliquée, dont le
// joueur possède déjà toutes les cases OU peut les acheter sur-le-champ.
//
// C'est la fonction du mode « Bâtir ». Exiger de posséder d'abord chaque case
// était le vrai obstacle : le joueur commence sans un pouce de terre, et rien
// dans l'interface ne lui disait qu'il fallait acheter avant de pouvoir bâtir.
// Ici on additionne le foncier manquant au devis, et `ouvrirChantier` achète le
// tout d'un seul geste.
function empriseConstructible(monde, c, type) {
  const def = BAT[type];
  const joueur = monde.joueur;
  let meilleur = null;
  for (let dy = 0; dy < def.h; dy++) for (let dx = 0; dx < def.w; dx++) {
    const cases = [];
    let ok = true, terrain = 0;
    for (let j = 0; j < def.h && ok; j++) for (let i = 0; i < def.w && ok; i++) {
      const k = monde.caseAt(c.x - dx + i, c.y - dy + j);
      if (!k || !k.ville || k.voie || k.bat || k.chantier) { ok = false; break; }
      if (k.proprio !== joueur.id) {
        // Une terre vierge doit toucher la frontière ; un indépendant vend
        // toujours, plus cher. Le reste appartient à un rival : on ne prend pas.
        if (k.proprio && k.proprio !== 'ind') { ok = false; break; }
        if (!k.proprio && !estAchetable(monde, k)) { ok = false; break; }
        terrain += monde.prixCase(k.ville, k);
      }
      cases.push(k);
    }
    if (!ok || cases.length !== def.cases) continue;
    // À forme égale, on prend l'emprise la moins chère en foncier.
    if (!meilleur || terrain < meilleur.terrain) meilleur = { cases, terrain };
  }
  return meilleur;
}

// Le devis complet d'un bâtiment posé ici : le foncier manquant plus les
// matériaux au prix du marché local du jour.
function devis(monde, c, type) {
  const e = empriseConstructible(monde, c, type);
  if (!e) return null;
  const m = c.ville.marche;
  let materiel = 0;
  for (const [r, q] of Object.entries(materiaux(type))) materiel += q * m.prix[r];
  return { cases: e.cases, terrain: e.terrain, materiel, total: e.terrain + materiel };
}

// L'ancienne version, qui exige la pleine possession : c'est encore la bonne
// pour le menu qui s'ouvre sur une case qu'on détient déjà.
function empriseDepuis(monde, c, type) {
  const def = BAT[type];
  const joueur = monde.joueur;
  for (let dy = 0; dy < def.h; dy++) for (let dx = 0; dx < def.w; dx++) {
    const cases = [];
    let ok = true;
    for (let j = 0; j < def.h && ok; j++) for (let i = 0; i < def.w && ok; i++) {
      const k = monde.caseAt(c.x - dx + i, c.y - dy + j);
      if (!k || k.voie || k.bat || k.chantier || k.proprio !== joueur.id) {
        ok = false; break;
      }
      cases.push(k);
    }
    if (ok && cases.length === def.cases) return cases;
  }
  return null;
}

// Hors des territoires : on ne bâtit pas en rase campagne. C'est ce qui donne
// leur valeur aux cases de la frontière urbaine.
function ficheCampagne(c) {
  const qualites = QUALITES.map(q => {
    const n = c.q[q];
    return `<div class="fiche"><div class="etiq">${NOMS_QUALITE[q]}</div>
      <div class="v ${n >= 4 ? 'vert' : n <= 2 ? 'rouge' : 'doux'}">${n}
      <span class="faible" style="font-size:11px"> / 5</span></div></div>`;
  }).join('');
  return entete(RELIEFS[c.relief].nom, 'Rase campagne — hors de tout territoire')
    + `<div class="grille">${qualites}</div>`
    + `<div class="note">Aucune ville ne s'étend jusqu'ici. On ne bâtit que dans le
       territoire d'une ville, et il s'étend en anneaux depuis sa gare.</div>`;
}

// --- Un chantier ------------------------------------------------------------

function ficheChantier(monde, ch) {
  const m = ch.ville.marche;
  const lignes = Object.entries(materiaux(ch.type)).map(([r, total]) => {
    const recu = ch.recu[r] || 0;
    return `<tr><td><span class="puce" style="background:${RES[r].couleur}"></span>${RES[r].nom}</td>
      <td class="n">${Math.round(recu)} / ${total}</td>
      <td class="n ${m.service[r] < 0.9 ? 'rouge' : 'doux'}">${pct(m.service[r])} servi</td></tr>`;
  }).join('');

  return entete(`Chantier — ${BAT[ch.type].nom}`,
    `${ch.societe.nom} · ouvert au mois ${ch.ouvertLe} · ${pct(ch.progression())} livré`)
    + `<table>${lignes}</table>
    <div class="note">Le bâtiment ne sortira de terre que le mois où la dernière brique sera
    livrée. Ouvrir trop de chantiers à la fois, c'est immobiliser son cash dans des trous —
    c'est le principal piège de trésorerie du jeu.</div>`;
}

// --- Un bâtiment ------------------------------------------------------------

const TEXTE_ALERTE = {
  matieres: 'Manque de matières premières',
  bras: 'Manque de main-d\'œuvre',
  invendus: 'Locaux vacants',
  perte: 'Perte financière',
};

// --- La ville vue depuis un logement ----------------------------------------
//
// Un immeuble ne vaut que par le pouvoir d'achat de ceux qui l'habitent. Le
// loyer suit le foncier, l'occupation suit la population, et la population suit
// les trois baromètres. Ces chiffres-là ne sont donc pas du décor : ce sont les
// variables dont dépend directement le revenu du propriétaire.
function jauge(etiquette, valeur, texte, inverse = false) {
  const t = inverse ? 1 - valeur : valeur;
  const couleur = rgb(echelle(Math.max(0, Math.min(1, t))));
  return `<div class="fiche"><div class="etiq">${etiquette}</div>
    <div class="v" style="color:${couleur}">${texte}</div>
    <div style="margin-top:5px;height:5px;border-radius:3px;background:rgba(255,255,255,.10);overflow:hidden">
      <div style="height:100%;width:${(Math.max(0, Math.min(1, valeur)) * 100).toFixed(0)}%;background:${couleur}"></div>
    </div></div>`;
}

function ficheVilleDepuisLogement(v) {
  const b = v.barometres;
  const chomage = 1 - b.emploi;
  const epargne = v.tauxEpargne === undefined ? 0 : v.tauxEpargne;

  return `<h3>La ville, vue d'ici</h3>
    <div class="grille">
      ${jauge('Chômage', chomage, pct(chomage), true)}
      ${jauge('Nourriture', b.nourriture, pct(b.nourriture))}
      ${jauge('Produits manufacturés', b.produits, pct(b.produits))}
    </div>
    <div class="grille">
      <div class="fiche"><div class="etiq">Salaire de case</div>
        <div class="v">${v.salaire.toFixed(2)} $</div>
        <div class="etiq" style="margin-top:2px">barème ${P.salaireCase} $</div></div>
      <div class="fiche"><div class="etiq">Revenu du ménage</div>
        <div class="v doux">${eur(v.revenuMenage || 0)}</div>
        <div class="etiq" style="margin-top:2px">2 employés, emploi compris</div></div>
      ${jauge('Taux d\'épargne', epargne, pct(epargne))}
    </div>
    <div class="note">Le ménage paie d'abord sa nourriture et son loyer ; c'est l'achat de
      produits manufacturés qui encaisse tout le chômage. Ce qui reste après le panier ne
      dort pas : il bâtit la ville, et ce sont ces chantiers-là que l'on rachète.</div>`;
}

function ficheBatiment(monde, b, c) {
  const def = b.def, m = b.ville.marche;
  const joueur = monde.joueur;
  const aMoi = b.societe === joueur;
  const independant = !b.societe;
  const proprio = independant ? 'Propriétaire indépendant' : b.societe.nom;

  const rdt = b.rendement;
  const vise = rendementVise(b.type);
  const seuil = b.seuilActivite(m);

  // --- Ce qu'il rapporte ---------------------------------------------------
  const exploitation = `
    <div class="grille">
      <div class="fiche"><div class="etiq">Rentabilité</div>
        <div class="v" style="color:${rgb(echelle(b.tenue()))}">${(rdt * 100).toFixed(1)} %</div>
        <div class="etiq" style="margin-top:2px">visé ${(vise * 100).toFixed(0)} %</div></div>
      <div class="fiche"><div class="etiq">Résultat du mois</div>
        <div class="v ${b.resultat >= 0 ? 'vert' : 'rouge'}">${eur(b.resultat)}</div></div>
      <div class="fiche"><div class="etiq">Profit sur 12 mois</div>
        <div class="v ${b.profitAnnuel >= 0 ? 'vert' : 'rouge'}">${eur(b.profitAnnuel)}</div></div>
      <div class="fiche"><div class="etiq">Activité</div><div class="v">${pct(b.tauxReel)}</div></div>
      <div class="fiche"><div class="etiq">Entretien</div>
        <div class="v doux">${b.entretien.toFixed(2)} $</div></div>
      <div class="fiche"><div class="etiq">Valeur</div>
        <div class="v">${eur(b.valeur(monde.multiple))}</div></div>
      <div class="fiche"><div class="etiq">Prix de revient</div>
        <div class="v doux">${eur(b.prixDeRevient)}</div></div>
    </div>
    <div class="note">La rentabilité se mesure sur le prix de revient — terrain et matériaux
      au prix du jour — et se compare au rendement que le barème assigne à son palier.
      ${rdt >= vise ? '<span class="vert">Ce bâtiment tient sa promesse.</span>'
        : rdt <= 0 ? '<span class="rouge">Il ne rapporte rien.</span>'
        : `<span class="doux">Il en tient ${Math.round(b.tenue() * 100)} %.</span>`}</div>`;

  // --- Ce qu'il consomme, et ce qui lui manque -----------------------------
  let intrants = '';
  const liste = b.intrants();
  if (liste.length) {
    intrants = `<h3>Ce qu'il consomme</h3><table>
      <tr><th>Intrant</th><th class="n">Reçu / demandé</th><th class="n">Prix</th></tr>
      ${liste.map(i => {
        const manque = i.part < 0.97;
        return `<tr>
          <td><span class="puce" style="background:${RES[i.res].couleur}"></span>${RES[i.res].nom}</td>
          <td class="n ${manque ? 'rouge' : 'vert'}">${Math.round(i.recu)} / ${Math.round(i.demande)}
            ${manque ? ` <b>· il manque ${Math.round(i.demande - i.recu)}</b>` : ' ✓'}</td>
          <td class="n doux">${m.prix[i.res].toFixed(2)} $</td>
        </tr>`;
      }).join('')}
    </table>`;
    const pire = liste.slice().sort((a, x) => a.part - x.part)[0];
    if (pire.part < 0.97) {
      intrants += `<div class="avert">Rationné sur ${RES[pire.res].nom.toLowerCase()} :
        il ne tourne qu'à ${pct(b.tauxReel)}. On ne scie pas du bois qu'on n'a pas — c'est
        la loi du minimum, et elle ne se contourne qu'en amont.</div>`;
    }
  }

  // --- Ce qu'il produit ----------------------------------------------------
  let production = '';
  if (def.sort) {
    production = `<h3>Ce qu'il produit</h3>
      <div class="grille">
        <div class="fiche"><div class="etiq">${RES[def.sort].nom} par mois</div>
          <div class="v">${b.production.toFixed(0)}
            <span class="faible" style="font-size:11px"> / ${b.capacite.toFixed(0)}</span></div></div>
        <div class="fiche"><div class="etiq">Prix de vente</div>
          <div class="v">${m.prix[def.sort].toFixed(2)} $</div></div>
        <div class="fiche"><div class="etiq">Marge par unité</div>
          <div class="v ${b.margeUnitaire > 0 ? 'vert' : 'rouge'}">${b.margeUnitaire.toFixed(2)} $</div></div>
        <div class="fiche"><div class="etiq">Seuil d'activité</div>
          <div class="v ${seuil > 0.6 ? 'rouge' : 'doux'}">${isFinite(seuil) ? pct(seuil) : 'hors d\'atteinte'}</div></div>
      </div>`;
  }

  // Un logement : ce qui décide de son loyer et de son occupation, c'est l'état
  // de la ville, pas ce qui se passe entre ses murs.
  const ville = def.cat === 'loge' ? ficheVilleDepuisLogement(b.ville) : '';

  // --- Le terrain sous le bâtiment ----------------------------------------
  // Ce qu'il y a sous les fondations décide de ce que vaut le bâtiment autant
  // que ce qu'il produit : le terrain est la moitié du coût d'une maison, et la
  // qualité du sol commande le rendement de toute exploitation.
  const qMoy = {};
  for (const q of QUALITES) {
    qMoy[q] = b.cases.reduce((s, k) => s + k.q[q], 0) / b.cases.length;
  }
  const sol = `<h3>Le terrain — ${b.cases.length} case${b.cases.length > 1 ? 's' : ''}</h3>
    <div class="grille">
      ${QUALITES.map(q => {
        const n = qMoy[q];
        const vise = def.qual === q;
        return `<div class="fiche" ${vise ? 'style="border-color:var(--or)"' : ''}>
          <div class="etiq">${NOMS_QUALITE[q]}${vise ? ' ★' : ''}</div>
          <div class="v ${n >= 3.5 ? 'vert' : n <= 2.2 ? 'rouge' : 'doux'}">${n.toFixed(1)}
            <span class="faible" style="font-size:11px"> / 5</span></div></div>`;
      }).join('')}
    </div>
    <div class="grille">
      <div class="fiche"><div class="etiq">Prix du sol</div>
        <div class="v">${eur(b.terrainCourant)}</div></div>
      <div class="fiche"><div class="etiq">Payé à l'achat</div>
        <div class="v doux">${eur(b.terrain)}</div></div>
      <div class="fiche"><div class="etiq">Distance à la gare</div>
        <div class="v doux">${b.cases[0].distanceGare}</div></div>
      <div class="fiche"><div class="etiq">Quartier</div>
        <div class="v doux" style="font-size:12px">${NOMS_QUARTIER[b.cases[0].quartier] || '—'}</div></div>
    </div>
    ${def.qual ? `<div class="note">Sol de qualité <b>${b.qualite.toFixed(1)} / 5</b> : cette
      exploitation sort ${facteurQualite(b.qualite).toFixed(2)}× ce que sortirait la même sur une terre
      moyenne. Un handicap de terrain ne fait aucun bruit — il se lit uniquement dans la
      marge, et il ne se guérit jamais.</div>` : ''}`;

  // --- Ce qu'on peut en faire ---------------------------------------------
  let actions = '';

  if (aMoi) {
    if (def.sort) {
      actions += `
        <h3>Curseur d'activité — ${Math.round(b.activite * 100)} %</h3>
        <input type="range" id="curseurActivite" min="0" max="100" value="${Math.round(b.activite * 100)}">
        <div class="actions" style="margin-top:6px">
          <button class="preReglage" data-v="0">Sommeil</button>
          <button class="preReglage" data-v="50">50 %</button>
          <button class="preReglage" data-v="100">100 %</button>
          ${joueur.entrepotDans(b.ville)
            ? `<button id="btnEntrepot">${b.versEntrepot ? '↺ Vendre au marché' : '⇥ Vers l\'entrepôt'}</button>` : ''}
        </div>
        <div class="note">Curseur à zéro : plus de matières achetées, plus de salaires versés.
        Le bâtiment reste debout moyennant un entretien réduit à 10 % de sa masse salariale.</div>`;
    }
    actions += `<div class="actions" style="margin-top:10px">
      <button id="btnDemolir">Démolir</button></div>
      <div class="note">Vous conservez le terrain, ne récupérez aucun matériau, et la case est
      libre le mois suivant. C'est le seul moyen, pour une ville saturée, de se densifier.</div>`;

  } else if (independant) {
    // Un indépendant vend à qui le demande, au prix du marché majoré de 20 %.
    const prix = monde.prixRachatIndependant(b);
    const peut = joueur.tresorerie >= prix;
    actions = `<h3>L'acquérir</h3>
      <div class="actions">
        <button class="primaire" id="btnRacheter" ${peut ? '' : 'disabled'}>
          Racheter — ${eur(prix)}</button>
      </div>
      <div class="note">Un propriétaire indépendant vend à qui le demande, au prix du marché
      majoré de 20 % — ${eur(b.valeur(monde.multiple))} + 20 %. C'est cher, et c'est le
      raccourci : on n'attend pas d'avoir bâti.</div>
      ${peut ? '' : '<div class="avert">Trésorerie insuffisante.</div>'}`;

  } else {
    // Une offre sur le bien d'un rival : un curseur, une réponse en un clic.
    const possible = monde.offrePossible(b, joueur);
    const rentable = b.profitAnnuel > 0;
    actions = `<h3>Faire une offre à ${b.societe.nom}</h3>`;
    if (!possible) {
      actions += `<div class="note">Vous avez déjà fait une offre à cette société ce mois-ci.
        Une seule par mois et par adversaire : cela interdit le harcèlement et, surtout, cela
        force à choisir le bâtiment qui compte vraiment.</div>`;
    } else {
      actions += `
        <input type="range" id="curseurOffre" min="5" max="15" step="1" value="10">
        <div class="actions" style="margin-top:6px">
          <button class="primaire" id="btnOffre">Offrir <span id="montantOffre">—</span></button>
        </div>
        <div class="note" id="lectureOffre"></div>
        <div class="note">
          ${rentable
            ? `Le curseur va de 5 à 15 fois le profit des douze derniers mois. Le marché paie
               <b>×${monde.multiple}</b> en ce moment : offrir moins est une insulte, offrir
               plus est un prix de dépossession — rationnel seulement pour un bâtiment
               stratégique.`
            : `Ce bâtiment ne gagne rien : l'offre porte sur son plancher — terrain et
               matériaux — de 80 % à 120 %.`}
        </div>`;
    }
  }

  return entete(def.nom,
      `${proprio} · ${b.ville.nom}`
      + (b.alerte ? ` · <span class="rouge">⚠ ${TEXTE_ALERTE[b.alerte]}</span>` : ''))
    + exploitation + ville + production + intrants + sol + actions;
}

// ===== js/main.js ====================================================

// ---------------------------------------------------------------------------
// Orchestration : la boucle de temps, les entrées, le rafraîchissement.
//
// Un mois dure dix secondes réelles. Le joueur revient toutes les dix secondes
// pour saisir une opportunité, puis a sept secondes pour réfléchir.
// ---------------------------------------------------------------------------






const MOIS = ['janv.', 'févr.', 'mars', 'avril', 'mai', 'juin',
              'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

// Pas de durée : la partie court tant que le joueur la fait courir.
const monde = new Monde({ nbVilles: 5, graine: (Math.random() * 1e9) | 0 });
const cv = $('#carte');
const rendu = new Rendu(cv, monde);

let enMarche = false, vitesse = 1, horloge = 0;
let vueVolet = null;                 // 'filtres' | 'villes' | 'marche' | 'societe' | 'rail'

// --- Boucle -----------------------------------------------------------------

let precedent = performance.now();
function boucle(t) {
  const dt = Math.min(250, t - precedent);
  precedent = t;

  if (enMarche) {
    horloge += dt * vitesse;
    const duree = P.moisParSeconde * 1000;
    while (horloge >= duree) {
      horloge -= duree;
      monde.tick();
      rendu.rafraichirIndex();
      rafraichirTout();
    }
  }

  rendu.dessiner();
  requestAnimationFrame(boucle);
}

// --- Affichage --------------------------------------------------------------

function rafraichirTout() { rafraichirBarre(); rafraichirVolet(); rafraichirFeuille(); }

function rafraichirBarre() {
  const s = monde.joueur;
  $('#date').textContent = `An ${Math.floor(monde.mois / 12) + 1} · ${MOIS[monde.mois % 12]}`;
  // Sans date butoir, ce qui compte n'est plus le temps qui reste mais la
  // valeur qu'on a bâtie. On affiche donc le rang.
  const clst = monde.classement();
  const rg = clst.findIndex(x => x.societe === s) + 1;
  $('#restant').textContent = `${rg === 1 ? '1er' : rg + 'e'} sur ${clst.length}`;
  $('#tresorerie').textContent = eur(s.tresorerie);

  const r = s.resultatMensuel;
  const el = $('#resultat');
  el.textContent = (r >= 0 ? '+' : '') + eur(r);
  el.className = 'sous ' + (r > 0 ? 'vert' : r < 0 ? 'rouge' : 'doux');

  $('#fortune').textContent = eur(s.cours(monde.multiple) * s.actions * P.partFondateur);
  $('#rang').textContent = `cours ${s.cours(monde.multiple).toFixed(2).replace('.', ',')} $`;
}

// --- Volet ------------------------------------------------------------------

const TITRES = { filtres: 'Filtres', villes: 'Les villes', marche: 'Le marché',
                 societe: 'Ma société', rail: 'Le chemin de fer', batir: 'Bâtir' };

function ouvrirVolet(vue) {
  vueVolet = vue;
  $('#volet').classList.remove('cachee');
  $('#voletTitre').textContent = TITRES[vue];
  document.querySelectorAll('.ico').forEach(b =>
    b.classList.toggle('actif',
      b.dataset.vue === vue || (vue === 'filtres' && b.id === 'btnFiltres')));
  rafraichirVolet();
}

function fermerVolet() {
  vueVolet = null;
  $('#volet').classList.add('cachee');
  document.querySelectorAll('.ico').forEach(b => b.classList.remove('actif'));
}

function rafraichirVolet() {
  if (!vueVolet) return;
  const corps = $('#voletCorps');
  const haut = corps.scrollTop;
  corps.innerHTML =
      vueVolet === 'filtres' ? voletFiltres(monde, rendu)
    : vueVolet === 'villes'  ? voletVilles(monde)
    : vueVolet === 'marche'  ? voletMarche(monde, rendu)
    : vueVolet === 'societe' ? voletSociete(monde)
    : vueVolet === 'batir'   ? voletBatir(monde, rendu)
    : voletRail(monde);
  corps.scrollTop = haut;
  brancherVolet(corps);
}

function brancherVolet(corps) {
  corps.querySelectorAll('[data-filtre]').forEach(b => b.onclick = () => {
    appliquerFiltre(b.dataset.filtre || null, null);
    rafraichirVolet();
  });
  corps.querySelectorAll('[data-prix]').forEach(b => b.onclick = () => {
    appliquerFiltre(null, b.dataset.prix);
    rafraichirVolet();
  });
  corps.querySelectorAll('[data-rdt]').forEach(b => b.onclick = () => {
    appliquerFiltre(null, null, b.dataset.rdt);
    rafraichirVolet();
  });
  corps.querySelectorAll('[data-ville]').forEach(b => b.onclick = () => {
    const v = monde.villes[+b.dataset.ville];
    monde.villeChoisie = v;
    rendu.cadrerVille(v);
    rafraichirVolet();
  });
  corps.querySelectorAll('.ligneBat').forEach(tr => tr.onclick = () => {
    const b = monde.joueur.batiments.find(x => x.id === +tr.dataset.bat);
    if (!b) return;
    rendu.selection = b.cases[0];
    rendu.cadrerVille(b.ville);
    fermerVolet();
    ouvrirFeuille(); rafraichirFeuille();
  });
  corps.querySelectorAll('[data-batir]').forEach(b => b.onclick = () => {
    // Re-toucher le bâtiment déjà choisi annule la pose : on ne se retrouve
    // jamais coincé dans un mode dont on ne sait pas sortir.
    const meme = rendu.pose === b.dataset.batir;
    rendu.pose = meme ? null : b.dataset.batir;
    rendu.survol = null;
    // Et le volet s'efface — sur téléphone il couvre les trois quarts de
    // l'écran, si bien que le doigt tendu vers la carte retombait sur la liste
    // et changeait de bâtiment au lieu d'en poser un. Le bandeau du haut suffit
    // à rappeler ce qu'on est en train de faire.
    if (!meme) { fermerVolet(); fermerFeuille(); }
    majBandeauPose();
    if (vueVolet) rafraichirVolet();
  });
  const annuler = corps.querySelector('#btnAnnulerPose');
  if (annuler) annuler.onclick = () => {
    rendu.pose = null; rendu.survol = null; majBandeauPose(); rafraichirVolet();
  };

  corps.querySelectorAll('.miniInvest').forEach(btn => btn.onclick = () => {
    monde.investirRail(monde.liaisons[+btn.dataset.liaison], monde.joueur, 800);
    rafraichirTout();
  });
}

// Le bandeau rappelle en permanence qu'on regarde une donnée et non la carte :
// sans lui, on oublie le filtre actif et on lit des couleurs qui ne sont pas
// celles des bâtiments.
function appliquerFiltre(nom, prix, rdt) {
  rendu.choisirFiltre(nom, prix, rdt);
  const b = $('#bandeauFiltre');
  if (!nom && !prix && !rdt) { b.classList.add('cachee'); return; }
  b.classList.remove('cachee');
  $('#bandeauNom').textContent =
      rdt ? (rdt === 'tous' ? 'Rentabilité — tous' : `Rentabilité — ${BAT[rdt].nom}`)
    : prix ? `Prix — ${RES[prix].nom}`
    : nom === 'proprio' ? 'Mes possessions'
    : (FILTRES_CASE[nom] || FILTRES_VILLE[nom]).nom;
  $('#bandeauEchelle').style.display = nom === 'proprio' ? 'none' : '';
}

// Le bandeau du haut sert aussi de rappel de mode : on ne doit jamais pouvoir
// toucher la carte sans savoir ce qui va s'y passer.
function majBandeauPose() {
  const b = $('#bandeauFiltre');
  $('#btnQuitterFiltre').textContent = 'Voir les bâtiments';
  if (!rendu.pose) {
    if (!rendu.filtre && !rendu.filtrePrix && !rendu.filtreRdt) b.classList.add('cachee');
    else appliquerFiltre(rendu.filtre, rendu.filtrePrix, rendu.filtreRdt);
    return;
  }
  b.classList.remove('cachee');
  $('#bandeauNom').textContent = `Poser — ${BAT[rendu.pose].nom} · touchez la carte`;
  $('#bandeauEchelle').style.display = 'none';
  $('#btnQuitterFiltre').textContent = 'Annuler';
}

// Poser un bâtiment : on achète le foncier manquant et on ouvre le chantier
// d'un seul geste. Le joueur voit le total avant de valider.
function poser(c) {
  const d = devis(monde, c, rendu.pose);
  if (!d) return false;
  const joueur = monde.joueur;
  if (joueur.tresorerie < d.total) {
    $('#bandeauNom').textContent =
      `${BAT[rendu.pose].nom} — ${eur(d.total)}, trésorerie insuffisante`;
    return false;
  }
  // Le foncier des cases qu'on ne possède pas encore est réglé par
  // `ouvrirChantier` lui-même ; il ne reste qu'à les rendre acquérables.
  if (!monde.ouvrirChantier(rendu.pose, c.ville, d.cases, joueur)) return false;
  rendu.rafraichirIndex();
  rendu.pose = null; rendu.survol = null;
  majBandeauPose();
  rafraichirTout();
  return true;
}

// --- Feuille ----------------------------------------------------------------

function ouvrirFeuille() { $('#feuille').classList.remove('fermee'); }
function fermerFeuille() { $('#feuille').classList.add('fermee'); rendu.selection = null; }

function rafraichirFeuille() {
  if ($('#feuille').classList.contains('fermee')) return;
  const c = rendu.selection;
  $('#feuilleCorps').innerHTML = contenuFeuille(monde, c);
  brancherFeuille(c);
}

function brancherFeuille(c) {
  if (!c) return;
  const joueur = monde.joueur;

  const acheter = $('#btnAcheter');
  if (acheter) acheter.onclick = () => {
    if (monde.acheterTerrain(c.ville, c, joueur)) rafraichirTout();
  };

  document.querySelectorAll('.btnBatir').forEach(btn => btn.onclick = () => {
    const cases = empriseDepuis(monde, c, btn.dataset.type);
    if (!cases) return;
    if (monde.ouvrirChantier(btn.dataset.type, c.ville, cases, joueur)) {
      rendu.rafraichirIndex();
      rafraichirTout();
    }
  });

  const cur = $('#curseurActivite');
  if (cur && c.bat) {
    cur.oninput = () => { c.bat.activite = +cur.value / 100; };
    cur.onchange = () => rafraichirTout();
  }
  document.querySelectorAll('.preReglage').forEach(b => b.onclick = () => {
    if (c.bat) { c.bat.activite = +b.dataset.v / 100; rafraichirTout(); }
  });

  const ent = $('#btnEntrepot');
  if (ent && c.bat) ent.onclick = () => {
    c.bat.versEntrepot = !c.bat.versEntrepot; rafraichirTout();
  };

  const dem = $('#btnDemolir');
  if (dem && c.bat) dem.onclick = () => {
    monde.demolir(c.bat); rendu.rafraichirIndex(); fermerFeuille(); rafraichirTout();
  };

  // Racheter à un indépendant : il vend toujours, au prix majoré.
  const rach = $('#btnRacheter');
  if (rach && c.bat) rach.onclick = () => {
    if (monde.acheterBatiment(c.bat, joueur)) { rendu.rafraichirIndex(); rafraichirTout(); }
  };

  // Offrir à un rival : le curseur dit le prix, la cible répond en un clic.
  const cur2 = $('#curseurOffre');
  if (cur2 && c.bat) {
    const majMontant = () => {
      const prix = monde.prixOffre(c.bat, +cur2.value);
      $('#montantOffre').textContent = eur(prix);
      const valeur = c.bat.valeur(monde.multiple);
      const ecart = prix / valeur;
      $('#lectureOffre').innerHTML = c.bat.profitAnnuel > 0
        ? `×${cur2.value} le profit, soit ${eur(prix)} — `
          + (ecart < 0.95 ? '<span class="rouge">sous la valeur du bâtiment</span>'
             : ecart > 1.25 ? '<span class="or">bien au-dessus : un prix de dépossession</span>'
             : '<span class="vert">un prix qui peut être accepté</span>')
        : `${eur(prix)} sur un plancher de ${eur(valeur)}`;
      $('#btnOffre').disabled = joueur.tresorerie < prix;
    };
    cur2.oninput = majMontant;
    majMontant();
  }

  const off = $('#btnOffre');
  if (off && c.bat) off.onclick = () => {
    const r = monde.faireOffre(c.bat, joueur, +$('#curseurOffre').value);
    if (!r.fait) { $('#lectureOffre').innerHTML = `<span class="rouge">${r.motif}</span>`; return; }
    rendu.rafraichirIndex();
    rafraichirTout();
    if (!r.accepte) {
      $('#lectureOffre').innerHTML = `<span class="rouge">Offre refusée.</span>
        La cible refuse librement : une offre sous le marché n'est jamais acceptée, sauf par
        quelqu'un qui a besoin d'argent.`;
    }
  };
}

// --- La carte au doigt ------------------------------------------------------
// Un toucher sélectionne, un glissement déplace, deux doigts zooment. Il faut
// distinguer les trois, sans quoi le moindre tremblement de la main ouvrirait
// une fiche au mauvais endroit.

const doigts = new Map();
let depart = null, aGlisse = false, ecartInitial = 0, zoomInitial = 1, dernierToucher = 0;

cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId);
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (doigts.size === 1) {
    depart = { x: e.clientX, y: e.clientY, cx: rendu.cx, cy: rendu.cy };
    aGlisse = false;
  } else if (doigts.size === 2) {
    const [a, b] = [...doigts.values()];
    ecartInitial = Math.hypot(a.x - b.x, a.y - b.y);
    zoomInitial = rendu.zoom;
    aGlisse = true;                     // un pincement n'est jamais une sélection
  }
});

cv.addEventListener('pointermove', (e) => {
  if (!doigts.has(e.pointerId)) return;
  doigts.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (doigts.size >= 2) {
    const [a, b] = [...doigts.values()];
    const ecart = Math.hypot(a.x - b.x, a.y - b.y);
    if (ecartInitial > 8) {
      const r = cv.getBoundingClientRect();
      const cible = Math.max(1, Math.min(28, zoomInitial * ecart / ecartInitial));
      rendu.zoomerVers((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, cible / rendu.zoom);
    }
    return;
  }

  if (!depart) return;
  const dx = e.clientX - depart.x, dy = e.clientY - depart.y;
  if (!aGlisse && Math.hypot(dx, dy) > 9) aGlisse = true;
  if (aGlisse) { rendu.cx = depart.cx + dx; rendu.cy = depart.cy + dy; rendu.recadrer(); }
});

cv.addEventListener('pointerup', (e) => {
  doigts.delete(e.pointerId);
  const t = Date.now();

  if (doigts.size === 0 && depart && !aGlisse) {
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;

    // Deux touchers rapprochés : on approche, plutôt que d'ouvrir une fiche.
    if (t - dernierToucher < 320) {
      rendu.zoomerVers(px, py, 2.0);
    } else {
      const c = rendu.caseSous(px, py);
      if (c && rendu.pose) {
        // Un bâtiment d'une seule case se pose au premier toucher : il n'y a
        // rien à prévisualiser. Pour les autres, le premier toucher montre
        // l'emprise et le second la valide — sur un écran tactile il n'y a pas
        // de survol, et poser à l'aveugle un carré de quatre cases n'est pas
        // jouable.
        if (BAT[rendu.pose].cases === 1 || rendu.survol === c) poser(c);
        else rendu.survol = c;
      } else if (c) {
        rendu.selection = c;
        if (c.ville) monde.villeChoisie = c.ville;
        ouvrirFeuille(); rafraichirFeuille();
      }
    }
  }
  dernierToucher = t;
  if (doigts.size === 0) depart = null;
});

cv.addEventListener('pointercancel', (e) => { doigts.delete(e.pointerId); depart = null; });

cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  rendu.zoomerVers(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.18 : 1 / 1.18);
}, { passive: false });

// --- Commandes --------------------------------------------------------------

function majPause() {
  $('#btnPause').querySelector('.signe').textContent = enMarche ? '❚❚' : '▶';
}

$('#btnPause').onclick = () => { enMarche = !enMarche; majPause(); };

const VITESSES = [1, 4, 20];
$('#btnVitesse').onclick = () => {
  vitesse = VITESSES[(VITESSES.indexOf(vitesse) + 1) % VITESSES.length];
  $('#btnVitesse').textContent = '×' + vitesse;
};

document.querySelectorAll('.ico[data-vue]').forEach(b => b.onclick = () => {
  vueVolet === b.dataset.vue ? fermerVolet() : ouvrirVolet(b.dataset.vue);
});
$('#btnFiltres').onclick = () => vueVolet === 'filtres' ? fermerVolet() : ouvrirVolet('filtres');
$('#btnFermerVolet').onclick = fermerVolet;
$('#feuillePoignee').onclick = fermerFeuille;
$('#btnQuitterFiltre').onclick = () => {
  if (rendu.pose) { rendu.pose = null; rendu.survol = null; majBandeauPose(); }
  else appliquerFiltre(null, null, null);
  if (vueVolet) rafraichirVolet();
};

$('#btnRecentrer').onclick = () => { rendu.zoom = 1; rendu.cx = 0; rendu.cy = 0; };
$('#btnZoomPlus').onclick  = () => rendu.zoomerVers(rendu.w / 2, rendu.h / 2, 1.6);
$('#btnZoomMoins').onclick = () => rendu.zoomerVers(rendu.w / 2, rendu.h / 2, 1 / 1.6);

addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); $('#btnPause').click(); }
  if (e.key === 'Escape') { fermerFeuille(); fermerVolet(); }
});
addEventListener('resize', () => rendu.dimensionner());


// --- Départ -----------------------------------------------------------------

// Exposés pour le banc d'essai : la page se pilote au doigt, mais un test
// doit pouvoir viser une case précise.
// Le rendu a besoin de savoir où un bâtiment tient ; feuille.js importe déjà
// render.js, on injecte donc la fonction plutôt que de croiser les imports.
rendu.emprise = (c, type) => empriseConstructible(monde, c, type);
rendu.villeAuCentre = () => monde.villeChoisie || monde.villes[0];

window.__rendu = rendu; window.__monde = monde; window.__feuille = contenuFeuille; window.__feuille = contenuFeuille;

rendu.dimensionner();
rendu.rafraichirIndex();
// On ouvre sur une ville plutôt que sur la carte entière : le joueur doit voir
// des bâtiments à la première seconde, pas une mosaïque de taches.
rendu.cadrerVille(monde.villes[0]);
monde.villeChoisie = monde.villes[0];
rafraichirTout();
requestAnimationFrame(boucle);
</script>
