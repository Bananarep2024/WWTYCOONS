  // manufactures — bâties tant que le baromètre des produits restait sous sa
  // cible, laquelle est hors d'atteinte par construction, jusqu'à ce que le
  // rendement de TOUTES tombe à zéro.
  let enChantier = 0, installe = 0;
  for (const v of m.villes) {
    for (const b of monde.tousBatiments(v)) if (b.def.sort === def.sort) installe += b.capacite;
    for (const c of monde.tousChantiers(v)) {
      if (BAT[c.type].sort === def.sort) enChantier += BAT[c.type].debit * BAT[c.type].cases;
    }
  }
  enChantier += production;   // le nôtre en fait partie
  const dilution = installe > 0
    ? Math.pow(installe / (installe + enChantier), P.exposantPrix) : 1;

  let mensuel = production * m.prix[def.sort] * dilution - P.salaireCase * def.cases;
  for (const [r, qte] of Object.entries(def.intrants || {})) {
    mensuel -= qte * def.cases * m.prix[r];
  }

  let bati = 0;
  for (const [r, qte] of Object.entries(def.mat)) bati += qte * def.cases * m.prix[r];
  const terrain = cases.reduce((s, c) => s + monde.prixCase(ville, c), 0);
  const revient = terrain + bati;
  if (revient <= 0) return 0;

  return (mensuel * 12 - bati * P.entretienAnnuel) / revient;
}

// Cherche un carré de quatre maisons d'indépendants contiguës et le libère.
// On ne touche jamais au bien d'un joueur : à lui de démolir s'il le veut.
function raserPourDensifier(monde, ville) {
  const def = BAT.immeuble;
  for (const depart of ville.cases) {
    if (depart.quartier !== 'residentiel') continue;
    const lot = [];
    let ok = true;
    for (let dy = 0; dy < def.h && ok; dy++) for (let dx = 0; dx < def.w && ok; dx++) {
      const c = monde.caseAt(depart.x + dx, depart.y + dy);
      if (!c || c.ville !== ville || c.voie || c.chantier) { ok = false; break; }
      // Case libre, ou maison appartenant à un indépendant : les deux conviennent.
      if (c.bat && !(c.bat.type === 'maison' && !c.bat.societe)) { ok = false; break; }
      if (!c.bat && c.proprio && c.proprio !== 'ind') { ok = false; break; }
      lot.push(c);
    }
    if (!ok || lot.length !== def.cases) continue;
    // On ne rase que si l'opération gagne réellement des ménages.
    const perdus = lot.filter(c => c.bat).length;
    if (perdus === 0) continue;                       // trouverEmplacement l'aurait vu
    if (def.menages <= perdus) continue;
    for (const c of lot) if (c.bat) monde.demolir(c.bat);
    return lot;
  }
  return null;
}

function coutEstime(monde, ville, type) {
  const m = ville.marche;
  let c = 0;
  const def = BAT[type];
  for (const [r, q] of Object.entries(def.mat)) c += q * def.cases * m.prix[r];
  return c + def.cases * monde.prixCase(ville, { distanceGare: 8, proprio: 'ind' });
}

// ---------------------------------------------------------------------------
// Les sociétés rivales.
//
// Elles jouent le même jeu que le joueur, avec les mêmes règles : elles
// achètent de la terre, ouvrent des chantiers, règlent l'activité de leurs
// bâtiments. Elles n'ont accès à aucune information cachée.
// ---------------------------------------------------------------------------

function piloterSociete(monde, s) {
  if (s.faillite) return;

  // On surveille d'abord ce qu'on possède : un atelier qui perd de l'argent
  // depuis trois mois passe en sommeil plutôt que de saigner.
  for (const b of s.batiments) {
    if (!b.def.sort) continue;
    const pertes = b.histo.slice(-3);
    if (pertes.length === 3 && pertes.every(x => x < 0)) b.activite = 0;
    else if (b.activite === 0 && b.margeBrute(b.ville.marche) > b.entretien * 2) b.activite = 1;
  }

  // Ouvrir trop de chantiers à la fois, c'est immobiliser son cash dans des
  // trous. C'est le principal piège de trésorerie du jeu.
  if (s.chantiers.length >= 2) return;
  if (s.tresorerie < 1200) return;

  // Où bâtir : la ville où l'occasion est la plus nette. Chaque société a un
  // métier de prédilection, sans quoi les trois rivales bâtiraient exactement
  // la même chose au même moment.
  let meilleur = null;
  for (const v of monde.villes) {
    const besoin = besoinLePlusCriant(monde, v, s.penchant);
    if (!besoin) continue;
    let type = besoin.type === 'logement'
      ? (v.marche.stock.acier > 300 && s.tresorerie > 6000 ? 'immeuble' : 'maison')
      : remonter(monde, v, besoin.res);
    if (!type) continue;
    const def = BAT[type];
    if (def.cat !== 'loge' && brasDisponibles(monde, v) < def.cases) continue;
    // On n'ajoute pas un atelier de plus à une filière déjà à l'arrêt : ce
    // serait payer un bâtiment pour le mettre aussitôt en sommeil.
    if (sature(monde, v, type)) continue;
    const score = besoin.score;
    if (!meilleur || score > meilleur.score) meilleur = { ville: v, type, score };
  }

  // Les bureaux sont le seul argent qui vienne du dehors : une ville qui en
  // manque s'étiole. C'est un placement lent mais qui ne dépend d'aucun marché.
  if (!meilleur || meilleur.score < 1.2) {
    const v = monde.villes[Math.floor(Math.random() * monde.villes.length)];
    const bureaux = monde.tousBatiments(v).filter(b => b.def.cat === 'bur').length;
    if (bureaux < Math.ceil(v.menages / 78) && brasDisponibles(monde, v) > 25) {
      meilleur = { ville: v, type: 'bureaux', score: 1 };
    }
  }
  if (!meilleur) return;

  const cases = monde.trouverEmplacement(meilleur.ville, meilleur.type, null)
             || monde.trouverEmplacement(meilleur.ville, meilleur.type, s);
  if (!cases) return;
  const cout = coutEstime(monde, meilleur.ville, meilleur.type);
  if (s.tresorerie < cout * 1.3) return;

  monde.ouvrirChantier(meilleur.type, meilleur.ville, cases, s);
}

// ===== js/sim/world.js ===============================================

// ---------------------------------------------------------------------------
// Le monde et la boucle mensuelle.
//
// Tout se résout au mois, et le mois dure dix secondes réelles. Rien ne se
// calcule en continu : la production, la consommation, les loyers, les
// salaires, les prix, les dividendes.
//
//   Seconde 0     la production est livrée, les prix recalculés, les comptes
//                 mis à jour
//   Secondes 0-3  fenêtre de priorité des joueurs : stocks au plus haut, prix
//                 au plus bas
//   Secondes 3-10 l'ordinateur consomme progressivement ; les stocks fondent
// ---------------------------------------------------------------------------







class Monde {
  // duree : nombre de mois, ou null pour une partie sans fin.
  constructor({ nbVilles = 5, duree = null, graine = Date.now() } = {}) {
    const carte = genererMonde(nbVilles, graine);
    this.L = carte.L; this.H = carte.H;
    this.cases = carte.cases;              // une seule grille pour tout le monde
    this.villes = carte.villes;
    this.liaisons = carte.liaisons;
    this.graine = graine;
    this.mois = 0;
    this.duree = duree;                 // null = la partie ne s'arrête jamais
    this.climat = 'normal';             // normal | euphorie | crise
    this.journal = [];
    this.offresDuMois = new Map();

    this.societes = [];
    this.joueur = new Societe('Vous', '#d9a441', true);
    this.societes.push(this.joueur);
    const rivaux = [
      ['Ashcroft & Fils',    '#5b8fd9', 'logement'],
      ['Compagnie Meridian', '#c05a8a', 'produits'],
      ['Consortium Vale',    '#5fae7f', 'planches'],
    ];
    for (const [n, c, penchant] of rivaux) {
      const s = new Societe(n, c);
      s.penchant = penchant;              // son métier de prédilection
      this.societes.push(s);
    }

    this.recomposerMarches();
    this.amorcer();
  }

  caseAt(x, y) {
    if (x < 0 || y < 0 || x >= this.L || y >= this.H) return null;
    return this.cases[y * this.L + x];
  }

  get multiple() {
    return this.climat === 'crise' ? P.multipleCrise
         : this.climat === 'euphorie' ? P.multipleEuphorie : P.multipleNormal;
  }

  // --- Marchés --------------------------------------------------------------
  // Dès que deux villes sont reliées par une ligne achevée, elles n'ont plus
  // qu'un seul marché : leurs stocks se confondent et un prix unique s'établit.
  // Les besoins et les productions s'additionnent.

  recomposerMarches() {
    const parent = this.villes.map((_, i) => i);
    const find = (i) => parent[i] === i ? i : (parent[i] = find(parent[i]));
    for (const l of this.liaisons) if (l.achevee) parent[find(l.a)] = find(l.b);

    const groupes = new Map();
    this.villes.forEach((v, i) => {
      const r = find(i);
      if (!groupes.has(r)) groupes.set(r, []);
      groupes.get(r).push(v);
    });

    const anciens = this.marches || [];
    this.marches = [];
    for (const membres of groupes.values()) {
      const m = new Marche(membres);
      // On reprend les stocks et les prix des marchés d'origine : la fusion
      // additionne, elle ne remet pas à zéro.
      const sources = anciens.filter(a => a.villes.some(v => membres.includes(v)));
      if (sources.length) {
        for (const r of RESSOURCES) {
          m.stock[r] = sources.reduce((s, a) => s + a.stock[r], 0);
          m.prix[r] = sources.reduce((s, a) => s + a.prix[r], 0) / sources.length;
        }
      }
      this.marches.push(m);
      for (const v of membres) v.marche = m;
    }
  }

  // Correctif obligatoire du piège de l'amorçage : il faut des planches pour
  // construire une scierie, qui produit les planches. Chaque ville commence
  // donc avec un stock importé, jamais réapprovisionné. Il finance les premiers
  // bâtiments puis se raréfie, ce qui rend très rentable la première scierie et
  // la première briqueterie de chaque ville.
  amorcer() {
    for (const v of this.villes) {
      for (const [r, q] of Object.entries(P.stockAmorcage)) v.marche.stock[r] += q;
      v.niveau = niveauVille(v.menages);
      // Un parc de départ minimal, aux mains des indépendants : sans lui la
      // ville n'a rien à manger le premier mois.
      this.parcDeDepart(v);
    }
    this.calibrerPrixInitiaux();
  }

  // Une partie ne commence pas à l'équilibre parfait. Chaque ville a hérité
  // d'un sol, donc d'un parc et de rendements qui lui sont propres : le blé
  // d'une plaine grasse ne vaut pas celui d'une terre ingrate, et le charbon
  // d'un pays de collines ne vaut pas celui d'une plaine.
  //
  // On établit donc les prix de départ comme le fera la simulation ensuite —
  // sur le rapport entre ce que la ville peut produire et ce qu'elle réclame.
  // Sinon les cinq villes s'ouvrent avec exactement les mêmes cours, et le
  // premier écart n'apparaît qu'après plusieurs années.
  calibrerPrixInitiaux() {
    for (const m of this.marches) {
      const offre = {}, besoin = {};
      for (const r of RESSOURCES) { offre[r] = 0; besoin[r] = 0; }

      for (const v of m.villes) {
        for (const b of this.tousBatiments(v)) {
          if (b.def.sort) offre[b.def.sort] += b.capacite;
          for (const [r, q] of Object.entries(b.def.intrants || {})) besoin[r] += q * b.n;
          // L'entretien du bâti est une demande permanente de matériaux.
          for (const [r, q] of Object.entries(materiaux(b.type))) {
            besoin[r] += q * P.entretienAnnuel / 12;
          }
        }
        // Ce que mangent et achètent les ménages. Pain et viande étant
        // substituables, la ration se répartit au prorata de ce que chaque
        // filière peut livrer — un ménage mange ce qu'il y a.
        v.__ration = v.menages;
        besoin.produits += v.menages;
      }

      const rations = m.villes.reduce((s, v) => s + (v.__ration || 0), 0);
      const nourr = offre.pain + offre.viande;
      for (const r of NOURRITURES) {
        besoin[r] += nourr > 0.001 ? rations * offre[r] / nourr : rations / 2;
      }

      for (const r of RESSOURCES) {
        const ref = RES[r].prix;
        let tension = offre[r] > 0.001 ? besoin[r] / offre[r]
                    : (besoin[r] > 0 ? P.tensionMax : 1);
        tension = Math.max(P.tensionMin, Math.min(P.tensionMax, tension));
        const prix = ref * Math.pow(tension, P.exposantPrix);
        m.prix[r] = Math.max(ref * P.prixPlancher, Math.min(ref * P.prixPlafond, prix));
      }
    }
  }

  // Le parc de départ n'est pas posé au hasard : il est dimensionné sur les
  // besoins réels de la ville, filière par filière, en remontant depuis la
  // consommation.
  //
  // « La consommation d'un ménage appelle 0,90 case de production. Mais une
  //   ville n'en vit pas : il faut environ 1,45 fois ce chiffre pour fabriquer
  //   en plus les matériaux des chantiers et de l'entretien. Une ville dotée du
  //   strict nécessaire à la consommation ne peut employer que 45 % de ses bras
  //   et s'effondre. » (§20)
  // Ce qu'une ville sait faire au premier jour. Une ville forestière ouvre avec
  // un excédent de bois et un manque de minerai ; une ville minière l'inverse.
  //
  // « Chaque ville peut donc tout produire un peu, mais aucune ne peut se
  //   suffire à elle-même. C'est ce qui rend le chemin de fer indispensable
  //   plutôt que confortable. » (§5)
  //
  // La filière alimentaire fait exception : le générateur doit garantir
  // qu'aucune ville ne démarre sous son seuil de survie, sinon elle meurt avant
  // que quiconque ait eu le temps de lui poser une voie.
  dotation(v, ressource, plancher = 0) {
    const r = v.__tirage || (v.__tirage = rng(this.graine + v.id * 7919));
    let k;
    if (v.profil.pred === ressource) k = 1.35 + r() * 0.30;
    else if (v.profil.rares.includes(ressource)) k = 0.32 + r() * 0.28;
    else k = 0.82 + r() * 0.26;
    return Math.max(plancher, k);
  }

  parcDeDepart(v) {
    const M = v.menages;
    const dBois = this.dotation(v, 'bois');
    const dArgile = this.dotation(v, 'argile');
    const dCharbon = this.dotation(v, 'charbon');
    const dFer = this.dotation(v, 'minerai');
    const dTerre = this.dotation(v, 'fertilite', 0.90);   // on ne laisse pas une ville affamée

    // Logement : un peu plus que la population, pour que l'occupation démarre
    // sous 100 % et laisse à la ville la place de croître.
    this.poserJusqua(v, 'maison', M / 0.85, b => b.def.menages);

    // Filière alimentaire : 1 ration par ménage et par mois.
    this.poserJusqua(v, 'minoterie', M * dTerre, b => b.capacite);
    this.poserJusqua(v, 'ferme', M * 2 * dTerre, b => b.capacite);   // 2 céréales par pain

    // Filière manufacturée, remontée jusqu'aux mines.
    this.poserJusqua(v, 'manufacture', M * 1.08, b => b.capacite);
    const planchesManu = M * 1.08 * 1;                          // 6 planches pour 6 produits
    const acierManu = M * 1.08 / 3;                             // 2 aciers pour 6 produits
    this.poserJusqua(v, 'acierie', acierManu * Math.min(dCharbon, dFer), b => b.capacite);
    this.poserJusqua(v, 'mineCharbon', acierManu * 4 * dCharbon, b => b.capacite);
    this.poserJusqua(v, 'mineFer', acierManu * 4 * dFer, b => b.capacite);

    // Matériaux : ce que réclament les manufactures, plus l'entretien du parc
    // et les chantiers à venir — c'est le facteur 1,45.
    const planches = planchesManu + M * 0.45;
    this.poserJusqua(v, 'scierie', planches * dBois, b => b.capacite);
    this.poserJusqua(v, 'coupe', planches * 2 * dBois, b => b.capacite);
    this.poserJusqua(v, 'briqueterie', M * 0.40 * dArgile, b => b.capacite);
    this.poserJusqua(v, 'carriere', M * 0.80 * dArgile, b => b.capacite);

    // Filière élevage : pour l'instant un doublon de la filière céréalière,
    // pain et viande étant substituables 1 pour 1. Modeste au départ.
    this.poserJusqua(v, 'abattoir', M * 0.12 * dTerre, b => b.capacite);
    this.poserJusqua(v, 'ranch', M * 0.24 * dTerre, b => b.capacite);

    // Les bureaux sont le seul argent qui vienne du dehors : le nombre de
    // départ décide de la trajectoire d'une ville plus sûrement que la qualité
    // de ses terres. Un immeuble pour 78 ménages tient l'emploi à 78 %.
    const bureaux = Math.max(1, Math.round(M / P.menagesParBureaux) + (v.bonusBureaux || 0));
    for (let k = 0; k < bureaux; k++) {
      const cases = this.trouverEmplacement(v, 'bureaux', null);
      if (cases) this.poser('bureaux', v, cases, null);
    }

    v.occupation = Math.min(1, v.menages / Math.max(1, this.tousBatiments(v)
      .filter(b => b.def.cat === 'loge').reduce((s, b) => s + b.def.menages, 0)));
  }

  // Pose des bâtiments d'un type jusqu'à couvrir la cible. La capacité réelle
  // dépend de la qualité du sol : sur une mauvaise terre il en faut simplement
  // davantage — la ville cherche toujours à couvrir ses besoins, quel que soit
  // le sol. Ce qui change, c'est le prix de revient.
  poserJusqua(v, type, cible, mesure) {
    let total = 0, gardeFou = 0;
    while (total < cible && gardeFou++ < 400) {
      const cases = this.trouverEmplacement(v, type, null);
      if (!cases) break;
      const b = this.poser(type, v, cases, null);
      total += mesure(b);
    }
    return total;
  }

  // --- Foncier --------------------------------------------------------------

  prixCase(ville, c) {
    const base = prixTerrain((c.ville || ville).niveau, c.distanceGare, qualiteMax(c));
    return c.proprio === 'ind' ? base * P.surprixIndependants : base;
  }

  // Où va quel bâtiment. Les quartiers ne sont pas décoratifs : ils empêchent
  // les ateliers de cerner les maisons, et donnent à chaque ville un plan qui
  // lui est propre.
  static VOCATION_PREFEREE = {
    loge: 'residentiel', bur: 'residentiel', neg: 'negoce',
    trans: 'industriel', manu: 'industriel', expl: 'agricole',
  };

  // Cherche la meilleure emprise libre de la bonne forme. Les exploitations
  // vont là où le sol est bon — une ferme sur une terre de qualité 5 sort une
  // fois et demie ce que sort la même ferme sur une qualité 3 ; le logement se
  // serre autour de la gare, là où le foncier est cher mais la ville dense.
  trouverEmplacement(ville, type, societe) {
    const def = BAT[type];
    const voulu = Monde.VOCATION_PREFEREE[def.cat];
    let meilleur = null, meilleurScore = -Infinity;

    for (const depart of ville.cases) {
      const cases = [];
      let ok = true;
      for (let dy = 0; dy < def.h && ok; dy++) for (let dx = 0; dx < def.w && ok; dx++) {
        const c = this.caseAt(depart.x + dx, depart.y + dy);
        if (!c || c.ville !== ville || c.voie || c.bat || c.chantier) { ok = false; break; }
        // Une société doit posséder toutes les cases de l'emprise ; le parc de
        // l'ordinateur s'installe sur les terres restées aux indépendants.
        if (societe && c.proprio !== societe.id) { ok = false; break; }
        if (!societe && c.proprio && c.proprio !== 'ind') { ok = false; break; }
        cases.push(c);
      }
      if (!ok || cases.length !== def.cases) continue;

      let score = 0;

      // Le quartier d'abord. On n'interdit rien — une ville doit toujours
      // pouvoir bâtir quelque part — mais on décourage franchement.
      const q = cases[0].quartier;
      if (q === voulu) score += 90;
      else if (voulu === 'residentiel' && q === 'negoce') score += 30;
      else if (voulu === 'industriel' && q === 'negoce') score += 30;
      else if (voulu === 'agricole' && q === 'industriel') score += 25;
      // Une usine dans un quartier d'habitation est le seul cas vraiment banni.
      else if (q === 'residentiel' && (def.cat === 'trans' || def.cat === 'manu')) score -= 70;

      if (def.qual) {
        // Une exploitation suit la ressource : c'est la seule chose qui compte.
        const moy = cases.reduce((s, c) => s + c.q[def.qual], 0) / cases.length;
        score += moy * 45 - cases[0].distanceGare * 0.4;
      } else {
        // Le reste se rapproche de la gare, où la ville est dense.
        score += -cases[0].distanceGare * 1.4;
      }

      if (score > meilleurScore) { meilleurScore = score; meilleur = cases; }
    }
    return meilleur;
  }

  // Pose immédiate (parc de départ et constructions des indépendants).
  poser(type, ville, cases, societe) {
    for (const c of cases) {
      c.vendue = true;
      if (!societe && !c.proprio) c.proprio = 'ind';
      c.prixPaye = this.prixCase(ville, c);
    }
    const b = new Batiment(type, ville, cases, societe);
    for (const c of cases) c.bat = b;
    if (societe) societe.batiments.push(b);
    else (ville.batIndependants ||= []).push(b);
    return b;
  }

  // Ouvre un chantier. Le cash part immédiatement — terrain compris — et le
  // chantier entre au carnet. Il ne sortira de terre que le mois où la dernière
  // brique sera livrée.
  ouvrirChantier(type, ville, cases, societe) {
    const coutTerrain = cases.reduce((s, c) =>
      s + (c.proprio === societe.id ? 0 : this.prixCase(ville, c)), 0);
    if (!societe.peutPayer(coutTerrain)) return null;
    societe.payer(coutTerrain);
    for (const c of cases) {
      c.proprio = societe.id;
      c.vendue = true;
      c.prixPaye = this.prixCase(ville, c);
    }
    const ch = new Chantier(type, ville, cases, societe, coutTerrain);
    ch.ouvertLe = this.mois;
    for (const c of cases) c.chantier = ch;
    societe.chantiers.push(ch);
    return ch;
  }

  acheterTerrain(ville, c, societe) {
    if (!estAchetable(this, c) && c.proprio !== 'ind') return false;
    const prix = this.prixCase(ville, c);
    if (!societe.peutPayer(prix)) return false;
    societe.payer(prix);
    c.proprio = societe.id;
    c.vendue = true;
    c.prixPaye = prix;
    return true;
  }

  // --- Acquérir le bien d'autrui -------------------------------------------

  // Un propriétaire indépendant vend à qui le demande, au prix du marché majoré
  // de 20 %, sans limite de fréquence. C'est le raccourci payant : on n'attend
  // pas d'avoir bâti, on rachète — plus cher.
  prixRachatIndependant(b) {
    return b.valeur(this.multiple) * P.surprixIndependants;
  }

  acheterBatiment(b, societe) {
    if (b.societe) return false;                       // pas à un indépendant
    const prix = this.prixRachatIndependant(b);
    if (!societe.peutPayer(prix)) return false;
    societe.payer(prix);
    b.ville.batIndependants = b.ville.batIndependants.filter(x => x !== b);
    b.societe = societe;
    societe.batiments.push(b);
    for (const c of b.cases) { c.proprio = societe.id; c.vendue = true; }
    this.journal.push(`${this.mois} · ${societe.nom} rachète ${BAT[b.type].nom} à ${b.ville.nom}`);
    return true;
  }

  // Une offre sur le bien d'un rival. « Il n'y a rien à négocier, il n'y a
  // qu'un curseur et une réponse en un clic. »
  //
  //   bâtiment rentable   → un multiple de 5 à 15 du profit des 12 derniers mois
  //   bâtiment déficitaire → de 80 % à 120 % du plancher, terrain et matériaux
  //
  // Une seule offre par mois et par adversaire : cela interdit le harcèlement
  // et, surtout, cela force à choisir. Vous ne pouvez pas rafler tout ce qui
  // vous intéresse chez un rival — vous devez désigner ce qui compte vraiment.
  offrePossible(b, societe) {
    if (!b.societe || b.societe === societe) return false;
    const faites = this.offresDuMois.get(societe.id);
    return !faites || !faites.has(b.societe.id);
  }

  prixOffre(b, curseur) {
    const profit = b.profitAnnuel;
    if (profit > 0) return profit * curseur;           // curseur de 5 à 15
    // Sur un bâtiment qui ne gagne rien, l'offre porte sur le plancher.
    const plancher = b.terrainCourant + b.valeurBatie;
    return plancher * (0.8 + (curseur - 5) / 10 * 0.4);
  }

  faireOffre(b, societe, curseur) {
    if (!this.offrePossible(b, societe)) return { fait: false, motif: 'déjà une offre ce mois' };
    const prix = this.prixOffre(b, curseur);
    if (!societe.peutPayer(prix)) return { fait: false, motif: 'trésorerie insuffisante' };

    if (!this.offresDuMois.has(societe.id)) this.offresDuMois.set(societe.id, new Set());
    this.offresDuMois.get(societe.id).add(b.societe.id);

    // La cible refuse librement, donc une offre sous le marché n'est jamais
    // acceptée — sauf par quelqu'un qui a besoin d'argent. Le système devient
    // ainsi un mécanisme de prédation contre les sociétés en difficulté.
    const cible = b.societe;
    const valeur = b.valeur(this.multiple);
    const auxAbois = cible.tresorerie < 800 || cible.faillite;
    const seuil = auxAbois ? valeur * 0.85 : valeur * 1.08;

    if (prix < seuil) return { fait: true, accepte: false, prix, motif: 'offre refusée' };

    societe.payer(prix);
    cible.encaisser(prix);
    cible.batiments = cible.batiments.filter(x => x !== b);
    b.societe = societe;
    societe.batiments.push(b);
    for (const c of b.cases) c.proprio = societe.id;
    this.journal.push(`${this.mois} · ${societe.nom} rachète ${BAT[b.type].nom} `
      + `à ${cible.nom} pour ${Math.round(prix)} $`);
    return { fait: true, accepte: true, prix };
  }

  demolir(b) {
    // La société conserve le terrain, ne récupère aucun matériau, et la case
    // est libre le mois suivant. Sans cette règle, une ville couverte de
    // maisons ne pourrait plus jamais se densifier.
    for (const c of b.cases) c.bat = null;
    if (b.societe) b.societe.batiments = b.societe.batiments.filter(x => x !== b);
    else b.ville.batIndependants = b.ville.batIndependants.filter(x => x !== b);
  }

  tousBatiments(ville) {
    const out = ville.batIndependants ? ville.batIndependants.slice() : [];
    for (const s of this.societes) for (const b of s.batiments) if (b.ville === ville) out.push(b);
    return out;
  }

  tousChantiers(ville) {
    const out = [];
    for (const s of this.societes) for (const c of s.chantiers) if (c.ville === ville) out.push(c);
    return out;
  }

  // =========================================================================
  //  LE MOIS
  // =========================================================================

  tick() {
    if (this.duree && this.mois >= this.duree) return false;
    this.mois++;
    this.offresDuMois.clear();   // une offre par mois et par adversaire

    for (const m of this.marches) m.reinitialiser();

    // --- 1. Tout le monde déclare ses besoins ------------------------------
    for (const v of this.villes) {
      const m = v.marche;
      const bats = this.tousBatiments(v);

      for (const b of bats) b.declarer(m);

      // Les ménages. Le budget est contraint : la nourriture et le loyer sont
      // incompressibles, c'est l'achat de produits manufacturés qui encaisse
      // tout le chômage.
      const revenu = P.employesParMenage * v.salaire * v.barometres.emploi;
      const prixNourr = Math.min(m.prix.pain, m.prix.viande);
      const dispo = Math.max(0, revenu - 5);            // hors loyer approximé
      const partNourr = Math.min(1, dispo / Math.max(0.01, prixNourr));
      const reste = Math.max(0, dispo - partNourr * prixNourr);
      const partProd = Math.min(1, reste / Math.max(0.01, m.prix.produits));

      v.demandeNourriture = v.menages * partNourr;
      v.demandeProduits = v.menages * partProd;

      // Pain et viande sont substituables 1 pour 1 : le ménage veut une ration
      // par mois, pas une demi-ration de chaque. Il mange ce qu'il y a, en
      // commençant par le moins cher. Une ville de blé se passe donc d'élevage
      // et une ville d'herbe se passe de blé, sans que ni l'une ni l'autre soit
      // punie pour ce que son sol ne donne pas.
      // La répartition se fait sur ce que chaque filière est CAPABLE de livrer —
      // sa production du mois écoulé plus son stock — et non sur le stock seul.
      // Sur un marché où le pain se consomme en juste-à-temps, le stock est nul
      // en début de mois : répartir là-dessus enverrait toute la demande sur la
      // viande, et la ville mourrait de faim avec du pain sur les étals.
      const moinsCher = m.prix.pain <= m.prix.viande ? 'pain' : 'viande';
      const autre = moinsCher === 'pain' ? 'viande' : 'pain';
      v.repas = {};
      const capaciteA = m.offreAttendue(moinsCher) * (v.menages / totalMenages(m));
      v.repas[moinsCher] = Math.min(v.demandeNourriture, capaciteA);
      v.repas[autre] = v.demandeNourriture - v.repas[moinsCher];
      m.demander(moinsCher, v.repas[moinsCher]);
      m.demander(autre, v.repas[autre]);
      m.demander('produits', v.demandeProduits);

      // Les chantiers. Cette commande n'est pas une intention : c'est une
      // demande réelle sur le marché, au même titre que le pain d'un ménage.
      // C'est ainsi qu'une ville à court de briques finit par se donner une
      // briqueterie.
      for (const ch of this.tousChantiers(v)) {
        for (const [r, q] of Object.entries(ch.restant)) if (q > 0) m.demander(r, q);
      }

      // L'entretien du bâti : une demande permanente de matériaux, qui donne
      // aux scieries et briqueteries leur débouché de régime de croisière.
      for (const b of bats) {
        for (const [r, q] of Object.entries(materiaux(b.type))) {
          m.demander(r, q * P.entretienAnnuel / 12);
        }
      }
    }

    // --- 2. On ouvre le guichet ---------------------------------------------
    // Les prix ne sont PAS recalculés ici : la production du mois doit d'abord
    // être livrée aux marchés (§2, seconde 0). Ils le seront en fin de mois,
    // sur le rapport entre les besoins et les entrées réellement constatés.
    for (const m of this.marches) m.ouvrirGuichet();

    // --- 3. Main-d'œuvre ----------------------------------------------------
    for (const v of this.villes) {
      const bras = v.menages * P.employesParMenage;
      const bats = this.tousBatiments(v);
      let postes = 0;
      for (const b of bats) postes += b.postesDemandes;
      for (const ch of this.tousChantiers(v)) postes += ch.postesDemandes;
      v.postesDemandes = postes;
      v.bras = bras;
      v.partBras = postes > 0 ? Math.min(1, bras / postes) : 1;
    }

    // --- 4. On produit, dans l'ordre de la filière --------------------------
    // Le service se recalcule avant chaque vague : sans quoi une scierie serait
    // rationnée sur un stock de bois qui ne contient pas encore la coupe du
    // mois. À l'intérieur d'une vague, chacun est servi au même prorata.
    const VAGUES = [
      ['coupe', 'carriere', 'mineCharbon', 'mineFer', 'ferme', 'ranch'],
      ['scierie', 'briqueterie', 'minoterie', 'abattoir', 'acierie'],
      ['manufacture'],
    ];

    for (const v of this.villes) v.__bats = this.tousBatiments(v);

    for (let i = 0; i < VAGUES.length; i++) {
      for (const m of this.marches) m.calculerService();
      for (const v of this.villes) {
        for (const b of v.__bats) {
          if (!VAGUES[i].includes(b.type)) continue;
          b.produire(v.marche, v.partBras);
          if (b.societe) b.societe.encaisser(b.resultat);
          else v.epargne += Math.max(0, b.resultat);
        }
      }

      // Après la première transformation, les chantiers et l'entretien se
      // présentent au même guichet que les usines : le chantier compte comme un
      // consommateur d'intrants, temporaire mais réel. Il n'est ni prioritaire,
      // ni sacrifié.
      if (i === 1) {
        for (const m of this.marches) m.calculerService();

        // L'entretien ne se contracte jamais, pas même en sommeil.
        for (const v of this.villes) {
          for (const b of v.__bats) {
            for (const [r, q] of Object.entries(materiaux(b.type))) {
              v.marche.prendre(r, q * P.entretienAnnuel / 12);
            }
          }
        }

        // Entre chantiers, priorité au plus ancien : un chantier ouvert il y a
        // dix mois ne cède jamais sa place à un chantier ouvert hier. C'est ce
        // qui garantit qu'aucun chantier ne reste ouvert pour toujours.
        for (const v of this.villes) {
          const m = v.marche;
          const chs = this.tousChantiers(v).sort((a, b) => a.ouvertLe - b.ouvertLe);
          for (const ch of chs) {
            for (const [r, q] of Object.entries(ch.restant)) {
              if (q <= 0) continue;
              const servi = m.prendre(r, q);
              ch.restant[r] = Math.max(0, q - servi);
              ch.recu[r] = (ch.recu[r] || 0) + servi;
              if (ch.societe) ch.societe.payer(servi * m.prix[r]);
            }
          }
        }
      }
    }

    // --- 5. Loyers, bureaux, entrepôts --------------------------------------
    // Ils ne prennent rien au marché : leur recette est un loyer, pas une
    // marchandise.
    for (const v of this.villes) {
      for (const b of v.__bats) {
        if (b.def.sort) continue;
        b.produire(v.marche, v.partBras);
        if (b.societe) b.societe.encaisser(b.resultat);
        else v.epargne += Math.max(0, b.resultat);
      }
    }

    // --- 6. Les ménages consomment ------------------------------------------
    // En deux passes. D'abord chacun prend sa part au prorata sur chaque
    // nourriture ; ensuite seulement joue la substitution, elle aussi au
    // prorata du reliquat. Servir la substitution hors quota donnerait tout le
    // stock à la première ville servie et affamerait les suivantes — sur un
    // marché fusionné, c'est la mort assurée des villes de la fin de liste.
    for (const m of this.marches) m.calculerService();

    for (const v of this.villes) {
      const m = v.marche;
      v.nourrObtenue = 0;
      for (const r of NOURRITURES) v.nourrObtenue += m.prendre(r, v.repas[r] || 0);
      v.prodObtenue = m.prendre('produits', v.demandeProduits);
    }

    for (const m of this.marches) {
      const manque = m.villes.reduce((s, v) =>
        s + Math.max(0, v.demandeNourriture - v.nourrObtenue), 0);
      const dispo = NOURRITURES.reduce((s, r) => s + m.stock[r], 0);
      m.partSubstitution = manque > 0.001 ? Math.min(1, dispo / manque) : 0;
    }

    for (const v of this.villes) {
      const m = v.marche;
      let reste = Math.max(0, v.demandeNourriture - v.nourrObtenue) * m.partSubstitution;
      for (const r of NOURRITURES) {
        if (reste <= 0.001) break;
        const pris = m.rafler(r, reste);
        v.nourrObtenue += pris;
        reste -= pris;
      }
    }

    for (const v of this.villes) {
      const m = v.marche;
      v.barometres.nourriture = clamp01(v.nourrObtenue / Math.max(1, v.menages));
      v.barometres.produits = clamp01(v.prodObtenue / Math.max(1, v.menages));
      v.barometres.emploi = clamp01(
        Math.min(v.postesDemandes, v.bras) / Math.max(1, v.bras));

      // L'épargne des ménages n'est ni perdue ni thésaurisée : elle bâtit la
      // ville. Une fois son panier et son loyer payés, ce qui reste au ménage
      // est investi sur place.
      const revenu = P.employesParMenage * v.salaire * v.barometres.emploi;
      const depense = v.nourrObtenue / Math.max(1, v.menages)
                        * Math.min(m.prix.pain, m.prix.viande)
                    + v.prodObtenue / Math.max(1, v.menages) * m.prix.produits + 5;
      v.epargne += Math.max(0, revenu - depense) * v.menages;

      // Ce que le ménage gagne, ce qu'il dépense, ce qu'il met de côté. Trois
      // chiffres que le joueur doit pouvoir lire depuis n'importe quel logement :
      // un immeuble ne vaut que par le pouvoir d'achat de ceux qui l'habitent.
      v.revenuMenage = revenu;
      v.depenseMenage = depense;
      v.tauxEpargne = revenu > 0 ? Math.max(0, revenu - depense) / revenu : 0;
    }

    // --- 7. Les prix du mois suivant ----------------------------------------
    // Maintenant seulement, sur le rapport entre les besoins réels du mois et ce
    // qui est entré sur le marché. Le stock n'entre pas dans ce calcul : il
    // protège l'approvisionnement, pas le cours.
    for (const m of this.marches) m.fixerPrix();

    // --- 8. Le salaire, variable d'ajustement de la ville -------------------
    for (const v of this.villes) this.ajusterSalaire(v);

    // --- 9. Démographie -----------------------------------------------------
    for (const v of this.villes) this.demographie(v);

    // --- 10. Les chantiers achevés sortent de terre --------------------------
    for (const s of this.societes) {
      const restants = [];
      for (const ch of s.chantiers) {
        if (ch.complet) {
          for (const c of ch.cases) c.chantier = null;
          const b = new Batiment(ch.type, ch.ville, ch.cases, s);
          for (const c of ch.cases) c.bat = b;
          s.batiments.push(b);
          this.journal.push(`${this.mois} · ${s.nom} achève ${BAT[ch.type].nom} à ${ch.ville.nom}`);
        } else restants.push(ch);
      }
      s.chantiers = restants;
    }

    // --- 11. Fermeture des cases mortes -------------------------------------
    // Une case qui reste vide un an ferme. Sans cette porte de sortie, une ville
    // qui a bâti au mauvais endroit reste prisonnière de son parc : elle a
    // atteint son plafond, ne peut plus rien bâtir d'autre, et décline en
    // regardant ses ateliers déserts.
    //
    // La règle ne vaut que pour le parc des indépendants — c'est la ville qui
    // ferme ses propres cases mortes. Le bâtiment d'une société lui appartient :
    // à elle de le mettre en sommeil, de le vendre ou de le démolir. On ne
    // détruit pas le capital d'un joueur à sa place.
    for (const v of this.villes) {
      const morts = (v.batIndependants || []).filter(b =>
        b.moisVide >= P.moisAvantFermeture && b.def.cat !== 'loge');
      if (morts.length) this.demolir(morts[0]);       // une seule par mois
    }

    // --- 12. Le rail ---------------------------------------------------------
    this.avancerRail();

    // --- 13. L'ordinateur et les rivaux bâtissent ---------------------------
    for (const v of this.villes) piloterVille(this, v);
    for (const s of this.societes) if (!s.estJoueur) piloterSociete(this, s);

    // --- 14. Finance --------------------------------------------------------
    for (const s of this.societes) s.enregistrerCours(this.multiple);
    for (const v of this.villes) {
      v.niveau = niveauVille(v.menages);
      v.histo.push({ mois: this.mois, menages: v.menages, salaire: v.salaire,
                     ...v.barometres });
      if (v.histo.length > 400) v.histo.shift();
    }

    // Une partie sans fin ne doit rien accumuler sans limite : le journal ne
    // garde que ce qui est encore lisible.
    if (this.journal.length > 200) this.journal.splice(0, this.journal.length - 200);

    return true;
  }

  // Le salaire est ancré sur le barème — 20 $ la case — et ne s'en écarte que
  // sous la tension du marché du travail : des bras rares le poussent en haut,
  // du chômage le pousse en bas. Il reste borné des deux côtés, et c'est
  // délibéré.
  //
  // La version précédente le tirait vers « le panier au prix du jour », plafonné
  // par ce que les employeurs pouvaient payer. Cela fabriquait une trappe :
  // moins d'emploi, moins de revenu, moins de demande, prix plus bas, salaire
  // plus bas — et l'économie s'installait à 14 $ dans une déflation dont rien ne
  // la sortait. Un salaire ancré casse la boucle, et laisse à la rareté des bras
  // le soin de le faire vivre.
  ajusterSalaire(v) {
    const m = v.marche;

    // Tension du marché du travail : postes demandés rapportés aux bras.
    const tension = v.bras > 0 ? v.postesDemandes / v.bras : 1;
    let cible = P.salaireCase * Math.pow(Math.max(0.2, tension), P.elasticiteSalaire);

    // Le salaire de subsistance : celui qui permet au ménage de boucler son
    // mois — panier compris — ET de mettre de côté de quoi bâtir.
    //
    // C'est le plancher qui manquait, et son absence était fatale. La règle de
    // tension seule fait baisser le salaire quand il y a du chômage ; le ménage
    // s'appauvrit, n'achète plus de produits manufacturés, les prix tombent, les
    // ateliers ferment, le chômage augmente. La boucle est complète et rien n'en
    // sort. Or l'épargne des ménages est le SEUL capital qui bâtisse la ville :
    // un salaire trop bas ne fait pas des entreprises rentables, il fait une
    // ville qui ne se construit jamais.
    const panier = Math.min(m.prix.pain, m.prix.viande) + m.prix.produits + P.loyerBase;
    const emploi = Math.max(0.4, v.barometres.emploi);
    const subsistance = panier * (1 + P.epargneVisee) / (P.employesParMenage * emploi);
    cible = Math.max(cible, subsistance);

    cible = Math.max(P.salaireCase * P.salairePlancher,
                     Math.min(P.salaireCase * P.salairePlafond, cible));

    // Un employeur ne paie pas au-delà de ce qu'il encaisse : le salaire ne peut
    // pas dépasser durablement la valeur ajoutée par case.
    let capaciteTotale = 0, cases = 0;
    for (const b of this.tousBatiments(v)) {
      if (!b.def.sort || b.tauxReel <= 0.01) continue;
      let recette = b.production * m.prix[b.def.sort];
      for (const [r, q] of Object.entries(b.recu || {})) recette -= q * m.prix[r];
      recette -= b.entretien;
      capaciteTotale += Math.max(0, recette + b.masseSalarialePleine * b.tauxReel);
      cases += b.n * b.tauxReel;
    }
    if (cases > 0) cible = Math.min(cible, capaciteTotale / cases);

    cible = Math.max(P.salaireCase * P.salairePlancher, cible);
    v.salaire += 0.25 * (cible - v.salaire);
  }

  // Hors seuil critique, c'est la moyenne des trois baromètres qui décide.
  // Au-dessus du pivot la ville attire, en dessous elle repousse. La cadence
  // est proportionnelle à l'écart.
  demographie(v) {
    const b = v.barometres;
    const moyenne = (b.nourriture + b.emploi + b.produits) / 3;
    v.moyenne = moyenne;

    let taux;
    const critique = b.nourriture < P.seuilsCritiques.nourriture
                  || b.emploi < P.seuilsCritiques.emploi
                  || b.produits < P.seuilsCritiques.produits;
    if (critique) {
      // Un seul seuil franchi vers le bas suffit à vider la ville, quels que
      // soient les autres.
      taux = -P.exodeCritique;
      v.enCrise = true;
    } else {
      // La cadence était écrite en dur ici, et P.cadenceDemo ne servait à
      // personne. Elle vaut « tant de pour-cent de la population par mois et
      // par point d'écart au pivot » : c'est le seul cadran qui décide de la
      // vitesse à laquelle une partie se déploie.
      taux = P.cadenceDemo * 100 * (moyenne - P.pivot);
      taux = Math.max(-P.cadenceMax, Math.min(P.cadenceMax, taux));
      v.enCrise = false;
    }

    // La capacité de logement borne l'afflux : la croissance s'arrête même à
    // 95 % de satisfaction si personne n'a bâti. C'est ce qui pousse à
    // construire.
    const capacite = this.tousBatiments(v)
      .filter(x => x.def.cat === 'loge')
      .reduce((s, x) => s + x.def.menages, 0);

    let nouveau = v.menages * (1 + taux);
    nouveau = Math.max(0, Math.min(nouveau, capacite));
    v.menages = nouveau;
    v.capaciteLogement = capacite;
    // Le taux d'occupation est commun à toute la ville, partagé par tous les
    // propriétaires : ajouter des logements augmente la capacité ; si la
    // population ne suit pas, l'occupation baisse pour tout le monde.
    v.occupation = capacite > 0 ? clamp01(v.menages / capacite) : 0;
  }

  // Le rail est entièrement conduit par l'ordinateur ; le joueur n'y intervient
  // que comme actionnaire. Chaque tranche de capital avance la date d'un mois,
  // dans la limite de 40 % du délai initial : le joueur peut avancer la date,
  // pas la faire disparaître.
  avancerRail() {
    for (const l of this.liaisons) {
      if (l.achevee) continue;
      if (this.mois >= l.date) {
        l.achevee = true;
        l.cotee = true;
        l.actions = Math.max(1000, l.capital);
        this.journal.push(`${this.mois} · ★ Liaison ouverte : ${l.nom} — les marchés fusionnent`);
        this.recomposerMarches();
      }
    }
  }

  investirRail(liaison, societe, montant) {
    if (liaison.achevee || !societe.peutPayer(montant)) return false;
    societe.payer(montant);
    liaison.capital += montant;
    liaison.parts[societe.id] = (liaison.parts[societe.id] || 0) + montant;
    // Une tranche = un mois d'avance, dans la limite de 40 % du délai initial.
    const tranche = 800;
    const avanceMax = Math.floor(liaison.dateInitiale * 0.40);
    const dejaAvance = liaison.dateInitiale - liaison.date;
    const gain = Math.min(Math.floor(montant / tranche), avanceMax - dejaAvance);
    liaison.date = Math.max(this.mois + 1, liaison.date - Math.max(0, gain));
    return true;
  }

  // Fortune finale = argent liquide + actions détenues × cours, le cours retenu
  // étant la moyenne des douze derniers mois.
  classement() {
    return this.societes.map(s => ({
      societe: s,
      fortune: s.coursMoyen() * s.actions * P.partFondateur,
    })).sort((a, b) => b.fortune - a.fortune);
  }
}

function clamp01(x) { return Math.max(0, Math.min(1, isFinite(x) ? x : 0)); }

// Sur un marché fusionné, chaque ville ne peut compter que sur sa part de
// l'offre commune, au prorata de sa population.
function totalMenages(marche) {
  return Math.max(1, marche.villes.reduce((s, v) => s + v.menages, 0));
}

// ===== js/ui/sprites.js ==============================================

// ---------------------------------------------------------------------------
// Les bâtiments, dessinés.
//
// Vus de très haut, on ne voit d'un bâtiment que son toit. C'est donc là que
// doit vivre son identité : une cheminée fumante pour l'aciérie, des piles de
// grumes pour la scierie, des silos pour la minoterie. La teinte dit la
// famille, le toit dit le métier.
//
// Chaque type est pré-rendu une fois par palier de zoom dans un petit canvas,
// puis recopié : dessiner cinq cents toits au trait à chaque image mettrait un
// téléphone à genoux.
// ---------------------------------------------------------------------------


// La teinte porte la famille industrielle. On ne la dépense jamais pour
// distinguer deux bâtiments du même métier — cette information-là passe par la
// forme du toit.
const COULEURS = {
  coupe: '#5d7f45', carriere: '#a8724a', mineCharbon: '#43434b', mineFer: '#6e5f78',
  ferme: '#c2a340', ranch: '#a8804f',
  scierie: '#a87c46', briqueterie: '#9c4a35', minoterie: '#cfae47',
  abattoir: '#a04040', acierie: '#54798a', manufacture: '#4a8763',
  maison: '#9b8f78', immeuble: '#bcae93', bureaux: '#6f96ba', entrepot: '#6d675a',
};

const cache = new Map();

// Éclaircit ou assombrit une couleur — le seul usage autorisé de la valeur.
function ton(hex, k) {
  const p = (i) => Math.max(0, Math.min(255, Math.round(parseInt(hex.substr(i, 2), 16) * k)));
  const h = (v) => v.toString(16).padStart(2, '0');
  return `#${h(p(1))}${h(p(3))}${h(p(5))}`;
}

function videCache() { cache.clear(); }

// Renvoie le canvas du bâtiment à la taille de case demandée.
function sprite(type, pas) {
  const cle = type + '@' + pas;
  if (cache.has(cle)) return cache.get(cle);

  const def = BAT[type];
  const w = Math.round(def.w * pas), h = Math.round(def.h * pas);
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, w); cv.height = Math.max(1, h);
  const ctx = cv.getContext('2d');
  const base = COULEURS[type];

  DESSINS[type](ctx, w, h, base, pas);

  cache.set(cle, cv);
  return cv;
}

// --- Briques de dessin ------------------------------------------------------

// Un bâtiment posé : un corps, un liseré d'ombre à droite et en bas. C'est ce
// liseré, et non un dégradé, qui détache le bâtiment du sol à toutes les
// distances.
function corps(ctx, x, y, w, h, couleur) {
  ctx.fillStyle = couleur;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(0,0,0,.30)';
  ctx.fillRect(x, y + h - Math.max(1, h * 0.13), w, Math.max(1, h * 0.13));
  ctx.fillRect(x + w - Math.max(1, w * 0.11), y, Math.max(1, w * 0.11), h);
}

// Un toit à deux pentes vu de dessus : deux bandes, l'une éclairée, l'autre à
// l'ombre, séparées par la ligne de faîte.
function toitDeuxPentes(ctx, x, y, w, h, couleur) {
  ctx.fillStyle = ton(couleur, 1.18);
  ctx.fillRect(x, y, w, h / 2);
  ctx.fillStyle = ton(couleur, 0.74);
  ctx.fillRect(x, y + h / 2, w, h / 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(x, y + h / 2 - 0.5, w, 1);
}

// Le toit en dents de scie de l'atelier : des verrières orientées au nord.
function dentsDeScie(ctx, x, y, w, h, couleur, n) {
  const pas = w / n;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = ton(couleur, 1.10);
    ctx.fillRect(x + i * pas, y, pas * 0.55, h);
    ctx.fillStyle = ton(couleur, 0.70);
    ctx.fillRect(x + i * pas + pas * 0.55, y, pas * 0.45, h);
  }
}

function cheminee(ctx, cx, cy, r, sombre = '#2e2a26') {
  ctx.fillStyle = sombre;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
}

function pastille(ctx, cx, cy, r, couleur) {
  ctx.fillStyle = couleur;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
}

// --- Un dessin par bâtiment -------------------------------------------------

const DESSINS = {
  // Le logement : un toit, une cheminée. Rien de plus, et c'est voulu — il y en
  // aura des centaines.
  maison(ctx, w, h, c) {
    const m = w * 0.10;
    toitDeuxPentes(ctx, m, m, w - 2 * m, h - 2 * m, c);
    if (w >= 11) cheminee(ctx, w * 0.72, h * 0.30, Math.max(1, w * 0.07));
  },

  // L'immeuble : toit plat, édicule d'escalier, et une emprise qui va jusqu'aux
  // bords — c'est la densité qui doit se lire.
  immeuble(ctx, w, h, c) {
    corps(ctx, 1, 1, w - 2, h - 2, c);
    ctx.fillStyle = ton(c, 0.62);
    ctx.fillRect(w * 0.36, h * 0.36, w * 0.26, h * 0.26);
    if (w >= 16) {
      ctx.fillStyle = 'rgba(0,0,0,.20)';
      for (let i = 1; i < 4; i++) ctx.fillRect(1, h * i / 4, w - 2, 1);
    }
  },

  // Les bureaux : une grande verrière au centre, qui les distingue au premier
  // coup d'œil de l'immeuble d'habitation.
  bureaux(ctx, w, h, c) {
    corps(ctx, 1, 1, w - 2, h - 2, c);
    ctx.fillStyle = ton(c, 1.42);
    ctx.fillRect(w * 0.22, h * 0.22, w * 0.56, h * 0.56);
    ctx.strokeStyle = 'rgba(0,0,0,.30)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w * 0.50, h * 0.22); ctx.lineTo(w * 0.50, h * 0.78);
    ctx.moveTo(w * 0.22, h * 0.50); ctx.lineTo(w * 0.78, h * 0.50);
    ctx.stroke();
  },

  // L'entrepôt : un hangar tout en longueur, ses portes sur la façade.
  entrepot(ctx, w, h, c) {
    corps(ctx, 1, h * 0.16, w - 2, h * 0.68, c);
    ctx.fillStyle = ton(c, 0.55);
    const n = Math.max(2, Math.round(w / 9));
    for (let i = 0; i < n; i++) {
      ctx.fillRect(2 + (w - 4) * (i + 0.25) / n, h * 0.64, (w - 4) * 0.4 / n, h * 0.18);
    }
  },

  // La ferme : d'abord des sillons, et une grange dans un coin. Ce sont les
  // sillons qu'on reconnaît de loin.
  ferme(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.82);
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = ton(c, 1.15);
    const n = Math.max(3, Math.round(h / 4));
    for (let i = 0; i < n; i++) ctx.fillRect(0, h * (i + 0.15) / n, w, h * 0.4 / n);
    if (w >= 14) {
      ctx.fillStyle = '#8a5a3a';
      ctx.fillRect(w * 0.06, h * 0.58, w * 0.24, h * 0.34);
    }
  },

  // Le ranch : un enclos, et le bétail dedans.
  ranch(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.86);
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = ton(c, 0.5); ctx.lineWidth = 1;
    ctx.strokeRect(1.5, 1.5, w - 3, h - 3);
    if (w >= 12) {
      ctx.fillStyle = '#6b4a33';
      for (let i = 0; i < 3; i++) {
        pastille(ctx, w * (0.25 + i * 0.24), h * (0.35 + (i % 2) * 0.3), Math.max(1, w * 0.045), '#6b4a33');
      }
    }
  },

  // La coupe forestière : des arbres, et une trouée déjà exploitée.
  coupe(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.72);
    ctx.fillRect(0, 0, w, h);
    const r = Math.max(1, w * 0.15);
    for (const [px, py] of [[0.28, 0.30], [0.68, 0.26], [0.30, 0.70], [0.72, 0.68]]) {
      pastille(ctx, w * px, h * py, r, ton(c, 1.25));
    }
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.fillRect(w * 0.44, h * 0.44, w * 0.16, h * 0.16);
  },

  // La carrière : une entaille en gradins dans le sol.
  carriere(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.80);
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = ton(c, 1.05 + i * 0.14);
      const k = 0.12 + i * 0.12;
      ctx.fillRect(w * k, h * k, w * (1 - 2 * k), h * (1 - 2 * k));
    }
  },

  mineCharbon(ctx, w, h, c) { mine(ctx, w, h, c, '#26262b'); },
  mineFer(ctx, w, h, c) { mine(ctx, w, h, c, '#7a6a86'); },

  // La scierie : dents de scie, et les grumes empilées à côté.
  scierie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.62); ctx.fillRect(0, 0, w, h);
    dentsDeScie(ctx, 1, h * 0.12, w * 0.62, h * 0.74, c, Math.max(2, Math.round(w / 12)));
    ctx.fillStyle = '#7d5b3a';
    const n = 3;
    for (let i = 0; i < n; i++) {
      ctx.fillRect(w * 0.68, h * (0.18 + i * 0.24), w * 0.26, h * 0.14);
    }
  },

  // La briqueterie : le four, sa cheminée, et les briques qui sèchent.
  briqueterie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.58); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.06, h * 0.16, w * 0.52, h * 0.68, c);
    cheminee(ctx, w * 0.32, h * 0.50, Math.max(1.2, w * 0.09), '#3a2420');
    ctx.fillStyle = ton(c, 1.30);
    for (let i = 0; i < 3; i++) ctx.fillRect(w * 0.66, h * (0.20 + i * 0.24), w * 0.28, h * 0.14);
  },

  // La minoterie : les silos, en enfilade. C'est la silhouette la plus
  // reconnaissable de toute la carte.
  minoterie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.58); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.04, h * 0.24, w * 0.42, h * 0.56, c);
    const r = Math.max(1.4, h * 0.15);
    for (let i = 0; i < 3; i++) {
      pastille(ctx, w * (0.58 + i * 0.16), h * 0.5, r, ton(c, 1.22));
      ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(w * (0.58 + i * 0.16), h * 0.5, r, 0, 7); ctx.stroke();
    }
  },

  // L'abattoir : le hangar et la cour de manœuvre.
  abattoir(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.56); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.06, h * 0.14, w * 0.56, h * 0.72, c);
    ctx.fillStyle = ton(c, 0.80);
    ctx.fillRect(w * 0.68, h * 0.20, w * 0.26, h * 0.60);
  },

  // L'aciérie : deux hauts fourneaux et la halle. Le seul bâtiment à deux
  // intrants du jeu, et le plus cher du palier — il doit se voir.
  acierie(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.50); ctx.fillRect(0, 0, w, h);
    corps(ctx, w * 0.05, h * 0.30, w * 0.56, h * 0.60, c);
    dentsDeScie(ctx, w * 0.05, h * 0.30, w * 0.56, h * 0.60, c, 3);
    const r = Math.max(1.6, w * 0.09);
    cheminee(ctx, w * 0.74, h * 0.28, r, '#33302e');
    cheminee(ctx, w * 0.88, h * 0.42, r * 0.82, '#33302e');
    ctx.fillStyle = '#d98a3a';
    ctx.beginPath(); ctx.arc(w * 0.74, h * 0.28, r * 0.42, 0, 7); ctx.fill();
  },

  // La manufacture : la plus grande halle vitrée de la carte.
  manufacture(ctx, w, h, c) {
    ctx.fillStyle = ton(c, 0.50); ctx.fillRect(0, 0, w, h);
    dentsDeScie(ctx, w * 0.06, h * 0.14, w * 0.88, h * 0.62, c, Math.max(3, Math.round(w / 10)));
    ctx.fillStyle = ton(c, 0.72);
    ctx.fillRect(w * 0.06, h * 0.80, w * 0.88, h * 0.12);
    if (w >= 18) cheminee(ctx, w * 0.14, h * 0.86, Math.max(1.2, w * 0.05), '#33302e');
  },
};

// Le chevalement d'une mine et son terril : la même silhouette pour le charbon
// et le fer, seule la couleur du tas change.
function mine(ctx, w, h, c, tas) {
  ctx.fillStyle = ton(c, 0.70);
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = tas;
  ctx.beginPath();
  ctx.moveTo(w * 0.52, h * 0.88); ctx.lineTo(w * 0.96, h * 0.88);
  ctx.lineTo(w * 0.74, h * 0.46); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = ton(c, 1.5); ctx.lineWidth = Math.max(1, w * 0.06);
  ctx.beginPath();
  ctx.moveTo(w * 0.14, h * 0.18); ctx.lineTo(w * 0.44, h * 0.62);
  ctx.moveTo(w * 0.44, h * 0.18); ctx.lineTo(w * 0.14, h * 0.62);
  ctx.stroke();
}

// ===== js/ui/render.js ===============================================

// ---------------------------------------------------------------------------
// Le rendu de la carte du monde.
//
// Deux couches, deux traitements. Le sol est une image : une fois par
// changement de filtre, on peint la carte entière à raison d'un pixel par case,
// puis on l'étire — repeindre vingt-cinq mille cases à chaque image mettrait un
// téléphone à genoux. Les bâtiments, eux, sont dessinés au-dessus, et seulement
// ceux que la fenêtre voit.
//
// Par défaut on voit les bâtiments, pas des données. Les filtres sont un mode
// qu'on demande, jamais l'état de repos de la carte.
// ---------------------------------------------------------------------------





const ALERTES = { matieres: '#e0993f', bras: '#6f9fc9', invendus: '#a97fc0', perte: '#e05a4e' };

// L'échelle des filtres : rouge pour le mauvais, jaune au milieu, vert pour le
// bon. Une seule échelle pour tous les filtres, pour que le joueur n'ait jamais
// à réapprendre à lire une couleur.
function echelle(t) {
  t = Math.max(0, Math.min(1, t));
  const arrets = [
    [0.00, [176, 54, 45]],    // rouge
    [0.35, [201, 122, 46]],   // orange
    [0.55, [206, 178, 58]],   // jaune
    [1.00, [93, 165, 96]],    // vert
  ];
  for (let i = 1; i < arrets.length; i++) {
    if (t <= arrets[i][0]) {
      const [t0, c0] = arrets[i - 1], [t1, c1] = arrets[i];
      const k = (t - t0) / (t1 - t0);
      return c0.map((v, j) => Math.round(v + (c1[j] - v) * k));
    }
  }
  return arrets[arrets.length - 1][1];
}

// Les filtres par case : chacun sait lire une case et en tirer une valeur de 0
// (mauvais, rouge) à 1 (bon, vert).
const FILTRES_CASE = {
  fertilite: { nom: 'Fertilité', lire: (c) => (c.q.fertilite - 1) / 4 },
  bois:      { nom: 'Bois',      lire: (c) => (c.q.bois - 1) / 4 },
  argile:    { nom: 'Argile',    lire: (c) => (c.q.argile - 1) / 4 },
  charbon:   { nom: 'Charbon',   lire: (c) => (c.q.charbon - 1) / 4 },
  minerai:   { nom: 'Minerai',   lire: (c) => (c.q.minerai - 1) / 4 },
  terrain:   { nom: 'Prix du sol',
               lire: (c) => 1 - Math.min(1, (prixTerrain(c.ville ? c.ville.niveau : 1,
                                              c.distanceGare, qualiteMax(c)) - 40) / 500) },
};

// Les filtres par ville : l'emploi, le salaire et les baromètres ne se
// mesurent pas à la case mais à la ville entière. Tout son territoire prend
// donc la même teinte, et les cinq villes se comparent d'un coup d'œil.
const FILTRES_VILLE = {
  emploi:     { nom: 'Emploi',     lire: (v) => v.barometres.emploi },
  nourriture: { nom: 'Nourriture', lire: (v) => v.barometres.nourriture },
  produits:   { nom: 'Produits',   lire: (v) => v.barometres.produits },
  occupation: { nom: 'Logement',   lire: (v) => 1 - Math.abs(v.occupation - 0.9) / 0.9 },
  // Un salaire élevé est une bonne nouvelle pour la ville et une mauvaise pour
  // l'industriel. On le lit ici du point de vue du patron : bas = vert.
  salaire:    { nom: 'Salaire',    lire: (v) => 1 - Math.min(1, (v.salaire - 10) / 25) },
};

class Rendu {
  constructor(canvas, monde) {
    this.cv = canvas;
    this.ctx = canvas.getContext('2d');
    this.monde = monde;
    this.filtre = null;              // null = on voit les bâtiments
    this.filtrePrix = null;          // ou le nom d'une ressource
    this.filtreRdt = null;           // ou un type de bâtiment, ou 'tous'
    this.selection = null;
    this.pose = null;          // type de bâtiment qu'on cherche à poser
    this.survol = null;        // dernière case visée, pour l'aperçu
    this.zoom = 1;
    this.cx = 0; this.cy = 0;
    this.index = [];                 // les bâtiments, rafraîchis au mois
    this.solPerime = true;
  }

  // Le canvas est en `position: fixed` sur toute la fenetre : c'est donc la
  // fenetre qu'il faut mesurer, jamais son parent. Un hote qui enveloppe la
  // page dans un conteneur sans hauteur donnerait sinon un canvas de 300 x 150,
  // et la carte disparaitrait sans la moindre erreur.
  dimensionner() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.cv.width = Math.round(this.w * dpr); this.cv.height = Math.round(this.h * dpr);
    this.cv.style.width = this.w + 'px'; this.cv.style.height = this.h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.ctx.imageSmoothingEnabled = false;
  }

  // À zoom 1, le monde entier tient dans la fenêtre.
  get pasBase() { return Math.min(this.w / this.monde.L, this.h / this.monde.H); }
  get pas() { return this.pasBase * this.zoom; }
  get ox() { return (this.w - this.monde.L * this.pas) / 2 + this.cx; }
  get oy() { return (this.h - this.monde.H * this.pas) / 2 + this.cy; }

  // La carte ne quitte jamais l'écran. Quand elle est plus grande que la
  // fenêtre, ses bords s'y arrêtent — on ne dérive pas dans le vide ; quand
  // elle est plus petite, elle reste centrée.
  recadrer() {
    const eL = this.monde.L * this.pas, eH = this.monde.H * this.pas;
    const mx = Math.max(0, (eL - this.w) / 2);
    const my = Math.max(0, (eH - this.h) / 2);
    this.cx = Math.max(-mx, Math.min(mx, this.cx));
    this.cy = Math.max(-my, Math.min(my, this.cy));
  }

  zoomerVers(px, py, facteur) {
    const avant = this.pas;
    this.zoom = Math.max(1, Math.min(28, this.zoom * facteur));
    const apres = this.pas;
    if (apres === avant) return;
    const k = apres / avant;
    this.cx = (this.cx + this.w / 2 - px) * k - this.w / 2 + px;
    this.cy = (this.cy + this.h / 2 - py) * k - this.h / 2 + py;
    this.recadrer();
  }

  // Centre la vue sur une ville, au zoom où l'on distingue les bâtiments.
  cadrerVille(v) {
    // On cadre sur la plus petite dimension : en portrait, c'est la largeur qui
    // décide, et une ville coupée au bord n'est pas une ville cadrée.
    const tenir = Math.min(this.w, this.h) * 0.88;
    this.zoom = Math.max(1, Math.min(28, tenir / (v.rayon * 2.5 * this.pasBase)));
    this.cx = (this.monde.L / 2 - v.gare.x - 0.5) * this.pas;
    this.cy = (this.monde.H / 2 - v.gare.y - 0.5) * this.pas;
    this.recadrer();
  }

  caseSous(px, py) {
    const x = Math.floor((px - this.ox) / this.pas), y = Math.floor((py - this.oy) / this.pas);
    return this.monde.caseAt(x, y);
  }

  choisirFiltre(nom, prix = null, rdt = null) {
    this.filtre = nom; this.filtrePrix = prix; this.filtreRdt = rdt;
    this.solPerime = true;
  }

  // Y a-t-il un mode de lecture en cours ? Sous un filtre, le bâti s'efface
  // pour laisser la donnée parler.
  get sousFiltre() { return !!(this.filtre || this.filtrePrix || this.filtreRdt); }

  // La rentabilité d'un bâtiment sur l'échelle commune. On ne compare pas des
  // pourcentages bruts — une coupe forestière vise 15 %, une manufacture 25 %,
  // et les mettre côte à côte sur la même règle punirait la première pour une
  // promesse qu'elle n'a jamais faite. On lit donc la TENUE : atteint-il le
  // rendement que le barème lui assigne ?
  //
  //   rouge  : il ne rapporte rien, ou il perd
  //   jaune  : il tient la moitié de sa promesse
  //   vert   : il atteint son rendement visé, ou le dépasse
  teinteRendement(b) {
    return echelle(b.tenue());
  }

  // Les bâtiments changent au mois, pas à l'image : on tient une liste à plat.
  rafraichirIndex() {
    this.index = [];
    for (const v of this.monde.villes) {
      for (const b of this.monde.tousBatiments(v)) this.index.push(b);
    }
    if (this.filtre && FILTRES_VILLE[this.filtre]) this.solPerime = true;
    if (this.filtrePrix) this.solPerime = true;
  }

  // --- Le sol -------------------------------------------------------------
  // Peint une fois, à un pixel par case, puis étiré. C'est ce qui rend une
  // carte de vingt-cinq mille cases affichable sur un téléphone.

  peindreSol() {
    const m = this.monde;
    if (!this.sol) {
      this.sol = document.createElement('canvas');
      this.sol.width = m.L; this.sol.height = m.H;
    }
    const ctx = this.sol.getContext('2d');
    const img = ctx.createImageData(m.L, m.H);
    const d = img.data;

    // Teintes de ville, calculées une fois pour toutes les cases du territoire.
    const teinteVille = new Map();
    if (this.filtrePrix) {
      for (const v of m.villes) {
        const ind = v.marche.prix[this.filtrePrix] / RES[this.filtrePrix].prix;
        // Cher = rouge, bon marché = vert. L'échelle couvre la moitié au double
        // du prix de référence, là où se joue tout ce qui est lisible.
        teinteVille.set(v, echelle(1 - (ind - 0.5) / 1.5));
      }
    } else if (this.filtre && FILTRES_VILLE[this.filtre]) {
      const f = FILTRES_VILLE[this.filtre];
      for (const v of m.villes) teinteVille.set(v, echelle(f.lire(v)));
    }

    const fCase = this.filtre && FILTRES_CASE[this.filtre] ? FILTRES_CASE[this.filtre] : null;
    const parVille = teinteVille.size > 0;
    // En lecture de rentabilité, la donnée est portée par les bâtiments : le
    // sol doit s'effacer pour ne pas leur disputer le regard.
    const sourdine = !!this.filtreRdt;
    const joueurId = m.joueur.id;
    const couleursSocietes = new Map(m.societes.map(s => [s.id,
      [parseInt(s.couleur.substr(1, 2), 16), parseInt(s.couleur.substr(3, 2), 16),
       parseInt(s.couleur.substr(5, 2), 16)]]));

    for (let i = 0; i < m.cases.length; i++) {
      const c = m.cases[i];
      let r, g, b;

      if (sourdine) {
        const gris = 26 + c.alt * 22 + (c.ville ? 10 : 0);
        r = gris; g = gris + 2; b = gris - 3;
      } else if (parVille) {
        if (c.ville) {
          const t = teinteVille.get(c.ville);
          [r, g, b] = t;
        } else {
          // Hors des villes, on garde le relief mais en sourdine : le regard
          // doit aller aux territoires comparés.
          const gris = 32 + c.alt * 26;
          r = gris; g = gris + 2; b = gris - 2;
        }
      } else if (this.filtre === 'proprio') {
        // Ce qui est à vous saute aux yeux ; le reste s'efface. C'est le seul
        // filtre qui ne suit pas l'échelle rouge-vert : il ne mesure rien, il
        // désigne.
        if (c.proprio === joueurId) { r = 224; g = 177; b = 85; }
        else if (c.proprio && c.proprio !== 'ind') {
          const s = couleursSocietes.get(c.proprio) || [90, 84, 72];
          [r, g, b] = s;
        } else if (c.bat || c.proprio === 'ind') { r = 74; g = 70; b = 60; }
        else if (c.ville) { r = 42; g = 39; b = 33; }
        else { r = 24; g = 23; b = 20; }
      } else if (fCase) {
        [r, g, b] = echelle(fCase.lire(c));
        if (!c.ville && this.filtre === 'terrain') { r = 34; g = 34; b = 30; }
      } else {
        const base = RELIEFS[c.relief].couleur;
        r = parseInt(base.substr(1, 2), 16);
        g = parseInt(base.substr(3, 2), 16);
        b = parseInt(base.substr(5, 2), 16);
      }

      // L'ombrage du relief : une lumière rasante venue du nord-ouest. C'est
      // elle, et rien d'autre, qui fait exister les montagnes sur une carte
      // vue de dessus.
      // L'altitude assombrit les fonds et blanchit les hauteurs ; l'ombrage
      // rasant du nord-ouest fait le reste. C'est ce couple, et rien d'autre,
      // qui fait exister un relief sur une carte vue de dessus.
      const etage = 0.86 + c.alt * 0.42;
      const lum = 1 + (-c.pente * 1.7 - c.penteY * 1.3) * 5.2;
      const k = Math.max(0.42, Math.min(1.7, lum * etage));
      d[i * 4]     = Math.min(255, r * k);
      d[i * 4 + 1] = Math.min(255, g * k);
      d[i * 4 + 2] = Math.min(255, b * k);
      d[i * 4 + 3] = 255;
    }

    ctx.putImageData(img, 0, 0);
    this.solPerime = false;
  }

  // --- L'image ------------------------------------------------------------

  dessiner() {
    // Les barres du navigateur mobile apparaissent et disparaissent sans
    // declencher d'evenement fiable : on verifie a chaque image.
    if (this.w !== window.innerWidth || this.h !== window.innerHeight) this.dimensionner();

    const { ctx } = this, m = this.monde, p = this.pas, ox = this.ox, oy = this.oy;
    if (this.solPerime || !this.sol) this.peindreSol();
    if (p !== this._dernierPas) { videCache(); this._dernierPas = p; }

    ctx.fillStyle = '#0f1512';
    ctx.fillRect(0, 0, this.w, this.h);

    ctx.imageSmoothingEnabled = p < 3;
    ctx.drawImage(this.sol, ox, oy, m.L * p, m.H * p);

    // La fenêtre, en cases : tout le reste du dessin s'y limite.
    const x0 = Math.floor(-ox / p) - 1, y0 = Math.floor(-oy / p) - 1;
    const x1 = Math.ceil((this.w - ox) / p) + 1, y1 = Math.ceil((this.h - oy) / p) + 1;
    const vu = (b) => b.cases[0].x >= x0 && b.cases[0].x <= x1
                   && b.cases[0].y >= y0 && b.cases[0].y <= y1;

    this.dessinerVoies(ctx, p, ox, oy, x0, y0, x1, y1);
    this.dessinerBatiments(ctx, p, ox, oy, vu);
    this.dessinerChantiers(ctx, p, ox, oy, x0, y0, x1, y1);

    // Les gares, toujours visibles : ce sont les repères de la carte.
    for (const v of m.villes) {
      const gx = ox + v.gare.x * p, gy = oy + v.gare.y * p;
      const r = Math.max(3, Math.min(9, p * 0.7));
      ctx.fillStyle = '#e0b155';
      ctx.beginPath(); ctx.arc(gx + p / 2, gy + p / 2, r, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    this.dessinerAlertes(ctx, p, ox, oy, vu);
    this.dessinerEtiquettes(ctx, p, ox, oy);

    // La frontière achetable : étroite et disputée, c'est là que se joue le
    // foncier. On ne la montre que quand elle sert.
    if (p >= 4 && (this.filtre === 'terrain' || this.filtre === 'proprio')) {
      ctx.strokeStyle = 'rgba(224,177,85,.75)'; ctx.lineWidth = 1;
      for (const v of m.villes) for (const c of v.cases) {
        if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
        if (!estAchetable(m, c)) continue;
        ctx.strokeRect(ox + c.x * p + .5, oy + c.y * p + .5, p - 1, p - 1);
      }
    }

    if (this.pose) this.dessinerPose(ctx, p, ox, oy, x0, y0, x1, y1);

    if (this.selection) {
      const c = this.selection;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.strokeRect(ox + c.x * p - 1, oy + c.y * p - 1, p + 2, p + 2);
    }
  }

  // Le mode « Bâtir ». On cercle d'or tout ce qui peut recevoir le bâtiment
  // choisi, et on montre en plein l'emprise exacte sous le doigt : sans cet
  // aperçu, poser un carré de quatre cases relève de la divination.
  dessinerPose(ctx, p, ox, oy, x0, y0, x1, y1) {
    const m = this.monde, def = BAT[this.pose];

    ctx.strokeStyle = 'rgba(224,177,85,.85)';
    ctx.lineWidth = Math.max(1, p * 0.12);
    for (const v of m.villes) for (const c of v.cases) {
      if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
      if (!this.posable(c)) continue;
      ctx.strokeRect(ox + c.x * p + .5, oy + c.y * p + .5, p - 1, p - 1);
    }

    const e = this.survol && this.emprise ? this.emprise(this.survol, this.pose) : null;
    if (e) {
      ctx.fillStyle = 'rgba(224,177,85,.42)';
      for (const c of e.cases) ctx.fillRect(ox + c.x * p, oy + c.y * p, p, p);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      const xs = e.cases.map(c => c.x), ys = e.cases.map(c => c.y);
      ctx.strokeRect(ox + Math.min(...xs) * p - 1, oy + Math.min(...ys) * p - 1,
                     def.w * p + 2, def.h * p + 2);
    }
  }

  // Une case est posable si le bâtiment choisi tient quelque part autour d'elle.
  posable(c) {
    return this.emprise ? !!this.emprise(c, this.pose) : false;
  }

  dessinerVoies(ctx, p, ox, oy, x0, y0, x1, y1) {
    const m = this.monde;
    // Une ligne achevée est un trait plein et doré ; une ligne en chantier
    // reste grisée. Le joueur voit dès la première seconde où le rail passera.
    for (const l of m.liaisons) {
      const a = m.villes[l.a].gare, b = m.villes[l.b].gare;
      ctx.strokeStyle = l.achevee ? 'rgba(224,177,85,.85)' : 'rgba(120,112,96,.55)';
      ctx.lineWidth = l.achevee ? Math.max(1.5, p * 0.30) : Math.max(1, p * 0.18);
      ctx.setLineDash(l.achevee ? [] : [Math.max(3, p), Math.max(3, p)]);
      ctx.beginPath();
      ctx.moveTo(ox + (a.x + .5) * p, oy + (a.y + .5) * p);
      ctx.lineTo(ox + (b.x + .5) * p, oy + (b.y + .5) * p);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  dessinerBatiments(ctx, p, ox, oy, vu) {
    const joueur = this.monde.joueur;
    const dessine = p >= 5.5 && !this.sousFiltre;

    for (const b of this.index) {
      if (!vu(b)) continue;
      const c = b.cases[0];
      const x = ox + c.x * p, y = oy + c.y * p;

      // Lecture de la rentabilité : le bâtiment porte lui-même la couleur, et
      // ceux qui ne sont pas du type demandé restent en silhouette. C'est ce
      // qui permet de comparer trente scieries d'un bout à l'autre de la carte.
      if (this.filtreRdt) {
        const vise = this.filtreRdt === 'tous' || this.filtreRdt === b.type;
        if (vise) {
          const t = this.teinteRendement(b);
          ctx.fillStyle = 'rgb(' + t[0] + ',' + t[1] + ',' + t[2] + ')';
        } else {
          ctx.fillStyle = 'rgba(0,0,0,.34)';
        }
        ctx.fillRect(x, y, p * b.def.w, p * b.def.h);
        if (b.societe === joueur && p >= 3) {
          ctx.strokeStyle = '#e0b155';
          ctx.lineWidth = Math.max(1, p * 0.10);
          ctx.strokeRect(x + .5, y + .5, p * b.def.w - 1, p * b.def.h - 1);
        }
        continue;
      }

      if (dessine) {
        ctx.drawImage(sprite(b.type, p), Math.round(x), Math.round(y));
      } else if (!this.sousFiltre) {
        // Trop petit pour un toit : on garde la couleur de famille, qui suffit
        // à lire la vocation des quartiers.
        ctx.fillStyle = COULEURS[b.type];
        ctx.fillRect(x, y, p * b.def.w, p * b.def.h);
      } else {
        // Sous un filtre, le bâti ne doit pas voler la couleur de la donnée :
        // il n'en reste qu'une silhouette sombre.
        ctx.fillStyle = 'rgba(0,0,0,.28)';
        ctx.fillRect(x, y, p * b.def.w, p * b.def.h);
      }

      // Ce qui est à vous se voit toujours, quel que soit le mode.
      if (b.societe === joueur && p >= 3) {
        ctx.strokeStyle = '#e0b155';
        ctx.lineWidth = Math.max(1, p * 0.10);
        ctx.strokeRect(x + .5, y + .5, p * b.def.w - 1, p * b.def.h - 1);
      }
    }
  }

  dessinerChantiers(ctx, p, ox, oy, x0, y0, x1, y1) {
    const joueur = this.monde.joueur;
    for (const s of this.monde.societes) for (const ch of s.chantiers) {
      const c = ch.cases[0];
      if (c.x < x0 || c.x > x1 || c.y < y0 || c.y > y1) continue;
      const x = ox + c.x * p, y = oy + c.y * p;
      const w = p * BAT[ch.type].w, h = p * BAT[ch.type].h;
      ctx.fillStyle = '#3a3226';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = s === joueur ? '#e0b155' : 'rgba(150,140,120,.7)';
      ctx.setLineDash([Math.max(2, p * 0.3), Math.max(2, p * 0.3)]);
      ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
      ctx.setLineDash([]);
      if (p >= 7) {
        ctx.fillStyle = '#e0b155';
        ctx.fillRect(x + 2, y + h - 4, (w - 4) * ch.progression(), 2);
      }
    }
  }

  // Les pastilles d'alerte : quatre états seulement, jamais recouvertes. C'est
  // la couche que le joueur lit vraiment.
  dessinerAlertes(ctx, p, ox, oy, vu) {
    if (p < 4) return;
    for (const b of this.index) {
      if (!b.alerte || !vu(b)) continue;
      const c = b.cases[0];
      const r = Math.min(3.2, Math.max(1.6, p / 4));
      ctx.fillStyle = ALERTES[b.alerte];
      ctx.beginPath();
      ctx.arc(ox + (c.x + b.def.w) * p - r - 1, oy + c.y * p + r + 1, r, 0, 7);
      ctx.fill();
    }
  }

  dessinerEtiquettes(ctx, p, ox, oy) {
    ctx.textAlign = 'center';
    ctx.font = `600 ${Math.max(10, Math.min(15, 9 + p * 0.5))}px ui-sans-serif, system-ui, sans-serif`;
    for (const v of this.monde.villes) {
      const x = ox + (v.gare.x + .5) * p;
      const y = oy + v.gare.y * p - Math.max(8, p * 0.9);
      if (x < -60 || x > this.w + 60 || y < -20 || y > this.h + 20) continue;
      const texte = p < 4 ? v.nom : `${v.nom} · ${Math.round(v.menages)}`;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,7,6,.85)';
      ctx.strokeText(texte, x, y);
      ctx.fillStyle = v.enCrise ? '#e05a4e' : '#efe8d8';
      ctx.fillText(texte, x, y);
    }
    ctx.textAlign = 'left';
  }
}

// ===== js/ui/panneaux.js =============================================

// ---------------------------------------------------------------------------
// Le contenu des volets : filtres, villes, marché, société, rail.
//
// « Le registre est ce qui permet au joueur de repérer le bâtiment qui perd de
//   l'argent. Sans lui, une société de trente bâtiments est une boîte noire et
//   le joueur ne peut prendre aucune décision éclairée — il jouera au hasard. »
// ---------------------------------------------------------------------------



const $ = (s) => document.querySelector(s);
const eur = (n) => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('fr-FR') + ' $';
const pct = (n) => Math.round(n * 100) + ' %';
const cl = (n) => n > 0 ? 'vert' : n < 0 ? 'rouge' : 'doux';
const rgb = (t) => `rgb(${t[0]},${t[1]},${t[2]})`;

// Les bâtiments dont la rentabilité veut dire quelque chose : l'entrepôt ne
// rapporte rien par construction, il n'a pas de rendement à comparer.
const RENTABLES = TYPES_BAT.filter(t => BAT[t].cat !== 'neg');

// --- Filtres ----------------------------------------------------------------

function voletFiltres(monde, rendu) {
  const past = (id, nom, actif, teinte) =>
    `<button data-filtre="${id}" class="${actif ? 'actif' : ''}">`
    + (teinte ? `<span class="nuance" style="background:${teinte}"></span>` : '')
    + `${nom}</button>`;

  const f = rendu.filtre, fp = rendu.filtrePrix, rendement = rendu.filtreRdt;

  return `
    <h3>Ce que montre la carte</h3>
    <div class="pastilles">
      ${past('', 'Les bâtiments', !f && !fp)}
      ${past('proprio', 'Mes possessions', f === 'proprio')}
    </div>

    <h3>Le terrain — case par case</h3>
    <div class="pastilles">
      ${Object.entries(FILTRES_CASE).map(([id, x]) =>
        past(id, x.nom, f === id)).join('')}
    </div>

    <h3>Les villes — territoire entier</h3>
    <div class="pastilles">
      ${Object.entries(FILTRES_VILLE).map(([id, x]) =>
        past(id, x.nom, f === id)).join('')}
    </div>

    <h3>La rentabilité, bâtiment par bâtiment</h3>
    <div class="pastilles">
      <button data-rdt="tous" class="${rendement === 'tous' ? 'actif' : ''}">Tous</button>
      ${RENTABLES.map(t =>
        `<button data-rdt="${t}" class="${rendement === t ? 'actif' : ''}">
           <span class="nuance" style="background:${COULEURS[t]}"></span>${BAT[t].nom}</button>`
      ).join('')}
    </div>
    <div class="note">Chaque bâtiment prend la couleur de son rendement : rouge s'il ne
      rapporte rien, vert à 20 % l'an — le rendement visé de la transformation, au milieu du
      barème. Ceux d'un autre métier restent en silhouette.</div>

    <h3>Le prix d'une marchandise, ville par ville</h3>
    <div class="pastilles">
      ${RESSOURCES.map(r =>
        `<button data-prix="${r}" class="${fp === r ? 'actif' : ''}">
           <span class="nuance" style="background:${RES[r].couleur}"></span>${RES[r].nom}</button>`
      ).join('')}
    </div>

    <div class="note">
      Une seule échelle pour tout : <b class="rouge">rouge</b> pour ce qui va mal,
      jaune au milieu, <b class="vert">vert</b> pour ce qui va bien. Sur les prix,
      le rouge dit « cher » — mauvaise nouvelle pour qui achète, bonne pour qui vend.
    </div>
  `;
}

// --- Villes -----------------------------------------------------------------

function voletVilles(monde) {
  return `<h3>Les cinq villes</h3>
    <div class="listeVilles">
      ${monde.villes.map(v => {
        const b = v.barometres;
        const moy = (b.nourriture + b.emploi + b.produits) / 3;
        return `<button data-ville="${v.id}">
          <span>
            <b>${v.nom}</b>${v.enCrise ? ' <span class="rouge">⚠</span>' : ''}
            <span class="cv"><br>${P.nomsNiveau[v.niveau - 1]} · ${Math.round(v.menages)} ménages</span>
          </span>
          <span class="cv" style="text-align:right">
            <span style="color:${rgb(echelle(moy))}">●</span> ${pct(moy)}
